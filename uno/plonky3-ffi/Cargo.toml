# uno_plonky3_ffi — Rust crate exposing the Plonky3 Transfer AIR verifier
# (and a reference prover for scaffolding) to the C++ validator via C ABI.
#
# This is the P.0 / P.2-bootstrap scaffold per design doc §13.
# It deliberately implements a *Minimum Viable AIR* — a single Poseidon2-Goldilocks
# hash + a single Merkle-path-step constraint + a u64 range check — to validate
# the end-to-end toolchain (Rust↔C++ FFI, Plonky3 prover/verifier round-trip).
#
# The full Transfer AIR (§4.2 claims 1–9 of doc/uno-workchain.md) is NOT in this
# scaffold. See src/transfer_air.rs TODO(uno-design-gap) markers for what remains.
#
# Pin: Plonky3 commit 6374a36ff50fc641821513852263cc61ca7a1278 (upstream v0.5.1).
# Vendored into `third-party/plonky3-uno/` per §16 decision #43. All Plonky3
# crate deps below point at the local vendored path, not the upstream git host;
# this isolates us from upstream API churn, gives auditors a stable artifact,
# and makes builds reproducible without network access. See
# `third-party/plonky3-uno/README.uno.md` for the vendoring + update policy.
#
# TODO(uno-p1): once Plonky3 publishes a 0.6.x release to crates.io (upstream
# has signalled intent but no date as of 2026-04), switch from the local vendor
# path to a versioned `crates.io` dep and retire the vendor tree.

[package]
name        = "uno_plonky3_ffi"
version     = "0.1.0"
edition     = "2021"
license     = "GPL-3.0"
description = "Uno wc=2 workchain: Plonky3 STARK verifier + reference prover (C ABI)"
publish     = false

[lib]
name       = "uno_plonky3_ffi"
# Produce both a staticlib (for Agent 5's CMake link into validator-engine)
# and an rlib (for Rust-side integration tests + tosctl consumption).
crate-type = ["staticlib", "rlib"]

[dependencies]
# ---- Plonky3 (vendored at third-party/plonky3-uno/, decision #43) ----------
# We intentionally enumerate every crate we use; no wildcard / workspace import.
# This keeps the dependency surface auditable and makes the diff for a future
# rev-bump (or the eventual crates.io switch) mechanical.
#
# All paths are relative to `uno/plonky3-ffi/Cargo.toml`; two `..` levels take
# us to the repo root, then into `third-party/plonky3-uno/<crate-dir>`. Crate
# directory names in the upstream workspace drop the `p3-` prefix (e.g. the
# `p3-air` crate lives in `air/`).
p3-air         = { path = "../../third-party/plonky3-uno/air" }
p3-challenger  = { path = "../../third-party/plonky3-uno/challenger" }
p3-commit      = { path = "../../third-party/plonky3-uno/commit" }
p3-dft         = { path = "../../third-party/plonky3-uno/dft" }
p3-field       = { path = "../../third-party/plonky3-uno/field" }
p3-fri         = { path = "../../third-party/plonky3-uno/fri" }
p3-goldilocks  = { path = "../../third-party/plonky3-uno/goldilocks" }
p3-matrix      = { path = "../../third-party/plonky3-uno/matrix" }
p3-merkle-tree = { path = "../../third-party/plonky3-uno/merkle-tree" }
p3-poseidon2   = { path = "../../third-party/plonky3-uno/poseidon2" }
p3-poseidon2-air = { path = "../../third-party/plonky3-uno/poseidon2-air" }
p3-symmetric   = { path = "../../third-party/plonky3-uno/symmetric" }
p3-uni-stark   = { path = "../../third-party/plonky3-uno/uni-stark" }

# ---- Small utilities -------------------------------------------------------
# Postcard is used for proof serialization (same format Plonky3's own examples
# use). Deterministic, no alloc-required features that we'd have to audit.
postcard    = { version = "1", features = ["alloc"] }
serde       = { version = "1", features = ["derive"] }
# `rand` is retained as a transitive surface used by some Plonky3 test paths
# and dev-time scaffolding. The production verify/prove path does NOT seed
# any RNG — Poseidon2 round constants come from the audited
# `GOLDILOCKS_POSEIDON2_RC_*` tables in `p3_goldilocks::poseidon2` (see
# decision #42, §16). No OS entropy is touched on any code path we invoke.
rand        = { version = "0.10", default-features = false, features = ["alloc", "std_rng"] }

[build-dependencies]
cbindgen = "0.29"

[dev-dependencies]
# For the adversarial-witness negative test.
hex = "0.4"

[profile.release]
# STARK prover is the hot path; release must be aggressive. Debug-asserts off
# so the reference prover does not diverge from the validator-build verifier
# in edge cases (e.g. integer overflow wraparound assumptions).
opt-level       = 3
lto             = "thin"
codegen-units   = 1
debug           = false
overflow-checks = false
# Panic strategy: we use `abort` so FFI can never unwind across the C ABI
# boundary. Any verifier error is a returned int, not a panic.
panic           = "abort"

[profile.dev]
# Keep dev builds usable for P.2 prover iteration; but still no panic=unwind
# (matches release, so FFI behavior is identical across build profiles).
opt-level = 1
panic     = "abort"

# ---------------------------------------------------------------------------
# Determinism notes (see design doc §4.3 "No randomness, no wall-clock,
# no HashMap iteration, no floats anywhere in the verify path"):
#
#   * No `rand` default feature ("std_rng" pulls in OS entropy) — we only
#     use rand_chacha::ChaCha20Rng with a seed derived from public inputs.
#   * No `tokio`, no async runtime — verify is a synchronous, pure function.
#   * No `hashbrown`-iteration surfaces exposed to the verify path.
#
# Agent 5 (C++ side) ALSO enforces this at the FFI boundary by never calling
# `uno_plonky3_prove` from consensus code; `prove` is for wallet/tosctl only.
# ---------------------------------------------------------------------------
