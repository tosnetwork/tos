# uno_plonky3_ffi — Rust crate exposing the Plonky3 Transfer AIR verifier
# (and a reference prover) to the C++ validator via C ABI.
#
# This crate is the Rust-side proof-system implementation for Uno wc=2.
# It exposes the shape-aware Transfer AIR verifier used by the validator,
# together with the reference prover and Rust-side benches/tests. The AIR
# lives in `src/transfer_air.rs` and covers the §4.1 envelope
# (`1..4` spends × `1..4` outputs) with real Poseidon2-Goldilocks
# constraints and in-circuit balance checks.
#
# Pin: Plonky3 commit 6374a36ff50fc641821513852263cc61ca7a1278 (upstream v0.5.1).
# Vendored into `third-party/plonky3-uno/` per §16 decision #43. All Plonky3
# crate deps below point at the local vendored path, not the upstream git host;
# this isolates us from upstream API churn, gives auditors a stable artifact,
# and makes builds reproducible without network access. See
# `third-party/plonky3-uno/README.uno.md` for the vendoring + update policy.
#
# TODO(uno-p1): once Plonky3 publishes a 0.6.x release to crates.io (upstream
# has signalled intent but no date as of 2026-04), switch from the local vendor
# path to a versioned `crates.io` dep and retire the vendor tree.

[package]
name        = "uno_plonky3_ffi"
version     = "0.1.0"
edition     = "2021"
license     = "GPL-3.0"
description = "Uno wc=2 workchain: Plonky3 STARK verifier + reference prover (C ABI)"
publish     = false

[lib]
name       = "uno_plonky3_ffi"
# Produce both a staticlib (for Agent 5's CMake link into validator-engine)
# and an rlib (for Rust-side integration tests + tosctl consumption).
crate-type = ["staticlib", "rlib"]

[dependencies]
# ---- Plonky3 (vendored at third-party/plonky3-uno/, decision #43) ----------
# We intentionally enumerate every crate we use; no wildcard / workspace import.
# This keeps the dependency surface auditable and makes the diff for a future
# rev-bump (or the eventual crates.io switch) mechanical.
#
# All paths are relative to `uno/plonky3-ffi/Cargo.toml`; two `..` levels take
# us to the repo root, then into `third-party/plonky3-uno/<crate-dir>`. Crate
# directory names in the upstream workspace drop the `p3-` prefix (e.g. the
# `p3-air` crate lives in `air/`).
p3-air         = { path = "../../third-party/plonky3-uno/air" }
p3-challenger  = { path = "../../third-party/plonky3-uno/challenger" }
p3-commit      = { path = "../../third-party/plonky3-uno/commit" }
p3-dft         = { path = "../../third-party/plonky3-uno/dft" }
p3-field       = { path = "../../third-party/plonky3-uno/field" }
p3-fri         = { path = "../../third-party/plonky3-uno/fri" }
p3-goldilocks  = { path = "../../third-party/plonky3-uno/goldilocks" }
p3-matrix      = { path = "../../third-party/plonky3-uno/matrix" }
p3-merkle-tree = { path = "../../third-party/plonky3-uno/merkle-tree" }
p3-poseidon2   = { path = "../../third-party/plonky3-uno/poseidon2" }
p3-poseidon2-air = { path = "../../third-party/plonky3-uno/poseidon2-air" }
p3-symmetric   = { path = "../../third-party/plonky3-uno/symmetric" }
p3-batch-stark = { path = "../../third-party/plonky3-uno/batch-stark" }
# M-P2 Phase 3 (scaffolding-only for this commit): LogUp lookup gadget.
# Used by the batch-stark prover to enforce argumentwise-multiplicative
# equality between trace columns and a preprocessed 16-bit range table,
# once the AIR is wired up to decompose u64 values into u16 limbs. See
# doc/uno-p2-path-research.md §Path iii for the −156 KB/4-4 estimate.
p3-lookup      = { path = "../../third-party/plonky3-uno/lookup" }
p3-uni-stark   = { path = "../../third-party/plonky3-uno/uni-stark" }
p3-util        = { path = "../../third-party/plonky3-uno/util" }

# ---- Small utilities -------------------------------------------------------
# Postcard is used for proof serialization (same format Plonky3's own examples
# use). Deterministic, no alloc-required features that we'd have to audit.
postcard    = { version = "1", features = ["alloc"] }
serde       = { version = "1", features = ["derive"] }
# `rand` is retained as a transitive surface used by some Plonky3 test paths
# and dev-time scaffolding. The production verify/prove path does NOT seed
# any RNG — Poseidon2 round constants come from the audited
# `GOLDILOCKS_POSEIDON2_RC_*` tables in `p3_goldilocks::poseidon2` (see
# decision #42, §16). No OS entropy is touched on any code path we invoke.
rand        = { version = "0.10", default-features = false, features = ["alloc", "std_rng"] }

# K-aggregation-A1: used by `verifier_air` / `aggregator` modules for
# off-AIR hashing — merkle-root over per-Tx public inputs, deterministic
# stub proof bytes. Future Phase A2 may switch in-AIR hashes to Poseidon2
# but BLAKE3 remains the off-AIR commitment primitive for the block-level
# PI merkle root. Matches the C++ side (`uno/crypto/internal/blake3_adapter.h`).
blake3 = "1.5"

[build-dependencies]
cbindgen = "0.29"

[dev-dependencies]
# For the adversarial-witness negative test.
hex = "0.4"
# K-codec-parity: the codec_parity_goldens integration test hashes the
# canonical tx_hash preimage with BLAKE3 (same backend as the C++ side via
# `uno/crypto/internal/blake3_adapter.h`). blake3 is now in the main
# [dependencies] block for the aggregation scaffolding (K-aggregation-A1),
# so this section entry is redundant — leaving the tag here as a comment
# for the integration test that still relies on it.

# ---------------------------------------------------------------------------
# Benches (K-air-bench, K-fri-analysis)
#
# `harness = false` disables the default libtest harness so the bench file's
# own `fn main()` is the entire bench binary. This keeps the standardized
# shape-matrix harness free of criterion / nightly-`#[bench]` dependencies
# while still being driven by `cargo bench --bench <name>`.
# ---------------------------------------------------------------------------
[[bench]]
name    = "shape_matrix"
harness = false

# K-fri-analysis: FRI parameter-space sweep harness. Reproduces the data
# table in `doc/uno-fri-param-analysis.md` — prove/verify/proof-bytes and
# conjectured+proven soundness bits across ~15 (log_blowup, num_queries,
# pow_bits) triples at the 4/4 worst-case envelope shape. Non-consensus-
# critical; does NOT change `prover.rs::build_config`'s §2.1 pin.
[[bench]]
name    = "fri_param_sweep"
harness = false

[profile.release]
# STARK prover is the hot path; release must be aggressive. Debug-asserts off
# so the reference prover does not diverge from the validator-build verifier
# in edge cases (e.g. integer overflow wraparound assumptions).
opt-level       = 3
lto             = "thin"
codegen-units   = 1
debug           = false
overflow-checks = false
# Panic strategy: `unwind` so that `ffi_guard` (`std::panic::catch_unwind`)
# in src/lib.rs can convert a stray `.unwrap()` / `assert!` from the
# verifier path into a returned `InternalError`. Under `panic = "abort"`
# (the previous setting) `catch_unwind` is a no-op and any panic from a
# malformed proof aborted the validator process, exactly what the FFI
# guard is supposed to prevent.
#
# Safety: `extern "C"` functions in this crate must not let a panic
# unwind across the C ABI boundary; every entry point is wrapped in
# `ffi_guard`. Modern rustc additionally aborts at the C boundary if
# a panic ever escapes the guard (defense-in-depth).
panic           = "unwind"

[profile.dev]
# Keep dev builds usable for P.2 prover iteration. Match release on
# panic strategy so FFI behavior is identical across build profiles
# (see release-profile rationale above).
opt-level = 1
panic     = "unwind"

# ---------------------------------------------------------------------------
# Determinism notes (see design doc §4.3 "No randomness, no wall-clock,
# no HashMap iteration, no floats anywhere in the verify path"):
#
#   * No `rand` default feature ("std_rng" pulls in OS entropy) — we only
#     use rand_chacha::ChaCha20Rng with a seed derived from public inputs.
#   * No `tokio`, no async runtime — verify is a synchronous, pure function.
#   * No `hashbrown`-iteration surfaces exposed to the verify path.
#
# Agent 5 (C++ side) ALSO enforces this at the FFI boundary by never calling
# `uno_plonky3_prove` from consensus code; `prove` is for wallet/tosctl only.
# ---------------------------------------------------------------------------
