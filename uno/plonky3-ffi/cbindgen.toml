# cbindgen config for the uno_plonky3_ffi C header.
#
# Consumed by build.rs. Emits include/uno_plonky3_ffi.h that the C++ bridge
# (uno/crypto/plonky3-verifier.{h,cpp}) includes via `extern "C"`.

language = "C"
pragma_once = true
include_guard = "UNO_PLONKY3_FFI_H"
autogen_warning = "/* Auto-generated by cbindgen from uno/plonky3-ffi/src/lib.rs. Do not edit. */"
documentation = true
documentation_style = "c99"
line_length = 100
tab_width = 4
style = "type"
cpp_compat = true

# No type-prefix rewrite: the Rust types already carry the `Plonky3*` prefix
# which, combined with the file's include-guard and the Rust function names
# (`uno_plonky3_*`), disambiguates cleanly against any plausible TOS-side
# symbol. An earlier configuration added a second `UnoPlonky3` prefix via
# cbindgen and produced double-prefixed names (`UnoPlonky3Plonky3VerifierHandle`);
# the simpler solution is to consume the Rust names as-is.

[export]
# Only export items reachable from `lib.rs`. The transfer_air / prover /
# verifier submodules' internal constants (NUM_COLS, LOG_TRACE_HEIGHT, etc.)
# are not part of the stable C ABI and should not pollute the header.
include = [
    "Plonky3VerifierHandle",
    "Plonky3ProverHandle",
    "Plonky3ProofBytes",
    "Plonky3PublicInputs",
    "Plonky3Witness",
    "Plonky3OwnedProof",
    "Plonky3Status",
    "uno_plonky3_verifier_init",
    "uno_plonky3_verifier_free",
    "uno_plonky3_verify",
    "uno_plonky3_prover_init",
    "uno_plonky3_prover_free",
    "uno_plonky3_prove",
    "uno_plonky3_proof_free",
    "uno_mine_uno_prove",
    "uno_mine_uno_verify",
    "uno_plonky3_abi_version",
    "uno_poseidon2_goldilocks_permute_t8",
    "uno_poseidon2_goldilocks_permute_t16",
]
exclude = [
    # Submodule constants that cbindgen would otherwise lift out as #defines
    # (they have no public C ABI meaning and would collide in a large
    # codebase).
    "NUM_COLS",
    "LOG_TRACE_HEIGHT",
    "TRACE_HEIGHT",
    "NUM_PUBLIC_INPUTS",
    "PUBLIC_INPUTS_WIRE_LEN",
    "MERKLE_MIX_COEF",
    "LEAF",
    "SIBLING",
    "PARENT_CLAIM",
    "VALUE_ACC",
    "VALUE_BIT",
]

[fn]
# C-idiomatic naming: the Rust side already uses snake_case `uno_plonky3_*`
# for every FFI function; no rename table needed.
rename_args = "none"

[parse]
parse_deps = false
