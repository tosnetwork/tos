[package]
name = "tos-uno-crypto-prototype"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["rlib", "staticlib"]

[dependencies]
bulletproofs = { path = "vendor/bulletproofs", default-features = false }
curve25519-dalek = { git = "https://github.com/xelis-project/curve25519-dalek", rev = "10042b03cfc92e505e9d33d2827d5c0f0d36989a", default-features = false, features = ["alloc", "std", "precomputed-tables"] }
merlin = { git = "https://github.com/xelis-project/merlin", rev = "ee857c79347e0e2201e5192523faea13ac9bf451", default-features = false }

[workspace]
exclude = ["vendor/bulletproofs"]

# ABI entry points contain recoverable panics rather than terminating the node.
[profile.dev]
panic = "unwind"

[profile.release]
panic = "unwind"

[build-dependencies]
cbindgen = { version = "=0.29.0", default-features = false }

[dev-dependencies]
rand = "=0.10.1"
bulletproofs = { path = "vendor/bulletproofs", default-features = false, features = ["kernel-test"] }
