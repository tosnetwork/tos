                  description: 'Optional constraints object.'
                expires_at:
                  type: integer
                  minimum: 0
                  maximum: 4294967295
                  description: 'Unix time of expiry.'
                revocable: {type: boolean, default: true, description: 'Whether the grant can be revoked.'}
      responses:
        '200':
          description: 'Method answer (success or error). Always HTTP 200.'
          content:
            application/json:
              schema:
                oneOf:
                  - allOf:
                      - {'$ref': '#/components/schemas/JsonRpcSuccess'}
                      - {properties: {result: {'$ref': '#/components/schemas/LifecycleMutationResult'}}}
                  - {'$ref': '#/components/schemas/JsonRpcError'}
        '401': {'$ref': '#/components/responses/Unauthorized'}
        '415': {'$ref': '#/components/responses/UnsupportedMediaType'}
        '429': {'$ref': '#/components/responses/RateLimited'}
  /revokeAccountAgent:
    post:
