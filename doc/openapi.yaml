      summary: 'Verified signatures of a masterchain block'
      tags: [blocks]
      description: |-
        Verified view. The result is PqSignaturesResult in doc/explorer-pq-rpc-v1.schema.json.

        Served history window: the evidence is built from the target block's masterchain state and its
        predecessor's. A block whose state this node has garbage-collected -- older than the node's state GC
        horizon, set by validator-engine --state-ttl (default 86400 s) and advanced only at key-block
        boundaries -- answers BLOCK_UNAVAILABLE (-32004, retryable false). Repeating the request against the
        same node will not succeed; use an archival node for older blocks. A block the node has not applied
        yet, or a timeout, answers UPSTREAM_UNAVAILABLE (retryable true).

        POST only: block_id.
      parameters:
        - name: seqno
          in: query
          description: 'Masterchain seqno. Required unless block_id is given; 0 answers UNSIGNED_BLOCK.'
          schema: {type: integer, minimum: 0, maximum: 2147483647}
        - name: with_proof
          in: query
          description: 'Include the raw proof bytes.'
          schema: {type: boolean, default: false}
      responses:
        '200':
          description: 'Method answer (success or error). Always HTTP 200.'
          content:
            application/json:
              schema:
                oneOf:
                  - allOf:
                      - {'$ref': '#/components/schemas/JsonRpcSuccess'}
                      - properties:
                          result: {'$ref': 'explorer-pq-rpc-v1.schema.json#/$defs/PqSignaturesResult'}
                  - {'$ref': '#/components/schemas/JsonRpcError'}
        '401': {'$ref': '#/components/responses/Unauthorized'}
        '429': {'$ref': '#/components/responses/RateLimited'}
    post:
      operationId: getMasterchainBlockSignatures
      summary: 'Verified signatures of a masterchain block'
      tags: [blocks]
      description: |-
        Verified view. The result is PqSignaturesResult in doc/explorer-pq-rpc-v1.schema.json.

        Served history window: the evidence is built from the target block's masterchain state and its
        predecessor's. A block whose state this node has garbage-collected -- older than the node's state GC
        horizon, set by validator-engine --state-ttl (default 86400 s) and advanced only at key-block
        boundaries -- answers BLOCK_UNAVAILABLE (-32004, retryable false). Repeating the request against the
        same node will not succeed; use an archival node for older blocks. A block the node has not applied
        yet, or a timeout, answers UPSTREAM_UNAVAILABLE (retryable true).
      requestBody:
        required: false
        description: 'Named parameters. An empty body is {}.'
        content:
          application/json:
            schema:
              type: object
              properties:
                seqno:
                  type: integer
                  minimum: 0
                  maximum: 2147483647
                  description: >-
                    Masterchain seqno. Required unless block_id is given; 0 answers UNSIGNED_BLOCK.
                block_id:
                  '$ref': '#/components/schemas/MasterchainBlockId'
                  description: >-
                    Complete masterchain block id to pin the answer to. Its seqno must equal `seqno` when both
                    are given; a different resolved block answers BLOCK_ID_MISMATCH. POST only (an object
                    cannot travel in a query string).
                with_proof: {type: boolean, default: false, description: 'Include the raw proof bytes.'}
      responses:
        '200':
          description: 'Method answer (success or error). Always HTTP 200.'
          content:
            application/json:
              schema:
                oneOf:
                  - allOf:
                      - {'$ref': '#/components/schemas/JsonRpcSuccess'}
                      - properties:
                          result: {'$ref': 'explorer-pq-rpc-v1.schema.json#/$defs/PqSignaturesResult'}
