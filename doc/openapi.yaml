        chain_id: {type: integer}
        delegation_ref: {type: string}
        replay_protection:
          type: object
          properties: {'@type': {const: transaction.replayProtection}, mode: {const: contract_defined}}
    SubmissionResult:
      type: object
      properties:
        '@type': {const: transaction.submissionResult}
        accepted: {type: boolean}
        transaction_hash: {type: string}
        submission_id: {type: string}
        status: {type: integer}
        authorization_roles: {'$ref': '#/components/schemas/AuthorizationRoles'}
