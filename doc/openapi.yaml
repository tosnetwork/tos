        action:
          type: object
          properties:
            '@type': {const: transaction.action.externalMessage}
            address: {type: string}
            body: {type: string}
            init_code: {type: string}
            init_data: {type: string}
        authorization_roles: {'$ref': '#/components/schemas/AuthorizationRoles'}
        fee_intent:
          type: object
          properties:
            '@type': {const: transaction.feeIntent}
