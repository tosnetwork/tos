        raw_form: {type: string}
        bounceable: {type: object, properties: {b64: {type: string}, b64url: {type: string}}}
        non_bounceable: {type: object, properties: {b64: {type: string}, b64url: {type: string}}}
        given_type: {type: string}
        test_only: {type: boolean}
    DetectedHash:
      type: object
      properties:
        '@type': {const: ext.utils.detectedHash}
        b64: {type: string}
        b64url: {type: string}
        hex: {type: string}
    RawFullAccountState:
      type: object
