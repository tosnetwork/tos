  # ──────────────────────────────────────────────────────────────────────
  # RunMethod
  # ──────────────────────────────────────────────────────────────────────
  /runGetMethod:
    post:
      operationId: runGetMethod_post
      summary: Run a smart contract get-method
      description: >
        Executes a get-method on a smart contract. Stack entries use
        legacy ["type", value] pair format (e.g. ["num", "123"],
        ["cell", {"bytes": "..."}]).
      tags: [runmethod]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [address, method]
              properties:
                address: {$ref: '#/components/schemas/TonAddr'}
                method:
                  type: string
                  description: Get-method name (e.g. "seqno", "get_nft_data")
                stack:
                  type: array
                  description: >
                    Input stack as array of ["type", value] pairs.
                    Types: "num"/"tvm.Number", "cell"/"tvm.Cell", "slice"/"tvm.Slice".
                  items:
                    type: array
                    minItems: 2
                    maxItems: 2
                seqno: {type: integer, description: 'MC block seqno (default latest)'}
      responses:
        '200':
          description: Get-method result
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OkResponse'
                  - type: object
                    properties:
                      result: {$ref: '#/components/schemas/RunResult'}

  /runGetMethodStd:
    post:
      operationId: runGetMethodStd_post
      summary: Run a get-method (standardized typed stack format)
      description: >
        Same as runGetMethod but returns TVM stack entries with typed
        wrappers (tvm.stackEntryNumber, tvm.stackEntryCell, etc.)
        instead of legacy ["type", value] pairs.
      tags: [runmethod]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [address, method]
              properties:
                address: {$ref: '#/components/schemas/TonAddr'}
                method: {type: string}
                stack:
                  type: array
                  items:
                    type: array
                    minItems: 2
                    maxItems: 2
                seqno: {type: integer}
      responses:
        '200':
          description: Get-method result (standardized stack)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OkResponse'
                  - type: object
                    properties:
                      result: {$ref: '#/components/schemas/RunResult'}

  # ──────────────────────────────────────────────────────────────────────
  # Send
  # ──────────────────────────────────────────────────────────────────────
  /sendBoc:
