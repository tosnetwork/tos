        block_id: {'$ref': '#/components/schemas/BlockIdExt'}
        state_proof: {type: string}
        config_proof: {type: string}
        decoded: {'$ref': 'explorer-pq-rpc-v1.schema.json#/$defs/DecodedConfig'}
    LibraryResult:
      type: object
      properties:
        '@type': {const: smc.libraryResult}
        result:
          type: array
          items: {type: object, properties: {hash: {type: string}, data: {type: string}}}
    RunResult:
      type: object
      properties:
        '@type': {const: smc.runResult}
