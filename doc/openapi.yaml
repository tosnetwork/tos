        is_self_submitted: {type: boolean}
        is_self_paid: {type: boolean}
    TransactionIntentInput:
      type: object
      properties:
        from: {'$ref': '#/components/schemas/Address'}
        address: {'$ref': '#/components/schemas/Address'}
        body: {'$ref': '#/components/schemas/Base64Boc'}
        init_code: {'$ref': '#/components/schemas/Base64Boc'}
        init_data: {'$ref': '#/components/schemas/Base64Boc'}
        account_model: {type: string}
        authorization_version: {type: string}
        delegation_ref: {type: string}
        action:
          type: object
          required: [body]
          properties:
            address: {'$ref': '#/components/schemas/Address'}
            body: {'$ref': '#/components/schemas/Base64Boc'}
            init_code: {'$ref': '#/components/schemas/Base64Boc'}
            init_data: {'$ref': '#/components/schemas/Base64Boc'}
        authorization_roles:
          type: object
          properties: {signer: {type: string}, submitter: {type: string}, fee_payer: {type: string}}
    TransactionIntent:
      type: object
      properties:
        '@type': {const: transaction.intent}
