# OpenAPI description of the validator-engine JSON-RPC server.
#
# Kept aligned with the dispatcher by scripts/check-jsonrpc-spec.py: the method
# names and flags in validator-engine/json-rpc-server.cpp and the error kinds in
# validator-engine/json-rpc-contract.h must match this file. Layout: 2-space
# indentation, block mappings, flow style only for short leaf values.
openapi: '3.1.0'
info:
  title: 'TOS JSON-RPC API'
  version: '2.0.0'
  description: |-
    JSON-RPC 2.0 and REST surface of the validator-engine embedded HTTP server.

    Every method is reachable three ways:

    - `POST /jsonRPC` with a JSON-RPC 2.0 envelope (single request or batch).
    - `POST /<method>` with the named-parameter object as the body (no envelope; an empty body is `{}`).
    - `GET /<method>?k=v` for the methods documented with a GET operation. The query string becomes the params
      object: `workchain`, `seqno`, `unixtime`, `param` and `config_id` become JSON integers when their text is
      exactly a canonical int32 (otherwise they stay strings and are refused); `include_pq`, `include_decoded`,
      `with_proof` and `include_experimental` become booleans for `true`/`false`; every other member stays a string.

    Only named parameters exist. Parameters are parsed strictly: a present value of the wrong JSON type or
    range
    is refused with -32602 naming the parameter, never replaced by a default.

    Answers. Every method answer, success or error, is HTTP 200 on every route, with the body
    `{"jsonrpc":"2.0","id":...,"result":...}` or
    `{"jsonrpc":"2.0","id":...,"error":{"code","message","data"}}`
    (`JsonRpcSuccess` / `JsonRpcError`). REST routes answer with id null. There is no `ok` member and no
    top-level
    `code`. Method-level capacity refusals are HTTP 200 with RATE_LIMITED. Only refusals made before any
    method
    runs use another status, with the same error body:

    | status | code | reason | when |
    | --- | --- | --- | --- |
    | 401 | -32000 | UNAUTHORIZED | missing or wrong X-API-Key |
    | 429 | -32005 | RATE_LIMITED | per-source ingress budget exhausted at header admission |
    | 404 | -32601 | METHOD_NOT_FOUND | GET of an unknown path |
    | 405 | -32600 | INVALID_REQUEST | HTTP method other than GET, POST or OPTIONS |
    | 415 | -32600 | INVALID_REQUEST | POST without Content-Type: application/json |

    OPTIONS on any path is a CORS preflight answered with 204. A POST to a path that is neither a method name
    nor
    another route is treated as `/jsonRPC`.

    Every block id in every response writes `shard` as the signed decimal string (see `Shard`). The typed
    error
    reasons are listed in `ErrorData`. Result shapes of the verified views (getMasterchainBlockSignatures, the
    include_pq views of getAccountCapability and getWalletInformation, the include_decoded view of
    getConfigParam,
    getProofQuery) are defined in doc/explorer-pq-rpc-v1.schema.json.

    Admin method: getNodeConsensusStatus (result `NodeConsensusStatus`) is off by default and served on
    `/jsonRPC` and `POST /getNodeConsensusStatus` only when the operator starts the engine with
    --json-rpc-expose-consensus-status; otherwise it answers METHOD_NOT_FOUND. It has no GET route.

    Write methods (sendBoc, sendBocReturnHash, sendBocReturnHashNoError, sendQuery, submitSignedTransaction
    and the
    grant/revoke methods) answer WRITE_DISABLED (-32601) when the server runs in read-only mode.
  license: {name: GPL-2.0-or-later, identifier: GPL-2.0-or-later}
servers: [{url: /, description: 'The validator-engine JSON-RPC listener.'}]
security: [{ApiKeyAuth: []}]
tags:
  - {name: envelope, description: 'JSON-RPC 2.0 envelope endpoint'}
  - {name: health, description: 'Probes and metadata'}
  - {name: utils, description: 'Address and hash utilities'}
  - {name: accounts, description: 'Account state'}
  - {name: permissions, description: 'Account permission views and lifecycle'}
  - {name: blocks, description: 'Blocks and chain state'}
  - {name: transactions, description: Transactions}
  - {name: config, description: 'Configuration, libraries and proofs'}
  - {name: runmethod, description: 'Get-method execution'}
  - {name: send, description: 'Message building, submission and fees'}
paths:
  /jsonRPC:
    post:
      operationId: jsonRPC
      summary: 'JSON-RPC 2.0 endpoint'
      tags: [envelope]
      description: |-
        JSON-RPC 2.0 envelope endpoint.

        Envelope rules:

        - Empty body or not JSON: -32700 PARSE_ERROR. Top level neither an object nor an array: -32600.
        - `jsonrpc` must be exactly the string "2.0"; `method` must be a string; otherwise -32600.
        - `params` absent or an object. An array (positional parameters) is refused with -32602
          INVALID_ARGUMENT:
          only named parameters exist. Any other type, including null, is -32600.
        - `id` a string, number or null; anything else is -32600 with id null. A request object with no `id`
        member is a notification: it runs and the answer is HTTP 204 with no body, also when the method fails
          or is
          unknown. An invalid envelope (-32600) is always answered.
        - Unknown method: -32601 METHOD_NOT_FOUND "Method not found: <name>". Write method in read-only mode:
          -32601
          WRITE_DISABLED.

        Batch: an array of 1 to 100 request objects, processed in order. The answer is a JSON array of the
        answers to
        the non-notification elements; when every element is a notification the answer is HTTP 204 with no
        body. An
        empty array or more than 100 elements is answered with a single -32600 error object.
      x-admin-methods: [getNodeConsensusStatus]
      x-write-methods:
        - sendBoc
        - sendBocReturnHash
        - sendBocReturnHashNoError
        - sendQuery
        - submitSignedTransaction
        - grantAccountDelegation
        - revokeAccountDelegation
        - grantAccountSession
        - revokeAccountSession
        - grantAccountAgent
        - revokeAccountAgent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - {'$ref': '#/components/schemas/JsonRpcRequest'}
                - type: array
                  minItems: 1
                  maxItems: 100
                  items: {'$ref': '#/components/schemas/JsonRpcRequest'}
      responses:
        '200':
          description: 'Answer to a request, or array of answers to a batch. Method errors are HTTP 200.'
          content:
            application/json:
              schema:
                oneOf:
                  - {'$ref': '#/components/schemas/JsonRpcSuccess'}
                  - {'$ref': '#/components/schemas/JsonRpcError'}
                  - type: array
                    items:
                      oneOf:
                        - {'$ref': '#/components/schemas/JsonRpcSuccess'}
                        - {'$ref': '#/components/schemas/JsonRpcError'}
        '204': {description: 'Notification, or a batch of notifications only. No body.'}
        '401': {'$ref': '#/components/responses/Unauthorized'}
        '415': {'$ref': '#/components/responses/UnsupportedMediaType'}
        '429': {'$ref': '#/components/responses/RateLimited'}
  /healthcheck:
    get:
      operationId: healthcheck
      summary: 'Liveness probe'
      tags: [health]
      security: []
      description: 'Static reply; starts no work and needs no API key.'
      responses:
        '200':
          description: Alive.
          content: {text/plain: {schema: {const: OK}}}
  /readyz:
    get:
      operationId: readyz
      summary: 'Readiness probe'
      tags: [health]
      description: >-
        Reports whether the node is synced. Not charged to the per-source budget; the answer is cached for a
        short interval.
      responses:
        '200':
          description: Synced.
          content: {application/json: {schema: {'$ref': '#/components/schemas/ReadyzResult'}}}
        '503':
          description: 'Not synced, or the node could not be queried.'
          content: {application/json: {schema: {'$ref': '#/components/schemas/ReadyzResult'}}}
        '401': {'$ref': '#/components/responses/Unauthorized'}
  /api-info:
    get:
      operationId: apiInfo
      summary: 'Machine-readable API metadata'
      tags: [health]
      security: []
      description: >-
        Derived from the method table, so it lists exactly the methods this server serves. No API key needed.
      responses:
        '200':
          description: 'API metadata.'
          content: {application/json: {schema: {'$ref': '#/components/schemas/ApiInfo'}}}
  /detectAddress:
    get:
      operationId: detectAddress_get
      summary: 'Detect the forms of an address'
      tags: [utils]
      parameters:
        - name: address
          in: query
          required: true
          description: 'Account address: raw `workchain:hex` or the user-friendly base64/base64url form.'
          schema: {'$ref': '#/components/schemas/Address'}
      responses:
        '200':
          description: 'Method answer (success or error). Always HTTP 200.'
          content:
            application/json:
              schema:
                oneOf:
                  - allOf:
                      - {'$ref': '#/components/schemas/JsonRpcSuccess'}
                      - {properties: {result: {'$ref': '#/components/schemas/DetectedAddress'}}}
                  - {'$ref': '#/components/schemas/JsonRpcError'}
        '401': {'$ref': '#/components/responses/Unauthorized'}
        '429': {'$ref': '#/components/responses/RateLimited'}
    post:
      operationId: detectAddress
      summary: 'Detect the forms of an address'
      tags: [utils]
      requestBody:
        required: false
        description: 'Named parameters. An empty body is {}.'
        content:
          application/json:
            schema:
              type: object
              required: [address]
              properties:
                address:
                  '$ref': '#/components/schemas/Address'
                  description: >-
                    Account address: raw `workchain:hex` or the user-friendly base64/base64url form.
      responses:
        '200':
          description: 'Method answer (success or error). Always HTTP 200.'
          content:
            application/json:
              schema:
                oneOf:
                  - allOf:
                      - {'$ref': '#/components/schemas/JsonRpcSuccess'}
                      - {properties: {result: {'$ref': '#/components/schemas/DetectedAddress'}}}
                  - {'$ref': '#/components/schemas/JsonRpcError'}
        '401': {'$ref': '#/components/responses/Unauthorized'}
        '415': {'$ref': '#/components/responses/UnsupportedMediaType'}
        '429': {'$ref': '#/components/responses/RateLimited'}
  /detectHash:
    get:
      operationId: detectHash_get
      summary: 'Detect the encodings of a 256-bit hash'
      tags: [utils]
      parameters:
        - name: hash
          in: query
          required: true
          description: 'Hash as base64, base64url or hex.'
          schema: {'$ref': '#/components/schemas/Hash'}
      responses:
        '200':
          description: 'Method answer (success or error). Always HTTP 200.'
          content:
            application/json:
              schema:
                oneOf:
                  - allOf:
                      - {'$ref': '#/components/schemas/JsonRpcSuccess'}
                      - {properties: {result: {'$ref': '#/components/schemas/DetectedHash'}}}
                  - {'$ref': '#/components/schemas/JsonRpcError'}
        '401': {'$ref': '#/components/responses/Unauthorized'}
        '429': {'$ref': '#/components/responses/RateLimited'}
    post:
      operationId: detectHash
      summary: 'Detect the encodings of a 256-bit hash'
      tags: [utils]
      requestBody:
        required: false
        description: 'Named parameters. An empty body is {}.'
        content:
          application/json:
            schema:
              type: object
              required: [hash]
              properties:
                hash: {'$ref': '#/components/schemas/Hash', description: 'Hash as base64, base64url or hex.'}
      responses:
        '200':
          description: 'Method answer (success or error). Always HTTP 200.'
          content:
            application/json:
              schema:
                oneOf:
                  - allOf:
                      - {'$ref': '#/components/schemas/JsonRpcSuccess'}
                      - {properties: {result: {'$ref': '#/components/schemas/DetectedHash'}}}
                  - {'$ref': '#/components/schemas/JsonRpcError'}
        '401': {'$ref': '#/components/responses/Unauthorized'}
        '415': {'$ref': '#/components/responses/UnsupportedMediaType'}
        '429': {'$ref': '#/components/responses/RateLimited'}
  /packAddress:
    get:
      operationId: packAddress_get
      summary: 'Raw address to user-friendly form'
      tags: [utils]
      parameters:
        - name: address
          in: query
          required: true
          description: 'Raw address `workchain:hex`.'
          schema: {type: string}
      responses:
        '200':
          description: 'Method answer (success or error). Always HTTP 200.'
          content:
            application/json:
              schema:
                oneOf:
                  - allOf:
                      - {'$ref': '#/components/schemas/JsonRpcSuccess'}
                      - {properties: {result: {type: string, description: 'User-friendly address.'}}}
                  - {'$ref': '#/components/schemas/JsonRpcError'}
        '401': {'$ref': '#/components/responses/Unauthorized'}
        '429': {'$ref': '#/components/responses/RateLimited'}
    post:
      operationId: packAddress
      summary: 'Raw address to user-friendly form'
      tags: [utils]
      requestBody:
        required: false
        description: 'Named parameters. An empty body is {}.'
        content:
          application/json:
            schema:
              type: object
              required: [address]
              properties: {address: {type: string, description: 'Raw address `workchain:hex`.'}}
      responses:
        '200':
          description: 'Method answer (success or error). Always HTTP 200.'
          content:
            application/json:
              schema:
                oneOf:
                  - allOf:
                      - {'$ref': '#/components/schemas/JsonRpcSuccess'}
                      - {properties: {result: {type: string, description: 'User-friendly address.'}}}
                  - {'$ref': '#/components/schemas/JsonRpcError'}
        '401': {'$ref': '#/components/responses/Unauthorized'}
        '415': {'$ref': '#/components/responses/UnsupportedMediaType'}
        '429': {'$ref': '#/components/responses/RateLimited'}
  /unpackAddress:
    get:
      operationId: unpackAddress_get
      summary: 'User-friendly address to raw form'
      tags: [utils]
      parameters:
        - name: address
          in: query
          required: true
          description: 'Account address: raw `workchain:hex` or the user-friendly base64/base64url form.'
          schema: {'$ref': '#/components/schemas/Address'}
      responses:
        '200':
          description: 'Method answer (success or error). Always HTTP 200.'
          content:
            application/json:
              schema:
                oneOf:
                  - allOf:
                      - {'$ref': '#/components/schemas/JsonRpcSuccess'}
                      - {properties: {result: {type: string, description: 'Raw address `workchain:hex`.'}}}
                  - {'$ref': '#/components/schemas/JsonRpcError'}
        '401': {'$ref': '#/components/responses/Unauthorized'}
        '429': {'$ref': '#/components/responses/RateLimited'}
    post:
      operationId: unpackAddress
      summary: 'User-friendly address to raw form'
      tags: [utils]
      requestBody:
        required: false
        description: 'Named parameters. An empty body is {}.'
        content:
          application/json:
            schema:
              type: object
              required: [address]
              properties:
                address:
                  '$ref': '#/components/schemas/Address'
                  description: >-
                    Account address: raw `workchain:hex` or the user-friendly base64/base64url form.
      responses:
        '200':
          description: 'Method answer (success or error). Always HTTP 200.'
          content:
            application/json:
              schema:
                oneOf:
                  - allOf:
                      - {'$ref': '#/components/schemas/JsonRpcSuccess'}
                      - {properties: {result: {type: string, description: 'Raw address `workchain:hex`.'}}}
                  - {'$ref': '#/components/schemas/JsonRpcError'}
        '401': {'$ref': '#/components/responses/Unauthorized'}
        '415': {'$ref': '#/components/responses/UnsupportedMediaType'}
        '429': {'$ref': '#/components/responses/RateLimited'}
  /getAddressInformation:
    get:
      operationId: getAddressInformation_get
      summary: 'Raw account state'
      tags: [accounts]
      parameters:
        - name: address
          in: query
          required: true
          description: 'Account address: raw `workchain:hex` or the user-friendly base64/base64url form.'
          schema: {'$ref': '#/components/schemas/Address'}
        - name: seqno
          in: query
          description: >-
            Masterchain block seqno to read at. Absent = the latest block; 0 = block 0 (not latest).
          schema: {'$ref': '#/components/schemas/Seqno'}
      responses:
        '200':
          description: 'Method answer (success or error). Always HTTP 200.'
          content:
            application/json:
              schema:
                oneOf:
                  - allOf:
                      - {'$ref': '#/components/schemas/JsonRpcSuccess'}
                      - {properties: {result: {'$ref': '#/components/schemas/RawFullAccountState'}}}
                  - {'$ref': '#/components/schemas/JsonRpcError'}
        '401': {'$ref': '#/components/responses/Unauthorized'}
        '429': {'$ref': '#/components/responses/RateLimited'}
    post:
      operationId: getAddressInformation
      summary: 'Raw account state'
      tags: [accounts]
      requestBody:
        required: false
        description: 'Named parameters. An empty body is {}.'
        content:
          application/json:
            schema:
              type: object
              required: [address]
              properties:
                address:
                  '$ref': '#/components/schemas/Address'
                  description: >-
                    Account address: raw `workchain:hex` or the user-friendly base64/base64url form.
                seqno:
                  '$ref': '#/components/schemas/Seqno'
                  description: >-
                    Masterchain block seqno to read at. Absent = the latest block; 0 = block 0 (not latest).
      responses:
        '200':
          description: 'Method answer (success or error). Always HTTP 200.'
          content:
            application/json:
              schema:
                oneOf:
                  - allOf:
                      - {'$ref': '#/components/schemas/JsonRpcSuccess'}
                      - {properties: {result: {'$ref': '#/components/schemas/RawFullAccountState'}}}
                  - {'$ref': '#/components/schemas/JsonRpcError'}
        '401': {'$ref': '#/components/responses/Unauthorized'}
        '415': {'$ref': '#/components/responses/UnsupportedMediaType'}
        '429': {'$ref': '#/components/responses/RateLimited'}
  /getExtendedAddressInformation:
    get:
      operationId: getExtendedAddressInformation_get
      summary: 'Extended account state'
      tags: [accounts]
      parameters:
        - name: address
          in: query
          required: true
          description: 'Account address: raw `workchain:hex` or the user-friendly base64/base64url form.'
          schema: {'$ref': '#/components/schemas/Address'}
        - name: seqno
          in: query
          description: >-
            Masterchain block seqno to read at. Absent = the latest block; 0 = block 0 (not latest).
          schema: {'$ref': '#/components/schemas/Seqno'}
      responses:
        '200':
          description: 'Method answer (success or error). Always HTTP 200.'
          content:
            application/json:
              schema:
                oneOf:
                  - allOf:
                      - {'$ref': '#/components/schemas/JsonRpcSuccess'}
                      - {properties: {result: {'$ref': '#/components/schemas/FullAccountState'}}}
                  - {'$ref': '#/components/schemas/JsonRpcError'}
        '401': {'$ref': '#/components/responses/Unauthorized'}
        '429': {'$ref': '#/components/responses/RateLimited'}
    post:
      operationId: getExtendedAddressInformation
      summary: 'Extended account state'
      tags: [accounts]
      requestBody:
        required: false
        description: 'Named parameters. An empty body is {}.'
        content:
          application/json:
            schema:
              type: object
              required: [address]
              properties:
                address:
                  '$ref': '#/components/schemas/Address'
                  description: >-
                    Account address: raw `workchain:hex` or the user-friendly base64/base64url form.
                seqno:
                  '$ref': '#/components/schemas/Seqno'
                  description: >-
                    Masterchain block seqno to read at. Absent = the latest block; 0 = block 0 (not latest).
      responses:
        '200':
          description: 'Method answer (success or error). Always HTTP 200.'
          content:
            application/json:
              schema:
                oneOf:
                  - allOf:
                      - {'$ref': '#/components/schemas/JsonRpcSuccess'}
                      - {properties: {result: {'$ref': '#/components/schemas/FullAccountState'}}}
                  - {'$ref': '#/components/schemas/JsonRpcError'}
        '401': {'$ref': '#/components/responses/Unauthorized'}
        '415': {'$ref': '#/components/responses/UnsupportedMediaType'}
        '429': {'$ref': '#/components/responses/RateLimited'}
  /getWalletInformation:
    get:
      operationId: getWalletInformation_get
      summary: 'Wallet information (type, seqno, balance)'
      tags: [accounts]
      description: |-
        With include_pq, with_proof or block_id the answer is the verified view: the result additionally
        carries `pq_authorization` (PublicAuthorization in doc/explorer-pq-rpc-v1.schema.json) and its
        failures use the verified-view reasons.

        POST only: block_id.
      parameters:
        - name: address
          in: query
          required: true
          description: 'Account address: raw `workchain:hex` or the user-friendly base64/base64url form.'
          schema: {'$ref': '#/components/schemas/Address'}
        - name: seqno
          in: query
          description: >-
            Masterchain block seqno to read at. Absent = the latest block; 0 = block 0 (not latest).
          schema: {'$ref': '#/components/schemas/Seqno'}
        - name: include_pq
          in: query
          description: >-
            Request the verified post-quantum authorization view. Requires the canonical raw address form
            (`workchain:64 lowercase hex`). Any of include_pq, with_proof or block_id selects the verified
            view, which requires include_pq=true.
          schema: {type: boolean, default: false}
        - name: with_proof
          in: query
          description: 'Include the raw proof bytes.'
          schema: {type: boolean, default: false}
        - name: include_experimental
          in: query
          description: 'Include experimental capability fields.'
          schema: {type: boolean, default: false}
      responses:
        '200':
          description: 'Method answer (success or error). Always HTTP 200.'
          content:
            application/json:
              schema:
                oneOf:
                  - allOf:
                      - {'$ref': '#/components/schemas/JsonRpcSuccess'}
                      - {properties: {result: {'$ref': '#/components/schemas/WalletInformation'}}}
                  - {'$ref': '#/components/schemas/JsonRpcError'}
        '401': {'$ref': '#/components/responses/Unauthorized'}
        '429': {'$ref': '#/components/responses/RateLimited'}
    post:
      operationId: getWalletInformation
      summary: 'Wallet information (type, seqno, balance)'
      tags: [accounts]
      description: >-
        With include_pq, with_proof or block_id the answer is the verified view: the result additionally
        carries `pq_authorization` (PublicAuthorization in doc/explorer-pq-rpc-v1.schema.json) and its
        failures use the verified-view reasons.
      requestBody:
        required: false
        description: 'Named parameters. An empty body is {}.'
        content:
          application/json:
            schema:
              type: object
              required: [address]
              properties:
                address:
                  '$ref': '#/components/schemas/Address'
                  description: >-
                    Account address: raw `workchain:hex` or the user-friendly base64/base64url form.
                seqno:
                  '$ref': '#/components/schemas/Seqno'
                  description: >-
                    Masterchain block seqno to read at. Absent = the latest block; 0 = block 0 (not latest).
                include_pq:
                  type: boolean
                  default: false
                  description: >-
                    Request the verified post-quantum authorization view. Requires the canonical raw address
                    form (`workchain:64 lowercase hex`). Any of include_pq, with_proof or block_id selects the
                    verified view, which requires include_pq=true.
                with_proof: {type: boolean, default: false, description: 'Include the raw proof bytes.'}
                include_experimental:
                  type: boolean
                  default: false
                  description: 'Include experimental capability fields.'
                block_id:
                  '$ref': '#/components/schemas/MasterchainBlockId'
                  description: >-
                    Complete masterchain block id to pin the answer to. Its seqno must equal `seqno` when both
                    are given; a different resolved block answers BLOCK_ID_MISMATCH. POST only (an object
                    cannot travel in a query string).
      responses:
        '200':
          description: 'Method answer (success or error). Always HTTP 200.'
          content:
            application/json:
              schema:
                oneOf:
                  - allOf:
                      - {'$ref': '#/components/schemas/JsonRpcSuccess'}
                      - {properties: {result: {'$ref': '#/components/schemas/WalletInformation'}}}
                  - {'$ref': '#/components/schemas/JsonRpcError'}
        '401': {'$ref': '#/components/responses/Unauthorized'}
        '415': {'$ref': '#/components/responses/UnsupportedMediaType'}
        '429': {'$ref': '#/components/responses/RateLimited'}
  /getAddressBalance:
    get:
      operationId: getAddressBalance_get
      summary: 'Account balance in nanotomis'
      tags: [accounts]
      parameters:
        - name: address
          in: query
          required: true
          description: 'Account address: raw `workchain:hex` or the user-friendly base64/base64url form.'
          schema: {'$ref': '#/components/schemas/Address'}
        - name: seqno
          in: query
          description: >-
            Masterchain block seqno to read at. Absent = the latest block; 0 = block 0 (not latest).
          schema: {'$ref': '#/components/schemas/Seqno'}
      responses:
        '200':
          description: 'Method answer (success or error). Always HTTP 200.'
          content:
            application/json:
              schema:
                oneOf:
                  - allOf:
                      - {'$ref': '#/components/schemas/JsonRpcSuccess'}
                      - properties:
                          result:
                            type: string
                            pattern: '^[0-9]+$'
                            description: 'Balance in nanotomis, decimal.'
                  - {'$ref': '#/components/schemas/JsonRpcError'}
        '401': {'$ref': '#/components/responses/Unauthorized'}
        '429': {'$ref': '#/components/responses/RateLimited'}
    post:
      operationId: getAddressBalance
      summary: 'Account balance in nanotomis'
      tags: [accounts]
      requestBody:
        required: false
        description: 'Named parameters. An empty body is {}.'
        content:
          application/json:
