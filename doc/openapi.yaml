  /getConfigParam:
    get:
      operationId: getConfigParam_get
      summary: 'One configuration parameter'
      tags: [config]
      description: |-
        An absent parameter answers CONFIG_PARAM_ABSENT (-32004) with message "config param N not found".

        POST only: block_id.
      parameters:
        - name: param
          in: query
          description: 'Configuration parameter id (required unless config_id is given).'
          schema: {type: integer, format: int32}
        - {name: config_id, in: query, description: 'Alias of param.', schema: {type: integer, format: int32}}
        - name: seqno
          in: query
          description: >-
            Masterchain block seqno to read at. Absent = the latest block; 0 = block 0 (not latest).
          schema: {'$ref': '#/components/schemas/Seqno'}
        - name: with_proof
          in: query
          description: 'Include the raw proof bytes.'
          schema: {type: boolean, default: false}
        - name: include_decoded
          in: query
          description: >-
            Request the verified typed view: the result additionally carries `decoded` (DecodedConfig in
            doc/explorer-pq-rpc-v1.schema.json). block_id selects the same view and requires
            include_decoded=true.
          schema: {type: boolean, default: false}
      responses:
        '200':
          description: 'Method answer (success or error). Always HTTP 200.'
          content:
            application/json:
              schema:
                oneOf:
                  - allOf:
                      - {'$ref': '#/components/schemas/JsonRpcSuccess'}
                      - {properties: {result: {'$ref': '#/components/schemas/ConfigInfo'}}}
                  - {'$ref': '#/components/schemas/JsonRpcError'}
        '401': {'$ref': '#/components/responses/Unauthorized'}
        '429': {'$ref': '#/components/responses/RateLimited'}
    post:
      operationId: getConfigParam
      summary: 'One configuration parameter'
      tags: [config]
      description: >-
        An absent parameter answers CONFIG_PARAM_ABSENT (-32004) with message "config param N not found".
      requestBody:
        required: false
        description: 'Named parameters. An empty body is {}.'
        content:
          application/json:
            schema:
              type: object
              properties:
                param:
                  type: integer
                  format: int32
                  description: 'Configuration parameter id (required unless config_id is given).'
                config_id: {type: integer, format: int32, description: 'Alias of param.'}
                seqno:
                  '$ref': '#/components/schemas/Seqno'
                  description: >-
                    Masterchain block seqno to read at. Absent = the latest block; 0 = block 0 (not latest).
                with_proof: {type: boolean, default: false, description: 'Include the raw proof bytes.'}
                include_decoded:
                  type: boolean
                  default: false
                  description: >-
                    Request the verified typed view: the result additionally carries `decoded` (DecodedConfig
                    in doc/explorer-pq-rpc-v1.schema.json). block_id selects the same view and requires
                    include_decoded=true.
                block_id:
                  '$ref': '#/components/schemas/MasterchainBlockId'
                  description: >-
                    Complete masterchain block id to pin the answer to. Its seqno must equal `seqno` when both
                    are given; a different resolved block answers BLOCK_ID_MISMATCH. POST only (an object
                    cannot travel in a query string).
      responses:
        '200':
          description: 'Method answer (success or error). Always HTTP 200.'
          content:
            application/json:
              schema:
                oneOf:
                  - allOf:
                      - {'$ref': '#/components/schemas/JsonRpcSuccess'}
                      - {properties: {result: {'$ref': '#/components/schemas/ConfigInfo'}}}
                  - {'$ref': '#/components/schemas/JsonRpcError'}
        '401': {'$ref': '#/components/responses/Unauthorized'}
        '415': {'$ref': '#/components/responses/UnsupportedMediaType'}
        '429': {'$ref': '#/components/responses/RateLimited'}
  /getConfigAll:
    get:
      operationId: getConfigAll_get
