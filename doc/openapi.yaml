        replay_protection:
          type: object
          properties: {'@type': {const: transaction.replayProtection}, mode: {const: contract_defined}}
        delegation_ref: {type: string}
    SigningPayload:
      type: object
      properties:
        '@type': {const: transaction.signingPayload}
