        account: {type: string}
    RawTransactions:
      type: object
      properties:
        '@type': {const: raw.transactions}
        transactions: {type: array, items: {'$ref': '#/components/schemas/RawTransaction'}}
        previous_transaction_id: {'$ref': '#/components/schemas/InternalTransactionId'}
    LocatedTransaction:
      type: object
      properties:
        '@type': {const: blocks.transaction}
