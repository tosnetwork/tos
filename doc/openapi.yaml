      x-write: true
      requestBody:
        required: false
        description: 'Named parameters. An empty body is {}.'
        content:
          application/json:
            schema:
              type: object
              required: [address, permission_id]
              properties:
                address:
                  '$ref': '#/components/schemas/Address'
                  description: 'Account that granted the permission.'
                permission_id: {type: string, minLength: 1, description: 'Permission to revoke.'}
      responses:
        '200':
          description: 'Method answer (success or error). Always HTTP 200.'
          content:
            application/json:
              schema:
                oneOf:
                  - allOf:
                      - {'$ref': '#/components/schemas/JsonRpcSuccess'}
                      - {properties: {result: {'$ref': '#/components/schemas/LifecycleMutationResult'}}}
                  - {'$ref': '#/components/schemas/JsonRpcError'}
        '401': {'$ref': '#/components/responses/Unauthorized'}
        '415': {'$ref': '#/components/responses/UnsupportedMediaType'}
        '429': {'$ref': '#/components/responses/RateLimited'}
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: >-
        Required on every route except /healthcheck, /api-info and OPTIONS when the server is configured with
        an API key.
  responses:
    Unauthorized:
      description: 'Missing or wrong X-API-Key: code -32000, reason UNAUTHORIZED.'
      content: {application/json: {schema: {'$ref': '#/components/schemas/JsonRpcError'}}}
    RateLimited:
      description: >-
        Per-source ingress budget exhausted at header admission: code -32005, reason RATE_LIMITED, retryable.
      content: {application/json: {schema: {'$ref': '#/components/schemas/JsonRpcError'}}}
    UnsupportedMediaType:
      description: 'POST without Content-Type application/json: code -32600, reason INVALID_REQUEST.'
      content: {application/json: {schema: {'$ref': '#/components/schemas/JsonRpcError'}}}
  schemas:
    Workchain:
      type: integer
      format: int32
      minimum: -2147483648
      maximum: 2147483647
      description: >-
        Workchain id, a JSON integer in the signed 32-bit range. A string such as "-1" is refused.
    Seqno:
      type: integer
      minimum: 0
      maximum: 2147483647
      description: >-
        Block seqno, a JSON integer in [0, 2147483647]. Strings, negatives, fractions and exponent forms are
        refused.
    Shard:
      type: string
      pattern: '^-?[1-9][0-9]*$'
      description: >-
        Shard id as the signed decimal of the 64-bit shard id, written exactly as responses write it: no '+',
        no leading zeros, never 0, e.g. "-9223372036854775808" for the full masterchain or basechain shard.
        The unsigned form, hex and JSON numbers are refused.
      examples: ['-9223372036854775808']
    Lt:
      type: string
      pattern: '^(0|[1-9][0-9]*)$'
      description: 'Logical time, canonical decimal of a non-negative 64-bit integer.'
    LtInput:
      oneOf: [{'$ref': '#/components/schemas/Lt'}, {type: integer, minimum: 0}]
      description: 'Logical time as the canonical decimal string or a JSON integer.'
    Address: {type: string, description: 'Account address: raw `workchain:hex` or user-friendly form.'}
    Hash: {type: string, description: '256-bit hash, base64 (standard or url-safe) or hex.'}
    Base64Boc: {type: string, contentEncoding: base64, description: 'Base64 serialized bag of cells.'}
    BlockIdExt:
      type: object
      required: [workchain, shard, seqno, root_hash, file_hash]
      properties:
        '@type': {const: tos.blockIdExt}
        workchain: {'$ref': '#/components/schemas/Workchain'}
        shard: {'$ref': '#/components/schemas/Shard'}
        seqno: {'$ref': '#/components/schemas/Seqno'}
        root_hash: {type: string, description: Base64.}
        file_hash: {type: string, description: Base64.}
    MasterchainBlockId:
      type: object
      required: [workchain, shard, seqno, root_hash, file_hash]
      additionalProperties: false
      description: >-
        Complete masterchain block id used as a selector. Duplicate or unknown members are refused.
      properties:
        '@type': {type: string}
        workchain: {const: -1}
        shard: {const: '-9223372036854775808'}
        seqno: {'$ref': '#/components/schemas/Seqno'}
        root_hash:
          type: string
          minLength: 44
          maxLength: 44
          description: 'Standard padded base64 of 32 bytes.'
        file_hash:
          type: string
          minLength: 44
          maxLength: 44
          description: 'Standard padded base64 of 32 bytes.'
    BootstrapState:
      type: object
      required: [id, ready, reason, gen_utime, expires_at, archive_ttl]
      properties:
        id: {'$ref': '#/components/schemas/BlockIdExt'}
        ready: {type: boolean}
        reason:
          type: string
          enum: [ready, snapshot_not_found, snapshot_expired, state_unavailable, proof_unavailable, invalid_state, resource_limit, timeout]
        gen_utime:
          type: integer
          minimum: 0
          description: 'Snapshot creation Unix time; zero when its description is unavailable.'
        expires_at:
          type: integer
          minimum: 0
          description: 'Persistent snapshot expiry Unix time; zero when its description is unavailable.'
        archive_ttl:
          type: number
          description: >-
            This node's configured ordinary archive retention in seconds. A client
            must conservatively reject an anchor that is too old for this retention;
            this field does not promise that all intervening archives exist.
    InternalTransactionId:
      type: object
      properties:
        '@type': {const: internal.transactionId}
        lt: {'$ref': '#/components/schemas/Lt'}
        hash: {type: string}
    JsonRpcRequest:
      type: object
      required: [jsonrpc, method]
      description: 'One JSON-RPC 2.0 request object. A request object with no `id` member is a notification.'
      properties:
        jsonrpc:
          const: '2.0'
          description: >-
            Exactly the string "2.0"; a missing member, "1.0" or the number 2.0 is refused with -32600.
        method:
          type: string
          enum:
            - detectAddress
            - detectHash
            - packAddress
            - unpackAddress
            - getAddressInformation
            - getExtendedAddressInformation
            - getWalletInformation
            - getAddressBalance
            - getAddressState
            - getAccountCapability
            - getAccountDelegations
            - getAccountSessions
            - getAccountAgents
            - getTokenData
            - getAccountJettons
            - getAccountNfts
            - getAccountEvents
            - getAccountEvent
            - getMasterchainInfo
            - getConsensusBlock
            - getNodeConsensusStatus
            - lookupBlock
            - shards
            - getShards
            - getBlockHeader
            - getBootstrapState
            - getMasterchainBlockSignatures
            - getShardBlockProof
            - getOutMsgQueueSize
            - getBlockTransactions
            - getBlockTransactionsExt
            - getTransactions
            - getTransactionsStd
            - tryLocateTx
            - tryLocateResultTx
            - tryLocateSourceTx
            - getConfigParam
            - getConfigAll
            - getLibraries
            - getProofQuery
            - runGetMethod
            - runGetMethodStd
            - estimateFee
            - buildTransactionIntent
            - getSigningPayload
            - sendBoc
            - sendBocReturnHash
            - sendBocReturnHashNoError
            - sendQuery
            - submitSignedTransaction
            - grantAccountDelegation
            - revokeAccountDelegation
            - grantAccountSession
            - revokeAccountSession
            - grantAccountAgent
            - revokeAccountAgent
          description: >-
            Method name. A non-string is refused with -32600; an unknown name answers -32601 METHOD_NOT_FOUND.
            getNodeConsensusStatus is served only when the operator enabled it.
        params:
          type: object
          description: >-
            Named parameters. Absent means {}. An array (positional parameters) is refused with -32602
            INVALID_ARGUMENT, message "Invalid params: positional parameters are not supported; 'params' must
            be an object"; any other type, including null, with -32600. Only named parameters exist.
        id:
          type: [string, number, 'null']
          description: >-
            Echoed in the answer. Any other type is refused with -32600 and id null. Absent = notification.
    JsonRpcSuccess:
      type: object
      required: [jsonrpc, id, result]
      additionalProperties: false
      properties: {jsonrpc: {const: '2.0'}, id: {type: [string, number, 'null']}, result: {}}
    JsonRpcError:
      type: object
      required: [jsonrpc, id, error]
      additionalProperties: false
      description: 'Every error answer, on every route. REST routes answer with id null.'
      properties:
        jsonrpc: {const: '2.0'}
        id: {type: [string, number, 'null']}
        error:
          type: object
          required: [code, message, data]
          additionalProperties: false
          properties:
            code: {type: integer}
            message: {type: string}
            data: {'$ref': '#/components/schemas/ErrorData'}
    ErrorData:
      type: object
      required: [schema_version, reason, retryable]
      additionalProperties: false
      description: |-
        Typed error detail. `reason` is the stable machine-readable name to branch on; `code` is the JSON-RPC
        code it travels under; `retryable` says whether repeating the same request can succeed.

        | reason | code | retryable | meaning |
        | --- | --- | --- | --- |
        | PARSE_ERROR | -32700 | false | The body is empty or is not JSON. |
        | INVALID_REQUEST | -32600 | false | The envelope is invalid (jsonrpc not exactly "2.0", method not a string, params neither absent nor an object or array, id not a string/number/null, empty or oversized batch), or a pre-dispatch HTTP refusal (405 method, 415 content type). |
        | METHOD_NOT_FOUND | -32601 | false | No method of that name is served (including the admin method when the operator has not enabled it), or GET of an unknown path (HTTP 404). Also used by the wallet-index methods when the node runs without the index. |
        | WRITE_DISABLED | -32601 | false | A write method was called on a server started in read-only mode. |
        | INVALID_ARGUMENT | -32602 | false | A parameter is missing, of the wrong JSON type, out of range or malformed; positional (array) params. The message names the parameter. |
        | INTERNAL_ERROR | -32603 | false | The method failed for a reason that has no more specific kind. Repeating the same request is not expected to succeed. |
        | UNAUTHORIZED | -32000 | false | Missing or wrong X-API-Key (HTTP 401, before any method runs). |
        | RATE_LIMITED | -32005 | true | A capacity budget refused the request: the per-source ingress budget at header admission (HTTP 429), or a method-level budget such as the per-source method budget or verified-view worker capacity (HTTP 200). Retry later. |
        | NOT_FOUND | -32004 | false | The requested object does not exist in this node's answer. |
        | CONFIG_PARAM_ABSENT | -32004 | false | getConfigParam for a configuration parameter that is not set (message "config param N not found"); also the include_decoded view of an absent parameter that has no typed decoder. |
        | BLOCK_UNAVAILABLE | -32004 | false | The block or its state is outside the history this node serves (garbage-collected state or archive package). Not retryable against the same node; ask an archival node. |
        | PERMISSION_SOURCE_UNSUPPORTED | -32006 | false | The account model has no permission source for this view or lifecycle operation (message keeps its PERMISSION_SOURCE_UNSUPPORTED prefix). |
        | PERMISSION_SOURCE_DEFERRED | -32006 | false | The requested permission source tier is deferred and not served. |
        | INDEXED_STATE_STALE | -32006 | false | source_tier=indexed was forced, but no fresh indexed permission state is available. |
        | LIFECYCLE_IMMUTABLE | -32006 | false | The account model does not allow this grant or revoke. |
        | CONTRACT_KIND_UNSUPPORTED | -32006 | false | getTokenData on a contract that is not a recognised token contract. |
        | UPSTREAM_UNAVAILABLE | -32603 | true | The node could not answer now: a query timed out or was cancelled, the node is not synced, or the block is not applied yet. The same request can succeed later. |
        | UNSIGNED_BLOCK | -32602 | false | getMasterchainBlockSignatures for seqno 0 (the zero state carries no signatures). |
        | BLOCK_ID_MISMATCH | -32009 | false | A caller-supplied complete block_id disagrees with the block the node resolved at that height. |
        | EVIDENCE_INVALID | -32603 | false | Proof, signature, block identity or native layout validation failed in a verified view. |
        | UNSUPPORTED_CARRIER | -32603 | false | A native signature carrier has no supported decoder. |
        | STATE_INVALID | -32603 | false | A recognised account or configuration state is malformed, or a required policy is missing. |
        | RESOURCE_LIMIT | -32603 | false | Valid-looking evidence exceeds a configured processing or response budget of a verified view. |
        | VERIFICATION_BACKEND_FAILURE | -32603 | true | The native cryptographic backend failed; this is not an invalid-signature verdict. |

        A call site that names no reason maps its code: -32700 PARSE_ERROR, -32600 INVALID_REQUEST, -32601
        METHOD_NOT_FOUND, -32602 INVALID_ARGUMENT, -32000 UNAUTHORIZED, -32004 NOT_FOUND, -32005 RATE_LIMITED,
        anything else INTERNAL_ERROR. A failure of the node's own query path is classified first:
        garbage-collected data is BLOCK_UNAVAILABLE, a timeout, cancellation or not-ready answer is
        UPSTREAM_UNAVAILABLE.
      properties:
        schema_version: {const: 1}
        reason:
          type: string
          enum:
            - PARSE_ERROR
            - INVALID_REQUEST
            - METHOD_NOT_FOUND
            - WRITE_DISABLED
            - INVALID_ARGUMENT
            - INTERNAL_ERROR
            - UNAUTHORIZED
            - RATE_LIMITED
            - NOT_FOUND
            - CONFIG_PARAM_ABSENT
            - BLOCK_UNAVAILABLE
            - PERMISSION_SOURCE_UNSUPPORTED
            - PERMISSION_SOURCE_DEFERRED
            - INDEXED_STATE_STALE
            - LIFECYCLE_IMMUTABLE
            - CONTRACT_KIND_UNSUPPORTED
            - UPSTREAM_UNAVAILABLE
            - UNSIGNED_BLOCK
            - BLOCK_ID_MISMATCH
            - EVIDENCE_INVALID
            - UNSUPPORTED_CARRIER
            - STATE_INVALID
            - RESOURCE_LIMIT
            - VERIFICATION_BACKEND_FAILURE
        retryable: {type: boolean}
      x-error-reasons:
        - {reason: PARSE_ERROR, code: -32700, retryable: false}
        - {reason: INVALID_REQUEST, code: -32600, retryable: false}
        - {reason: METHOD_NOT_FOUND, code: -32601, retryable: false}
        - {reason: WRITE_DISABLED, code: -32601, retryable: false}
        - {reason: INVALID_ARGUMENT, code: -32602, retryable: false}
        - {reason: INTERNAL_ERROR, code: -32603, retryable: false}
        - {reason: UNAUTHORIZED, code: -32000, retryable: false}
        - {reason: RATE_LIMITED, code: -32005, retryable: true}
        - {reason: NOT_FOUND, code: -32004, retryable: false}
        - {reason: CONFIG_PARAM_ABSENT, code: -32004, retryable: false}
        - {reason: BLOCK_UNAVAILABLE, code: -32004, retryable: false}
        - {reason: PERMISSION_SOURCE_UNSUPPORTED, code: -32006, retryable: false}
        - {reason: PERMISSION_SOURCE_DEFERRED, code: -32006, retryable: false}
        - {reason: INDEXED_STATE_STALE, code: -32006, retryable: false}
        - {reason: LIFECYCLE_IMMUTABLE, code: -32006, retryable: false}
        - {reason: CONTRACT_KIND_UNSUPPORTED, code: -32006, retryable: false}
        - {reason: UPSTREAM_UNAVAILABLE, code: -32603, retryable: true}
        - {reason: UNSIGNED_BLOCK, code: -32602, retryable: false}
        - {reason: BLOCK_ID_MISMATCH, code: -32009, retryable: false}
        - {reason: EVIDENCE_INVALID, code: -32603, retryable: false}
        - {reason: UNSUPPORTED_CARRIER, code: -32603, retryable: false}
        - {reason: STATE_INVALID, code: -32603, retryable: false}
        - {reason: RESOURCE_LIMIT, code: -32603, retryable: false}
        - {reason: VERIFICATION_BACKEND_FAILURE, code: -32603, retryable: true}
    ReadyzResult:
      type: object
      required: [ready]
      properties:
        ready: {type: boolean}
        sync_lag_seconds: {type: integer}
        last_block_utime: {type: integer}
        node_time: {type: integer}
        last_block: {'$ref': '#/components/schemas/BlockIdExt'}
        error: {type: string, description: 'Present when the node could not be queried.'}
    ApiInfo:
      type: object
