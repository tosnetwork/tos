        want_merge: {type: boolean}
        want_split: {type: boolean}
        validator_list_hash_short: {type: integer}
        catchain_seqno: {type: integer}
        min_ref_mc_seqno: {type: integer}
        is_key_block: {type: boolean}
        prev_key_block_seqno: {type: integer}
        start_lt: {'$ref': '#/components/schemas/Lt'}
        end_lt: {'$ref': '#/components/schemas/Lt'}
        gen_utime: {type: integer}
        prev_blocks: {type: array, items: {'$ref': '#/components/schemas/BlockIdExt'}}
