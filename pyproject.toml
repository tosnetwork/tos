[project]
name = "tos"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "pytest>=9.0.1",
    "pytest-asyncio",
    "tostester",
    "types-gdb>=16.3.0.20250920",
]

[dependency-groups]
dev = [
    "basedpyright>=1.32.1",
    "ruff>=0.14.2",
]

[tool.uv.sources]
tostester = { workspace = true }

[tool.uv.workspace]
members = [
    "test/tostester",
]

[tool.ruff]
line-length = 100
# Scripts also run under the system python3 of the CI images, so keep syntax that
# older interpreters parse (for example parenthesised multi-type except clauses).
target-version = "py312"
include = ["test/integration/**/*.py", "test/tostester/**/*.py"]
# Evidence records pin these files by their exact bytes (sha256), and the A03
# ledger re-hashes the working tree; reformatting them would break those
# bindings. Source guards also apply exact-text mutations to some of them, so the
# same holds for mutation targets. force-exclude makes the exclusion hold for
# explicitly named files.
force-exclude = true
extend-exclude = [
    "scripts/a03_development_ledger.py",
    "scripts/agent-chain-index-e2e.py",
    "scripts/agent-economy-composed-e2e.py",
    "scripts/agent-query-api-e2e.py",
    "scripts/agent-task-escrow-e2e.py",
    "scripts/agent-wallet-account-e2e.py",
    "scripts/capability-registry-e2e.py",
    "scripts/check-nominator-pool-pq-route.py",
    "scripts/check-pq-e2e-initial-validators.py",
    "scripts/f01_finalized_ids.py",
    "scripts/nominator-pool-lifecycle-e2e.py",
    "scripts/proof-attestation-e2e.py",
    "scripts/service-actor-e2e.py",
    "scripts/x01_window_evidence.py",
    "test/integration/test_simplex2_release.py",
    "test/integration/test_simplex2_release_unit.py",
    "test/pq-native/test_a03_development_ledger.py",
    "test/pq-native/test_e05_http_transcript.py",
    "test/pq-native/test_e06_http_transcript.py",
    "test/pq-native/test_e07_timeout_control.py",
    "test/pq-native/test_e08_negative_finality.py",
    "test/pq-native/test_e09_negative_finality.py",
    "test/pq-native/test_e10_composed_evidence.py",
    "test/tostester/src/tostester/network.py",
    # The node health monitor's receipts, source manifests and deployment hash inputs pin
    # these scripts by their exact bytes, for the same reason as above.
    "tools/node-health-monitor/scripts/check-witness-current.py",
    "tools/node-health-monitor/scripts/freeze-manifests.py",
    "tools/node-health-monitor/scripts/plan-c09-retention-dry-run.py",
    "tools/node-health-monitor/scripts/prepare-c09-fresh-window.py",
    "tools/node-health-monitor/scripts/sample-query-functional.py",
    "tools/node-health-monitor/scripts/test-plan-c09-retention-dry-run.py",
    "tools/node-health-monitor/scripts/verify-c09-dev-30m.py",
    "tools/node-health-monitor/scripts/write-c09-functional-stop-receipt.py",
    "tools/node-health-monitor/tests/c00-closure-mutations.py",
    "tools/node-health-monitor/tests/c01-publisher-mutations.py",
    "tools/node-health-monitor/tests/c02-edge-mutations.py",
    "tools/node-health-monitor/tests/c03-runtime-chain.py",
    "tools/node-health-monitor/tests/c04-consumer-closure.py",
    "tools/node-health-monitor/tests/c04-consumer-mutations.py",
    "tools/node-health-monitor/tests/c04-metric-union.py",
    "tools/node-health-monitor/tests/c04-native-mutations.py",
    "tools/node-health-monitor/tests/c06-rust-mutations.py",
    "tools/node-health-monitor/tests/check-c04-producer-pair.py",
]

[tool.ruff.lint]
# Default rules with isort
select = [
    # pycodestyle
    "E4", "E7", "E9",
    # Pyflakes
    "F",
    # isort
    "I",
]

ignore = [
    # This disallows to use `l` and `O` as variable names because "they can be confused with `1` and
    # `0`". My response will be use a proper font that makes them distinguishable.
    "E741",
]

[tool.ruff.lint.per-file-ignores]
# Names injected at run time by the hash-verified loader that executes these files.
"scripts/x02_private_probe.py" = ["F821"]
"scripts/x02_stage_a_child.py" = ["F821"]

[tool.pyright]
include = ["test/integration", "test/tostester"]

[tool.pytest]
testpaths = ["test/tostester/tests"]
