{
  "schema_version": 1,
  "placement": "development_fixture",
  "native_owner": "health_edge",
  "remote_native_mode": "cached_only",
  "native_interval_seconds": 15,
  "native_actual_inflight": 1,
  "native_source_budget_ms": 2000,
  "native_http_timeout_ms": 3000,
  "native_cache_max_age_seconds": 30,
  "native_max_bytes": 2097152,
  "native_build_per_path": false,
  "getstats_enabled": false,
  "skip_missed_ticks": true,
  "retry_on_timeout": false,
  "core_max_bytes": 4194304,
  "core_max_series": 2048,
  "core_max_scopes": 8,
  "diagnostics_enabled": false,
  "ai_enabled": false,
  "live_fallback": false,
  "max_contiguous_monitor_work_us": "1000",
  "network_id": null,
  "binary_digest": null,
  "performance_digest": null,
  "failure_domains": null,
  "mtls_digest": null,
  "receiver_digest": null,
  "effective_resource_digest": null
}
