global:
  scrape_interval: 5s
  evaluation_interval: 5s
alerting:
  alertmanagers:
  - static_configs:
    - targets: ['127.0.0.1:33959']
rule_files:
- '$HOME/tos-node-health-impl/tools/node-health-monitor/deploy/prometheus/rules.yml'
scrape_configs:
- job_name: health-state
  metrics_path: /metrics
  authorization:
    credentials_file: '/tmp/nhm-c03-runtime-a9k5wkky/read.token'
  static_configs:
  - targets: ['127.0.0.1:49849']
