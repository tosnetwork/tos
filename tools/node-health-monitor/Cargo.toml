[workspace]
resolver = "2"
members = ["crates/health-core", "crates/health-services"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "LGPL-2.0-or-later"
rust-version = "1.97.1"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["std", "serde", "clock"] }
