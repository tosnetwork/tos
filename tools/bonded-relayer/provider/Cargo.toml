[package]
name = "br1-native-provider"
version = "0.1.0"
edition = "2021"
publish = false
license = "GPL-3.0-only"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
sha2 = "0.10"
hex = "0.4"
rand = "0.8"
zeroize = "1"
libc = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "json"] }
rusqlite = { version = "0.32", features = ["bundled"] }
chain_block = { path = "../../../tosctl/src/block" }
node-contracts = { package = "contracts", path = "../../../tosctl/src/node-control/contracts" }
shielded-pool-wallet = { path = "../../shielded-pool-wallet" }
shielded-pool-circuit = { path = "../../shielded-pool-circuit" }
tos_sandbox = { path = "../../../tosctl/src/sandbox" }
fips204 = { version = "=0.4.6", default-features = false, features = ["ml-dsa-44", "default-rng"] }
ark-ff = "=0.5.0"
common = { path = "../../../tosctl/src/node-control/common" }
tokio = { version = "1", features = ["rt", "time", "process", "io-util"] }
async-trait = "0.1"
ed25519-dalek = { version = "2", features = ["zeroize"] }
tl_api = { path = "../../../tosctl/src/tl/api" }
tos_executor = { path = "../../../tosctl/src/executor" }

[dev-dependencies]
tempfile = "3"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
