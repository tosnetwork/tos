[package]
name = "shielded-pool-mobile"
version = "0.1.0"
edition = "2021"
publish = false
license = "GPL-3.0-only"
description = "Bounded mobile C ABI over the existing shielded wallet cryptography"

[lib]
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
shielded-pool-wallet = { path = "../shielded-pool-wallet" }
shielded-pool-circuit = { path = "../shielded-pool-circuit" }
base64 = "=0.22.1"
hex = "=0.4.3"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
zeroize = { version = "=1.9.0", features = ["derive"] }

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
