[package]
name = "shielded-pool-mobile"
version = "0.1.0"
edition = "2021"
publish = false
license = "GPL-3.0-only"
description = "Bounded mobile C ABI over the existing shielded wallet cryptography"

[lib]
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
shielded-pool-codec = { path = "../shielded-pool-codec" }
chain_block = { path = "../../tosctl/src/block" }
shielded-pool-wallet = { path = "../shielded-pool-wallet" }
shielded-pool-circuit = { path = "../shielded-pool-circuit" }
chacha20poly1305 = { version = "=0.10.1", default-features = false, features = ["alloc"] }
rand = "=0.8.5"
sha3 = "=0.10.8"
base64 = "=0.22.1"
hex = "=0.4.3"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
zeroize = { version = "=1.9.0", features = ["derive"] }

[target.'cfg(unix)'.dependencies]
libc = "=0.2.191"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
