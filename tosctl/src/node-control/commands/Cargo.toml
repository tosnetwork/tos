[package]
name = "commands"
version = "0.3.0"
edition = "2024"
license = 'GPL-3.0'

[features]
node-data-sync-native = ["node-data-sync/native"]
pq-wallet = ["dep:wallet-pq-signer", "contracts/native-wallet-vault"]
# The shielded-pool client (`tosctl shield`). Off by default: it pulls in the
# proving-system field arithmetic and the post-quantum primitives.
shielded = ["dep:shielded-pool-wallet", "dep:shielded-pool-circuit", "dep:shielded-pool-prover", "dep:shielded-pool-ceremony", "dep:chacha20poly1305", "dep:sha3"]

[dependencies]
wallet-pq-signer = { path = "../../wallet-pq-signer", features = ["vault"], optional = true }
tos-native-mnemonic = { path = "../../tos-native-mnemonic" }
shielded-pool-wallet = { path = "../../../../tools/shielded-pool-wallet", optional = true }
shielded-pool-circuit = { path = "../../../../tools/shielded-pool-circuit", optional = true }
shielded-pool-prover = { path = "../../../../tools/shielded-pool-prover", optional = true }
shielded-pool-ceremony = { path = "../../../../tools/shielded-pool-ceremony", optional = true }
chacha20poly1305 = { version = "=0.10.1", default-features = false, features = ["alloc", "getrandom"], optional = true }
sha3 = { version = "=0.10.8", optional = true }
serde = { features = ["derive", "rc"], version = "1.0" }
serde_json = "1.0"
ciborium = "0.2"
anyhow = "1.0"
clap = { version = "4.4", features = ["derive", "env"] }
tracing = "0.1"
base64 = "0.22.1"
colored = "2.0"
hex = "0.4"
libc = "0.2"
reqwest = { version = "0.12.24", default-features = false, features = [
    "json",
    "rustls-tls",
    "stream",
] }
sha2 = "0.10"
ed25519-dalek = "2"
rand = "0.8"
zeroize = "1.8"
futures-util = "0.3"
common = { path = "../common" }
control-client = { path = "../control-client" }
node-data-sync = { path = "../node-data-sync" }
chain-rpc-client = { path = "../chain-rpc-client" }
adnl = { features = ["client"], path = "../../adnl" }
chain_block = { path = "../../block" }
elections = { path = "../elections" }
contracts = { path = "../contracts" }
chain_block_json = { version = "0.9.41", path = "../../block-json" }
service = { path = "../service" }
secrets-vault = { path = '../../secrets-vault', default-features = false, features = [
    "file-storage-json",
    "crypto-default",
    "hashicorp-storage",
    "with-base64",
] }
scopeguard = "1"
rpassword = "7"
tempfile = "3"

# TODO: remove after debug
tokio = { version = "1.48.0", features = ["full"] }

[dev-dependencies]
tokio = { version = "1.48.0", features = ["test-util"] }
tl_api = { path = "../../tl/api" }
adnl = { path = "../../adnl", features = ["server"] }
async-trait = "0.1"
