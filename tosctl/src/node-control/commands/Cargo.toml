[package]
name = "commands"
version = "0.3.0"
edition = "2024"
license = 'GPL-3.0'

[dependencies]
serde = { features = ["derive", "rc"], version = "1.0" }
serde_json = "1.0"
ciborium = "0.2"
anyhow = "1.0"
clap = { version = "4.4", features = ["derive", "env"] }
tracing = "0.1"
base64 = "0.22.1"
colored = "2.0"
hex = "0.4"
libc = "0.2"
reqwest = { version = "0.12.24", default-features = false, features = [
    "json",
    "rustls-tls",
    "stream",
] }
sha2 = "0.10"
ed25519-dalek = "2"
hmac = "0.12"
pbkdf2 = "0.12"
rand = "0.8"
bip39 = { version = "2.2", default-features = false, features = ["std"] }
zeroize = "1.8"
futures-util = "0.3"
common = { path = "../common" }
control-client = { path = "../control-client" }
chain-rpc-client = { path = "../chain-rpc-client" }
adnl = { features = ["client"], path = "../../adnl" }
chain_block = { path = "../../block" }
elections = { path = "../elections" }
contracts = { path = "../contracts" }
chain_block_json = { version = "0.9.41", path = "../../block-json" }
service = { path = "../service" }
secrets-vault = { path = '../../secrets-vault', default-features = false, features = [
    "file-storage-json",
    "crypto-default",
    "hashicorp-storage",
    "with-base64",
] }
scopeguard = "1"
rpassword = "7"

# TODO: remove after debug
tokio = { version = "1.48.0", features = ["full"] }
