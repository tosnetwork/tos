[package]
name = "wallet-pq-signer"
version = "0.1.0"
edition = "2024"
license = "LGPL-2.0-or-later"
publish = false

[features]
vault = ["dep:secrets-vault"]

[dependencies]
tos-native-mnemonic = { path = "../tos-native-mnemonic" }
secrets-vault = { path = "../secrets-vault", optional = true }
openssl-sys = "0.9"
openssl = "0.10"
zeroize = "1"

[build-dependencies]
cc = "1"

[dev-dependencies]
serde_json = "1"
hex = "0.4"
fips204 = { version = "=0.4.6", default-features = false, features = ["ml-dsa-44"] }

tokio = { version = "1", features = ["macros", "rt"] }
tempfile = "3"
chrono = "0.4"
anyhow = "1"
async-trait = "0.1"
