# ethminer stratum configuration for eTOS mining
#
# Usage:
#   ethminer --config ethminer-stratum.conf
#
# Replace the placeholder values below with your actual node address and
# wallet address before use. All other parameters are tuned for eTOS
# (keccak-256, 12-second block time).
#
# Install ethminer from: https://github.com/ethereum-mining/ethminer

{
    "farm-recheck": 200,

    "pool": [
        {
            # stratum1+tcp  = standard stratum v1 over TCP (no SSL)
            # stratum1+tls  = stratum v1 over TLS (use if your node supports it)
            "url": "stratum1+tcp://YOUR_ETOS_WALLET_ADDRESS@YOUR_TOS_NODE_IP:8545",

            # Fallback pool (optional). Replace or remove if not needed.
            "url": "stratum1+tcp://YOUR_ETOS_WALLET_ADDRESS@FALLBACK_TOS_NODE_IP:8545"
        }
    ],

    # Mining device selection. Remove the "cl" or "cu" section if you
    # only have one type of GPU.
    "opencl": {
        "enabled": true
    },
    "cuda": {
        "enabled": true
    },

    # Report hashrate to the node (optional, for monitoring).
    "report-hashrate": false,

    # Extra nonce size in bytes (0 = auto, recommended for solo mining).
    "nonce-scrambler": 0,

    # Log verbosity: 0=silent 1=errors 2=warnings 3=info 4=debug
    "verbosity": 3
}
