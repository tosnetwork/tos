# T-Rex stratum configuration for eTOS mining
#
# Usage:
#   t-rex --config trex-stratum.conf
#
# Replace the placeholder values below with your actual node address and
# wallet address. All other parameters are tuned for eTOS (keccak-256,
# 12-second target interval).
#
# Install T-Rex from: https://github.com/trexminer/T-Rex

{
    # eTOS uses keccak-256, same as Ethereum PoW (ethash)
    "algo": "ethash",

    # Pool / node endpoint
    # Replace YOUR_TOS_NODE_IP and port with your TOS full node's stratum port.
    # Replace YOUR_ETOS_WALLET_ADDRESS with your 0x... eTOS wallet address.
    "url": "stratum+tcp://YOUR_TOS_NODE_IP:8545",
    "user": "YOUR_ETOS_WALLET_ADDRESS",
    "pass": "x",

    # Worker name shown in pool dashboard / node logs (optional)
    "worker": "rig0",

    # Fallback pool/node (optional)
    # "url2": "stratum+tcp://FALLBACK_TOS_NODE_IP:8545",
    # "user2": "YOUR_ETOS_WALLET_ADDRESS",
    # "pass2": "x",

    # Device selection (comma-separated GPU indices, or "all")
    "devices": "all",

    # Kernel (0=auto, 1=old, 2=new)
    "kernel": 0,

    # Intensity (0=auto)
    "intensity": 0,

    # Autotune: let T-Rex find the optimal kernel automatically
    "autotune-mode": "full",

    # Telemetry / API server (comment out if not needed)
    "api-bind-http": "0.0.0.0:4067",

    # Log verbosity (0-5)
    "log-path": "trex-etos.log",
    "no-watchdog": false
}
