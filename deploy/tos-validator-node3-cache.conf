[Service]
Environment=TOS_MEMORY_DIAGNOSTICS=1
Environment=MALLOC_CONF=background_thread:true,dirty_decay_ms:10000,muzzy_decay_ms:10000
ExecStart=
ExecStart=/usr/local/bin/tos-validator-engine --global-config /data/tos-global.json --local-config /data/testnet/node3/config.json --db /data/testnet/node3 -v2 --initial-sync-delay 5 --celldb-cache-size 1073741824 --celldb-cache-min-size 1073741824 --celldb-cell-cache-max-size 100000 --quic-flood-control -1
