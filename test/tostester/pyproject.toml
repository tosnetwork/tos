[project]
name = "tostester"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "dash",
    "plotly",
    # pytoniq-core vendored as pytosiq_core (in src/pytosiq_core/)
    "watchfiles>=1.1.1",
    "bitarray",
    "pynacl",
    "pycryptodome",
]

[project.scripts]
consensus_explorer = "consensus_explorer.explorer:_main"
