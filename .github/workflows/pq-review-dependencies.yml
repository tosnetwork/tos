name: PQ offline review dependencies
on:
  pull_request:
    paths:
      - '.github/workflows/pq-review-dependencies.yml'
permissions:
  contents: read
jobs:
  wheels:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Download wheels for an offline Python 3.13 review
        run: |
          mkdir wheels
          python3 -m pip download --dest wheels --only-binary=:all: --python-version 313 --platform manylinux2014_x86_64 --implementation cp --abi cp313 bitarray==3.7.2 PyNaCl==1.5.0 pycryptodome==3.23.0 cffi==1.17.1 pycparser==2.22
          sha256sum wheels/* > wheels/SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pq-review-python-wheels
          path: wheels/
          retention-days: 3
          if-no-files-found: error
