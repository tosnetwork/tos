name: Agent controller key validation

on:
  push:
    branches: ['fix/issue-191-agent-controller-key-validation']
    paths: ['.github/workflows/agent-controller-key-validation.yml']

permissions:
  contents: read

concurrency:
  group: agent-controller-key-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    if: github.repository == 'tosnetwork/tos' && github.ref == 'refs/heads/fix/issue-191-agent-controller-key-validation'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    outputs:
      commit: ${{ steps.commit.outputs.sha }}
    env:
      FUNC_PATH: ${{ github.workspace }}/build/crypto/func
      FIFT_PATH: ${{ github.workspace }}/build/crypto/fift
      EMULATOR_PATH: ${{ github.workspace }}/build/emulator/libemulator.so
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 4
      - name: Reuse hash-verified tools built from this branch's pinned native source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/tosnetwork/tos/actions/artifacts/11873979267/zip > "$RUNNER_TEMP/tools.zip"
          echo "fa69a0a143169e4b7e777629bb09fd51fdc008c504329790db4b2339c40c9938  $RUNNER_TEMP/tools.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/tools.zip" native-tools.tar.gz -d "$RUNNER_TEMP/native-tools"
          mkdir -p build
          tar -xzf "$RUNNER_TEMP/native-tools/native-tools.tar.gz" -C build
          build/crypto/func -V
          python3 -m pip install cryptography==46.0.4 ruff==0.15.2
      - name: Apply the locally validated minimal authorization change
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('crypto/smartcont/agent-account-code.fc')
          s = p.read_text()
          old = '  if ((~ via_module) & (header_op == op::agent_checked_contract_call_v2)) {\n    require_strong_controller_key(controller_pubkey);\n  }\n'
          assert s.count(old) == 1
          s = s.replace(old, '')
          old = '  ifnot (via_module) {\n    ;; Bind the signature'
          assert s.count(old) == 1
          s = s.replace(old, '  ;; Every raw controller operation relies on the stored key, including legacy\n  ;; sends and cancellation. Keep this out of state loading so owner recovery\n  ;; and module-only authorization do not depend on an unusable legacy key.\n  ifnot (via_module) {\n    require_strong_controller_key(controller_pubkey);\n    ;; Bind the signature')
          p.write_text(s)
          PY
          python3 scripts/update-auth-contract-code.py
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tosctl/src/node-control/contracts/src/agent_account.rs')
          s = p.read_text()
          replacements = {
              'efc5675d718c3172f65c87ecef648beb6a2f6e2046099883ccccf03683051620': ('53600f89a4849412001f3c075b8f02fe2845ff6de60866fb65dc2b6b98fa1dd1', 1),
              'b9b9997179f55b800ab7f3a2d3ba9af7dd2aaa52d2d6537ee22d7f89bee1b953': ('c28f0b1e3ea4c26a6aec5ebab4a317da8493d229a2c88fd724705ef1ae5b4929', 2),
          }
          for old, (new, count) in replacements.items():
              assert s.count(old) == count
              s = s.replace(old, new)
          p.write_text(s)
          PY
          ruff check --fix test/weak-ed25519/test_agent_controller.py
          ruff format test/weak-ed25519/test_agent_controller.py
          ruff check test/weak-ed25519/test_agent_controller.py
          ruff format --check test/weak-ed25519/test_agent_controller.py
      - name: Native deployment, rejection, recovery, delivery, gas and mutation checks
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/agent-controller-validation"
          python3 scripts/update-auth-contract-code.py --check
          python3 test/weak-ed25519/test_agent_controller.py --output "$RUNNER_TEMP/agent-controller-validation" 2>&1 | tee "$RUNNER_TEMP/agent-controller-validation/native.log"
          python3 test/weak-ed25519/test_native_aliases.py 2>&1 | tee "$RUNNER_TEMP/agent-controller-validation/existing-aliases.log"
          python3 - <<'PY' 2>&1 | tee "$RUNNER_TEMP/agent-controller-validation/semantic-red.log"
          import sys, unittest
          sys.path.insert(0, 'test/weak-ed25519')
          import test_agent_controller as t
          t.AgentControllerTests.setUpClass()
          try:
              t.AgentControllerTests.shipped = t.AgentControllerTests.mutant
              t.WEAK_KEYS = [t.IDENTITY_ALIAS]
              result = unittest.TestResult()
              t.AgentControllerTests('test_all_weak_encodings_reject_every_external_operation').run(result)
              assert not result.errors and len(result.failures) == 2, result.errors
              assert all("'success': True" in failure and "'transaction':" in failure for _, failure in result.failures)
              print('SEMANTIC RED: both legacy/staged weak-key rejection assertions fail on accepted native transactions when the stored-key guard is restored to v2-only. No compile/setup errors.')
          finally:
              t.AgentControllerTests.tearDownClass()
          PY
          python3 - <<'PY' 2>&1 | tee "$RUNNER_TEMP/agent-controller-validation/existing-agent-auth.log"
          import sys, tempfile, unittest
          from pathlib import Path
          sys.path.insert(0, 'test/auth-extensions')
          import test_auth as t
          from native import compile_contract
          class AgentAuthentication(t.AuthenticationTests):
              @classmethod
              def setUpClass(cls):
                  cls.tmp = tempfile.TemporaryDirectory()
                  t.CODES.clear()
                  t.CODES['agent'] = compile_contract('agent-account-code.fc', Path(cls.tmp.name) / 'agent.boc')
          names = unittest.defaultTestLoader.getTestCaseNames(AgentAuthentication)
          names.remove('test_wallet_rejects_destruction_and_arbitrary_actions')
          result = unittest.TextTestRunner(verbosity=2).run(unittest.TestSuite(AgentAuthentication(n) for n in names))
          raise SystemExit(0 if result.wasSuccessful() else 1)
          PY
      - name: Commit only the validated source, SDK artifact and regression on the isolated branch
        id: commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 - <<'PY'
          import subprocess
          expected = {'crypto/smartcont/agent-account-code.fc', 'tosctl/src/node-control/contracts/src/agent_account.rs', 'test/weak-ed25519/test_agent_controller.py'}
          actual = set(subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines())
          assert actual == expected, actual
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crypto/smartcont/agent-account-code.fc tosctl/src/node-control/contracts/src/agent_account.rs test/weak-ed25519/test_agent_controller.py
          git diff --cached --check
          git commit -m 'fix: validate every legacy agent controller key before signature verification'
          git -c credential.helper= -c 'credential.helper=!gh auth git-credential' push origin HEAD:refs/heads/fix/issue-191-agent-controller-key-validation
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git rev-parse HEAD > "$RUNNER_TEMP/agent-controller-validation/source-commit.txt"
          git diff --binary 994ac69cfb854fbb9d43535f81498c28993eae9c HEAD -- crypto/smartcont/agent-account-code.fc tosctl/src/node-control/contracts/src/agent_account.rs test/weak-ed25519/test_agent_controller.py > "$RUNNER_TEMP/agent-controller-validation/validated.patch"
          tar -czf "$RUNNER_TEMP/agent-controller-validation/validated-source.tar.gz" crypto/smartcont/agent-account-code.fc tosctl/src/node-control/contracts/src/agent_account.rs test/weak-ed25519/test_agent_controller.py
          cp "$(command -v ruff)" "$RUNNER_TEMP/agent-controller-validation/ruff"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: agent-controller-validation
          path: ${{ runner.temp }}/agent-controller-validation/
          retention-days: 30
          if-no-files-found: error

  sdk:
    needs: native
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.native.outputs.commit }}
          persist-credentials: false
      - run: scripts/install-rust-toolchain.sh
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: tosctl/src -> target
      - name: Run agent SDK tests and real Rust action-phase sandbox
        env:
          TOS_ROOT: ${{ github.workspace }}
          CARGO_BUILD_JOBS: 2
        run: |
          set -euo pipefail
          cargo test --locked --manifest-path tosctl/src/Cargo.toml -p contracts --lib agent_account::tests 2>&1 | tee "$RUNNER_TEMP/agent-sdk.log"
          cargo test --locked --manifest-path tosctl/src/Cargo.toml -p contracts --test agent_account_sandbox 2>&1 | tee "$RUNNER_TEMP/agent-sandbox.log"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: agent-controller-sdk-validation
          path: |
            ${{ runner.temp }}/agent-sdk.log
            ${{ runner.temp }}/agent-sandbox.log
          retention-days: 30
