name: uno-ci

# CI gate for the TOS Uno (wc=2) privacy workchain branch.
#
# This workflow is the K-ci-setup landing: every prior merge into `uno`
# has been hand-verified against the §12 test matrix. This file makes
# that matrix an automated merge gate.
#
# Jobs:
#   * build-and-test-linux — clang-21 + CMake Release + liboqs (pinned)
#                            runs all 15 §12 test binaries
#   * rust-tests            — cargo test --release for uno/plonky3-ffi
#                            and tosctl/uno
#   * doc-lint              — openapi.yaml YAML validation + grep-based
#                            dead-link scan on doc/uno-*.md + README.md

on:
  push:
    branches: [uno]
  pull_request:
    branches: [uno]

concurrency:
  group: uno-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------
  # Job 1 — native C++ build + 15-binary §12 test matrix
  # ---------------------------------------------------------------------
  build-and-test-linux:
    name: build-and-test-linux
    runs-on: ubuntu-22.04
    env:
      LIBOQS_COMMIT: 3cb781fd4737c900ad755ee0bb9e1949d0f68955
      RUST_TOOLCHAIN: "1.91.1"
      CMAKE_PREFIX_PATH: /home/runner/.local
      CCACHE_DIR: /home/runner/work/ccache

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install base apt prerequisites (BUILD.md §Linux Prerequisites)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            git \
            cmake \
            ninja-build \
            ccache \
            autoconf \
            automake \
            libtool \
            texinfo \
            pkg-config \
            python3 \
            python3-dev \
            python3-yaml \
            libgflags-dev \
            libreadline-dev \
            libgsl-dev \
            libblas-dev \
            libgslcblas0 \
            libjemalloc-dev \
            libssl-dev \
            gawk \
            wget \
            curl \
            lsb-release \
            software-properties-common \
            gnupg

      - name: Install clang-21 via apt.llvm.org
        run: |
          cd /tmp
          rm -f llvm.sh
          wget -q https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 21
          clang-21 --version
          clang++-21 --version

      # -----------------------------------------------------------------
      # Caches: liboqs install tree, cargo registry, ccache
      # -----------------------------------------------------------------
      - name: Cache liboqs install ($HOME/.local)
        id: cache-liboqs
        uses: actions/cache@v4
        with:
          path: /home/runner/.local
          key: liboqs-${{ runner.os }}-${{ env.LIBOQS_COMMIT }}-v1

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('uno/plonky3-ffi/Cargo.lock', 'tosctl/uno/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: /home/runner/work/ccache
          key: ccache-uno-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            ccache-uno-${{ runner.os }}-

      # -----------------------------------------------------------------
      # liboqs — build and install at the pinned commit only on cache miss
      # -----------------------------------------------------------------
      - name: Build + install liboqs (pinned commit, cache miss only)
        if: steps.cache-liboqs.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          git clone https://github.com/open-quantum-safe/liboqs.git /tmp/liboqs-src
          cd /tmp/liboqs-src
          git checkout "${LIBOQS_COMMIT}"
          cmake -S . -B /tmp/liboqs-build \
            -DOQS_BUILD_ONLY_LIB=ON \
            -DOQS_ENABLE_KEM_ML_KEM=ON \
            -DBUILD_SHARED_LIBS=OFF \
            -DCMAKE_INSTALL_PREFIX="$HOME/.local" \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/liboqs-build -j"$(nproc)"
          cmake --install /tmp/liboqs-build
          test -f "$HOME/.local/lib/liboqs.a"
          test -f "$HOME/.local/include/oqs/oqs.h"

      - name: Verify liboqs install
        run: |
          ls -la "$HOME/.local/lib/liboqs.a"
          ls -la "$HOME/.local/include/oqs/oqs.h"

      # -----------------------------------------------------------------
      # Rust toolchain pinned from tosctl/src/rust-toolchain.toml
      # -----------------------------------------------------------------
      - name: Install pinned Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: 1.91.1
          profile: minimal
          override: true
          components: clippy

      # -----------------------------------------------------------------
      # CMake configure + build
      # -----------------------------------------------------------------
      - name: Configure CMake (Release, clang-21, CMAKE_PREFIX_PATH=$HOME/.local)
        run: |
          set -euo pipefail
          mkdir -p "$CCACHE_DIR"
          CMAKE_PREFIX_PATH="$HOME/.local" \
            cmake -S . -B build \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_C_COMPILER=clang-21 \
              -DCMAKE_CXX_COMPILER=clang++-21 \
              -DCMAKE_C_COMPILER_LAUNCHER=ccache \
              -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build the 15 §12 uno test binaries
        run: |
          set -euo pipefail
          cmake --build build -j"$(nproc)" --target \
            test-uno-primitive-parity \
            test-uno-mandatory-negatives \
            test-uno-end-to-end \
            test-uno-parallel-verify \
            test-uno-restart-survival \
            test-uno-determinism \
            test-uno-state-transition-golden \
            test-uno-public-input-fixture \
            test-uno-codec-shapes \
            test-uno-transfer \
            test-uno-filter \
            test-uno-genesis-loader \
            test-uno-bech32m-envelope \
            test-uno-nullifier-warm-lru \
            test-uno-subscriptions

      # -----------------------------------------------------------------
      # Run each of the 15 test binaries sequentially, collect pass/fail,
      # and emit a compact job-summary table. Job fails on any non-zero.
      # -----------------------------------------------------------------
      - name: Run §12 test matrix
        id: run-tests
        run: |
          set -uo pipefail

          TESTS=(
            test-uno-primitive-parity
            test-uno-mandatory-negatives
            test-uno-end-to-end
            test-uno-parallel-verify
            test-uno-restart-survival
            test-uno-determinism
            test-uno-state-transition-golden
            test-uno-public-input-fixture
            test-uno-codec-shapes
            test-uno-transfer
            test-uno-filter
            test-uno-genesis-loader
            test-uno-bech32m-envelope
            test-uno-nullifier-warm-lru
            test-uno-subscriptions
          )

          FAIL=0
          SUMMARY="$GITHUB_STEP_SUMMARY"
          {
            echo "## Uno §12 test matrix"
            echo ""
            echo "| Binary | Result |"
            echo "|---|---|"
          } >> "$SUMMARY"

          for t in "${TESTS[@]}"; do
            BIN="build/uno/test/${t}"
            if [ ! -x "$BIN" ]; then
              echo "| \`$t\` | MISSING |" >> "$SUMMARY"
              echo "::error::binary not built: $BIN"
              FAIL=1
              continue
            fi
            echo "::group::$t"
            if "$BIN"; then
              echo "| \`$t\` | PASS |" >> "$SUMMARY"
            else
              RC=$?
              echo "| \`$t\` | FAIL (rc=$RC) |" >> "$SUMMARY"
              echo "::error::$t exited with $RC"
              FAIL=1
            fi
            echo "::endgroup::"
          done

          if [ "$FAIL" -ne 0 ]; then
            echo "One or more §12 tests failed."
            exit 1
          fi

  # ---------------------------------------------------------------------
  # Job 2 — Rust unit tests (plonky3-ffi + tosctl/uno)
  # ---------------------------------------------------------------------
  rust-tests:
    name: rust-tests
    runs-on: ubuntu-22.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install pinned Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: 1.91.1
          profile: minimal
          override: true
          components: clippy

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            uno/plonky3-ffi/target
            tosctl/uno/target
          key: cargo-rust-tests-${{ runner.os }}-${{ hashFiles('uno/plonky3-ffi/Cargo.lock', 'tosctl/uno/Cargo.lock') }}
          restore-keys: |
            cargo-rust-tests-${{ runner.os }}-

      - name: cargo test --release --lib (uno/plonky3-ffi) — expect 43/0/0
        working-directory: uno/plonky3-ffi
        run: cargo test --release --lib

      - name: cargo test --release (tosctl/uno) — expect 49/0/0
        working-directory: tosctl/uno
        run: cargo test --release

  # ---------------------------------------------------------------------
  # Job 3 — doc-lint (YAML parse + dead-link scan)
  # ---------------------------------------------------------------------
  doc-lint:
    name: doc-lint
    runs-on: ubuntu-22.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install python3 + PyYAML
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-yaml

      - name: Validate doc/openapi.yaml parses
        run: |
          python3 -c "import yaml; yaml.safe_load(open('doc/openapi.yaml'))"
          echo "doc/openapi.yaml: OK"

      - name: Dead-link scan on doc/uno-*.md + README.md
        run: |
          set -euo pipefail

          # Collect the files we want to lint. Missing files are fine on
          # branches where only a subset of uno-*.md exists.
          FILES=()
          if [ -f README.md ]; then FILES+=("README.md"); fi
          for f in doc/uno-*.md; do
            [ -f "$f" ] && FILES+=("$f")
          done

          if [ "${#FILES[@]}" -eq 0 ]; then
            echo "No candidate files to lint — skipping."
            exit 0
          fi

          echo "Scanning ${#FILES[@]} file(s): ${FILES[*]}"

          FAIL=0
          # Regex matches markdown links of the form [text](path). We only
          # consider relative paths (no scheme, no #-anchor-only links,
          # no mailto:). We strip an optional #fragment before resolving.
          LINK_RE='\[[^]]*\]\(([^)]+)\)'

          for f in "${FILES[@]}"; do
            base_dir="$(dirname "$f")"
            # Extract each link target.
            python3 - "$f" "$base_dir" <<'PY' || FAIL=1
          import os, re, sys
          src, base_dir = sys.argv[1], sys.argv[2]
          bad = 0
          text = open(src, 'r', encoding='utf-8', errors='replace').read()
          for m in re.finditer(r'\[[^\]]*\]\(([^)]+)\)', text):
              target = m.group(1).strip()
              # Skip absolute URLs and pure anchors / mailto.
              if target.startswith(('http://', 'https://', 'mailto:', '#', 'ftp://', 'ws://', 'wss://')):
                  continue
              # Strip #fragment and ?query.
              for sep in ('#', '?'):
                  i = target.find(sep)
                  if i >= 0:
                      target = target[:i]
              if not target:
                  continue
              # Resolve relative to the file's directory.
              resolved = os.path.normpath(os.path.join(base_dir, target))
              if not os.path.exists(resolved):
                  print(f"::error file={src}::dead link: {m.group(1)} -> {resolved}")
                  bad += 1
          sys.exit(1 if bad else 0)
          PY
          done

          if [ "$FAIL" -ne 0 ]; then
            echo "Dead links detected."
            exit 1
          fi
          echo "All markdown links resolved."
