name: Build TOS pow-miner

# Builds the TOS pow-miner binary for each platform and keeps it as a workflow
# artifact. This workflow never writes a release: create-release.yml is the
# only publisher of v* releases, and it collects these artifacts from the run
# whose head_sha is the release tag's commit, verifying each artifact's digest
# (scripts/release-artifacts.json lists them).
#
# Trigger: push of a v* release tag, or a manual run on that tag.
# Each matrix leg uploads one artifact, named by its `artifact` key, holding
# tos-pow-miner-{platform}.tar.gz.
#
# NOTE: The pow-miner C++ source lives at crypto/util/pow-miner-*.cpp
# and must be present before this workflow can build the target.
# The cmake target name is "pow-miner" (added to crypto/CMakeLists.txt
# alongside the existing mintless-proof-generator target).

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions: {}

concurrency:
  group: build-tos-pow-miner-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            os: ubuntu-22.04
            artifact: tos-pow-miner-linux-x64
          - platform: macos-x64
            os: macos-15-intel
            artifact: tos-pow-miner-macos-x64
          - platform: macos-arm64
            os: macos-14
            artifact: tos-pow-miner-macos-arm64

    runs-on: ${{ matrix.os }}
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
          persist-credentials: false

      # ------------------------------------------------------------------
      # Linux: install build dependencies
      # ------------------------------------------------------------------
      - name: Install build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            git \
            cmake \
            ninja-build \
            ccache \
            autoconf \
            automake \
            libtool \
            pkg-config \
            libssl-dev \
            libgflags-dev \
            libreadline-dev

      - name: Install clang-21 (Linux)
        if: runner.os == 'Linux'
        run: sudo scripts/install-llvm-toolchain.sh 21

      # ------------------------------------------------------------------
      # macOS: install build dependencies (mirrors build-macos-portable.sh)
      # ------------------------------------------------------------------
      - name: Install build dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          export NONINTERACTIVE=1
          brew install cmake ninja pkg-config automake libtool autoconf ccache openssl

      # ------------------------------------------------------------------
      # Rust toolchain needed for Rust crates under tosctl/src.
      # Pinned version matches tosctl/src/rust-toolchain.toml
      # ------------------------------------------------------------------
      - name: Install repository-pinned Rust toolchain
        run: scripts/install-rust-toolchain.sh

      # ------------------------------------------------------------------
      # Configure CMake — Linux
      # ------------------------------------------------------------------
      - name: Configure CMake (Linux)
        if: runner.os == 'Linux'
        run: |
          cmake -S . -B build \
            -GNinja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang-21 \
            -DCMAKE_CXX_COMPILER=clang++-21

      # ------------------------------------------------------------------
      # Configure CMake — macOS
      # ------------------------------------------------------------------
      - name: Configure CMake (macOS)
        if: runner.os == 'macOS'
        run: |
          export SDKROOT="$(xcrun --sdk macosx --show-sdk-path)"
          cmake -S . -B build \
            -GNinja \
            -DPORTABLE=1 \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 \
            -DCMAKE_SYSROOT="$(xcrun --show-sdk-path)"

      # ------------------------------------------------------------------
      # Build only the pow-miner target
      # ------------------------------------------------------------------
      - name: Build pow-miner
        run: |
          cmake --build build --target pow-miner -j"$(nproc 2>/dev/null || sysctl -n hw.logicalcpu)"

      # ------------------------------------------------------------------
      # Package: strip + archive. The release collector verifies the
      # artifact digest GitHub records at upload, so no checksum file is kept.
      # ------------------------------------------------------------------
      - name: Package artifact
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          ARCHIVE="tos-pow-miner-${PLATFORM}.tar.gz"

          # Find the built binary (cmake output location varies by generator)
          BIN=$(find build -name 'pow-miner' -type f | head -1)
          if [ -z "$BIN" ]; then
            echo "ERROR: pow-miner binary not found in build/" >&2
            exit 1
          fi

          # Strip (best-effort; macOS strip is different from GNU strip)
          strip "$BIN" 2>/dev/null || true

          # Create staging dir
          mkdir -p staging
          cp "$BIN" staging/pow-miner

          # Archive
          tar -czf "$ARCHIVE" -C staging .

          echo "ARCHIVE=${ARCHIVE}" >> "$GITHUB_ENV"

      - name: Keep the archive for the release collector
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.artifact }}
          path: ${{ env.ARCHIVE }}
          if-no-files-found: error
          retention-days: 14
