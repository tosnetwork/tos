name: MacOS-14 TOS build (shared, arm64)

on:
  pull_request:
    branches: [master, testnet]
    types: [opened, reopened, synchronize, ready_for_review]
  push:
    branches: [master, testnet]
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Date Stamp
        shell: bash
        id: date-stamp
        run: |
          echo "timestamp=$(date -u "+%Y%m%d%H%M_%S")" >> "$GITHUB_OUTPUT"

      - name: Create ~/.ccache
        run: |
          mkdir -p ~/.ccache

      - name: Cache TOS
        id: cache-tos
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ${{ runner.os }}-${{ runner.arch }}-14-shared-ccache-${{ steps.date-stamp.outputs.timestamp }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-14-shared-ccache

      - name: Build TOS
        run: |
          cp assembly/native/build-macos-shared.sh .
          chmod +x build-macos-shared.sh
          ./build-macos-shared.sh -t -c -o 14.0
          ccache -sp

      - name: Run Tests
        run: |
          cd build
          ctest --output-on-failure --timeout 1800

      - name: Run toslib integration test
        run: |
          ./test/toslib/integration/test_integration.sh
