name: Create tol release

# Publishes the tol binaries built from exactly the commit the tag names. Push
# the tag and let the build workflows in scripts/release-artifacts.json succeed
# on it (run them on the tag by hand when its name is not v*); this workflow
# refuses the release otherwise. See create-release.yml.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tol release tag to publish'
        required: true

permissions: {}

concurrency:
  group: create-tol-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    outputs:
      tag_sha: ${{ steps.tag.outputs.sha }}
    steps:
      - name: Check out the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false

      - name: Resolve the tag commit
        id: tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^[0-9A-Za-z][0-9A-Za-z._-]*$ ]] || { echo "not a release tag: $TAG" >&2; exit 1; }
          git fetch --no-tags --depth=1 origin "+refs/tags/$TAG:refs/tags/$TAG"
          sha="$(git rev-parse "refs/tags/$TAG^{commit}")"
          [ "$sha" = "$(git rev-parse HEAD)" ] || { echo "checkout is not the tag commit" >&2; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Collect artifacts built from the tag commit
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          TAG_SHA: ${{ steps.tag.outputs.sha }}
        run: |
          python3 scripts/release-artifacts.py collect \
            --repo "$GITHUB_REPOSITORY" --tag "$TAG" --tag-sha "$TAG_SHA" --out artifacts

      - name: Stage release assets
        run: python3 scripts/release-artifacts.py stage --set tol --artifacts artifacts --out stage

      - name: Hand the staged assets to the publishing job
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-stage
          path: stage
          if-no-files-found: error
          retention-days: 3

  publish:
    needs: collect
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Receive the staged assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-stage
          path: stage

      - name: Verify every staged file against SHA256SUMS
        working-directory: stage
        env:
          TAG_SHA: ${{ needs.collect.outputs.tag_sha }}
        run: |
          set -euo pipefail
          sha256sum --check --strict SHA256SUMS
          listed="$(cut -d' ' -f3- SHA256SUMS | sort)"
          present="$(find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%f\n' | sort)"
          [ "$listed" = "$present" ] || { echo "staged files differ from SHA256SUMS" >&2; exit 1; }
          jq -e --arg sha "$TAG_SHA" '.tag_commit == $sha' release-provenance.json

      - name: Create the release and upload the assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$TAG" --notes ""
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" stage/*
