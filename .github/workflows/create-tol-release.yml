name: Create tol release

# Publishes the tol binaries built from exactly the commit the tag names. Tol
# release tags must be tol-v<version>, the namespace the tag ruleset in
# doc/tos-release-policy.md protects. Push the tag, run the build workflows in
# scripts/release-artifacts.json on it by hand (they build v* tags on push
# only), and let them succeed; this workflow refuses the release otherwise.
# See create-release.yml.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tol release tag (tol-v*) to publish'
        required: true

permissions: {}

concurrency:
  # One publication per tag at a time, shared by both release workflows;
  # a second run waits and is then refused by the none-state check.
  group: publish-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    outputs:
      tag_sha: ${{ steps.tag.outputs.sha }}
    steps:
      - name: Check out the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false

      - name: Resolve the tag commit
        id: tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^tol-v[0-9A-Za-z._-]+$ ]] || { echo "not a tol release tag: $TAG" >&2; exit 1; }
          git fetch --no-tags --depth=1 origin "+refs/tags/$TAG:refs/tags/$TAG"
          sha="$(git rev-parse "refs/tags/$TAG^{commit}")"
          [ "$sha" = "$(git rev-parse HEAD)" ] || { echo "checkout is not the tag commit" >&2; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Collect artifacts built from the tag commit
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          TAG_SHA: ${{ steps.tag.outputs.sha }}
        run: |
          python3 scripts/release-artifacts.py collect \
            --repo "$GITHUB_REPOSITORY" --set tol --tag "$TAG" --tag-sha "$TAG_SHA" --out artifacts

      - name: Stage release assets
        run: python3 scripts/release-artifacts.py stage --set tol --artifacts artifacts --out stage

      - name: Hand the staged assets to the publishing job
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-stage
          path: stage
          if-no-files-found: error
          retention-days: 3

  # The only job that writes a tol-v* release. All assets go into one draft,
  # and the draft is published once. Before each step that creates, fills or
  # publishes it, check-tag re-resolves the tag on GitHub and confirms the
  # tag's releases are what that step expects:
  #   none       before the draft is created: an existing release, draft or
  #              published, is refused and never added to;
  #   draft      before the upload;
  #   draft + the staged files, exactly, before publication;
  #   published + the staged files, after publication; on failure the
  #              release is deleted and the job fails.
  # The tag ruleset and release immutability in doc/tos-release-policy.md
  # close the window between the last check and publication.
  publish:
    needs: collect
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.tag }}
      TAG_SHA: ${{ needs.collect.outputs.tag_sha }}
    steps:
      - name: Check out the release guard from this workflow's commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          path: guard
          persist-credentials: false
          sparse-checkout: |
            scripts/release-artifacts.py
            scripts/release-artifacts.json
          sparse-checkout-cone-mode: false

      - name: Receive the staged assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-stage
          path: stage

      - name: Verify every staged file against SHA256SUMS
        working-directory: stage
        run: |
          set -euo pipefail
          sha256sum --check --strict SHA256SUMS
          listed="$(cut -d' ' -f3- SHA256SUMS | sort)"
          present="$(find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%f\n' | sort)"
          [ "$listed" = "$present" ] || { echo "staged files differ from SHA256SUMS" >&2; exit 1; }

      - name: Refuse an existing release, then create the draft
        run: |
          set -euo pipefail
          python3 guard/scripts/release-artifacts.py check-tag --repo "$GITHUB_REPOSITORY" --set tol \
            --tag "$TAG" --tag-sha "$TAG_SHA" --provenance stage/release-provenance.json \
            --release-state none
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --draft \
            --title "$TAG" --notes ""

      - name: Check the tag and the draft, then upload every asset to it
        run: |
          set -euo pipefail
          python3 guard/scripts/release-artifacts.py check-tag --repo "$GITHUB_REPOSITORY" --set tol \
            --tag "$TAG" --tag-sha "$TAG_SHA" --provenance stage/release-provenance.json \
            --release-state draft
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" stage/*

      - name: Check the tag and the complete draft, then publish it once
        run: |
          set -euo pipefail
          python3 guard/scripts/release-artifacts.py check-tag --repo "$GITHUB_REPOSITORY" --set tol \
            --tag "$TAG" --tag-sha "$TAG_SHA" --provenance stage/release-provenance.json \
            --release-state draft --assets stage
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false

      - name: Check the published release, and withdraw it if the tag moved
        run: |
          set -euo pipefail
          if ! python3 guard/scripts/release-artifacts.py check-tag --repo "$GITHUB_REPOSITORY" --set tol \
            --tag "$TAG" --tag-sha "$TAG_SHA" --provenance stage/release-provenance.json \
            --release-state published --assets stage; then
            echo "::error::the published release for $TAG failed its final check; deleting the release" >&2
            gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes
            exit 1
          fi
