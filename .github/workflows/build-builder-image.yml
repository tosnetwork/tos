name: Build TOS Builder Image

on:
  workflow_dispatch:  # Manual trigger only — rebuild when updating toolchain
  schedule:
    - cron: '0 0 1 * *'  # Monthly rebuild for security patches

env:
  REGISTRY: ghcr.io

jobs:
  build-ubuntu-22:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3.10.0
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          file: Dockerfile.builder
          target: builder-22
          push: true
          tags: ${{ env.REGISTRY }}/${{ github.repository }}-builder:ubuntu-22.04
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-ubuntu-24:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3.10.0
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          file: Dockerfile.builder
          target: builder-24
          push: true
          tags: ${{ env.REGISTRY }}/${{ github.repository }}-builder:ubuntu-24.04
          cache-from: type=gha
          cache-to: type=gha,mode=max
