name: Build TOS Builder Image

# Publishes ghcr.io/<owner>/<repo>-builder:ubuntu-24.04 as one multi-architecture
# index for linux/amd64 and linux/arm64. Each architecture is built natively on
# its own runner, then the index job joins the two digests under the tag.
#
# The node image (Dockerfile, built by docker-ubuntu-image.yml for both
# architectures) starts FROM this tag. A builder published for one architecture
# only makes the other node image fail with "no match for platform in
# manifest", so the two lists of platforms must stay the same;
# scripts/test_container_platforms.py checks that they do.

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 1 * *'  # Monthly rebuild for security patches
  push:
    branches: [main]
    paths:
      - Dockerfile.builder
      - .dockerignore
      - scripts/install-llvm-toolchain.sh
      - scripts/keys/apt-llvm-org.asc
      - scripts/build-tool-pins.json
      - scripts/verify-build-tool.py
      - .github/workflows/build-builder-image.yml

permissions: {}

env:
  REGISTRY: ghcr.io

concurrency:
  group: build-builder-image
  cancel-in-progress: false

jobs:
  build:
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          file: Dockerfile.builder
          target: builder-24
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: ${{ env.REGISTRY }}/${{ github.repository }}-builder:ubuntu-24.04-${{ matrix.arch }}
          cache-from: type=gha,scope=builder-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=builder-${{ matrix.arch }}
      - name: Record the per-architecture digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "build produced no digest" >&2; exit 1; }
          mkdir -p digests
          printf '%s' "$DIGEST" > "digests/$ARCH"
      - name: Hand the digest to the index job
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: builder-digest-${{ matrix.arch }}
          path: digests/${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 3

  index:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Receive the per-architecture digests
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: builder-digest-*
          merge-multiple: true
          path: digests
      - uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Join both architectures under ubuntu-24.04
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ github.repository }}-builder
        run: |
          set -euo pipefail
          image="${IMAGE,,}"
          amd64="$(cat digests/amd64)"
          arm64="$(cat digests/arm64)"
          docker buildx imagetools create --tag "$image:ubuntu-24.04" "$image@$amd64" "$image@$arm64"
          platforms="$(docker buildx imagetools inspect "$image:ubuntu-24.04" --format '{{json .Manifest}}' \
            | jq -r '[.manifests[].platform | select(.os == "linux") | .architecture] | sort | join(",")')"
          [ "$platforms" = "amd64,arm64" ] || { echo "index has platforms '$platforms', expected amd64,arm64" >&2; exit 1; }
          echo "published $image:ubuntu-24.04 for $platforms"
