name: Build TOS Builder Image

on:
  workflow_dispatch:  # Manual trigger only — rebuild when updating toolchain
  schedule:
    - cron: '0 0 1 * *'  # Monthly rebuild for security patches

env:
  REGISTRY: ghcr.io

jobs:
  build-ubuntu-22:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          file: Dockerfile.builder
          target: builder-22
          push: true
          tags: ${{ env.REGISTRY }}/${{ github.repository }}-builder:ubuntu-22.04
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-ubuntu-24:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          file: Dockerfile.builder
          target: builder-24
          push: true
          tags: ${{ env.REGISTRY }}/${{ github.repository }}-builder:ubuntu-24.04
          cache-from: type=gha
          cache-to: type=gha,mode=max
