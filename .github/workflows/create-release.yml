name: Create release

# Publishes the binaries built from exactly the commit a release tag names.
#
# Push the release tag first. The build workflows listed in
# scripts/release-artifacts.json run on that tag push; once they have all
# succeeded, run this workflow with the tag. It refuses the release unless every
# build workflow has a successful run whose head_sha is the tag commit, and it
# binds each published file to that run, the artifact id and the artifact
# digest in release-provenance.json and SHA256SUMS. Publication re-resolves
# the tag on GitHub and refuses, or withdraws the release, if it no longer
# names the commit the assets were built from. Release tags must be v<version>,
# the namespace the tag ruleset in doc/tos-release-policy.md protects.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag (v*) to publish'
        required: true

permissions: {}

concurrency:
  group: create-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    outputs:
      tag_sha: ${{ steps.tag.outputs.sha }}
    steps:
      - name: Check out the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false

      - name: Resolve the tag commit
        id: tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9A-Za-z._-]+$ ]] || { echo "not a release tag: $TAG" >&2; exit 1; }
          git fetch --no-tags --depth=1 origin "+refs/tags/$TAG:refs/tags/$TAG"
          sha="$(git rev-parse "refs/tags/$TAG^{commit}")"
          [ "$sha" = "$(git rev-parse HEAD)" ] || { echo "checkout is not the tag commit" >&2; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Collect artifacts built from the tag commit
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          TAG_SHA: ${{ steps.tag.outputs.sha }}
        run: |
          python3 scripts/release-artifacts.py collect \
            --repo "$GITHUB_REPOSITORY" --tag "$TAG" --tag-sha "$TAG_SHA" --out artifacts

      - name: Stage release assets
        run: |
          python3 scripts/release-artifacts.py stage --set full --artifacts artifacts --out stage
          cp recent_changelog.md stage-notes.md

      - name: Hand the staged assets to the publishing job
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-stage
          path: |
            stage
            stage-notes.md
          if-no-files-found: error
          retention-days: 3

  # The tag is re-resolved on GitHub before every step that creates, fills or
  # publishes the release, and once more after publishing; a release whose
  # tag moved is deleted again. The release is a draft, invisible to users,
  # until the last check before publication has passed. The tag ruleset and
  # release immutability in doc/tos-release-policy.md close the remaining
  # window between that check and publication.
  publish:
    needs: collect
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.tag }}
      TAG_SHA: ${{ needs.collect.outputs.tag_sha }}
    steps:
      - name: Check out the release guard from this workflow's commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          path: guard
          persist-credentials: false
          sparse-checkout: |
            scripts/release-artifacts.py
            scripts/release-artifacts.json
          sparse-checkout-cone-mode: false

      - name: Receive the staged assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-stage
          path: release

      - name: Verify every staged file against SHA256SUMS
        working-directory: release/stage
        run: |
          set -euo pipefail
          sha256sum --check --strict SHA256SUMS
          listed="$(cut -d' ' -f3- SHA256SUMS | sort)"
          present="$(find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%f\n' | sort)"
          [ "$listed" = "$present" ] || { echo "staged files differ from SHA256SUMS" >&2; exit 1; }

      - name: Check the tag still names the built commit, then create a draft
        run: |
          set -euo pipefail
          python3 guard/scripts/release-artifacts.py check-tag --repo "$GITHUB_REPOSITORY" --set full \
            --tag "$TAG" --tag-sha "$TAG_SHA" --provenance release/stage/release-provenance.json
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --draft \
            --title "TOS $TAG" --notes-file release/stage-notes.md

      - name: Check the tag again, then upload the assets to the draft
        run: |
          set -euo pipefail
          python3 guard/scripts/release-artifacts.py check-tag --repo "$GITHUB_REPOSITORY" --set full \
            --tag "$TAG" --tag-sha "$TAG_SHA" --provenance release/stage/release-provenance.json
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" release/stage/*

      - name: Check the tag again, then publish the draft
        run: |
          set -euo pipefail
          python3 guard/scripts/release-artifacts.py check-tag --repo "$GITHUB_REPOSITORY" --set full \
            --tag "$TAG" --tag-sha "$TAG_SHA" --provenance release/stage/release-provenance.json
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false

      - name: Check the published release's tag, and withdraw the release if it moved
        run: |
          set -euo pipefail
          if ! python3 guard/scripts/release-artifacts.py check-tag --repo "$GITHUB_REPOSITORY" --set full \
            --tag "$TAG" --tag-sha "$TAG_SHA" --provenance release/stage/release-provenance.json; then
            echo "::error::tag $TAG moved while its release was published; deleting the release" >&2
            gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes
            exit 1
          fi
