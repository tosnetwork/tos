name: Local PQ focused regression

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - 'scripts/*local*pq*'
      - 'scripts/*root*services*'
      - 'scripts/setup-testnet.sh'
      - 'tools/shielded-pool-circuit/**'
      - 'crypto/smartcont/tos-shielded-pool-v1.fc'
      - '.github/workflows/local-pq-runtime-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: local-pq-runtime-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Persistent deficit-policy regressions
        env:
          PYTHONPATH: scripts
        run: |
          mkdir -p "$RUNNER_TEMP/local-pq-evidence"
          git rev-parse HEAD > "$RUNNER_TEMP/local-pq-evidence/commit.txt"
          set -o pipefail
          python3 -m unittest discover -s scripts -p test_local_pq_funding_policy.py -v 2>&1 | tee "$RUNNER_TEMP/local-pq-evidence/policy.log"
      - name: Retain exact regression sources for independent reproduction
        if: always()
        run: |
          git archive --format=tar.gz --output="$RUNNER_TEMP/local-pq-evidence/sources.tar.gz" HEAD scripts test/tostester crypto/smartcont tools/shielded-pool-circuit tl .github/workflows pyproject.toml uv.lock tosctl/src/node-control/contracts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: local-pq-evidence-${{ github.sha }}
          path: ${{ runner.temp }}/local-pq-evidence
          retention-days: 3
          if-no-files-found: error
