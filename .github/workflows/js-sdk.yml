name: JS SDK

# Every package's unit tests and type check. The authentication workflow runs
# only the wallets package; this covers the rest, including the weak-key
# predicate in @tos/crypto that every wallet constructor relies on.
on:
  pull_request:
    paths:
      - 'sdk/js/**'
      - '.github/workflows/js-sdk.yml'
    types: [opened, reopened, synchronize, ready_for_review]
  push:
    branches: [main]
    paths:
      - 'sdk/js/**'
      - '.github/workflows/js-sdk.yml'
  schedule:
    - cron: '17 7 * * 0'

permissions:
  contents: read

concurrency:
  group: js-sdk-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ (vars.SELF_HOSTED_LINUX == 'true' && (
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       contains(fromJSON(vars.CI_TRUSTED_LOGINS), github.event.pull_request.user.login) &&
       contains(fromJSON(vars.CI_TRUSTED_LOGINS), github.triggering_actor))))
      && fromJSON('["self-hosted","linux","x64","tos-vm"]') || 'ubuntu-24.04' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Type check and test every package
        working-directory: sdk/js
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm -r typecheck
          pnpm -r test
          git diff --exit-code
