name: sanitize-atos-task-escrow-sidecar-e2e

on:
  push:
    branches:
      - agent/atos-task-escrow-sidecar-e2e

permissions:
  contents: write

jobs:
  sanitize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/atos-task-escrow-sidecar-e2e
          fetch-depth: 0
      - name: Remove interrupted-delivery helpers
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/atos-sidecar-e2e-patch.part*
          rm -f .github/atos-task-escrow-sidecar-e2e.trigger
          rm -f .github/atos-task-escrow-sidecar-real-localnet.run2
          rm -f .github/workflows/export-atos-task-escrow-sidecar-source.yml
          rm -f .github/workflows/materialize-atos-task-escrow-sidecar-e2e.yml
          rm -f .github/workflows/complete-atos-task-escrow-sidecar-e2e.yml
          rm -f .github/workflows/finalize-atos-task-escrow-sidecar-e2e.yml
          rm -f .github/workflows/strict-localnet-gate-atos-task-escrow-sidecar.yml
          rm -f .github/workflows/strict-localnet-gate-atos-task-escrow-sidecar-v2.yml
          rm -f .github/workflows/sanitize-atos-task-escrow-sidecar-e2e.yml
          script="$(find scripts -maxdepth 1 -type f | grep -Ei '(atos.*task.*escrow.*sidecar.*e2e|task.*escrow.*sidecar.*e2e)' | head -1 || true)"
          test -n "${script}"
          workflow="$(find .github/workflows -maxdepth 1 -type f | grep -Ei '(localnet|real[-_]?chain)' | grep -Ei '(atos|task.*escrow|sidecar)' | grep -Eiv '(materialize|export|finalize|strict|sanitize|complete)' | head -1 || true)"
          test -n "${workflow}"
          python3 -m py_compile "${script}"
          git diff --check
      - name: Commit sanitized branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'ci: sanitize ATOS TaskEscrow localnet E2E branch'
          git push origin HEAD:agent/atos-task-escrow-sidecar-e2e
