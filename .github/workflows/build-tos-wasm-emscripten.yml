name: Emscripten TOS build (wasm)

on:
  push:
    tags: ['v*']
  workflow_dispatch:
  workflow_call:

# A literal group: inside a call, github.workflow is the caller's name, so every
# matrix member would share one group. A pull request cancels its own older run;
# any other run (a push, the nightly run, a tag) is never cancelled by another.
concurrency:
  group: wasm-${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    timeout-minutes: 50
    runs-on: ubuntu-22.04

    steps:
    - name: Check out repository
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
    - name: Install system libraries
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential git cmake ninja-build libjemalloc-dev
        mkdir -p 3pp_emscripten

    - name: Install clang-21
      run: sudo scripts/install-llvm-toolchain.sh 21

    - name: Cache 3pp Emscripten
      id: cache-3pp-emscripten
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: 3pp_emscripten
        key: ${{ runner.os }}-${{ runner.arch }}-ubuntu-22.04-3pp_em-${{ hashFiles('**/assembly/wasm/fift-func-wasm-build-ubuntu.sh') }}

    - name: Build TOS WASM artifacts
      run: |
        cp assembly/wasm/fift-func-wasm-build-ubuntu.sh .
        chmod +x fift-func-wasm-build-ubuntu.sh
        ./fift-func-wasm-build-ubuntu.sh -a

    - name: Upload artifacts
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: tos-wasm
        path: artifacts
        retention-days: 14
