name: TOS Static Code Analysis

on:
  workflow_dispatch:
  workflow_call:

# A literal group: inside a call, github.workflow is the caller's name, so every
# matrix member would share one group. A pull request cancels its own older run;
# any other run (a push, the nightly run, a tag) is never cancelled by another.
concurrency:
  group: cppcheck-${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    timeout-minutes: 110
    runs-on: ubuntu-22.04

    steps:
    - name: Check out repository
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
    - name: Run Cppcheck
      uses: Bedzior/run-cppcheck@51eb317e7a1430757d150d2e0143b68fb7d8ac68 # v1.0.0
      with:
        enabled checks: all
        enable inconclusive: true
        generate report: true

    - name: Upload report
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: tos-ccpcheck-report
        path: output
        retention-days: 14
