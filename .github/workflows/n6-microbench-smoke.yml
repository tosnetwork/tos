name: N6 microbench smoke

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up repository Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build

      - name: Configure Release build
        run: cmake -S . -B build-n6-smoke -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build smoke benchmark
        run: cmake --build build-n6-smoke --target n6-microbench-smoke -j2

      - name: Run registered smoke gate
        working-directory: build-n6-smoke
        run: ctest -L n6-microbench-smoke --no-tests=error --output-on-failure
