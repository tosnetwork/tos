name: BR1 B1 bounded relay service and client

# These gates also run on stacked pull requests; no main-only base filter.
on:
  pull_request:
    paths:
      - 'tools/bonded-relayer/**'
      - 'test/bonded-relayer/**'
      - 'doc/br1-service-api.md'
      - 'doc/evidence/br1-delivery/**'
      - '.github/workflows/br1-service.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: br1-service-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  service:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
      - name: Check the exact Python sources with pinned Ruff
        run: |
          python -m pip install ruff==0.15.2
          ruff check --isolated --select E4,E7,E9,F,I --ignore E741 --line-length 100 --target-version py312 tools/bonded-relayer/relay_http.py \
            tools/bonded-relayer/relay_service.py \
            tools/bonded-relayer/relay_client.py \
            tools/bonded-relayer/relay_wire.py \
            test/bonded-relayer/_service_fixture.py \
            test/bonded-relayer/test_relay_service.py \
            test/bonded-relayer/delivery_controls.py
          ruff format --check --isolated --line-length 100 --target-version py312 tools/bonded-relayer/relay_http.py \
            tools/bonded-relayer/relay_service.py \
            tools/bonded-relayer/relay_client.py \
            tools/bonded-relayer/relay_wire.py \
            test/bonded-relayer/_service_fixture.py \
            test/bonded-relayer/test_relay_service.py \
            test/bonded-relayer/delivery_controls.py
      - name: Exercise real HTTP, client and journal boundaries
        run: python -m unittest discover -s test/bonded-relayer -p test_relay_service.py -v
      - name: Remove service guards and require designated assertion failures
        run: python test/bonded-relayer/delivery_controls.py --lane service --out build/br1-service-receipts/service-controls.json
      - name: Retain bounded source-bound control receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: br1-service-${{ github.sha }}
          path: build/br1-service-receipts/
          if-no-files-found: warn
          retention-days: 14
