name: Validator P0 profile

on:
  pull_request:
    paths:
      - 'doc/validator-auth-p0/**'
      - 'doc/validator-auth-p0-freeze.json'
      - 'doc/validator-auth-p0-native-insertions.json'
      - 'keyring/**'
      - 'test/validator-auth-p0/**'
      - '.github/workflows/validator-auth-p0-profile.yml'
      - 'third-party/tl-parser/**'
      - 'tl/generate/scheme/tos_api.tl'
      - 'tl/generate/scheme/lite_api.tl'
      - 'crypto/block/block.tlb'
      - 'tos/tos-types.h'
  workflow_dispatch:

permissions:
  contents: read
# One group per commit. The frozen record names this workflow as the evidence
# that must pass at the commit carrying its exact artifact set, so a run
# cancelled because a later commit arrived leaves the earlier commit with
# nothing that can be cited for it -- and a record whose evidence cannot be
# produced is not a record. Two runs for the same commit still collapse.
concurrency:
  group: validator-p0-profile-${{ github.sha }}
  cancel-in-progress: false

jobs:
  profile:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Check reference bytes, real C0 signatures and persistent schema constraints
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          git rev-parse HEAD > artifacts/commit.txt
          python3 test/validator-auth-p0/archive_evidence.py --out artifacts/source.tar
          sha256sum artifacts/source.tar > artifacts/source.sha256
          sha256sum doc/validator-auth-p0/profile.json > artifacts/profile.sha256
          python3 --version > artifacts/toolchain.txt
          openssl version >> artifacts/toolchain.txt
          gzip -dc test/validator-auth-p0/golden.json.gz > artifacts/golden.json
          python3 test/validator-auth-p0/contract_artifacts.py | tee artifacts/contract.log
          python3 test/validator-auth-p0/freeze_record.py
          python3 test/validator-auth-p0/differential.py --out artifacts/differential.json
          python3 test/validator-auth-p0/check_production.py --out artifacts/production-boundary.json
          python3 test/validator-auth-p0/run_tests.py --out artifacts/test-results.json 2>&1 | tee artifacts/tests.log
          cp test/validator-auth-p0/lifecycle-api-golden.json artifacts/
          python3 test/validator-auth-p0/mutations.py --out artifacts/mutations.json
      - name: Compile the native TL parser and reject incompatible schema
        shell: bash
        run: |
          set -euo pipefail
          cmake -S third-party/tl-parser -B build-p0-schema -G Ninja
          cmake --build build-p0-schema -j2
          python3 test/validator-auth-p0/check_schema.py --tl-parser build-p0-schema/tl-parser --out artifacts/schema.json
          git diff --exit-code
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: validator-p0-profile
          path: artifacts/
          retention-days: 14
          if-no-files-found: error

  profile-arm:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Check reference bytes, real C0 signatures and persistent schema constraints
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          git rev-parse HEAD > artifacts/commit.txt
          python3 test/validator-auth-p0/archive_evidence.py --out artifacts/source.tar
          sha256sum artifacts/source.tar > artifacts/source.sha256
          sha256sum doc/validator-auth-p0/profile.json > artifacts/profile.sha256
          python3 --version > artifacts/toolchain.txt
          openssl version >> artifacts/toolchain.txt
          gzip -dc test/validator-auth-p0/golden.json.gz > artifacts/golden.json
          python3 test/validator-auth-p0/contract_artifacts.py | tee artifacts/contract.log
          python3 test/validator-auth-p0/freeze_record.py
          python3 test/validator-auth-p0/differential.py --out artifacts/differential.json
          python3 test/validator-auth-p0/check_production.py --out artifacts/production-boundary.json
          python3 test/validator-auth-p0/run_tests.py --out artifacts/test-results.json 2>&1 | tee artifacts/tests.log
          cp test/validator-auth-p0/lifecycle-api-golden.json artifacts/
      - name: Compile the native TL parser and reject incompatible schema
        shell: bash
        run: |
          set -euo pipefail
          cmake -S third-party/tl-parser -B build-p0-schema -G Ninja
          cmake --build build-p0-schema -j2
          python3 test/validator-auth-p0/check_schema.py --tl-parser build-p0-schema/tl-parser --out artifacts/schema.json
          git diff --exit-code
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: validator-p0-profile-arm
          path: artifacts/
          retention-days: 14
          if-no-files-found: error

  native-boc:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Build focused native TL-B and BOC target
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y clang lld cmake ninja-build pkg-config libssl-dev libsodium-dev liblz4-dev zlib1g-dev gperf
          cmake -S . -B build-p0-native -G Ninja -DCMAKE_BUILD_TYPE=Release -DTOS_ARCH= \
            -DUSE_QUIC=OFF -DTOS_USE_ROCKSDB=OFF -DTOS_USE_ABSEIL=OFF -DTOS_USE_LLD=ON \
            -DCMAKE_SKIP_INSTALL_RULES=ON \
            -DCMAKE_PROJECT_INCLUDE="$PWD/test/validator-auth-p0/native-profile.cmake" \
            -DOPENSSL_CRYPTO_LIBRARY="$(pkg-config --variable=libdir openssl)/libcrypto.so" \
            -DOPENSSL_SSL_LIBRARY="$(pkg-config --variable=libdir openssl)/libssl.so" \
            -DOPENSSL_INCLUDE_DIR="$(pkg-config --variable=includedir openssl)"
          cmake --build build-p0-native --target test-p0-native -j2
          mkdir -p artifacts
          git rev-parse HEAD > artifacts/commit.txt
          build-p0-native/test-p0-native | tee artifacts/native-boc.txt
          python3 test/validator-auth-p0/native_guard.py --build build-p0-native --out artifacts/native-guard.json
          git diff --exit-code
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: validator-p0-profile-native
          path: artifacts/
          retention-days: 14
          if-no-files-found: error

  conformance:
    needs: [profile, profile-arm, native-boc]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Require both architecture jobs
        run: |
          test '${{ needs.profile.result }}' = success
          test '${{ needs.profile-arm.result }}' = success
          test '${{ needs.native-boc.result }}' = success
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: validator-p0-profile*
          path: evidence
      - name: Compare exact-head reference evidence and require mutations
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYCODE'
          import json, os
          from pathlib import Path
          left = Path('evidence/validator-p0-profile')
          right = Path('evidence/validator-p0-profile-arm')
          required_tests = {
              'test_api_guards.ApiGuardTests.test_verified_summary_binds_exact_certificate_signers',
              'test_freeze.FreezeTests.test_replay_requires_every_block_and_snapshot_is_read_only',
              'test_freeze.FreezeTests.test_400_limit_and_large_certificate',
              'test_freeze.FreezeTests.test_service_policy_and_component_separation',
              'test_api_guards.ApiGuardTests.test_c0_sign_result_requires_exact_signature_size',
              'test_api_guards.ApiGuardTests.test_verified_summary_rejects_noncanonical_signers',
              'test_api_guards.ApiGuardTests.test_verification_request_pins_both_context_proofs',
              'test_api_guards.ApiGuardTests.test_polling_preserves_terminal_state_and_exact_result',
          }
          for directory in (left, right):
              if (directory/'commit.txt').read_text().strip() != os.environ['EXPECTED_HEAD']:
                  raise SystemExit('wrong-head evidence')
              report = json.loads((directory/'test-results.json').read_text())
              if not report['success'] or report['tests_run'] != len(report['test_ids']):
                  raise SystemExit('incomplete test execution')
              if not required_tests <= set(report['test_ids']):
                  raise SystemExit('missing API regression tests')
          names = ('golden.json', 'lifecycle-api-golden.json', 'schema.json',
                   'production-boundary.json', 'profile.sha256', 'contract.log', 'test-results.json', 'differential.json')
          for name in names:
              if (left/name).read_bytes() != (right/name).read_bytes():
                  raise SystemExit('cross-architecture mismatch: '+name)
          native = Path('evidence/validator-p0-profile-native')
          if (native/'commit.txt').read_text().strip() != os.environ['EXPECTED_HEAD']:
              raise SystemExit('wrong-head native evidence')
          if 'PASS native TL-B/BOC and malformed leaf controls' not in (native/'native-boc.txt').read_text():
              raise SystemExit('missing native BOC evidence')
          guard = json.loads((native/'native-guard.json').read_text())
          if not all(guard[k] for k in ('compiled', 'killed', 'restored')):
              raise SystemExit('native guard not demonstrated')
          mutations = json.loads((left/'mutations.json').read_text())
          if len(mutations) != 31 or len({x['guard'] for x in mutations}) != 31:
              raise SystemExit('missing mutation inventory')
          if 'verified-signers' not in {x['guard'] for x in mutations}:
              raise SystemExit('missing signer-binding mutation')
          if not all(x['parsed'] and x['killed'] and x['returncode'] == 1 and x['failures'] for x in mutations):
              raise SystemExit('undemonstrated mutation kill')
          print('PASS: same HEAD, eight equal evidence files, 31 discriminating reference mutations')
          PYCODE
