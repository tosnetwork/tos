name: Release TOS pow-miner

# Builds the TOS pow-miner binary for multiple platforms and
# publishes the artifacts to the GitHub Release created by the tag push.
# The build jobs run with a read-only token; only the publish job, which runs
# no build code, can write to the release.
#
# Trigger: push of any tag matching "v*" (e.g. v0.1.0, v1.2.3-rc1).
# Each matrix leg produces:
#   tos-pow-miner-{platform}-{tag}.tar.gz   (Linux / macOS)
#   tos-pow-miner-{platform}-{tag}.zip      (Windows)
# plus a SHA256SUMS file for verification.
#
# NOTE: The pow-miner C++ source lives at crypto/util/pow-miner-*.cpp
# and must be present before this workflow can build the target.
# The cmake target name is "pow-miner" (added to crypto/CMakeLists.txt
# alongside the existing mintless-proof-generator target).

on:
  push:
    tags:
      - 'v*'

permissions: {}

concurrency:
  group: release-tos-pow-miner-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            os: ubuntu-22.04
            archive_ext: tar.gz
          - platform: macos-x64
            os: macos-15-intel
            archive_ext: tar.gz
          - platform: macos-arm64
            os: macos-14
            archive_ext: tar.gz

    runs-on: ${{ matrix.os }}
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
          persist-credentials: false

      # ------------------------------------------------------------------
      # Linux: install build dependencies
      # ------------------------------------------------------------------
      - name: Install build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            git \
            cmake \
            ninja-build \
            ccache \
            autoconf \
            automake \
            libtool \
            pkg-config \
            libssl-dev \
            libgflags-dev \
            libreadline-dev

      - name: Install clang-21 (Linux)
        if: runner.os == 'Linux'
        run: sudo scripts/install-llvm-toolchain.sh 21

      # ------------------------------------------------------------------
      # macOS: install build dependencies (mirrors build-macos-portable.sh)
      # ------------------------------------------------------------------
      - name: Install build dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          export NONINTERACTIVE=1
          brew install cmake ninja pkg-config automake libtool autoconf ccache openssl

      # ------------------------------------------------------------------
      # Rust toolchain needed for Rust crates under tosctl/src.
      # Pinned version matches tosctl/src/rust-toolchain.toml
      # ------------------------------------------------------------------
      - name: Install repository-pinned Rust toolchain
        run: scripts/install-rust-toolchain.sh

      # ------------------------------------------------------------------
      # Configure CMake — Linux
      # ------------------------------------------------------------------
      - name: Configure CMake (Linux)
        if: runner.os == 'Linux'
        run: |
          cmake -S . -B build \
            -GNinja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang-21 \
            -DCMAKE_CXX_COMPILER=clang++-21

      # ------------------------------------------------------------------
      # Configure CMake — macOS
      # ------------------------------------------------------------------
      - name: Configure CMake (macOS)
        if: runner.os == 'macOS'
        run: |
          export SDKROOT="$(xcrun --sdk macosx --show-sdk-path)"
          cmake -S . -B build \
            -GNinja \
            -DPORTABLE=1 \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 \
            -DCMAKE_SYSROOT="$(xcrun --show-sdk-path)"

      # ------------------------------------------------------------------
      # Build only the pow-miner target
      # ------------------------------------------------------------------
      - name: Build pow-miner
        run: |
          cmake --build build --target pow-miner -j"$(nproc 2>/dev/null || sysctl -n hw.logicalcpu)"

      # ------------------------------------------------------------------
      # Package: strip + archive + SHA256SUMS
      # ------------------------------------------------------------------
      - name: Package artifact
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          PLATFORM="${{ matrix.platform }}"
          ARCHIVE="tos-pow-miner-${PLATFORM}-${TAG}.tar.gz"

          # Find the built binary (cmake output location varies by generator)
          BIN=$(find build -name 'pow-miner' -type f | head -1)
          if [ -z "$BIN" ]; then
            echo "ERROR: pow-miner binary not found in build/" >&2
            exit 1
          fi

          # Strip (best-effort; macOS strip is different from GNU strip)
          strip "$BIN" 2>/dev/null || true

          # Create staging dir
          mkdir -p staging
          cp "$BIN" staging/pow-miner

          # Archive
          tar -czf "$ARCHIVE" -C staging .

          # SHA256
          sha256sum "$ARCHIVE" > "${ARCHIVE}.sha256"

          echo "ARCHIVE=${ARCHIVE}" >> "$GITHUB_ENV"

      - name: Hand the archive to the publishing job
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pow-miner-${{ matrix.platform }}
          path: |
            ${{ env.ARCHIVE }}
            ${{ env.ARCHIVE }}.sha256
          if-no-files-found: error
          retention-days: 3

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Receive the archives built in this run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: pow-miner-*
          merge-multiple: true
          path: dist

      - name: Verify and upload
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          for sum in *.sha256; do
            sha256sum --check --strict "$sum"
          done
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$TAG" --notes ""
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber ./*
