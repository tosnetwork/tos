name: Release TOS pow-miner

# Builds the TOS pow-miner binary for multiple platforms and
# publishes the artifacts to the GitHub Release created by the tag push.
#
# Trigger: push of any tag matching "v*" (e.g. v0.1.0, v1.2.3-rc1).
# Each matrix leg produces:
#   tos-pow-miner-{platform}-{tag}.tar.gz   (Linux / macOS)
#   tos-pow-miner-{platform}-{tag}.zip      (Windows)
# plus a SHA256SUMS file for verification.
#
# NOTE: The pow-miner C++ source lives at crypto/util/pow-miner-*.cpp
# and must be present before this workflow can build the target.
# The cmake target name is "pow-miner" (added to crypto/CMakeLists.txt
# alongside the existing mintless-proof-generator target).

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-tos-pow-miner-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            os: ubuntu-22.04
            archive_ext: tar.gz
          - platform: macos-x64
            os: macos-15-intel
            archive_ext: tar.gz
          - platform: macos-arm64
            os: macos-14
            archive_ext: tar.gz

    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      # ------------------------------------------------------------------
      # Linux: install build dependencies (mirrors uno-ci.yml)
      # ------------------------------------------------------------------
      - name: Install build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            git \
            cmake \
            ninja-build \
            ccache \
            autoconf \
            automake \
            libtool \
            pkg-config \
            libssl-dev \
            libgflags-dev \
            libreadline-dev

      - name: Install clang-21 (Linux)
        if: runner.os == 'Linux'
        run: |
          cd /tmp
          rm -f llvm.sh
          wget -q https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 21

      # ------------------------------------------------------------------
      # macOS: install build dependencies (mirrors build-macos-portable.sh)
      # ------------------------------------------------------------------
      - name: Install build dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          export NONINTERACTIVE=1
          brew install cmake ninja pkg-config automake libtool autoconf ccache openssl

      # ------------------------------------------------------------------
      # Rust toolchain — required by corrosion-rs / libuno_plonky3_ffi
      # Pinned version matches tosctl/src/rust-toolchain.toml and uno-ci.yml
      # ------------------------------------------------------------------
      - name: Install pinned Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: 1.91.1
          profile: minimal
          override: true

      # ------------------------------------------------------------------
      # Configure CMake — Linux
      # ------------------------------------------------------------------
      - name: Configure CMake (Linux)
        if: runner.os == 'Linux'
        run: |
          cmake -S . -B build \
            -GNinja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang-21 \
            -DCMAKE_CXX_COMPILER=clang++-21

      # ------------------------------------------------------------------
      # Configure CMake — macOS
      # ------------------------------------------------------------------
      - name: Configure CMake (macOS)
        if: runner.os == 'macOS'
        run: |
          export SDKROOT="$(xcrun --sdk macosx --show-sdk-path)"
          cmake -S . -B build \
            -GNinja \
            -DPORTABLE=1 \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 \
            -DCMAKE_SYSROOT="$(xcrun --show-sdk-path)"

      # ------------------------------------------------------------------
      # Build only the pow-miner target
      # ------------------------------------------------------------------
      - name: Build pow-miner
        run: |
          cmake --build build --target pow-miner -j"$(nproc 2>/dev/null || sysctl -n hw.logicalcpu)"

      # ------------------------------------------------------------------
      # Package: strip + archive + SHA256SUMS
      # ------------------------------------------------------------------
      - name: Package artifact
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          PLATFORM="${{ matrix.platform }}"
          ARCHIVE="tos-pow-miner-${PLATFORM}-${TAG}.tar.gz"

          # Find the built binary (cmake output location varies by generator)
          BIN=$(find build -name 'pow-miner' -type f | head -1)
          if [ -z "$BIN" ]; then
            echo "ERROR: pow-miner binary not found in build/" >&2
            exit 1
          fi

          # Strip (best-effort; macOS strip is different from GNU strip)
          strip "$BIN" 2>/dev/null || true

          # Create staging dir
          mkdir -p staging
          cp "$BIN" staging/pow-miner

          # Archive
          tar -czf "$ARCHIVE" -C staging .

          # SHA256
          sha256sum "$ARCHIVE" > "${ARCHIVE}.sha256"

          echo "ARCHIVE=${ARCHIVE}" >> "$GITHUB_ENV"

      - name: Upload release asset
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ${{ env.ARCHIVE }}
          asset_name: ${{ env.ARCHIVE }}
          tag: ${{ github.ref_name }}
          overwrite: true

      - name: Upload SHA256 checksum
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ${{ env.ARCHIVE }}.sha256
          asset_name: ${{ env.ARCHIVE }}.sha256
          tag: ${{ github.ref_name }}
          overwrite: true
