name: Check TOS Builder Image

# Builds Dockerfile.builder for both release architectures on a pull request
# that changes it or its toolchain inputs, so a broken arm64 stage or tool
# download is caught before it merges instead of by the first publish on main.
#
# This workflow only reads: it builds, never logs in, never pushes and holds no
# write permission. build-builder-image.yml publishes the image after merge,
# and must build the same target for the same architectures on the same
# runners; scripts/test_container_platforms.py checks that the two agree.

on:
  pull_request:
    paths:
      - Dockerfile.builder
      - .dockerignore
      - scripts/install-llvm-toolchain.sh
      - scripts/keys/apt-llvm-org.asc
      - scripts/build-tool-pins.json
      - scripts/verify-build-tool.py
      - .github/workflows/build-builder-image.yml
      - .github/workflows/check-builder-image.yml

permissions:
  contents: read

concurrency:
  group: check-builder-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0
      - name: Build without publishing
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          file: Dockerfile.builder
          target: builder-24
          platforms: linux/${{ matrix.arch }}
          push: false
          # Read the cache the publishing workflow wrote on main; a pull request does
          # not write it, so it cannot evict main's layers.
          cache-from: type=gha,scope=builder-${{ matrix.arch }}
