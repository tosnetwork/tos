name: Ubuntu TOS build (node binaries)

# The node binaries a release publishes, built with the production node recipe
# (assembly/native/build-node-binaries.sh): Release, clang-21, jemalloc, a fixed
# CPU level and SOURCE_DATE_EPOCH set to the commit time. The same script builds
# tosctl with the pinned Rust toolchain and the committed Cargo.lock. The
# AppImage workflows keep building the desktop tools; operators install
# validators from these.
on:
  # Release packaging: a version tag builds the binaries the release workflow
  # collects (scripts/release-artifacts.json); dispatch builds them on demand.
  push:
    tags: ['v*']
  # A change to the recipe or to what the release takes from this build runs
  # both legs before it merges. A pull-request run only uploads workflow
  # artifacts with a read-only token; the release collects push and dispatch
  # runs of the tag commit only (scripts/release-artifacts.py).
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - '.github/workflows/build-tos-linux-node-binaries.yml'
      - 'assembly/native/build-node-binaries.sh'
      - 'scripts/release-artifacts.json'
      - 'scripts/install-llvm-toolchain.sh'
      - 'scripts/keys/apt-llvm-org.asc'
      - 'CMake/Findjemalloc.cmake'
      - 'rldp2/CMakeLists.txt'
      - 'rust-toolchain.toml'
      - 'scripts/install-rust-toolchain.sh'
      - 'tosctl/src/Cargo.lock'
      - 'tosctl/src/common/build/build.rs'
      - 'tosctl/src/node-control/nodectl/src/app_cli_args.rs'
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Node binaries (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
            artifact: tos-node-x86_64-linux
          - arch: arm64
            runner: ubuntu-24.04-arm
            artifact: tos-node-arm64-linux
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240

    steps:
    - name: Check out repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        persist-credentials: false

    - name: Install system libraries
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential git cmake ninja-build autoconf automake libtool \
          texinfo pkg-config python3 libgflags-dev libreadline-dev libgsl-dev libblas-dev \
          libgslcblas0 libjemalloc-dev libgmp-dev gperf libssl-dev

    # GSL is linked statically into the node binaries and is GPL-3.0-or-later,
    # so the release publishes the corresponding source of the libgsl-dev the
    # build links: the Ubuntu source package of that exact version, checked
    # against digests pinned here. The build script refuses any other version.
    - name: Fetch the corresponding source of GSL
      run: |
        version=2.7.1+dfsg-6ubuntu2
        installed=$(dpkg-query -W -f '${source:Version}' libgsl-dev)
        if [ "$installed" != "$version" ]; then
          echo "libgsl-dev is $installed, not the pinned $version" >&2
          exit 1
        fi
        dir="$RUNNER_TEMP/gsl-source"
        mkdir "$dir"
        base=https://archive.ubuntu.com/ubuntu/pool/universe/g/gsl
        for file in gsl_2.7.1+dfsg-6ubuntu2.dsc gsl_2.7.1+dfsg.orig.tar.gz gsl_2.7.1+dfsg-6ubuntu2.debian.tar.xz; do
          curl -fsSL --retry 3 -o "$dir/$file" "$base/$file"
        done
        (cd "$dir" && sha256sum --check --strict) <<'SUMS'
        aac8cb968eb8da9ad63e85c7764c06e2f54cd48c5d82dc7c2d670cd3ae68c291  gsl_2.7.1+dfsg-6ubuntu2.dsc
        e560d6b9c6e254e46769bbb03583c00ecafbdd51b062c55db23b3b9612868567  gsl_2.7.1+dfsg.orig.tar.gz
        361386353e07347f6e66673a8c7f4bb96685e62960ec45df7e15d78e798fcfa9  gsl_2.7.1+dfsg-6ubuntu2.debian.tar.xz
        SUMS
        tar --sort=name --owner=0 --group=0 --numeric-owner --mtime=@0 \
          -C "$dir" -cf "$RUNNER_TEMP/gsl-2.7.1-source.tar" \
          gsl_2.7.1+dfsg-6ubuntu2.dsc gsl_2.7.1+dfsg.orig.tar.gz gsl_2.7.1+dfsg-6ubuntu2.debian.tar.xz

    - name: Install clang-21
      run: sudo scripts/install-llvm-toolchain.sh 21

    # tosctl is built by the same script, with the toolchain rust-toolchain.toml pins.
    - name: Install repository-pinned Rust toolchain
      run: scripts/install-rust-toolchain.sh

    - name: Build the node binaries with the node recipe
      run: assembly/native/build-node-binaries.sh node-binaries

    - name: Add the corresponding source of GSL to the build output
      run: install -m 0644 "$RUNNER_TEMP/gsl-2.7.1-source.tar" node-binaries/

    - name: Upload artifacts
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: ${{ matrix.artifact }}
        path: node-binaries
        if-no-files-found: error
        retention-days: 14
