name: Add native session C0 validation

on:
  pull_request:
    paths:
      - '.github/workflows/task2-c0-session-edit.yml'

permissions:
  contents: write

jobs:
  edit:
    if: github.head_ref == 'feat/validator-auth-p0'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
      - name: Insert focused validation and remove this workflow
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/validator-auth-p0-implementation.yml')
          text = path.read_text()
          anchor = "      - name: Resolve node context and retained native history\n"
          if text.count(anchor) != 1:
              raise SystemExit(f'validation anchor count is {text.count(anchor)}, expected 1')
          step = '''      - name: Install reconciled C0 provider routes at native session birth
        if: matrix.guards == 'native'
        run: |
          set -euo pipefail
          cmake --build build-p0 --target test-p0-native-session-provider -j2
          cmake --build build-p0-sanitized --target test-p0-native-session-provider -j2
          SESSION_PROVIDER_TMP="$(mktemp -d)"
          test -x build-p0/validator/auth/test-p0-native-session-provider
          test -x build-p0-sanitized/validator/auth/test-p0-native-session-provider
          build-p0/validator/auth/test-p0-native-session-provider \\
            artifacts/owner-transactions-mc artifacts/committee-fixtures \\
            "$SESSION_PROVIDER_TMP/normal" \\
            | tee artifacts/native-session-provider.txt
          ASAN_OPTIONS=detect_leaks=1:detect_stack_use_after_return=1 \\
            UBSAN_OPTIONS=halt_on_error=1 \\
            build-p0-sanitized/validator/auth/test-p0-native-session-provider \\
            artifacts/owner-transactions-mc artifacts/committee-fixtures-sanitized \\
            "$SESSION_PROVIDER_TMP/sanitized" \\
            | tee artifacts/native-session-provider-sanitized.txt
          python3 test/validator-auth-implementation/native_session_provider_mutations.py \\
            --build build-p0 --owner artifacts/owner-transactions-mc \\
            --committee artifacts/committee-fixtures \\
            --work "$SESSION_PROVIDER_TMP/mutations-work" \\
            --out artifacts/native-session-provider-mutations
          cp artifacts/native-session-provider-mutations/mutations.json \\
            artifacts/native-session-provider-mutations.json
          git diff --exit-code
'''
          path.write_text(text.replace(anchor, step + anchor, 1))
          PY
          git diff --check -- .github/workflows/validator-auth-p0-implementation.yml
          git rm .github/workflows/task2-c0-session-edit.yml
          git config user.name tosman
          git config user.email gtosnetwork@gmail.com
          git add .github/workflows/validator-auth-p0-implementation.yml
          git commit -m 'Run native session C0 provider guards'
          git push origin HEAD:feat/validator-auth-p0
