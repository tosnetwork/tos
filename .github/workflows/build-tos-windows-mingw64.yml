name: MSYS2 MinGW64 Build

on:
  pull_request:
    branches: [master, testnet]
    types: [opened, reopened, synchronize, ready_for_review]
  push:
    branches: [master, testnet]
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup MSYS2 and Install Packages
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2
        with:
          msystem: MINGW64
          update: true

      - name: Run Build Script
        run: |
          echo "Running in MSYS2 MINGW64 environment!"
          cp assembly/msys2/build-mingw64.sh .
          chmod +x build-mingw64.sh
          ./build-mingw64.sh -a

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tos-msys2-mingw64
          path: artifacts
          retention-days: 14
