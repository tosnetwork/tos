name: Toslib Android

on:
  pull_request:
    branches: [master, testnet]
    types: [opened, reopened, synchronize, ready_for_review]
  push:
    branches: [master, testnet]
    tags: ['v*']
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Check out repository
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
    - name: Install system libraries
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential git cmake ninja-build automake libtool texinfo autoconf libgflags-dev \
        libreadline-dev pkg-config libgsl-dev python3 python3-dev libtool autoconf

    -  name: Install llvm-21
       run: sudo scripts/install-llvm-toolchain.sh 21

    - name: Cache Android NDK
      id: cache-android-ndk
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: android-ndk-r27d-linux.zip
        key: ${{ runner.os }}-${{ runner.arch }}-ubuntu-22.04-cache-android-ndk-${{ hashFiles('**/assembly/android/build-android-toslib.sh', '**/scripts/build-tool-pins.json') }}

    # Rust toolchain needed for Rust crates under tosctl/src.
    - name: Install repository-pinned Rust toolchain
      run: scripts/install-rust-toolchain.sh

    - name: Build TOS
      run: |
        cp assembly/android/build-android-toslib.sh .
        chmod +x build-android-toslib.sh
        ./build-android-toslib.sh -a

    - name: Upload artifacts
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: tos-android-toslib
        path: artifacts
        retention-days: 14
