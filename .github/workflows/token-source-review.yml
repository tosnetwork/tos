name: Token source dependency review

on:
  push:
    branches: [refactor/token-naming]
    paths: [.github/workflows/token-source-review.yml]

permissions:
  contents: read

jobs:
  source-snapshot:
    if: github.repository == 'tosnetwork/tos' && github.ref == 'refs/heads/refactor/token-naming'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Retain tracked sources, never the checkout credentials or runtime state
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/token-source-review"
          mkdir -p "$out"
          git rev-parse HEAD > "$out/commit.txt"
          git archive --format=tar.gz HEAD > "$out/source.tar.gz"
          git diff --binary 8430f633a5b694b3ee0b31934d92941898474d83 HEAD > "$out/base.diff"
          sha256sum "$out/source.tar.gz" "$out/base.diff"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: token-source-review-${{ github.sha }}
          path: ${{ runner.temp }}/token-source-review
          if-no-files-found: error
          retention-days: 3
