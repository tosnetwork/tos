name: Experimental rescue context parity

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/rescue-context.yml'
      - 'crypto/block/transaction.*'
      - 'crypto/smc-envelope/SmartContract.cpp'
      - 'crypto/vm/**'
      - 'crypto/pq/**'
      - 'crypto/fift/lib/Asm.fif'
      - 'crypto/smartcont/**'
      - 'crypto/CMakeLists.txt'
      - 'CMakeLists.txt'
      - 'emulator/**'
      - 'third-party/slhdsa-c/**'
      - 'third-party/mldsa-native/**'
      - 'third-party/lms-reference/**'
      - 'tosctl/src/**'
      - 'test/auth-extensions/**'
      - 'test/rescue-fee-gate/**'
      - 'test/wallet-v5r2/**'
      - 'test/test-ext-message-ingress.cpp'
      - 'test/test-ext-message-ingress-fixtures.cpp'
      - 'test/test-ext-message-admission-budget.cpp'
      - 'test/test-ext-message-pool.cpp'
      - 'validator/impl/ext-message-*'
      - 'validator/impl/external-message*'
      - 'validator/impl/CMakeLists.txt'

permissions:
  contents: read

concurrency:
  group: rescue-context-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  parity:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    # Full custody/recovery controls now include repeated complete H20 rebuilds.
    timeout-minutes: 150
    env:
      TOS_ROOT: ${{ github.workspace }}
      CARGO_TARGET_DIR: ${{ github.workspace }}/build-cargo
      FUNC_PATH: ${{ github.workspace }}/build/crypto/func
      FIFT_PATH: ${{ github.workspace }}/build/crypto/fift
      EMULATOR_PATH: ${{ github.workspace }}/build/emulator/libemulator.so
      SLH_TOOL: ${{ github.workspace }}/build-signers/slh_tool
      MLDSA_TOOL: ${{ github.workspace }}/build-signers/mldsa_tool
      LMS_TOOL: ${{ github.workspace }}/build-signers/lms_tool
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
      - name: Install pinned Rust toolchain
        run: scripts/install-rust-toolchain.sh
      - name: Build native Release tools and both Rust drivers
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build --target func fift tlbc emulator test-fee-native-cost test-pq-suite-parity test-wallet-pq-signer-fixture -j2
          sh test/rescue-fee-gate/tools/build.sh build-signers
          cargo build --manifest-path tosctl/src/Cargo.toml --locked -p tos_vm -p tos_executor \
            --example fee-native-cost --example suite-parity --example pq-tx-parity
          cargo build --manifest-path tosctl/src/Cargo.toml --locked -p contracts \
            --example lms_fee_cache_fixture --example v5r2_auth_encode --example v5r2_pop_encode --example v5r2_prepare_encode --example v5r2_fee_encode --example v5r2_genesis_encode
      - name: PQ-only native wallet signer and fault controls
        run: |
          python test/wallet-v5r2/pq_signer_controls.py --build build --output artifacts/context/wallet-pq-signer
          python test/wallet-v5r2/pq_signer_controls.py --c-api --build build --output artifacts/context/wallet-pq-signer-c
      - name: Rust native wallet signer and proven-key controls
        run: |
          cargo build --manifest-path tosctl/src/Cargo.toml --locked -p wallet-pq-signer --example public_fixture
          cargo test --manifest-path tosctl/src/Cargo.toml --locked -p wallet-pq-signer
          python test/wallet-v5r2/native_fee_verify_controls.py --output artifacts/context/native-fee-verify-controls
          python test/wallet-v5r2/native_fee_sign_controls.py --output artifacts/context/native-fee-sign-controls
          python test/wallet-v5r2/native_fee_journal_controls.py --output artifacts/context/native-fee-journal-controls
          python test/wallet-v5r2/fee_seed_binding_controls.py --output artifacts/context/fee-seed-binding-controls
          python test/wallet-v5r2/fee_vault_controls.py --output artifacts/context/fee-vault-controls
          python test/wallet-v5r2/fee_recovery_controls.py --output artifacts/context/fee-recovery-controls
          python test/wallet-v5r2/manifest_fee_controls.py --output artifacts/context/manifest-fee-controls
          python test/wallet-v5r2/fee_rebuild_controls.py --output artifacts/context/fee-rebuild-controls
          cargo test --manifest-path tosctl/src/Cargo.toml --locked -p contracts --features native-wallet-vault --lib fee_mnemonic_rebuilds_tree_cache_and_encrypted_custody -- --ignored
          python test/wallet-v5r2/fee_tree_controls.py --output artifacts/context/fee-tree-controls
          python test/wallet-v5r2/fee_tree_cache_controls.py --output artifacts/context/fee-tree-cache-controls
          cargo test --manifest-path tosctl/src/Cargo.toml --locked -p contracts --features native-wallet-signer --lib internal_fee_signature_matches_independent_vm
          python test/wallet-v5r2/kdf_controls.py --output artifacts/context/wallet-kdf-controls
          cargo test --manifest-path tosctl/src/Cargo.toml --locked -p tos-native-mnemonic
          python test/wallet-v5r2/mnemonic_vector_check.py
          python test/wallet-v5r2/mnemonic_controls.py --output artifacts/context/native-mnemonic-controls
          cargo test --manifest-path tosctl/src/Cargo.toml --locked -p wallet-pq-signer --features vault --lib vault::mnemonic_tests
          cargo test --manifest-path tosctl/src/Cargo.toml --locked -p contracts --features native-wallet-signer --lib fee_state_tests
          python test/wallet-v5r2/rust_signer_controls.py --output artifacts/context/rust-wallet-signer-controls
          python test/wallet-v5r2/vault_signer_controls.py --output artifacts/context/vault-wallet-signer-controls
          cargo test --manifest-path tosctl/src/Cargo.toml --locked -p secrets-vault --lib storage::
          python test/wallet-v5r2/vault_persistence_controls.py --output artifacts/context/vault-persistence-controls
          python test/wallet-v5r2/vault_ownership_controls.py --output artifacts/context/vault-ownership-controls
          python test/wallet-v5r2/vault_creation_controls.py --output artifacts/context/vault-creation-controls
          python test/wallet-v5r2/vault_restore_controls.py --output artifacts/context/vault-restore-controls
          python test/wallet-v5r2/proven_vault_controls.py --output artifacts/context/proven-vault-controls
          python test/wallet-v5r2/vault_recovery_controls.py --output artifacts/context/vault-recovery-controls
          python test/wallet-v5r2/vault_pop_controls.py --output artifacts/context/vault-pop-controls
          python test/wallet-v5r2/migration_signing_controls.py --output artifacts/context/migration-signing-controls
          python test/wallet-v5r2/fee_rollover_controls.py --output artifacts/context/fee-rollover-controls
      - name: PQ custody restore CLI and protected input controls
        run: |
          cargo build --manifest-path tosctl/src/Cargo.toml --locked -p tosctl --features pq-wallet
          cargo test --manifest-path tosctl/src/Cargo.toml --locked -p secrets-vault --lib secret_input::
          python test/wallet-v5r2/cli_restore.py --cli "$CARGO_TARGET_DIR/debug/tosctl" --output artifacts/context/pq-cli-restore
          python test/wallet-v5r2/cli_restore_controls.py --cli "$CARGO_TARGET_DIR/debug/tosctl" --output artifacts/context/pq-cli-controls
          python test/wallet-v5r2/cli_create.py --cli "$CARGO_TARGET_DIR/debug/tosctl" --output artifacts/context/pq-cli-create
          python test/wallet-v5r2/cli_create_controls.py --cli "$CARGO_TARGET_DIR/debug/tosctl" --output artifacts/context/pq-cli-create-controls
      - name: Fee signer scheduling boundaries and deletion controls
        run: |
          python test/wallet-v5r2/fee_schedule_controls.py --output artifacts/context/fee-schedule
          # Keep fork/exec handoff separate from immediate journal reopen probes.
          cargo test --manifest-path tosctl/src/Cargo.toml --locked -p contracts --lib lms_fee_ -- --test-threads=1
      - name: PQ-only wallet SDK wire vectors
        run: |
          python -m pip install cryptography==46.0.4
          python test/wallet-v5r2/sdk_auth_vectors.py --output /tmp/v5r2-auth-vectors.json
          cmp /tmp/v5r2-auth-vectors.json tosctl/src/node-control/contracts/tests/fixtures/v5r2/auth-wire.json
          python test/wallet-v5r2/sdk_pop_vectors.py --output /tmp/v5r2-pop-vectors.json
          cmp /tmp/v5r2-pop-vectors.json tosctl/src/node-control/contracts/tests/fixtures/v5r2/pop-wire.json
          python test/wallet-v5r2/sdk_prepare_vectors.py --output /tmp/v5r2-prepare-vectors.json
          cmp /tmp/v5r2-prepare-vectors.json tosctl/src/node-control/contracts/tests/fixtures/v5r2/prepare-wire.json
          python test/wallet-v5r2/sdk_fee_vectors.py --output /tmp/v5r2-fee-vectors.json
          cmp /tmp/v5r2-fee-vectors.json tosctl/src/node-control/contracts/tests/fixtures/v5r2/fee-wire.json
          python test/wallet-v5r2/sdk_genesis_vectors.py --output /tmp/v5r2-genesis-vectors.json
          cmp /tmp/v5r2-genesis-vectors.json tosctl/src/node-control/contracts/tests/fixtures/v5r2/genesis-wire.json
          python test/wallet-v5r2/sdk_genesis_vectors.py --successor --output /tmp/v5r2-successor-vectors.json
          cmp /tmp/v5r2-successor-vectors.json tosctl/src/node-control/contracts/tests/fixtures/v5r2/successor-wire.json
          cargo test --manifest-path tosctl/src/Cargo.toml --locked -p contracts --lib wallet_v5r2
      - name: Initial recovery manifest semantic controls
        run: |
          python test/wallet-v5r2/manifest_controls.py --output artifacts/context/initial-manifest-controls
          python test/wallet-v5r2/manifest_recovery_controls.py --output artifacts/context/manifest-recovery-controls
          python test/wallet-v5r2/manifest_vault_controls.py --output artifacts/context/manifest-vault-controls
      - name: Wallet SDK semantic deletion controls
        if: matrix.runner == 'ubuntu-24.04'
        run: |
          python test/wallet-v5r2/sdk_auth_controls.py --output artifacts/context/auth-sdk-controls
          python test/wallet-v5r2/sdk_auth_controls.py --pop --output artifacts/context/pop-sdk-controls
          python test/wallet-v5r2/sdk_auth_controls.py --prepare --output artifacts/context/prepare-sdk-controls
          python test/wallet-v5r2/sdk_auth_controls.py --fee --output artifacts/context/fee-sdk-controls
          python test/wallet-v5r2/cached_fee_decode_controls.py --output artifacts/context/fee-cached-decode-controls
          python test/wallet-v5r2/sdk_auth_controls.py --genesis --output artifacts/context/genesis-sdk-controls
      - name: Durable fee reservation deletion controls
        if: matrix.runner == 'ubuntu-24.04'
        run: |
          python test/wallet-v5r2/fee_journal_controls.py --output artifacts/context/fee-journal
      - name: PQ-only complete receiver delivery
        run: |
          python test/wallet-v5r2/module_tx_parity.py \
            --native-signer build/crypto/pq/test-wallet-pq-signer-fixture \
            --driver "$CARGO_TARGET_DIR/debug/examples/pq-tx-parity" \
            --output artifacts/context/r2-module
          python test/wallet-v5r2/test_pop.py --output artifacts/context/r2-pop
          python test/wallet-v5r2/test_preparation.py --output artifacts/context/r2-preparation \
            --rust-driver "$CARGO_TARGET_DIR/debug/examples/pq-tx-parity"
      - name: Full R2 fee transaction parity at diagnostic credit
        run: |
          python test/wallet-v5r2/fee_tx_parity.py \
            --driver "$CARGO_TARGET_DIR/debug/examples/pq-tx-parity" \
            --cache-driver "$CARGO_TARGET_DIR/debug/examples/lms_fee_cache_fixture" \
            --output artifacts/context/r2-fee-auth
          for role in 1 2; do
            mkdir -p "artifacts/context/r2-fee-pop$role/native"
            ln artifacts/context/r2-fee-auth/native/PUBLIC-TEST-ONLY-lms-tree \
              "artifacts/context/r2-fee-pop$role/native/PUBLIC-TEST-ONLY-lms-tree"
            python test/wallet-v5r2/sdk_auth_parity.py --pop-role "$role" \
              --native-signer "$CARGO_TARGET_DIR/debug/examples/public_fixture" \
              --auth-driver "$CARGO_TARGET_DIR/debug/examples/v5r2_auth_encode" \
              --pop-driver "$CARGO_TARGET_DIR/debug/examples/v5r2_pop_encode" \
              --driver "$CARGO_TARGET_DIR/debug/examples/pq-tx-parity" \
              --cache-driver "$CARGO_TARGET_DIR/debug/examples/lms_fee_cache_fixture" \
              --output "artifacts/context/r2-fee-pop$role"
          done
          mkdir -p artifacts/context/r2-fee-prepare/native
          ln artifacts/context/r2-fee-auth/native/PUBLIC-TEST-ONLY-lms-tree \
            artifacts/context/r2-fee-prepare/native/PUBLIC-TEST-ONLY-lms-tree
          cargo build --manifest-path tosctl/src/Cargo.toml --locked -p contracts \
            --example lms_fee_cache_fixture --features native-wallet-signer
          python test/wallet-v5r2/sdk_auth_parity.py --require-native-fee-signer \
            --native-signer "$CARGO_TARGET_DIR/debug/examples/public_fixture" \
            --auth-driver "$CARGO_TARGET_DIR/debug/examples/v5r2_auth_encode" \
            --pop-driver "$CARGO_TARGET_DIR/debug/examples/v5r2_pop_encode" \
            --preparation-driver "$CARGO_TARGET_DIR/debug/examples/v5r2_prepare_encode" \
            --fee-driver "$CARGO_TARGET_DIR/debug/examples/v5r2_fee_encode" \
            --genesis-driver "$CARGO_TARGET_DIR/debug/examples/v5r2_genesis_encode" \
            --driver "$CARGO_TARGET_DIR/debug/examples/pq-tx-parity" \
            --cache-driver "$CARGO_TARGET_DIR/debug/examples/lms_fee_cache_fixture" \
            --output artifacts/context/r2-fee-prepare
      - name: Encrypted fee custody matches executed recovery messages
        run: |
          python test/wallet-v5r2/recorded_fee_custody.py \
            --fixtures artifacts/context/r2-fee-prepare/native \
            --output artifacts/context/r2-recorded-fee-custody --controls
      - name: Initial wallet preparation CLI controls
        run: |
          python test/wallet-v5r2/cli_prepare_controls.py \
            --cli "$CARGO_TARGET_DIR/debug/tosctl" \
            --genesis-driver "$CARGO_TARGET_DIR/debug/examples/v5r2_genesis_encode" \
            --fixture artifacts/context/r2-fee-prepare/native/sdk-genesis.json \
            --output artifacts/context/cli-prepare-controls
      - name: Initial primary signing CLI retirement controls
        run: |
          python test/wallet-v5r2/cli_primary_controls.py \
            --cli "$CARGO_TARGET_DIR/debug/tosctl" \
            --genesis-driver "$CARGO_TARGET_DIR/debug/examples/v5r2_genesis_encode" \
            --fixture artifacts/context/r2-fee-prepare/native/sdk-genesis.json \
            --output artifacts/context/cli-primary-controls
      - name: PRIMARY CLI recipient delivery and receipt controls
        run: |
          python test/wallet-v5r2/cli_delivery_controls.py \
            --cli "$CARGO_TARGET_DIR/debug/tosctl" \
            --genesis-driver "$CARGO_TARGET_DIR/debug/examples/v5r2_genesis_encode" \
            --fixture artifacts/context/r2-fee-prepare/native/sdk-genesis.json \
            --output artifacts/context/cli-delivery-controls
      - name: SLH lock CLI native execution and action controls
        run: |
          python test/wallet-v5r2/cli_lock_controls.py \
            --cli "$CARGO_TARGET_DIR/debug/tosctl" \
            --genesis-driver "$CARGO_TARGET_DIR/debug/examples/v5r2_genesis_encode" \
            --fixture artifacts/context/r2-fee-prepare/native/sdk-genesis.json \
            --output artifacts/context/cli-lock-controls
      - name: Initial wallet inspection proof-binding controls
        run: |
          python test/wallet-v5r2/cli_inspect_controls.py \
            --cli "$CARGO_TARGET_DIR/debug/tosctl" \
            --fixture artifacts/context/r2-fee-prepare/native/sdk-genesis.json \
            --output artifacts/context/cli-inspect-controls
      - name: Initial manifest CLI restoration controls
        run: |
          python test/wallet-v5r2/cli_initial_controls.py \
            --cli "$CARGO_TARGET_DIR/debug/tosctl" \
            --genesis-driver "$CARGO_TARGET_DIR/debug/examples/v5r2_genesis_encode" \
            --fixture artifacts/context/r2-fee-prepare/native/sdk-genesis.json \
            --output artifacts/context/cli-initial-controls
      - name: Initial fee custody CLI recovery and controls
        run: |
          python test/wallet-v5r2/fee_recovery_fixture.py --output artifacts/context/fee-recovery-fixture
          cmp artifacts/context/fee-recovery-fixture/native-fee-recovery.json tosctl/src/wallet-pq-signer/tests/fixtures/native-fee-recovery.json
          python test/wallet-v5r2/cli_fee_restore.py \
            --cli "$CARGO_TARGET_DIR/debug/tosctl" \
            --fixture artifacts/context/r2-fee-prepare/native/sdk-genesis.json \
            --public-tree artifacts/context/fee-recovery-fixture/PUBLIC-TEST-ONLY-tree \
            --output artifacts/context/cli-fee-restore
          python test/wallet-v5r2/cli_fee_controls.py \
            --cli "$CARGO_TARGET_DIR/debug/tosctl" \
            --fixture artifacts/context/r2-fee-prepare/native/sdk-genesis.json \
            --public-tree artifacts/context/fee-recovery-fixture/PUBLIC-TEST-ONLY-tree \
            --output artifacts/context/cli-fee-controls
      - name: Fee session restore barrier and exclusive ownership controls
        run: |
          python test/wallet-v5r2/cli_fee_session_controls.py \
            --cli "$CARGO_TARGET_DIR/debug/tosctl" \
            --fixture artifacts/context/r2-fee-prepare/native/sdk-genesis.json \
            --fee-session-tree artifacts/context/r2-fee-prepare/native/PUBLIC-TEST-ONLY-lms-tree \
            --output artifacts/context/cli-fee-session-controls
      - name: Fee session abrupt export crash and native funded lock controls
        run: |
          python test/wallet-v5r2/cli_fee_session_crash_controls.py \
            --cli "$CARGO_TARGET_DIR/debug/tosctl" \
            --genesis-driver "$CARGO_TARGET_DIR/debug/examples/v5r2_genesis_encode" \
            --fixture artifacts/context/r2-fee-prepare/native/sdk-genesis.json \
            --fee-session-tree artifacts/context/fee-recovery-fixture/PUBLIC-TEST-ONLY-tree \
            --output artifacts/context/cli-fee-session-crash-controls
      - name: Fee session dual-role POP and challenge controls
        run: |
          python test/wallet-v5r2/cli_fee_pop_controls.py \
            --cli "$CARGO_TARGET_DIR/debug/tosctl" \
            --genesis-driver "$CARGO_TARGET_DIR/debug/examples/v5r2_genesis_encode" \
            --fixture artifacts/context/r2-fee-prepare/native/sdk-genesis.json \
            --fee-session-tree artifacts/context/fee-recovery-fixture/PUBLIC-TEST-ONLY-tree \
            --output artifacts/context/cli-fee-pop-controls
      - name: POP receipt CLI authenticated history and binding controls
        run: |
          python test/wallet-v5r2/cli_pop_receipt_controls.py \
            --cli "$CARGO_TARGET_DIR/debug/tosctl" \
            --genesis-driver "$CARGO_TARGET_DIR/debug/examples/v5r2_genesis_encode" \
            --fixture artifacts/context/r2-fee-prepare/native/sdk-genesis.json \
            --fee-session-tree artifacts/context/fee-recovery-fixture/PUBLIC-TEST-ONLY-tree \
            --output artifacts/context/cli-pop-receipt-controls
      - name: Fee session successor preparation and deployment controls
        run: |
          python test/wallet-v5r2/cli_fee_prepare_controls.py \
            --cli "$CARGO_TARGET_DIR/debug/tosctl" \
            --genesis-driver "$CARGO_TARGET_DIR/debug/examples/v5r2_genesis_encode" \
            --fixture artifacts/context/r2-fee-prepare/native/sdk-genesis.json \
            --fee-session-tree artifacts/context/fee-recovery-fixture/PUBLIC-TEST-ONLY-tree \
            --output artifacts/context/cli-fee-prepare-controls
      - name: Successor fee tree and funded POP lifecycle controls
        run: |
          python test/wallet-v5r2/fee_recovery_fixture.py \
            --vector-index 0 \
            --tree-id a6a6a6a6a6a6a6a6a6a6a6a6a6a6a6a6a6a6a6a6a6a6a6a6a6a6a6a6a6a6a6a6 \
            --output artifacts/context/successor-fee-recovery-fixture
          python test/wallet-v5r2/cli_successor_pop_controls.py \
            --cli "$CARGO_TARGET_DIR/debug/tosctl" \
            --genesis-driver "$CARGO_TARGET_DIR/debug/examples/v5r2_genesis_encode" \
            --fixture artifacts/context/r2-fee-prepare/native/sdk-genesis.json \
            --fee-session-tree artifacts/context/fee-recovery-fixture/PUBLIC-TEST-ONLY-tree \
            --successor-fee-fixture artifacts/context/successor-fee-recovery-fixture \
            --output artifacts/context/cli-successor-pop-controls
      - name: Reject active LMS key reuse in successor routes
        run: |
          python test/wallet-v5r2/fresh_fee_controls.py \
            --cli "$CARGO_TARGET_DIR/debug/tosctl" \
            --genesis-driver "$CARGO_TARGET_DIR/debug/examples/v5r2_genesis_encode" \
            --fixture artifacts/context/r2-fee-prepare/native/sdk-genesis.json \
            --fee-session-tree artifacts/context/fee-recovery-fixture/PUBLIC-TEST-ONLY-tree \
            --successor-fee-fixture artifacts/context/successor-fee-recovery-fixture \
            --output artifacts/context/fresh-fee-controls
      - name: Joint fee sessions and native client migration controls
        run: |
          python test/wallet-v5r2/cli_migration_controls.py \
            --cli "$CARGO_TARGET_DIR/debug/tosctl" \
            --genesis-driver "$CARGO_TARGET_DIR/debug/examples/v5r2_genesis_encode" \
            --fixture artifacts/context/r2-fee-prepare/native/sdk-genesis.json \
            --fee-session-tree artifacts/context/fee-recovery-fixture/PUBLIC-TEST-ONLY-tree \
            --successor-fee-fixture artifacts/context/successor-fee-recovery-fixture \
            --output artifacts/context/cli-migration-controls
      - name: Compiled-code manifest reconstruction controls
        run: |
          python test/wallet-v5r2/manifest_integration_controls.py \
            --driver "$CARGO_TARGET_DIR/debug/examples/v5r2_genesis_encode" \
            --fixture artifacts/context/r2-fee-prepare/native/sdk-genesis.json \
            --output artifacts/context/manifest-integration-controls
      - name: Verify gated migration signature was actually executed
        run: |
          python test/wallet-v5r2/recorded_migration_control.py \
            --fixtures artifacts/context/r2-fee-prepare/native \
            --submission artifacts/context/r2-fee-prepare/native/recovery/sdk-migration.boc \
            --output artifacts/context/r2-gated-migration-control
      - name: Reject corrupt primary POP before migration
        run: |
          python test/wallet-v5r2/dual_pop_control.py \
            --baseline artifacts/context/r2-fee-prepare \
            --native-signer "$CARGO_TARGET_DIR/debug/examples/public_fixture" \
            --output artifacts/context/r2-dual-pop-rejection
      - name: Receipt-checked native transaction timing smoke
        run: |
          python test/wallet-v5r2/test_benchmark_transactions.py
          python test/wallet-v5r2/recorded_admission.py \
            --fixtures artifacts/context/r2-fee-prepare \
            --driver "$CARGO_TARGET_DIR/debug/examples/pq-tx-parity" \
            --output artifacts/context/r2-recorded-admission
          python test/wallet-v5r2/benchmark_transactions.py \
            --fixtures artifacts/context/r2-fee-prepare \
            --output artifacts/context/r2-native-timing --iterations 10 --warmup 2
          python test/wallet-v5r2/default_credit_timing.py \
            --fixtures artifacts/context/r2-fee-prepare \
            --driver "$CARGO_TARGET_DIR/debug/examples/pq-tx-parity" \
            --output artifacts/context/r2-default-credit-timing --iterations 10
          python test/wallet-v5r2/test_admission_forgery_timing.py
          python test/wallet-v5r2/admission_forgery_timing.py \
            --fixtures artifacts/context/r2-fee-prepare \
            --driver "$CARGO_TARGET_DIR/debug/examples/pq-tx-parity" \
            --output artifacts/context/r2-admission-forgery-timing --variants 8 --iterations 10
          python test/wallet-v5r2/admission_envelope_probe.py \
            --fixtures artifacts/context/r2-fee-prepare \
            --driver "$CARGO_TARGET_DIR/debug/examples/pq-tx-parity" \
            --output artifacts/context/r2-admission-envelope-probe --iterations 10
      - name: Native ingress parser boundary controls
        run: |
          cmake --build build --target test-ext-message-pool -j2
          build/test-ext-message-pool
          python test/wallet-v5r2/admission_budget_controls.py --build build --pool-controls \
            --output artifacts/context/r2-admission-byte-budget-controls
          python test/wallet-v5r2/ingress_boundary_controls.py --build build \
            --output artifacts/context/r2-ingress-boundary-controls
          cmake --build build --target test-ext-message-ingress-fixtures -j2
          python test/wallet-v5r2/test_ingress_fixture_probe.py
          python test/wallet-v5r2/ingress_fixture_probe.py \
            --fixtures artifacts/context/r2-fee-prepare \
            --envelopes artifacts/context/r2-admission-envelope-probe \
            --driver build/test-ext-message-ingress-fixtures \
            --output artifacts/context/r2-ingress-fixture-probe --iterations 10
      - name: Native LMS chain buffer sensitivity
        if: matrix.runner == 'ubuntu-24.04'
        run: |
          python test/wallet-v5r2/lms_buffer_controls.py --build build \
            --fixtures artifacts/context/r2-fee-prepare \
            --output artifacts/context/r2-lms-buffer-controls
      - name: Receipt-bound module rent invariant
        run: |
          python test/wallet-v5r2/module_rent_control.py \
            --baseline artifacts/context/r2-fee-prepare/native \
            --output artifacts/context/r2-fee-prepare/module-rent-control.json
      - name: Preparation fee admission deletion controls
        if: matrix.runner == 'ubuntu-24.04'
        run: |
          python test/wallet-v5r2/preparation_fee_controls.py \
            --baseline artifacts/context/r2-fee-prepare \
            --output artifacts/context/r2-fee-prepare-controls
      - name: Recovery state transition deletion controls
        if: matrix.runner == 'ubuntu-24.04'
        run: |
          python test/wallet-v5r2/recovery_controls.py \
            --baseline artifacts/context/r2-fee-prepare \
            --output artifacts/context/r2-recovery-controls
      - name: Real cached signature verification deletion control
        if: matrix.runner == 'ubuntu-24.04'
        run: |
          python test/wallet-v5r2/cache_verification_control.py --native-fee-signer \
            --baseline artifacts/context/r2-fee-auth/native/sdk-cache \
            --driver "$CARGO_TARGET_DIR/debug/examples/lms_fee_cache_fixture" \
            --output artifacts/context/r2-cache-verification-control
      - name: Full fee verification deletion control
        if: matrix.runner == 'ubuntu-24.04'
        run: |
          python test/wallet-v5r2/fee_tx_mutation.py \
            --artifacts artifacts/context/r2-fee-auth --target "$CARGO_TARGET_DIR"
      - name: Verify context, opcode, complete transactions and legacy pricing
        run: |
          build/crypto/tlbc -q crypto/block/block.tlb crypto/smartcont/wallet-v5r2-rescue.tlb
          python test/rescue-fee-gate/test_context_admission.py \
            --cpp build/crypto/pq/test-fee-native-cost \
            --rust "$CARGO_TARGET_DIR/debug/examples/fee-native-cost" \
            --rust-tx "$CARGO_TARGET_DIR/debug/examples/pq-tx-parity" --output artifacts/context
          build/crypto/pq/test-pq-suite-parity test/rescue-fee-gate/suite-scenarios.tsv > artifacts/context/legacy-cpp.tsv
          "$CARGO_TARGET_DIR/debug/examples/suite-parity" test/rescue-fee-gate/suite-scenarios.tsv > artifacts/context/legacy-rust.tsv
          python test/rescue-fee-gate/compare.py test/rescue-fee-gate/suite-scenarios.tsv \
            artifacts/context/legacy-cpp.tsv artifacts/context/legacy-rust.tsv test/rescue-fee-gate/suite-expected.tsv
          cargo test --manifest-path tosctl/src/Cargo.toml --locked -p tos_vm --lib incoming_storage_context_is_versioned_and_optional
          cargo test --manifest-path tosctl/src/Cargo.toml --locked -p tos_assembler --lib lms_fee_hash_mnemonic_round_trip
          cargo test --manifest-path tosctl/src/Cargo.toml --locked -p tos_executor --lib
      - name: Require meaningful mutation failures and restore binaries
        if: matrix.runner == 'ubuntu-24.04'
        run: |
          python test/rescue-fee-gate/context_mutations.py --artifacts artifacts/context --target "$CARGO_TARGET_DIR"
          python test/rescue-fee-gate/context_transactions.py --output artifacts/context \
            --rust "$CARGO_TARGET_DIR/debug/examples/pq-tx-parity"
          git diff --exit-code
      - name: Record exact source and public evidence hashes
        if: always()
        run: |
          mkdir -p artifacts/context
          git rev-parse HEAD > artifacts/context/source-commit.txt
          uname -a > artifacts/context/platform.txt
          find artifacts/context -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > artifacts/context/SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: rescue-context-${{ matrix.runner }}
          path: |
            artifacts/context
            !artifacts/context/**/PUBLIC-TEST-ONLY-lms-tree
            !artifacts/context/**/PUBLIC-TEST-ONLY-successor-tree
          retention-days: 14
