name: Experimental rescue context parity

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/rescue-context.yml'
      - 'scripts/build-wallet-quantum-bundle.py'
      - 'LICENSE'
      - 'THIRD_PARTY_NOTICES.md'
      - 'doc/tvm-lms-fee-hash.md'
      - 'doc/auth-policy-v1.md'
      - 'test/pq-mldsa44/fixtures.json'
      - 'test/pq-falcon512/vectors.json'
      - 'crypto/block/block.tlb'
      - 'crypto/block/create-state.cpp'
      - 'crypto/block/mc-config.*'
      - 'crypto/block/transaction.*'
      - 'crypto/smc-envelope/SmartContract.cpp'
      - 'crypto/vm/**'
      - 'crypto/pq/**'
      - 'crypto/fift/**'
      - 'crypto/func/**'
      - 'crypto/smartcont/**'
      - 'crypto/CMakeLists.txt'
      - 'CMakeLists.txt'
      - 'emulator/**'
      - 'third-party/slhdsa-c/**'
      - 'third-party/mldsa-native/**'
      - 'third-party/lms-reference/**'
      - 'tosctl/src/**'
      - 'test/auth-extensions/**'
      - 'test/rescue-fee-gate/**'
      - 'test/wallet-quantum/**'
      - 'test/test-ext-message-ingress.cpp'
      - 'test/test-ext-message-ingress-fixtures.cpp'
      - 'test/test-ext-message-admission-budget.cpp'
      - 'test/test-ext-message-pool.cpp'
      - 'validator/impl/ext-message-*'
      - 'validator/impl/external-message*'
      - 'validator/impl/CMakeLists.txt'

permissions:
  contents: read

concurrency:
  group: rescue-context-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  parity:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            timeout_minutes: 150
          - runner: ubuntu-24.04-arm
            timeout_minutes: 180
    runs-on: ${{ matrix.runner }}
    # Leave ARM headroom for repeated H20 rebuilds and the final native ingress build.
    timeout-minutes: ${{ matrix.timeout_minutes }}
    env:
      TOS_ROOT: ${{ github.workspace }}
      CARGO_TARGET_DIR: ${{ github.workspace }}/build-cargo
      FUNC_PATH: ${{ github.workspace }}/build/crypto/func
      FIFT_PATH: ${{ github.workspace }}/build/crypto/fift
      EMULATOR_PATH: ${{ github.workspace }}/build/emulator/libemulator.so
      SLH_TOOL: ${{ github.workspace }}/build-signers/slh_tool
      MLDSA_TOOL: ${{ github.workspace }}/build-signers/mldsa_tool
      LMS_TOOL: ${{ github.workspace }}/build-signers/lms_tool
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
      - name: Install Python corpus dependency
        run: python -m pip install cryptography==46.0.4
      - name: Install pinned Rust toolchain
        run: scripts/install-rust-toolchain.sh
      - name: Build native Release tools and both Rust drivers
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build --target func fift tlbc create-state emulator test-fee-native-cost test-pq-suite-parity test-pq-falcon512-parity test-wallet-pq-signer-fixture -j2
          sh test/rescue-fee-gate/tools/build.sh build-signers
          cargo build --manifest-path tosctl/src/Cargo.toml --locked -p tos_vm -p tos_executor \
            --example fee-native-cost --example suite-parity --example falcon-parity --example pq-tx-parity
          cargo build --manifest-path tosctl/src/Cargo.toml --locked -p contracts \
            --example lms_fee_cache_fixture --example quantum_auth_encode --example quantum_pop_encode --example quantum_prepare_encode --example quantum_fee_encode --example quantum_genesis_encode
      - name: Generated admission configuration loading
        run: |
          python test/wallet-quantum/test_recorded_admission.py
          python test/wallet-quantum/admission_config_controls.py --output-dir artifacts/context/quantum-generated-config
      - name: Whole transactions using the generated admission configuration
        run: |
          python test/wallet-quantum/release_config_transactions.py \
            --config artifacts/context/quantum-generated-config/restored-config.boc \
            --driver "$CARGO_TARGET_DIR/debug/examples/pq-tx-parity" \
            --output artifacts/context/quantum-release-transactions
      - name: Reproducible code and interface review bundle
        run: |
          python test/wallet-quantum/release_bundle_controls.py \
            --config artifacts/context/quantum-generated-config/restored-config.boc \
            --expected-manifest test/wallet-quantum/review-candidate-manifest.json \
            --output artifacts/context/quantum-review-bundle
      - name: Generated-config transaction sensitivity controls
        if: matrix.runner == 'ubuntu-24.04'
        run: |
          python test/wallet-quantum/release_config_controls.py \
            --config artifacts/context/quantum-generated-config/restored-config.boc \
            --driver "$CARGO_TARGET_DIR/debug/examples/pq-tx-parity" \
            --output artifacts/context/quantum-release-transaction-controls
      - name: Full wallet flows on the generated candidate configuration
        run: |
          candidate_controls=()
          if [ '${{ matrix.runner }}' = ubuntu-24.04 ]; then candidate_controls=(--controls); fi
          python test/wallet-quantum/release_wallet_corpus.py \
            --config artifacts/context/quantum-generated-config/restored-config.boc \
            --driver "$CARGO_TARGET_DIR/debug/examples/pq-tx-parity" \
            --output artifacts/context/quantum-release-wallet "${candidate_controls[@]}"
      - name: PRIMARY wallet and recipient execution on the unchanged candidate
        run: |
          python test/wallet-quantum/module_tx_parity.py \
            --chain-config artifacts/context/quantum-generated-config/restored-config.boc \
            --native-signer build/crypto/pq/test-wallet-pq-signer-fixture \
            --driver "$CARGO_TARGET_DIR/debug/examples/pq-tx-parity" \
            --output artifacts/context/quantum-release-primary
      - name: Account-funded execution after ACCEPT
        run: |
          python test/wallet-quantum/post_accept_transactions.py \
            --config artifacts/context/quantum-generated-config/restored-config.boc \
            --driver "$CARGO_TARGET_DIR/debug/examples/pq-tx-parity" \
            --output artifacts/context/quantum-post-accept
      - name: SDK deployment and native cached recovery on generated configuration
        run: |
          cargo build --manifest-path tosctl/src/Cargo.toml --locked -p contracts \
            --features native-wallet-signer --example lms_fee_cache_fixture \
            --example quantum_genesis_encode --example quantum_fee_encode --example quantum_prepare_encode
          python test/wallet-quantum/release_sdk_recovery.py \
            --config artifacts/context/quantum-generated-config/restored-config.boc \
            --examples "$CARGO_TARGET_DIR/debug/examples" --output artifacts/context/quantum-release-sdk
      - name: Configured SDK fee-route identity controls
        if: matrix.runner == 'ubuntu-24.04'
        run: |
          python test/wallet-quantum/sdk_route_controls.py \
            --fixtures artifacts/context/quantum-release-sdk/transactions/native \
            --examples "$CARGO_TARGET_DIR/debug/examples" --output artifacts/context/quantum-release-sdk-controls
      - name: PQ-only native wallet signer and fault controls
        run: |
          python test/wallet-quantum/pq_signer_controls.py --build build --output artifacts/context/wallet-pq-signer
          python test/wallet-quantum/pq_signer_controls.py --c-api --build build --output artifacts/context/wallet-pq-signer-c
      - name: Rust native wallet signer and proven-key controls
        run: |
          cargo build --manifest-path tosctl/src/Cargo.toml --locked -p wallet-pq-signer --example public_fixture
          cargo test --manifest-path tosctl/src/Cargo.toml --locked -p wallet-pq-signer
          python test/wallet-quantum/native_fee_verify_controls.py --output artifacts/context/native-fee-verify-controls
          python test/wallet-quantum/native_fee_sign_controls.py --output artifacts/context/native-fee-sign-controls
          python test/wallet-quantum/native_fee_journal_controls.py --output artifacts/context/native-fee-journal-controls
          python test/wallet-quantum/fee_seed_binding_controls.py --output artifacts/context/fee-seed-binding-controls
          python test/wallet-quantum/fee_vault_controls.py --output artifacts/context/fee-vault-controls
          python test/wallet-quantum/fee_recovery_controls.py --output artifacts/context/fee-recovery-controls
          python test/wallet-quantum/manifest_fee_controls.py --output artifacts/context/manifest-fee-controls
          python test/wallet-quantum/fee_rebuild_controls.py --output artifacts/context/fee-rebuild-controls
          cargo test --manifest-path tosctl/src/Cargo.toml --locked -p contracts --features native-wallet-vault --lib fee_mnemonic_rebuilds_tree_cache_and_encrypted_custody -- --ignored
          python test/wallet-quantum/fee_tree_controls.py --output artifacts/context/fee-tree-controls
          python test/wallet-quantum/fee_tree_cache_controls.py --output artifacts/context/fee-tree-cache-controls
          cargo test --manifest-path tosctl/src/Cargo.toml --locked -p contracts --features native-wallet-signer --lib internal_fee_signature_matches_independent_vm
          python test/wallet-quantum/kdf_controls.py --output artifacts/context/wallet-kdf-controls
          cargo test --manifest-path tosctl/src/Cargo.toml --locked -p tos-native-mnemonic
          python test/wallet-quantum/mnemonic_vector_check.py
          python test/wallet-quantum/mnemonic_controls.py --output artifacts/context/native-mnemonic-controls
          cargo test --manifest-path tosctl/src/Cargo.toml --locked -p wallet-pq-signer --features vault --lib vault::mnemonic_tests
          cargo test --manifest-path tosctl/src/Cargo.toml --locked -p contracts --features native-wallet-signer --lib fee_state_tests
          python test/wallet-quantum/rust_signer_controls.py --output artifacts/context/rust-wallet-signer-controls
          python test/wallet-quantum/vault_signer_controls.py --output artifacts/context/vault-wallet-signer-controls
          cargo test --manifest-path tosctl/src/Cargo.toml --locked -p secrets-vault --lib storage::
          python test/wallet-quantum/vault_persistence_controls.py --output artifacts/context/vault-persistence-controls
          python test/wallet-quantum/vault_ownership_controls.py --output artifacts/context/vault-ownership-controls
          python test/wallet-quantum/vault_creation_controls.py --output artifacts/context/vault-creation-controls
          python test/wallet-quantum/vault_restore_controls.py --output artifacts/context/vault-restore-controls
          python test/wallet-quantum/proven_vault_controls.py --output artifacts/context/proven-vault-controls
          python test/wallet-quantum/vault_recovery_controls.py --output artifacts/context/vault-recovery-controls
          python test/wallet-quantum/vault_pop_controls.py --output artifacts/context/vault-pop-controls
          python test/wallet-quantum/migration_signing_controls.py --output artifacts/context/migration-signing-controls
          python test/wallet-quantum/fee_rollover_controls.py --output artifacts/context/fee-rollover-controls
      - name: PQ custody restore CLI and protected input controls
        run: |
          cargo build --manifest-path tosctl/src/Cargo.toml --locked -p tosctl --features pq-wallet
          cargo test --manifest-path tosctl/src/Cargo.toml --locked -p secrets-vault --lib secret_input::
          python test/wallet-quantum/cli_restore.py --cli "$CARGO_TARGET_DIR/debug/tosctl" --output artifacts/context/pq-cli-restore
          python test/wallet-quantum/cli_restore_controls.py --cli "$CARGO_TARGET_DIR/debug/tosctl" --output artifacts/context/pq-cli-controls
          python test/wallet-quantum/cli_create.py --cli "$CARGO_TARGET_DIR/debug/tosctl" --output artifacts/context/pq-cli-create
          python test/wallet-quantum/cli_create_controls.py --cli "$CARGO_TARGET_DIR/debug/tosctl" --output artifacts/context/pq-cli-create-controls
      - name: Fee signer scheduling boundaries and deletion controls
        run: |
          python test/wallet-quantum/fee_schedule_controls.py --output artifacts/context/fee-schedule
          # Keep fork/exec handoff separate from immediate journal reopen probes.
          cargo test --manifest-path tosctl/src/Cargo.toml --locked -p contracts --lib lms_fee_ -- --test-threads=1
      - name: PQ-only wallet SDK wire vectors
        run: |
          python test/wallet-quantum/sdk_auth_vectors.py --output /tmp/quantum-auth-vectors.json
          cmp /tmp/quantum-auth-vectors.json tosctl/src/node-control/contracts/tests/fixtures/quantum/auth-wire.json
          python test/wallet-quantum/sdk_pop_vectors.py --output /tmp/quantum-pop-vectors.json
          cmp /tmp/quantum-pop-vectors.json tosctl/src/node-control/contracts/tests/fixtures/quantum/pop-wire.json
          python test/wallet-quantum/sdk_prepare_vectors.py --output /tmp/quantum-prepare-vectors.json
          cmp /tmp/quantum-prepare-vectors.json tosctl/src/node-control/contracts/tests/fixtures/quantum/prepare-wire.json
          python test/wallet-quantum/sdk_fee_vectors.py --output /tmp/quantum-fee-vectors.json
          cmp /tmp/quantum-fee-vectors.json tosctl/src/node-control/contracts/tests/fixtures/quantum/fee-wire.json
          python test/wallet-quantum/sdk_genesis_vectors.py --output /tmp/quantum-genesis-vectors.json
          cmp /tmp/quantum-genesis-vectors.json tosctl/src/node-control/contracts/tests/fixtures/quantum/genesis-wire.json
          python test/wallet-quantum/sdk_genesis_vectors.py --successor --output /tmp/quantum-successor-vectors.json
          cmp /tmp/quantum-successor-vectors.json tosctl/src/node-control/contracts/tests/fixtures/quantum/successor-wire.json
          cargo test --manifest-path tosctl/src/Cargo.toml --locked -p contracts --lib wallet_quantum
      - name: Initial recovery manifest semantic controls
        run: |
          python test/wallet-quantum/manifest_controls.py --output artifacts/context/initial-manifest-controls
          python test/wallet-quantum/manifest_recovery_controls.py --output artifacts/context/manifest-recovery-controls
          python test/wallet-quantum/manifest_vault_controls.py --output artifacts/context/manifest-vault-controls
      - name: Wallet SDK semantic deletion controls
        if: matrix.runner == 'ubuntu-24.04'
        run: |
          python test/wallet-quantum/sdk_auth_controls.py --output artifacts/context/auth-sdk-controls
          python test/wallet-quantum/sdk_auth_controls.py --pop --output artifacts/context/pop-sdk-controls
          python test/wallet-quantum/sdk_auth_controls.py --prepare --output artifacts/context/prepare-sdk-controls
          python test/wallet-quantum/sdk_auth_controls.py --fee --output artifacts/context/fee-sdk-controls
          python test/wallet-quantum/cached_fee_decode_controls.py --output artifacts/context/fee-cached-decode-controls
          python test/wallet-quantum/sdk_auth_controls.py --genesis --output artifacts/context/genesis-sdk-controls
      - name: Durable fee reservation deletion controls
        if: matrix.runner == 'ubuntu-24.04'
        run: |
          python test/wallet-quantum/fee_journal_controls.py --output artifacts/context/fee-journal
      - name: PQ-only complete receiver delivery
        run: |
          python test/wallet-quantum/module_tx_parity.py \
            --native-signer build/crypto/pq/test-wallet-pq-signer-fixture \
            --driver "$CARGO_TARGET_DIR/debug/examples/pq-tx-parity" \
            --output artifacts/context/quantum-module
          python test/wallet-quantum/test_pop.py --output artifacts/context/quantum-pop
          python test/wallet-quantum/test_preparation.py --output artifacts/context/quantum-preparation \
            --rust-driver "$CARGO_TARGET_DIR/debug/examples/pq-tx-parity"
      - name: Full R2 fee transaction parity at diagnostic credit
        run: |
          python test/wallet-quantum/fee_tx_parity.py \
            --driver "$CARGO_TARGET_DIR/debug/examples/pq-tx-parity" \
            --cache-driver "$CARGO_TARGET_DIR/debug/examples/lms_fee_cache_fixture" \
            --output artifacts/context/quantum-fee-auth
          for role in 1 2; do
            mkdir -p "artifacts/context/quantum-fee-pop$role/native"
            ln artifacts/context/quantum-fee-auth/native/PUBLIC-TEST-ONLY-lms-tree \
              "artifacts/context/quantum-fee-pop$role/native/PUBLIC-TEST-ONLY-lms-tree"
            python test/wallet-quantum/sdk_auth_parity.py --pop-role "$role" \
              --native-signer "$CARGO_TARGET_DIR/debug/examples/public_fixture" \
              --auth-driver "$CARGO_TARGET_DIR/debug/examples/quantum_auth_encode" \
              --pop-driver "$CARGO_TARGET_DIR/debug/examples/quantum_pop_encode" \
              --driver "$CARGO_TARGET_DIR/debug/examples/pq-tx-parity" \
              --cache-driver "$CARGO_TARGET_DIR/debug/examples/lms_fee_cache_fixture" \
              --output "artifacts/context/quantum-fee-pop$role"
          done
          mkdir -p artifacts/context/quantum-fee-prepare/native
          ln artifacts/context/quantum-fee-auth/native/PUBLIC-TEST-ONLY-lms-tree \
            artifacts/context/quantum-fee-prepare/native/PUBLIC-TEST-ONLY-lms-tree
          cargo build --manifest-path tosctl/src/Cargo.toml --locked -p contracts \
            --example lms_fee_cache_fixture --features native-wallet-signer
          python test/wallet-quantum/sdk_auth_parity.py --require-native-fee-signer \
            --native-signer "$CARGO_TARGET_DIR/debug/examples/public_fixture" \
            --auth-driver "$CARGO_TARGET_DIR/debug/examples/quantum_auth_encode" \
            --pop-driver "$CARGO_TARGET_DIR/debug/examples/quantum_pop_encode" \
            --preparation-driver "$CARGO_TARGET_DIR/debug/examples/quantum_prepare_encode" \
            --fee-driver "$CARGO_TARGET_DIR/debug/examples/quantum_fee_encode" \
            --genesis-driver "$CARGO_TARGET_DIR/debug/examples/quantum_genesis_encode" \
            --driver "$CARGO_TARGET_DIR/debug/examples/pq-tx-parity" \
            --cache-driver "$CARGO_TARGET_DIR/debug/examples/lms_fee_cache_fixture" \
            --output artifacts/context/quantum-fee-prepare
      - name: Encrypted fee custody matches executed recovery messages
        run: |
          python test/wallet-quantum/recorded_fee_custody.py \
            --fixtures artifacts/context/quantum-fee-prepare/native \
            --output artifacts/context/quantum-recorded-fee-custody --controls
      - name: Initial wallet preparation CLI controls
        run: |
          python test/wallet-quantum/cli_prepare_controls.py \
            --cli "$CARGO_TARGET_DIR/debug/tosctl" \
            --genesis-driver "$CARGO_TARGET_DIR/debug/examples/quantum_genesis_encode" \
            --fixture artifacts/context/quantum-fee-prepare/native/sdk-genesis.json \
            --output artifacts/context/cli-prepare-controls
      - name: Initial primary signing CLI retirement controls
        run: |
          python test/wallet-quantum/cli_primary_controls.py \
            --cli "$CARGO_TARGET_DIR/debug/tosctl" \
            --genesis-driver "$CARGO_TARGET_DIR/debug/examples/quantum_genesis_encode" \
            --fixture artifacts/context/quantum-fee-prepare/native/sdk-genesis.json \
            --output artifacts/context/cli-primary-controls
      - name: PRIMARY CLI recipient delivery and receipt controls
        run: |
          python test/wallet-quantum/cli_delivery_controls.py \
            --cli "$CARGO_TARGET_DIR/debug/tosctl" \
            --genesis-driver "$CARGO_TARGET_DIR/debug/examples/quantum_genesis_encode" \
            --fixture artifacts/context/quantum-fee-prepare/native/sdk-genesis.json \
            --output artifacts/context/cli-delivery-controls
      - name: SLH lock CLI native execution and action controls
        run: |
          python test/wallet-quantum/cli_lock_controls.py \
            --cli "$CARGO_TARGET_DIR/debug/tosctl" \
            --genesis-driver "$CARGO_TARGET_DIR/debug/examples/quantum_genesis_encode" \
            --fixture artifacts/context/quantum-fee-prepare/native/sdk-genesis.json \
            --output artifacts/context/cli-lock-controls
      - name: Initial wallet inspection proof-binding controls
        run: |
          python test/wallet-quantum/cli_inspect_controls.py \
            --cli "$CARGO_TARGET_DIR/debug/tosctl" \
            --fixture artifacts/context/quantum-fee-prepare/native/sdk-genesis.json \
            --output artifacts/context/cli-inspect-controls
      - name: Initial manifest CLI restoration controls
        run: |
          python test/wallet-quantum/cli_initial_controls.py \
            --cli "$CARGO_TARGET_DIR/debug/tosctl" \
            --genesis-driver "$CARGO_TARGET_DIR/debug/examples/quantum_genesis_encode" \
            --fixture artifacts/context/quantum-fee-prepare/native/sdk-genesis.json \
            --output artifacts/context/cli-initial-controls
      - name: Initial fee custody CLI recovery and controls
        run: |
          python test/wallet-quantum/fee_recovery_fixture.py --output artifacts/context/fee-recovery-fixture
          cmp artifacts/context/fee-recovery-fixture/native-fee-recovery.json tosctl/src/wallet-pq-signer/tests/fixtures/native-fee-recovery.json
          python test/wallet-quantum/cli_fee_restore.py \
            --cli "$CARGO_TARGET_DIR/debug/tosctl" \
            --fixture artifacts/context/quantum-fee-prepare/native/sdk-genesis.json \
            --public-tree artifacts/context/fee-recovery-fixture/PUBLIC-TEST-ONLY-tree \
            --output artifacts/context/cli-fee-restore
          python test/wallet-quantum/cli_fee_controls.py \
            --cli "$CARGO_TARGET_DIR/debug/tosctl" \
            --fixture artifacts/context/quantum-fee-prepare/native/sdk-genesis.json \
            --public-tree artifacts/context/fee-recovery-fixture/PUBLIC-TEST-ONLY-tree \
            --output artifacts/context/cli-fee-controls
      - name: Fee session restore barrier and exclusive ownership controls
        run: |
          python test/wallet-quantum/cli_fee_session_controls.py \
            --cli "$CARGO_TARGET_DIR/debug/tosctl" \
            --fixture artifacts/context/quantum-fee-prepare/native/sdk-genesis.json \
            --fee-session-tree artifacts/context/quantum-fee-prepare/native/PUBLIC-TEST-ONLY-lms-tree \
            --output artifacts/context/cli-fee-session-controls
      - name: Fee session abrupt export crash and native funded lock controls
        run: |
          python test/wallet-quantum/cli_fee_session_crash_controls.py \
            --cli "$CARGO_TARGET_DIR/debug/tosctl" \
            --genesis-driver "$CARGO_TARGET_DIR/debug/examples/quantum_genesis_encode" \
            --fixture artifacts/context/quantum-fee-prepare/native/sdk-genesis.json \
            --fee-session-tree artifacts/context/fee-recovery-fixture/PUBLIC-TEST-ONLY-tree \
            --output artifacts/context/cli-fee-session-crash-controls
      - name: Fee session dual-role POP and challenge controls
        run: |
          python test/wallet-quantum/cli_fee_pop_controls.py \
            --cli "$CARGO_TARGET_DIR/debug/tosctl" \
            --genesis-driver "$CARGO_TARGET_DIR/debug/examples/quantum_genesis_encode" \
            --fixture artifacts/context/quantum-fee-prepare/native/sdk-genesis.json \
            --fee-session-tree artifacts/context/fee-recovery-fixture/PUBLIC-TEST-ONLY-tree \
            --output artifacts/context/cli-fee-pop-controls
      - name: POP receipt CLI authenticated history and binding controls
        run: |
          python test/wallet-quantum/cli_pop_receipt_controls.py \
            --cli "$CARGO_TARGET_DIR/debug/tosctl" \
            --genesis-driver "$CARGO_TARGET_DIR/debug/examples/quantum_genesis_encode" \
            --fixture artifacts/context/quantum-fee-prepare/native/sdk-genesis.json \
            --fee-session-tree artifacts/context/fee-recovery-fixture/PUBLIC-TEST-ONLY-tree \
            --output artifacts/context/cli-pop-receipt-controls
      - name: Fee session successor preparation and deployment controls
        run: |
          python test/wallet-quantum/cli_fee_prepare_controls.py \
            --cli "$CARGO_TARGET_DIR/debug/tosctl" \
            --genesis-driver "$CARGO_TARGET_DIR/debug/examples/quantum_genesis_encode" \
            --fixture artifacts/context/quantum-fee-prepare/native/sdk-genesis.json \
            --fee-session-tree artifacts/context/fee-recovery-fixture/PUBLIC-TEST-ONLY-tree \
            --output artifacts/context/cli-fee-prepare-controls
      - name: Successor fee tree and funded POP lifecycle controls
        run: |
          python test/wallet-quantum/fee_recovery_fixture.py \
            --vector-index 0 \
            --tree-id a6a6a6a6a6a6a6a6a6a6a6a6a6a6a6a6a6a6a6a6a6a6a6a6a6a6a6a6a6a6a6a6 \
            --output artifacts/context/successor-fee-recovery-fixture
          python test/wallet-quantum/cli_successor_pop_controls.py \
            --cli "$CARGO_TARGET_DIR/debug/tosctl" \
            --genesis-driver "$CARGO_TARGET_DIR/debug/examples/quantum_genesis_encode" \
            --fixture artifacts/context/quantum-fee-prepare/native/sdk-genesis.json \
            --fee-session-tree artifacts/context/fee-recovery-fixture/PUBLIC-TEST-ONLY-tree \
            --successor-fee-fixture artifacts/context/successor-fee-recovery-fixture \
            --output artifacts/context/cli-successor-pop-controls
      - name: Reject active LMS key reuse in successor routes
        run: |
          python test/wallet-quantum/fresh_fee_controls.py \
            --cli "$CARGO_TARGET_DIR/debug/tosctl" \
            --genesis-driver "$CARGO_TARGET_DIR/debug/examples/quantum_genesis_encode" \
            --fixture artifacts/context/quantum-fee-prepare/native/sdk-genesis.json \
            --fee-session-tree artifacts/context/fee-recovery-fixture/PUBLIC-TEST-ONLY-tree \
            --successor-fee-fixture artifacts/context/successor-fee-recovery-fixture \
            --output artifacts/context/fresh-fee-controls
      - name: Joint fee sessions and native client migration controls
        run: |
          python test/wallet-quantum/cli_migration_controls.py \
