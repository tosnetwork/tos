            --fixture artifacts/context/quantum-fee-prepare/native/sdk-genesis.json \
            --output artifacts/context/manifest-integration-controls
      - name: Verify gated migration signature was actually executed
        run: |
          python test/wallet-quantum/recorded_migration_control.py \
            --fixtures artifacts/context/quantum-fee-prepare/native \
            --submission artifacts/context/quantum-fee-prepare/native/recovery/sdk-migration.boc \
            --output artifacts/context/quantum-gated-migration-control
      - name: Reject corrupt primary POP before migration
        run: |
          python test/wallet-quantum/dual_pop_control.py \
            --baseline artifacts/context/quantum-fee-prepare \
            --native-signer "$CARGO_TARGET_DIR/debug/examples/public_fixture" \
            --output artifacts/context/quantum-dual-pop-rejection
      - name: Receipt-checked native transaction timing smoke
        run: |
          python test/wallet-quantum/test_benchmark_transactions.py
          python test/wallet-quantum/recorded_admission.py \
            --fixtures artifacts/context/quantum-fee-prepare \
            --driver "$CARGO_TARGET_DIR/debug/examples/pq-tx-parity" \
            --output artifacts/context/quantum-recorded-admission
          python test/wallet-quantum/benchmark_transactions.py \
            --fixtures artifacts/context/quantum-fee-prepare \
            --output artifacts/context/quantum-native-timing --iterations 10 --warmup 2
          python test/wallet-quantum/default_credit_timing.py \
            --fixtures artifacts/context/quantum-fee-prepare \
            --driver "$CARGO_TARGET_DIR/debug/examples/pq-tx-parity" \
            --output artifacts/context/quantum-default-credit-timing --iterations 10
          python test/wallet-quantum/test_admission_forgery_timing.py
          python test/wallet-quantum/admission_forgery_timing.py \
            --fixtures artifacts/context/quantum-fee-prepare \
            --driver "$CARGO_TARGET_DIR/debug/examples/pq-tx-parity" \
            --output artifacts/context/quantum-admission-forgery-timing --variants 8 --iterations 10
          python test/wallet-quantum/admission_envelope_probe.py \
            --fixtures artifacts/context/quantum-fee-prepare \
            --driver "$CARGO_TARGET_DIR/debug/examples/pq-tx-parity" \
            --output artifacts/context/quantum-admission-envelope-probe --iterations 10
      - name: Native ingress parser boundary controls
        run: |
          cmake --build build --target test-ext-message-pool -j2
          build/test-ext-message-pool
          python test/wallet-quantum/admission_budget_controls.py --build build --pool-controls \
            --output artifacts/context/quantum-admission-byte-budget-controls
          python test/wallet-quantum/ingress_boundary_controls.py --build build \
            --output artifacts/context/quantum-ingress-boundary-controls
          cmake --build build --target test-ext-message-ingress-fixtures -j2
          python test/wallet-quantum/test_ingress_fixture_probe.py
          python test/wallet-quantum/ingress_fixture_probe.py \
            --fixtures artifacts/context/quantum-fee-prepare \
            --envelopes artifacts/context/quantum-admission-envelope-probe \
            --driver build/test-ext-message-ingress-fixtures \
            --output artifacts/context/quantum-ingress-fixture-probe --iterations 10
      - name: Native LMS chain buffer sensitivity
        if: matrix.runner == 'ubuntu-24.04'
        run: |
          python test/wallet-quantum/lms_buffer_controls.py --build build \
            --fixtures artifacts/context/quantum-fee-prepare \
            --output artifacts/context/quantum-lms-buffer-controls
      - name: Receipt-bound module rent invariant
        run: |
          python test/wallet-quantum/module_rent_control.py \
            --baseline artifacts/context/quantum-fee-prepare/native \
            --output artifacts/context/quantum-fee-prepare/module-rent-control.json
      - name: Preparation fee admission deletion controls
        if: matrix.runner == 'ubuntu-24.04'
        run: |
          python test/wallet-quantum/preparation_fee_controls.py \
            --baseline artifacts/context/quantum-fee-prepare \
            --output artifacts/context/quantum-fee-prepare-controls
      - name: Recovery state transition deletion controls
        if: matrix.runner == 'ubuntu-24.04'
        run: |
          python test/wallet-quantum/recovery_controls.py \
            --baseline artifacts/context/quantum-fee-prepare \
            --output artifacts/context/quantum-recovery-controls
      - name: Real cached signature verification deletion control
        if: matrix.runner == 'ubuntu-24.04'
        run: |
          python test/wallet-quantum/cache_verification_control.py --native-fee-signer \
            --baseline artifacts/context/quantum-fee-auth/native/sdk-cache \
            --driver "$CARGO_TARGET_DIR/debug/examples/lms_fee_cache_fixture" \
            --output artifacts/context/quantum-cache-verification-control
      - name: Full fee verification deletion control
        if: matrix.runner == 'ubuntu-24.04'
        run: |
          python test/wallet-quantum/fee_tx_mutation.py \
            --artifacts artifacts/context/quantum-fee-auth --target "$CARGO_TARGET_DIR"
      - name: Falcon version-19 boundary in both VMs
        run: |
          python test/pq-falcon512/version_boundary.py --build build \
            --rust-examples "$CARGO_TARGET_DIR/debug/examples" --out artifacts/context/falcon-version
      - name: Reject early and late Falcon activation mutations
        if: matrix.runner == 'ubuntu-24.04'
        run: |
          python test/pq-falcon512/version_controls.py --build build \
            --rust-examples "$CARGO_TARGET_DIR/debug/examples" --out artifacts/context/falcon-version-controls
      - name: Verify context, opcode, complete transactions and legacy pricing
        run: |
          build/crypto/tlbc -q crypto/block/block.tlb crypto/smartcont/wallet-quantum-rescue.tlb
          python test/rescue-fee-gate/test_context_admission.py \
            --cpp build/crypto/pq/test-fee-native-cost \
            --rust "$CARGO_TARGET_DIR/debug/examples/fee-native-cost" \
            --rust-tx "$CARGO_TARGET_DIR/debug/examples/pq-tx-parity" --output artifacts/context
          build/crypto/pq/test-pq-suite-parity test/rescue-fee-gate/suite-scenarios.tsv > artifacts/context/legacy-cpp.tsv
          "$CARGO_TARGET_DIR/debug/examples/suite-parity" test/rescue-fee-gate/suite-scenarios.tsv > artifacts/context/legacy-rust.tsv
          python test/rescue-fee-gate/compare.py test/rescue-fee-gate/suite-scenarios.tsv \
            artifacts/context/legacy-cpp.tsv artifacts/context/legacy-rust.tsv test/rescue-fee-gate/suite-expected.tsv
          cargo test --manifest-path tosctl/src/Cargo.toml --locked -p tos_vm --lib incoming_storage_context_is_versioned_and_optional
          cargo test --manifest-path tosctl/src/Cargo.toml --locked -p tos_assembler --lib lms_fee_hash_mnemonic_round_trip
          cargo test --manifest-path tosctl/src/Cargo.toml --locked -p tos_executor --lib
      - name: Require meaningful mutation failures and restore binaries
        if: matrix.runner == 'ubuntu-24.04'
        run: |
          python test/rescue-fee-gate/context_mutations.py --artifacts artifacts/context --target "$CARGO_TARGET_DIR"
          python test/rescue-fee-gate/context_transactions.py --output artifacts/context \
            --rust "$CARGO_TARGET_DIR/debug/examples/pq-tx-parity"
          git diff --exit-code
      - name: Record exact source and public evidence hashes
        if: always()
        run: |
          mkdir -p artifacts/context
          git rev-parse HEAD > artifacts/context/source-commit.txt
          uname -a > artifacts/context/platform.txt
          find artifacts/context -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > artifacts/context/SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: rescue-context-${{ matrix.runner }}
          path: |
            artifacts/context
            !artifacts/context/**/PUBLIC-TEST-ONLY-lms-tree
            !artifacts/context/**/PUBLIC-TEST-ONLY-successor-tree
            !artifacts/context/**/PUBLIC-TEST-ONLY-tree
          retention-days: 14
