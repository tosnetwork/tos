name: Closed PR cache maintenance
on:
  schedule:
    - cron: '17 19 * * *'
  workflow_dispatch:
    inputs:
      apply:
        description: Delete confirmed closed-PR cache entries (otherwise preview only)
        type: boolean
        default: false
permissions:
  contents: read
  actions: write
  pull-requests: read
concurrency:
  group: closed-pr-cache-maintenance
  cancel-in-progress: false
jobs:
  cleanup:
    # Elevated cache permission runs only trusted default-branch code.
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Reclaim a bounded batch of closed PR caches
        env:
          GH_TOKEN: ${{ github.token }}
          APPLY: ${{ github.event_name == 'schedule' || inputs.apply }}
        run: |
          args=()
          if [ "$APPLY" = true ]; then args+=(--apply); fi
          python3 scripts/clean-closed-pr-caches.py "${args[@]}"
