name: materialize-atos-task-escrow-sidecar-e2e

on:
  push:
    branches:
      - agent/atos-task-escrow-sidecar-e2e

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/atos-task-escrow-sidecar-e2e
          fetch-depth: 0
      - name: Apply localnet E2E implementation
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          parts=(.github/atos-sidecar-e2e-patch.part*)
          if [ "${#parts[@]}" -eq 0 ]; then
            echo 'no staged E2E patch parts found' >&2
            exit 1
          fi
          cat "${parts[@]}" | base64 --decode > /tmp/atos-sidecar-e2e.patch.xz
          xz --test /tmp/atos-sidecar-e2e.patch.xz
          xz -dc /tmp/atos-sidecar-e2e.patch.xz > /tmp/atos-sidecar-e2e.patch
          git apply --binary --whitespace=error-all /tmp/atos-sidecar-e2e.patch
          rm -f .github/atos-sidecar-e2e-patch.part*
          rm -f .github/workflows/export-atos-task-escrow-sidecar-source.yml
          rm -f .github/workflows/materialize-atos-task-escrow-sidecar-e2e.yml
          if [ -f scripts/atos-task-escrow-sidecar-e2e.py ]; then
            python3 -m py_compile scripts/atos-task-escrow-sidecar-e2e.py
          fi
          git diff --check
      - name: Commit clean implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'test(localnet): add ATOS TaskEscrow sidecar end-to-end flow'
          git push origin HEAD:agent/atos-task-escrow-sidecar-e2e
