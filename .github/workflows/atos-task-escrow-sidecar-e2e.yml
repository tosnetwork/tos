name: ATOS TaskEscrow sidecar localnet E2E

on:
  push:
    branches: [main]
    paths:
      - 'tosctl/src/node-control/commands/src/commands/nodectl/agent_cmd.rs'
      - 'scripts/atos-task-escrow-publisher-e2e.py'
      - '.github/workflows/atos-task-escrow-sidecar-e2e.yml'
  pull_request:
    branches: [main]
    paths:
      - 'tosctl/src/node-control/commands/src/commands/nodectl/agent_cmd.rs'
      - 'scripts/atos-task-escrow-publisher-e2e.py'
      - '.github/workflows/atos-task-escrow-sidecar-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  localnet:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    container:
      image: ghcr.io/tosnetwork/tos-builder:ubuntu-24.04
      credentials:
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check out TOS
        uses: actions/checkout@v7
      - name: Check out tested tos-protocol publisher revision
        uses: actions/checkout@v7
        with:
          repository: tosnetwork/tos-protocol
          ref: cf67abc1370c2c64267b967ad5f3836b979b164a
          path: tos-protocol
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true
          cache-dependency-path: tos-protocol/go.sum
      - name: Date stamp
        id: date-stamp
        run: echo "timestamp=$(date -u '+%Y%m%d%H%M_%S')" >> "$GITHUB_OUTPUT"
      - name: Restore TOS compiler cache
        uses: actions/cache@v6
        with:
          path: ~/.ccache
          key: ${{ runner.os }}-${{ runner.arch }}-ubuntu-24.04-shared-ccache-${{ steps.date-stamp.outputs.timestamp }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-ubuntu-24.04-shared-ccache
      - uses: actions-rust-lang/setup-rust-toolchain@v1.17.0
        with:
          toolchain: 1.91.1
          cache: false
          rustflags: ''
      - name: Build minimum real-localnet toolchain and tosctl
        run: |
          set -euo pipefail
          mkdir -p ~/.ccache
          cp assembly/native/build-ubuntu-shared.sh .
          chmod +x build-ubuntu-shared.sh
          ./build-ubuntu-shared.sh -c
          cargo build --manifest-path tosctl/src/Cargo.toml -p tosctl
          cargo test --manifest-path tosctl/src/Cargo.toml -p commands exact_nanotos_bypasses_float_conversion
      - name: Validate publisher Go code
        working-directory: tos-protocol
        run: |
          set -euo pipefail
          make all
          make test-race
      - name: Prepare localnet Python environment
        run: |
          set -euo pipefail
          uv sync --no-dev
          uv run test/tostester/generate_tl.py
      - name: Run real local-chain publisher E2E
        env:
          TOS_PROTOCOL_DIR: ${{ github.workspace }}/tos-protocol
          TOS_BUILD_DIR: ${{ github.workspace }}/build
          TOSCTL: ${{ github.workspace }}/tosctl/src/target/debug/tosctl
        run: |
          set +e
          uv run python scripts/atos-task-escrow-publisher-e2e.py
          status=$?
          if [ "$status" -ne 0 ]; then
            echo '::group::TaskEscrow publisher stdout'
            sed -n '1,240p' test/integration/.atos-task-escrow-publisher-e2e/sidecar.stdout.log 2>/dev/null || true
            echo '::endgroup::'
            echo '::group::TaskEscrow publisher stderr'
            sed -n '1,240p' test/integration/.atos-task-escrow-publisher-e2e/sidecar.stderr.log 2>/dev/null || true
            echo '::endgroup::'
          fi
          exit "$status"
