name: Ubuntu TOS build (AppImages, x86-64)

on:
  push:
    tags: ['v*']
  workflow_dispatch:
  workflow_call:

# A literal group: inside a call, github.workflow is the caller's name, so every
# matrix member would share one group. A pull request cancels its own older run;
# any other run (a push, the nightly run, a tag) is never cancelled by another.
concurrency:
  group: linux-x86-64-appimage-${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    timeout-minutes: 100
    runs-on: ubuntu-22.04

    steps:
    - name: Check out repository
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
    - name: Date Stamp
      shell: bash
      id: date-stamp
      run: |
        echo "timestamp=$(date -u "+%Y%m%d%H%M_%S")" >> "$GITHUB_OUTPUT"

    - name: Install system libraries
      run: |
        sudo apt update
        sudo apt install -y build-essential git cmake ninja-build ccache libgsl-dev libblas-dev libgslcblas0
        mkdir ~/.ccache

    - name: Install clang-21
      run: sudo scripts/install-llvm-toolchain.sh 21

    - name: Restore cache TOS
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ~/.ccache
        key: ${{ runner.os }}-${{ runner.arch }}-ubuntu-22.04-portable-ccache

    # Rust toolchain needed for Rust crates under tosctl/src.
    - name: Install repository-pinned Rust toolchain
      run: scripts/install-rust-toolchain.sh

    - name: Build TOS
      run: |
        cp assembly/native/build-ubuntu-appimages.sh .
        chmod +x build-ubuntu-appimages.sh
        ./build-ubuntu-appimages.sh -a -c
        ccache -sp

    - name: Save cache TOS
      uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ~/.ccache
        key: ${{ runner.os }}-${{ runner.arch }}-ubuntu-22.04-portable-ccache-${{ steps.date-stamp.outputs.timestamp }}

    - name: Make AppImages
      run: |
        cp assembly/appimage/create-appimages.sh .
        cp assembly/appimage/AppRun .
        cp assembly/appimage/tos.png .
        chmod +x create-appimages.sh
        ./create-appimages.sh x86_64
        rm -rf artifacts

    - name: Save/Restore cache TOS libs
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ~/.ccache
        key: ${{ runner.os }}-${{ runner.arch }}-ubuntu-22.04-portable-libs-ccache-${{ steps.date-stamp.outputs.timestamp }}
        restore-keys: ${{ runner.os }}-${{ runner.arch }}-ubuntu-22.04-portable-libs-ccache

    - name: Build TOS libs
      run: |
        cp assembly/native/build-ubuntu-portable-libs.sh .
        chmod +x build-ubuntu-portable-libs.sh
        ./build-ubuntu-portable-libs.sh -a -c
        cp ./artifacts/libtoslibjson.so appimages/artifacts/
        cp ./artifacts/libemulator.so appimages/artifacts/

    - name: Upload artifacts
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: tos-x86_64-linux
        path: appimages/artifacts
        retention-days: 14
