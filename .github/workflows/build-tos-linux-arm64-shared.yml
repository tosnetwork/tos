name: Ubuntu TOS build (arm64)

on:
  # The full native build runs on everything that lands on main, and on
  # demand. It is not filtered by path: every list of what the build reads
  # has missed something (templates, export lists, generated inputs, test
  # vectors), and main receives few pushes.
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}

    steps:
    - name: Check out repository
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        fetch-depth: 0
    - name: Install system libraries
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential git cmake ninja-build libjemalloc-dev ccache ripgrep

    - if: matrix.os != 'ubuntu-24.04-arm'
      run: |
        sudo scripts/install-llvm-toolchain.sh 21

    - if: matrix.os == 'ubuntu-24.04-arm'
      name: Install llvm-21
      run: |
        lsb_release -a
        sudo scripts/install-llvm-toolchain.sh 21

    - name: Reuse compatible native compiler objects
      uses: ./.github/actions/native-cache
      with:
        profile: main-shared
        max-size: 1G

    # Rust toolchain needed for Rust crates under tosctl/src.
    - name: Install repository-pinned Rust toolchain
      run: scripts/install-rust-toolchain.sh

    - name: Build TOS
      run: |
        cp assembly/native/build-ubuntu-shared.sh .
        chmod +x build-ubuntu-shared.sh
        ./build-ubuntu-shared.sh -t -c
        ccache -sp

    # The suite reads git history and runs uv-based harnesses.
    - name: Install uv
      uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6

    - name: Run Tests
      run: |
        cd build
        python3 ../scripts/ci-ctest.py --build-dir .

    - name: Run toslib integration test
      run: |
        ./test/toslib/integration/test_integration.sh
