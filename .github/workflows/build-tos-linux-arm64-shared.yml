name: Ubuntu TOS build (arm64)

on:
  # The full native build is expensive, so it does not run per pull request.
  # It runs once on what actually lands, and only when the merge carries
  # something a native build can fail on. A documentation-only merge changes
  # nothing this job compiles and is filtered out by the paths below.
  push:
    branches: [main]
    paths:
      - 'CMakeLists.txt'
      - '**/CMakeLists.txt'
      - 'CMake/**'
      - '**/*.cmake'
      - '**/*.c'
      - '**/*.cc'
      - '**/*.cpp'
      - '**/*.h'
      - '**/*.hpp'
      - '**/*.rs'
      # A manifest or lockfile decides what the Rust half compiles, and the
      # build script and toolchain pin decide how any of it is built, so a
      # change to one of them can break the build without touching a source.
      - '**/Cargo.toml'
      - '**/Cargo.lock'
      - 'assembly/native/**'
      - 'scripts/install-rust-toolchain.sh'
      - 'rust-toolchain.toml'
      # The scripts and tests the job runs.
      - 'scripts/install-llvm-toolchain.sh'
      - 'test/toslib/integration/**'
      - 'third-party/**'
      - '.github/workflows/build-tos-linux-arm64-shared.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04-arm, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}

    steps:
    - name: Check out repository
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
    - name: Date Stamp
      shell: bash
      id: date-stamp
      run: |
        echo "timestamp=$(date -u "+%Y%m%d%H%M_%S")" >> "$GITHUB_OUTPUT"

    - name: Install system libraries
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential git cmake ninja-build libjemalloc-dev ccache ripgrep
        mkdir ~/.ccache

    - if: matrix.os != 'ubuntu-24.04-arm'
      run: |
        sudo scripts/install-llvm-toolchain.sh 21

    - if: matrix.os == 'ubuntu-24.04-arm'
      name: Install llvm-21
      run: |
        lsb_release -a
        sudo scripts/install-llvm-toolchain.sh 21

    - name: Cache TOS test
      id: cache-tos
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ~/.ccache
        key: ${{ runner.os }}-${{ runner.arch }}-${{ matrix.os }}-shared-ccache-${{ steps.date-stamp.outputs.timestamp }}
        restore-keys: ${{ runner.os }}-${{ runner.arch }}-${{ matrix.os }}-shared-ccache

    # Rust toolchain needed for Rust crates under tosctl/src.
    - name: Install repository-pinned Rust toolchain
      run: scripts/install-rust-toolchain.sh

    - name: Build TOS
      run: |
        cp assembly/native/build-ubuntu-shared.sh .
        chmod +x build-ubuntu-shared.sh
        ./build-ubuntu-shared.sh -t -c
        ccache -sp

    - name: Run Tests
      run: |
        cd build
        ctest --output-on-failure --timeout 1800

    - name: Run toslib integration test
      run: |
        ./test/toslib/integration/test_integration.sh
