name: MacOS-15 TOS build (shared, x86-64)

# macOS on Intel, the x86-64 counterpart of the Apple silicon build: the same
# script, targets and tests on an Intel runner, so the x86-64 code paths of
# macOS (the SHA-NI backend among them) are built and tested too. It runs on
# every pull request to main and every push to main, unfiltered by path, for
# the reason the Linux shared builds give.
on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Explicit public namespace for disposable CI networks.
  TOS_AUTH_NETWORK_TAG: "4343434343434343434343434343434343434343434343434343434343434343"

jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 360

    steps:
    - name: Check out repository
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        fetch-depth: 0

    - name: Date Stamp
      id: date-stamp
      run: |
        echo "timestamp=$(date -u "+%Y%m%d%H%M_%S")" >> "$GITHUB_OUTPUT"

    - name: Install build tools
      run: |
        # ripgrep: the source-guard tests search the tree with it, as on Linux.
        brew install ninja pkg-config autoconf automake libtool ccache ripgrep

    - name: Restore cache TOS
      id: cache-tos
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ~/.ccache
        key: ${{ runner.os }}-${{ runner.arch }}-macos-15-intel-shared-ccache-${{ steps.date-stamp.outputs.timestamp }}
        restore-keys: ${{ runner.os }}-${{ runner.arch }}-macos-15-intel-shared-ccache

    # Rust toolchain needed for Rust crates under tosctl/src.
    - name: Install repository-pinned Rust toolchain
      run: scripts/install-rust-toolchain.sh

    - name: Build TOS
      env:
        CCACHE_MAXSIZE: 2G
      run: |
        cp assembly/native/build-macos-shared.sh .
        chmod +x build-macos-shared.sh
        ./build-macos-shared.sh -t -c

    - name: Print ccache stats after TOS build
      if: ${{ always() }}
      run: |
        ccache -sp
        ccache -z

    - name: Save cache TOS
      if: ${{ success() }}
      uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ~/.ccache
        key: ${{ steps.cache-tos.outputs.cache-primary-key }}

    # The suite reads git history and runs uv-based harnesses.
    - name: Install uv
      uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      # Pinned to scripts/build-tool-pins.json, so the step never looks up the
      # latest release over the GitHub API.
      with:
        version: "0.11.7"

    # Linux routes all of 127.0.0.0/8 on lo; macOS only the addresses aliased
    # on lo0. The loopback-aliases tests bind sources up to 127.0.0.39.
    - name: Alias loopback sources
      run: |
        for i in $(seq 2 39); do sudo ifconfig lo0 alias "127.0.0.$i" up; done

    # Labels (CMakeLists.txt, BUILD.md): linux-only and gnu-tools need Linux or
    # GNU tooling; macos-known-failure lists the tests whose preconditions do
    # not hold on macOS. Serial, as on a three-core runner parallel tests
    # contend for time-bounded steps.
    # INVESTIGATION BRANCH ONLY, never for main: repeat the reply-budget case
    # of test-adnl-ext-query-refusal with its debug trace until it fails, first
    # alone and then next to CPU load, and keep the failing trace.
    - name: Repeat the ADNL refusal test until it fails
      env:
        TMPDIR: /private/tmp
      run: |
        bin=$(find build -name test-adnl-ext-query-refusal -type f -perm -u+x | head -1)
        test -n "$bin"
        mkdir -p loss-trace
        run_loop() {
          for i in $(seq 1 "$2"); do
            if ! "$bin" reply-budget trace > loss-trace/last.txt 2>&1; then
              cp loss-trace/last.txt "loss-trace/failure-$1-$i.txt"
              echo "FAILED in $1 at iteration $i"
              grep -E "LOSS_TRACE|ADNL_EXT_CLOSE|client_conn_stopped|server_reject|dropped_while_closing|closed: accepted|REFUSAL_FAILURE" loss-trace/last.txt | tail -200
              return 1
            fi
          done
          echo "no failure in $1 after $2 runs"
        }
        rc=0
        run_loop alone 1500 || rc=1
        if [ "$rc" = 0 ]; then
          for j in 1 2 3; do (while :; do :; done) & done
          run_loop loaded 1500 || rc=1
          kill $(jobs -p) 2>/dev/null || true
        fi
        exit $rc

    - name: Keep the failing trace
      if: ${{ always() }}
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: adnl-refusal-loss-trace
        path: loss-trace
        if-no-files-found: ignore
        retention-days: 14

    - name: Run node data tools tests
      env:
        TMPDIR: /private/tmp
      run: |
        # The same PATH as the build: GNU ar writes archives Apple's linker rejects.
        PATH="$(echo "$PATH" | tr ':' '\n' | grep -v -E 'binutils|llvm|coreutils' | paste -sd: -)"
        export PATH="/usr/bin:$PATH"
        cargo test --locked --release --manifest-path tosctl/src/Cargo.toml -p node-data-sync
