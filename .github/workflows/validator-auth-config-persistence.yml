name: Validator configuration persistence

on:
  push:
    branches: [feat/validator-auth-p0]
    paths:
      - 'test/validator-auth-implementation/config-contract-test.cpp'
      - 'test/validator-auth-implementation/config_contract_persistence.py'
      - 'crypto/smartcont/config-code.fc'
      - '.github/workflows/validator-auth-config-persistence.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: config-persistence-${{ github.ref }}
  cancel-in-progress: false

jobs:
  config-persistence:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
      - name: Install focused dependencies
        id: dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld cmake ninja-build pkg-config libssl-dev libsodium-dev liblz4-dev zlib1g-dev gperf python3-yaml
      - name: Parse the measurement job and verify its steps
        id: structure
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import yaml
          value = yaml.load(Path('.github/workflows/validator-auth-config-persistence.yml').read_text(), Loader=yaml.BaseLoader)
          assert set(value['jobs']) == {'config-persistence'}
          steps = value['jobs']['config-persistence']['steps']
          ids = [step['id'] for step in steps if 'id' in step]
          assert ids == ['dependencies', 'structure', 'build', 'measure', 'evidence']
          assert steps[-1]['if'] == 'always()'
          assert value['permissions']['contents'] == 'read'
          print('WORKFLOW_STRUCTURE_OK')
          PY
      - name: Compile normal and sanitized configuration tests
        id: build
        run: |
          set -euo pipefail
          mkdir -p artifacts/config-persistence
          for tree in build-p0 build-p0-sanitized; do
            extra=()
            if [ "$tree" = build-p0-sanitized ]; then
              extra=(-DTOS_USE_ASAN=ON -DTOS_USE_UBSAN=ON)
            fi
            cmake -S . -B "$tree" -G Ninja -DCMAKE_BUILD_TYPE=Release -DTOS_ARCH= \
              -DTOS_BUILD_P0_IMPLEMENTATION_TESTS=ON -DUSE_QUIC=OFF \
              -DTOS_USE_ROCKSDB=OFF -DTOS_USE_ABSEIL=OFF -DTOS_USE_LLD=ON \
              -DCMAKE_SKIP_INSTALL_RULES=ON \
              -DOPENSSL_CRYPTO_LIBRARY="$(pkg-config --variable=libdir openssl)/libcrypto.so" \
              -DOPENSSL_SSL_LIBRARY="$(pkg-config --variable=libdir openssl)/libssl.so" \
              -DOPENSSL_INCLUDE_DIR="$(pkg-config --variable=includedir openssl)" "${extra[@]}"
            targets=(test-p0-config-contract)
            if [ "$tree" = build-p0 ]; then targets+=(func fift); fi
            cmake --build "$tree" --target "${targets[@]}" -j2
          done
      - name: Execute every case and the installation removal independently
        id: measure
        run: |
          set +e
          python3 test/validator-auth-implementation/config_contract_persistence.py --out artifacts/config-persistence
          rc=$?
          printf '%s\n' "$rc" > artifacts/config-persistence/measurement.exit
          echo "MEASUREMENT_EXIT=$rc"
          exit "$rc"
      - name: Retain exact measurements and built contract cells
        id: evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: config-persistence-${{ github.sha }}
          path: artifacts/config-persistence
          if-no-files-found: warn
