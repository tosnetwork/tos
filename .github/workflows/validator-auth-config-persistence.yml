name: Validator configuration persistence

on:
  push:
    branches: [feat/validator-auth-p0]
    paths:
      - 'test/validator-auth-implementation/config-contract-test.cpp'
      - 'test/validator-auth-implementation/config_contract_persistence.py'
      - 'test/validator-auth-implementation/config_contract_persistence_mutations.py'
      - 'test/validator-auth-implementation/config_action_phase_mutations.py'
      - 'tosctl/src/executor/src/blockchain_config.rs'
      - 'tosctl/src/executor/src/transaction_executor.rs'
      - 'tosctl/src/sandbox/src/blockchain.rs'
      - 'tosctl/src/node-control/contracts/tests/native_registry_sandbox.rs'
      - 'doc/validator-auth-p0-native-insertions.json'
      - 'crypto/smartcont/config-code.fc'
      - '.github/workflows/validator-auth-config-persistence.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: config-persistence-${{ github.ref }}
  cancel-in-progress: false

jobs:
  config-persistence:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
      - name: Install focused dependencies
        id: dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld cmake ninja-build pkg-config libssl-dev libsodium-dev liblz4-dev zlib1g-dev gperf python3-yaml
      - name: Parse the measurement job and verify its steps
        id: structure
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import yaml
          value = yaml.load(Path('.github/workflows/validator-auth-config-persistence.yml').read_text(), Loader=yaml.BaseLoader)
          assert set(value['jobs']) == {'config-persistence'}
          steps = value['jobs']['config-persistence']['steps']
          ids = [step['id'] for step in steps if 'id' in step]
          assert ids == ['dependencies', 'structure', 'build', 'measure', 'cpp_mutations', 'rust_action', 'rust_mutations', 'frozen', 'evidence']
          assert steps[-1]['if'] == 'always()'
          assert value['permissions']['contents'] == 'read'
          print('WORKFLOW_STRUCTURE_OK')
          PY
      - name: Compile normal and sanitized configuration tests
        id: build
        run: |
          set -euo pipefail
          mkdir -p artifacts/config-persistence
          for tree in build-p0 build-p0-sanitized; do
            extra=()
            if [ "$tree" = build-p0-sanitized ]; then
              extra=(-DTOS_USE_ASAN=ON -DTOS_USE_UBSAN=ON)
            fi
            cmake -S . -B "$tree" -G Ninja -DCMAKE_BUILD_TYPE=Release -DTOS_ARCH= \
              -DTOS_BUILD_P0_IMPLEMENTATION_TESTS=ON -DUSE_QUIC=OFF \
              -DTOS_USE_ROCKSDB=OFF -DTOS_USE_ABSEIL=OFF -DTOS_USE_LLD=ON \
              -DCMAKE_SKIP_INSTALL_RULES=ON \
              -DOPENSSL_CRYPTO_LIBRARY="$(pkg-config --variable=libdir openssl)/libcrypto.so" \
              -DOPENSSL_SSL_LIBRARY="$(pkg-config --variable=libdir openssl)/libssl.so" \
              -DOPENSSL_INCLUDE_DIR="$(pkg-config --variable=includedir openssl)" "${extra[@]}"
            targets=(test-p0-config-contract)
            if [ "$tree" = build-p0 ]; then targets+=(func fift); fi
            cmake --build "$tree" --target "${targets[@]}" -j2
          done
      - name: Execute every case and the installation removal independently
        id: measure
        run: |
          set +e
          python3 test/validator-auth-implementation/config_contract_persistence.py --out artifacts/config-persistence
          rc=$?
          printf '%s\n' "$rc" > artifacts/config-persistence/measurement.exit
          echo "MEASUREMENT_EXIT=$rc"
          exit "$rc"
      - name: Run compiled configuration-contract mutations
        id: cpp_mutations
        run: |
          set +e
          python3 test/validator-auth-implementation/config_contract_persistence_mutations.py --out artifacts/config-persistence/cpp-mutations
          rc=$?
          printf '%s\n' "$rc" > artifacts/config-persistence/cpp-mutations.exit
          echo "CPP_MUTATIONS_EXIT=$rc"
          exit "$rc"
      - name: Run real action-phase persistence and rollback evidence
        id: rust_action
        run: |
          set +e
          export VALIDATOR_AUTH_CONFIG_PERSISTENCE_CELLS="$PWD/artifacts/config-persistence/cells"
          cargo test --manifest-path tosctl/src/node-control/contracts/Cargo.toml --test native_registry_sandbox config_persistence_action_phase -- --include-ignored --nocapture | tee artifacts/config-persistence/rust-action.log
          rc=${PIPESTATUS[0]}
          # A name filter that matches nothing exits zero having run nothing.
          grep -q "3 passed" artifacts/config-persistence/rust-action.log || rc=1
          printf '%s\n' "$rc" > artifacts/config-persistence/rust-action.exit
          echo "RUST_ACTION_EXIT=$rc"
          exit "$rc"
      - name: Run compiled action-phase mutations
        id: rust_mutations
        run: |
          set +e
          python3 test/validator-auth-implementation/config_action_phase_mutations.py --cells artifacts/config-persistence/cells --out artifacts/config-persistence/rust-mutations
          rc=$?
          printf '%s\n' "$rc" > artifacts/config-persistence/rust-mutations.exit
          echo "RUST_MUTATIONS_EXIT=$rc"
          exit "$rc"
      - name: Verify frozen production reconstruction
        id: frozen
        run: |
          set +e
          mkdir -p artifacts/config-persistence
          python3 test/validator-auth-p0/check_production.py --out artifacts/config-persistence/production.json
          production_rc=$?
          python3 test/validator-auth-p0/freeze_record.py
          freeze_rc=$?
          printf '%s\n' "$production_rc" > artifacts/config-persistence/check-production.exit
          printf '%s\n' "$freeze_rc" > artifacts/config-persistence/freeze-record.exit
          echo "CHECK_PRODUCTION_EXIT=$production_rc"
          echo "FREEZE_RECORD_EXIT=$freeze_rc"
          test "$production_rc" -eq 0 -a "$freeze_rc" -eq 0
      - name: Retain exact measurements and built contract cells
        id: evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: config-persistence-${{ github.sha }}
          path: artifacts/config-persistence
          if-no-files-found: warn
