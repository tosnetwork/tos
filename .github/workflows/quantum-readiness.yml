name: Quantum genesis and trusted-state validation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/ci-snapshot.py'
      - 'scripts/test_ci_snapshot.py'
      - '.github/workflows/quantum-readiness.yml'
      - 'crypto/block/**'
      - 'crypto/vm/**'
      - 'emulator/**'
      - 'crypto/fift/lib/Config.fif'
      - 'crypto/smartcont/**'
      - 'validator/auth-policy-admission.h'
      - 'validator/manager.cpp'
      - 'validator/interfaces/config.h'
      - 'validator/impl/config.hpp'
      - 'test/test-config-transition.cpp'
      - 'test/wallet-quantum/**'
      - 'test/tostester/**'
      - 'crypto/CMakeLists.txt'
      - 'CMakeLists.txt'
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read
  actions: read

concurrency:
  group: quantum-readiness-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      TOS_ROOT: ${{ github.workspace }}
      TOS_BUILD_DIR: ${{ github.workspace }}/build
      TOS_AUTH_NETWORK_TAG: "4343434343434343434343434343434343434343434343434343434343434343"
      PYTHONPATH: ${{ github.workspace }}/test/tostester/src
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Reuse only a proven identical Ready snapshot
        id: snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci-snapshot.py --job 'native-${{ matrix.runner }}'
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        if: steps.snapshot.outputs.run-tests == 'true'
      - name: Install system crypto development dependencies
        if: steps.snapshot.outputs.run-tests == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev
      - name: Build node and genesis configuration paths
        if: steps.snapshot.outputs.run-tests == 'true'
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DUSE_QUIC=OFF \
            -DOPENSSL_CRYPTO_LIBRARY="$(pkg-config --variable=libdir openssl)/libcrypto.so" \
            -DOPENSSL_SSL_LIBRARY="$(pkg-config --variable=libdir openssl)/libssl.so" \
            -DOPENSSL_INCLUDE_DIR="$(pkg-config --variable=includedir openssl)"
          cmake --build build --target validator test-config-transition create-state emulator \
            tos-pq-consensus-key gen_fif_smartcont_auto_config_code \
            gen_fif_smartcont_auto_elector_code -j"$(nproc)"
      - name: Prepare repository Python environment
        if: steps.snapshot.outputs.run-tests == 'true'
        run: |
          uv sync --locked --no-dev
          uv run test/tostester/generate_tl.py
      - name: Configuration transitions and sensitivity controls
        if: steps.snapshot.outputs.run-tests == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/quantum-evidence"
          build/test-config-transition > "$RUNNER_TEMP/quantum-evidence/native.log" 2>&1
          uv run python test/wallet-quantum/policy_native_mutations.py --admission-only \
            --build build --output "$RUNNER_TEMP/quantum-evidence/admission-controls"
      - name: Actual genesis construction and failure controls
        if: steps.snapshot.outputs.run-tests == 'true'
        run: |
          uv run python -m pytest -q test/tostester/tests/tostester/test_zerostate_auth_policy.py \
            test/tostester/tests/tostester/test_zerostate_supply.py \
            test/tostester/tests/tostester/test_zerostate_fee_schedule.py \
            -k 'auth_policy or initial_retirement or missing_policy or version15_retains or environment_namespace or genesis_requires_namespace or bad_namespace or admission_candidate or deployment_schedule or test_schedule or canonical_first_election or unsafe_first_election or canonical_genesis_script_accepts' \
            > "$RUNNER_TEMP/quantum-evidence/genesis.log" 2>&1
          git diff --exit-code
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: (always()) && steps.snapshot.outputs.run-tests == 'true'
        with:
          name: quantum-readiness-${{ matrix.runner }}
          path: ${{ runner.temp }}/quantum-evidence/
          retention-days: 14

      - name: Record successful executed snapshot
        if: github.event_name == 'pull_request' && steps.snapshot.outputs.run-tests == 'true'
        run: python3 scripts/ci-snapshot.py --job 'native-${{ matrix.runner }}' --record
      - name: Retain successful snapshot evidence
        if: github.event_name == 'pull_request' && steps.snapshot.outputs.run-tests == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ci-snapshot-native-${{ matrix.runner }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-snapshot-native-${{ matrix.runner }}.json
          if-no-files-found: error
          retention-days: 14
