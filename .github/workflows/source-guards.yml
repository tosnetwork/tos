name: Source guards

on:
  # A branch push beside its pull request would run this twice.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  source-guards:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up repository Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'

      - name: Check candidate bundle inputs before configure or compile
        run: python3 scripts/check-wallet-quantum-review-sources.py --self-test

      - name: Verify rescue suite coverage and failure controls
        run: |
          python3 scripts/check-rescue-context-ci.py
          python3 scripts/test_rescue_context_ci.py

      - name: Install configure-time tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build ripgrep

      - name: Verify CI snapshot reuse and complete test scheduling
        run: |
          python3 scripts/test_ci_snapshot.py
          python3 scripts/test_ci_ctest.py
          python3 scripts/test_ci_efficiency.py
          python3 scripts/test_clean_closed_pr_caches.py
          python3 scripts/test_check_ext_message_stop_accept.py

      - name: Configure the CTest registry
        run: cmake -S . -B build-source-guards -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Verify the complete source-guard inventory
        run: >-
          python3 scripts/check-source-guard-inventory.py
          --build-dir build-source-guards

      - name: Run every registered source guard
        working-directory: build-source-guards
        run: ctest -L source-guard --no-tests=error --output-on-failure

  # Offline regression tests for the local PQ testnet tooling: the root-run
  # service drivers, the root-service snapshot installer, planning, and the
  # config-34 proof helper. They need the locked Python dependencies and the
  # generated TL API, so they run here rather than as configure-only CTest
  # guards. Every test works in a temporary directory; none reads /data,
  # starts a node, or talks to a systemd unit.
  local-testnet-python:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up repository Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'

      - name: Set up uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6

      # The replay tool's only dependency, at the version its launcher pins.
      - name: Local CI replay parallelism tests
        run: uv run --no-project --with 'pyyaml==6.0.3' python scripts/local-ci/test_local_ci.py

      - name: Prepare generated Python API and dependencies
        run: |
          uv sync --frozen --no-dev
          uv run --frozen test/tostester/generate_tl.py

      - name: Run the Config34 proof tests
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONPATH: scripts
        run: >-
          uv run --frozen pytest -q -p no:cacheprovider
          test/pq-native/test_x02_config34_proof.py
