name: Source guards

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  source-guards:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up repository Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'

      - name: Install configure-time tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build ripgrep

      - name: Configure the CTest registry
        run: cmake -S . -B build-source-guards -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Verify the complete source-guard inventory
        run: >-
          python3 scripts/check-source-guard-inventory.py
          --build-dir build-source-guards

      - name: Run every registered source guard
        working-directory: build-source-guards
        run: ctest -L source-guard --no-tests=error --output-on-failure
