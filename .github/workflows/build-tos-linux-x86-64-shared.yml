name: Ubuntu TOS build (x86-64)

on:
  pull_request:
    branches: [main, master, testnet]
    types: [opened, reopened, synchronize, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

permissions:
  contents: read
  packages: read

jobs:
  build:
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    # Reuse the existing per-userspace Clang 21/uv builder image.
    # Image promotion/digest locking is a separate qualification boundary.
    container:
      image: ghcr.io/${{ github.repository }}-builder:${{ matrix.os }}
      credentials:
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GITHUB_TOKEN }}

    steps:
    - name: Check out repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        fetch-depth: 0

    - name: Trust this checkout for repository tests
      run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

    # test-quorum-static-grep is part of the full CTest registry and fails
    # closed when its search tool is absent. Keep that dependency explicit
    # rather than relying on the contents of the pre-built builder image.
    - name: Install source-guard search tool
      run: |
        apt-get update
        apt-get install -y ripgrep

    - name: Date Stamp
      id: date-stamp
      run: |
        echo "timestamp=$(date -u "+%Y%m%d%H%M_%S")" >> "$GITHUB_OUTPUT"

    - name: Restore cache TOS
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ~/.ccache
        key: ${{ runner.os }}-${{ runner.arch }}-${{ matrix.os }}-shared-ccache-${{ steps.date-stamp.outputs.timestamp }}
        restore-keys: ${{ runner.os }}-${{ runner.arch }}-${{ matrix.os }}-shared-ccache

    - name: Build TOS
      run: ci/run native-build

    - name: Verify the build does not modify the source tree
      run: |
        test ! -e "$GITHUB_WORKSPACE/crypto/smartcont/auto"
        git -C "$GITHUB_WORKSPACE" \
          -c safe.directory="$GITHUB_WORKSPACE" \
          diff --exit-code

    - name: Run unit tests
      run: ci/run native-tests

    - name: Prepare Python environment
      run: ci/run native-python-env

    - name: Run complete and targeted Python regressions
      run: ci/run native-python

    - name: Run integration tests
      run: ci/run native-integrations

    - name: Run toslib integration test
      run: ci/run installed-consumer
