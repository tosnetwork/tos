name: Ubuntu TOS build (x86-64)

on:
  pull_request:
    branches: [master, testnet, main]
    types: [opened, reopened, synchronize, ready_for_review]
  push:
    branches: [master, testnet, main]
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  build:
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    # Use pre-built builder image with Clang 21 + uv already installed.
    # No external script downloads at build time — eliminates supply chain risk.
    container:
      image: ghcr.io/${{ github.repository }}-builder:${{ matrix.os }}
      credentials:
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GITHUB_TOKEN }}

    steps:
    - name: Check out repository
      uses: actions/checkout@v7

    - name: Date Stamp
      id: date-stamp
      run: |
        echo "timestamp=$(date -u "+%Y%m%d%H%M_%S")" >> "$GITHUB_OUTPUT"

    - name: Restore cache TOS
      uses: actions/cache@v6
      with:
        path: ~/.ccache
        key: ${{ runner.os }}-${{ runner.arch }}-${{ matrix.os }}-shared-ccache-${{ steps.date-stamp.outputs.timestamp }}
        restore-keys: ${{ runner.os }}-${{ runner.arch }}-${{ matrix.os }}-shared-ccache

    # Rust toolchain needed for Rust crates under tosctl/src.
    - name: Install pinned Rust toolchain
      uses: actions-rust-lang/setup-rust-toolchain@v1.17.0
      with:
        toolchain: 1.91.1
        cache: false
        rustflags: ""

    - name: Build TOS
      run: |
        mkdir -p ~/.ccache
        cp assembly/native/build-ubuntu-shared.sh .
        chmod +x build-ubuntu-shared.sh
        ./build-ubuntu-shared.sh -t -c
        ccache -sp

    - name: Run unit tests
      run: |
        cd build
        ctest --output-on-failure --timeout 1800

    - name: Prepare Python environment
      run: |
        uv sync --no-dev
        uv run test/tostester/generate_tl.py

    - name: Run tostester tests
      run: |
        uv run pytest

    - name: Run integration tests
      run: |
        # Keep the default CI suite explicit.  Release-level runners in this
        # directory require a scenario subcommand and intentionally retain
        # multi-node artifacts; they must not be invoked implicitly.
        integration_tests=(
          test/integration/test_basic.py
        )
        for script in "${integration_tests[@]}"; do
          echo "$script"
          uv run python "$script"
        done
        uv run python test/integration/test_simplex2_release.py --help

    - name: Run toslib integration test
      run: |
        ./test/toslib/integration/test_integration.sh
