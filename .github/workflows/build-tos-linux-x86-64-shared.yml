name: Ubuntu TOS build (x86-64)

on:
  # The platform matrix (platform-matrix.yml) runs this for every pull request
  # into main and every push to main that can affect a build, and nightly
  # without the compile cache. It decides relevance itself, so this workflow
  # has no path filter of its own.
  workflow_dispatch:
  workflow_call:
    inputs:
      no_ccache:
        description: Build without the compile cache, so a cached object cannot hide a broken build
        type: boolean
        default: false

# A literal group: inside a call, github.workflow is the caller's name, so every
# matrix member would share one group. A pull request cancels its own older run;
# any other run (a push, the nightly run) is never cancelled by another. The
# cached and uncached builds of one run are separate groups.
concurrency:
  group: linux-x86-64-shared-${{ inputs.no_ccache && 'no-ccache' || 'ccache' }}-${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io

permissions:
  contents: read
  packages: read

jobs:
  build:
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
    timeout-minutes: 190
    runs-on: ${{ matrix.os }}
    # Use pre-built builder image with Clang 21 + uv already installed.
    # No external script downloads at build time — eliminates supply chain risk.
    container:
      image: ghcr.io/${{ github.repository }}-builder:${{ matrix.os }}
      credentials:
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GITHUB_TOKEN }}

    steps:
    - name: Check out repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        fetch-depth: 0

    - name: Trust this checkout for repository tests
      run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

    # test-quorum-static-grep is part of the full CTest registry and fails
    # closed when its search tool is absent. Keep that dependency explicit
    # rather than relying on the contents of the pre-built builder image.
    - name: Install source-guard search tool
      run: |
        apt-get update
        apt-get install -y ripgrep

    - name: Date Stamp
      id: date-stamp
      run: |
        echo "timestamp=$(date -u "+%Y%m%d%H%M_%S")" >> "$GITHUB_OUTPUT"

    # Pull requests read the cache that pushes to main save; saving one per pull
    # request would evict it. The uncached build neither reads nor writes it.
    - name: Restore cache TOS
      if: ${{ !inputs.no_ccache }}
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ~/.ccache
        key: ${{ runner.os }}-${{ runner.arch }}-${{ matrix.os }}-shared-ccache-${{ steps.date-stamp.outputs.timestamp }}
        restore-keys: ${{ runner.os }}-${{ runner.arch }}-${{ matrix.os }}-shared-ccache

    # Rust toolchain needed for Rust crates under tosctl/src.
    - name: Install repository-pinned Rust toolchain
      run: scripts/install-rust-toolchain.sh

    - name: Build TOS
      env:
        CCACHE_FLAG: ${{ !inputs.no_ccache && '-c' || '' }}
      run: |
        mkdir -p ~/.ccache
        cp assembly/native/build-ubuntu-shared.sh .
        chmod +x build-ubuntu-shared.sh
        ./build-ubuntu-shared.sh -t $CCACHE_FLAG
        if [ -n "$CCACHE_FLAG" ]; then ccache -sp; fi

    - name: Save cache TOS
      if: ${{ always() && !inputs.no_ccache && github.event_name != 'pull_request' }}
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ~/.ccache
        key: ${{ runner.os }}-${{ runner.arch }}-${{ matrix.os }}-shared-ccache-${{ steps.date-stamp.outputs.timestamp }}

    - name: Verify the build does not modify the source tree
      run: |
        test ! -e "$GITHUB_WORKSPACE/crypto/smartcont/auto"
        git -C "$GITHUB_WORKSPACE" \
          -c safe.directory="$GITHUB_WORKSPACE" \
          diff --exit-code

    - name: Run unit tests
      run: |
        cd build
        ctest --output-on-failure --timeout 1800

    - name: Prepare Python environment
      run: |
        uv sync --no-dev
        uv run test/tostester/generate_tl.py

    - name: Run Q01 and Z01 targeted Python tests
      run: |
        PYTHONDONTWRITEBYTECODE=1 uv run python -m pytest \
          test/pq-native/test_n6_startup_not_synced.py \
          test/pq-native/test_z01_final_capture.py \
          test/pq-native/test_z01_proof_controls.py

    - name: Run tostester tests
      run: |
        uv run pytest

    - name: Run integration tests
      run: |
        # Keep the default CI suite explicit.  Release-level runners in this
        # directory require a scenario subcommand and intentionally retain
        # multi-node artifacts; they must not be invoked implicitly.
        integration_tests=(
          test/integration/test_basic.py
          test/integration/test_manager_session_identity.py
        )
        for script in "${integration_tests[@]}"; do
          echo "$script"
          if [ "$script" = "test/integration/test_manager_session_identity.py" ]; then
            uv run python "$script" \
              --build-dir build \
              --artifact-dir "build/manager-session-identity-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          else
            uv run python "$script"
          fi
        done
        uv run python test/integration/test_simplex2_release.py --help

    - name: Run toslib integration test
      run: |
        ./test/toslib/integration/test_integration.sh
