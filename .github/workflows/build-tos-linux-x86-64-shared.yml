name: Ubuntu TOS build (x86-64)

on:
  pull_request:
    branches: [master, testnet, main]
    types: [opened, reopened, synchronize, ready_for_review]
  push:
    branches: [master, testnet, main]
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  build:
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    # Use pre-built builder image with Clang 21 + uv already installed.
    # No external script downloads at build time — eliminates supply chain risk.
    container:
      image: ghcr.io/${{ github.repository }}-builder:${{ matrix.os }}
      credentials:
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GITHUB_TOKEN }}

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Date Stamp
      id: date-stamp
      run: |
        echo "timestamp=$(date -u "+%Y%m%d%H%M_%S")" >> "$GITHUB_OUTPUT"

    - name: Restore cache TOS
      uses: actions/cache@v4
      with:
        path: ~/.ccache
        key: ${{ runner.os }}-${{ runner.arch }}-${{ matrix.os }}-shared-ccache-${{ steps.date-stamp.outputs.timestamp }}
        restore-keys: ${{ runner.os }}-${{ runner.arch }}-${{ matrix.os }}-shared-ccache

    # Rust toolchain needed for corrosion-rs / libuno_plonky3_ffi
    # (`cmake ..` calls `find_package(Rust)` via `third-party/corrosion`
    # since M-P2 Phase 2; pinned 1.91.1 matches tosctl/src/rust-toolchain.toml
    # and .github/workflows/uno-ci.yml).
    - name: Install pinned Rust toolchain
      uses: actions-rs/toolchain@v1
      with:
        toolchain: 1.91.1
        profile: minimal

    # JDK 8 needed by jvm/avata/makefile to compile rt.jar / api.jar
    # (Avata's Java standard library, baked into the interpreter via
    # TOS_AVATA_DEFAULT_RT_JAR).  Avata targets Java 8 bytecode
    # (`-source 1.8 -target 1.8` at jvm/avata/makefile:160) and the
    # makefile caps host-java-version at 8 (line 16-17), so JDK 8 is the
    # minimal sufficient version and avoids forward-compat surprises
    # from newer JDKs.
    - name: Install OpenJDK 8
      run: |
        apt-get update
        apt-get install -y --no-install-recommends openjdk-8-jdk-headless
        echo "JAVA_HOME=/usr/lib/jvm/java-8-openjdk-amd64" >> "$GITHUB_ENV"

    - name: Build TOS
      run: |
        mkdir -p ~/.ccache
        cp assembly/native/build-ubuntu-shared.sh .
        chmod +x build-ubuntu-shared.sh
        ./build-ubuntu-shared.sh -t -c
        ccache -sp

    - name: Run unit tests
      run: |
        cd build
        ctest --output-on-failure --timeout 1800

    - name: Prepare Python environment
      run: |
        uv sync --no-dev
        uv run test/tostester/generate_tl.py

    - name: Run tostester tests
      run: |
        uv run pytest

    - name: Run integration tests
      run: |
        for script in test/integration/*.py; do
          echo $script
          uv run $script
        done

    - name: Run toslib integration test
      run: |
        ./test/toslib/integration/test_integration.sh
