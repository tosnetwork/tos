name: Apply queued history resolution wiring

on:
  push:
    branches:
      - feat/validator-auth-p0

permissions:
  contents: write

jobs:
  edit-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Install focused native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld cmake ninja-build pkg-config libssl-dev libsodium-dev liblz4-dev zlib1g-dev gperf
      - name: Apply exact frozen-manager queue wiring
        run: |
          set -euo pipefail
          python3 tools/validator-auth/apply-task3-queue.py
          git diff --check
          python3 test/validator-auth-implementation/check_history_resolution_queue_wiring.py
      - name: Build and run queue cases and mutations
        run: |
          set -euo pipefail
          cmake -S . -B build-p0 -G Ninja -DCMAKE_BUILD_TYPE=Release -DTOS_ARCH= \
            -DTOS_BUILD_P0_IMPLEMENTATION_TESTS=ON -DUSE_QUIC=OFF \
            -DTOS_USE_ROCKSDB=OFF -DTOS_USE_ABSEIL=OFF -DTOS_USE_LLD=ON \
            -DCMAKE_SKIP_INSTALL_RULES=ON \
            -DOPENSSL_CRYPTO_LIBRARY="$(pkg-config --variable=libdir openssl)/libcrypto.so" \
            -DOPENSSL_SSL_LIBRARY="$(pkg-config --variable=libdir openssl)/libssl.so" \
            -DOPENSSL_INCLUDE_DIR="$(pkg-config --variable=includedir openssl)"
          cmake --build build-p0 --target test-p0-history-resolution-queue -j2
          build-p0/validator/auth/test-p0-history-resolution-queue | tee task3-queue.txt
          cmake -S . -B build-p0-sanitized -G Ninja -DCMAKE_BUILD_TYPE=Release -DTOS_ARCH= \
            -DTOS_BUILD_P0_IMPLEMENTATION_TESTS=ON -DUSE_QUIC=OFF \
            -DTOS_USE_ASAN=ON -DTOS_USE_UBSAN=ON \
            -DTOS_USE_ROCKSDB=OFF -DTOS_USE_ABSEIL=OFF -DTOS_USE_LLD=ON \
            -DCMAKE_SKIP_INSTALL_RULES=ON \
            -DOPENSSL_CRYPTO_LIBRARY="$(pkg-config --variable=libdir openssl)/libcrypto.so" \
            -DOPENSSL_SSL_LIBRARY="$(pkg-config --variable=libdir openssl)/libssl.so" \
            -DOPENSSL_INCLUDE_DIR="$(pkg-config --variable=includedir openssl)"
          cmake --build build-p0-sanitized --target test-p0-history-resolution-queue -j2
          ASAN_OPTIONS=detect_leaks=1:detect_stack_use_after_return=1 UBSAN_OPTIONS=halt_on_error=1 \
            build-p0-sanitized/validator/auth/test-p0-history-resolution-queue | tee task3-queue-sanitized.txt
          python3 test/validator-auth-implementation/history_resolution_queue_mutations.py task3-mutations | tee task3-mutations.txt
      - name: Verify frozen production boundary
        run: |
          set -euo pipefail
          python3 test/validator-auth-p0/check_production.py --out task3-production.json
          python3 test/validator-auth-p0/freeze_record.py
          python3 test/validator-auth-implementation/check_history_resolution_queue_wiring.py
      - name: Commit verified queue wiring
        run: |
          set -euo pipefail
          expected=$'.github/workflows/task3-history-resolution-queue-edit.yml\ndoc/validator-auth-p0-native-insertions.json\ntools/validator-auth/apply-task3-queue.py\nvalidator/manager.cpp\nvalidator/manager.hpp'
          test "$(git diff --name-only | sort)" = "$expected"
          git rm .github/workflows/task3-history-resolution-queue-edit.yml tools/validator-auth/apply-task3-queue.py
          git config user.name gtosnetwork-dotcom
          git config user.email gtosnetwork@gmail.com
          git add validator/manager.cpp validator/manager.hpp doc/validator-auth-p0-native-insertions.json
          git commit -m 'Queue validator auth history requests during resolution'
          git push origin HEAD:feat/validator-auth-p0
