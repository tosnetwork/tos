name: Wallet bridge trust
on:
  pull_request:
    paths:
      - 'sdk/js/packages/connect/**'
      - '.github/workflows/connect-trust.yml'
  schedule:
    - cron: '37 6 * * 0'
concurrency:
  group: connect-trust-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
jobs:
  connect-trust:
    timeout-minutes: 30
    runs-on: ${{ (vars.SELF_HOSTED_LINUX == 'true' && (
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       contains(fromJSON(vars.CI_TRUSTED_LOGINS), github.event.pull_request.user.login) &&
       contains(fromJSON(vars.CI_TRUSTED_LOGINS), github.triggering_actor))))
      && fromJSON('["self-hosted","linux","x64","tos-vm"]') || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install locked SDK dependencies
        working-directory: sdk/js
        run: |
          corepack enable
          pnpm install --frozen-lockfile
      - name: Verify encrypted pairing and session trust
        working-directory: sdk/js
        run: |
          pnpm --filter @tos/connect typecheck
          pnpm --filter @tos/connect test
