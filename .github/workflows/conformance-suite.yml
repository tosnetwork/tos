name: Conformance suite

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: conformance-suite-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  conformance:
    name: Conformance (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86-64
            runner: ubuntu-24.04
            cpu: x86-64-v2
          - arch: arm64
            runner: ubuntu-24.04-arm
            cpu: armv8-a
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    env:
      # Secrets are not passed to pull requests from forks; those run the in-tree seed vectors only.
      VECTORS_KEY_PRESENT: ${{ secrets.CONFORMANCE_VECTORS_DEPLOY_KEY != '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Read the pinned vectors commit
        id: pin
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          pin = json.load(open("test/conformance/VECTORS"))
          print(f"commit={pin['commit']}")
          PY
      - name: Check out the pinned conformance vectors
        if: env.VECTORS_KEY_PRESENT == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: tosnetwork/conformance-vectors
          ref: ${{ steps.pin.outputs.commit }}
          path: conformance-vectors
          ssh-key: ${{ secrets.CONFORMANCE_VECTORS_DEPLOY_KEY }}
          persist-credentials: false
      - name: Report a run without the external vectors
        if: env.VECTORS_KEY_PRESENT != 'true'
        run: echo "::warning title=Conformance vectors::no read access to the vectors repository (fork pull request); only the in-tree seed vectors run"
      - name: Check and prepare LLVM DNS on the ephemeral runner
        run: |
          python3 scripts/test_llvm_dns_fallback.py --controls
          sudo python3 scripts/ensure-llvm-dns.py --ephemeral-runner
      - name: Install the release toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build pkg-config autoconf automake libtool libjemalloc-dev libgmp-dev libssl-dev gperf
          sudo scripts/install-llvm-toolchain.sh 21
          clang++-21 --version
      - uses: ./.github/actions/native-cache
        with:
          profile: conformance-release
          max-size: 2G
      - name: Configure
        env:
          CPU: ${{ matrix.cpu }}
        run: |
          vectors=()
          if [ -d conformance-vectors ]; then vectors=(-DCONFORMANCE_VECTORS_DIR="$PWD/conformance-vectors"); fi
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang-21 -DCMAKE_CXX_COMPILER=clang++-21 \
            -DTOS_ARCH="$CPU" -DPORTABLE="$CPU" -DTOS_USE_JEMALLOC=ON "${vectors[@]}"
      - name: Build the reference library, its drivers and the replay tools
        run: |
          cmake --build build --parallel "$(nproc)" --target test/conformance/all emulator test-epoch-replay \
            test-vm-endstate test-pq-suite-parity test-vm-opcode-table test-pq-v16-parity test-pq-falcon512-parity \
            test-fee-native-cost pq-bytes-vectors-gen config43-vectors-gen authorisation-preimage-vectors-gen \
            descriptor-verdict-vectors-gen validator-session-vectors-gen test-varuint-codec test-storage-encoding \
            test-gas-purchase test-tl-cli-fixtures
      - name: Run the conformance gate
        run: |
          set -o pipefail
          ctest --test-dir build -L '^conformance$' --no-tests=error --output-on-failure 2>&1 | tee ctest.log
          # With the vectors checked out, every test must have run: a skip is not a pass.
          if [ -d conformance-vectors ] && grep -q 'Skipped' ctest.log; then
            echo "::error title=Conformance gate::a conformance test was skipped with the external vectors present"
            exit 1
          fi
