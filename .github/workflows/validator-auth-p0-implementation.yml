  config-json:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install native dependency headers
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake pkg-config libssl-dev
      - name: Preserve P0 bindings through native config and voting clients
        run: |
          set -euo pipefail
          mkdir -p artifacts
          git rev-parse HEAD > artifacts/commit.txt
          cargo fmt --manifest-path tosctl/src/Cargo.toml -p chain_block -p chain_block_json -p control-client -p service -- --check
          cargo test --locked --manifest-path tosctl/src/Cargo.toml -p chain_block_json --lib 2>&1 | tee artifacts/config-json.txt
          cargo test --locked --manifest-path tosctl/src/Cargo.toml -p control-client -p service p0_ -- --nocapture 2>&1 | tee artifacts/config-clients.txt
      - name: Compile binding, numeric and JSON guard removals
        if: matrix.runner == 'ubuntu-24.04'
        run: |
          python3 test/validator-auth-implementation/config_json_mutations.py --out artifacts/config-json-mutations.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: validator-p0-config-json-${{ matrix.runner }}
          path: artifacts/
          retention-days: 14
          if-no-files-found: error
