name: Validator P0 implementation

on:
  pull_request:
    paths:
      - 'validator/auth/**'
      - 'keyring/**'
      - 'crypto/**'
      - 'emulator/**'
      - 'tos/tos-types.h'
      - 'validator/impl/**'
      - 'tosctl/src/vm/**'
      - 'tosctl/src/block/**'
      - 'tosctl/src/node-control/control-client/src/config_params.rs'
      - 'tosctl/src/node-control/service/src/voting/voting_provider.rs'
      - 'tosctl/src/assembler/**'
      - 'tosctl/src/validator-auth-crypto/**'
      - 'tosctl/src/validator-auth/**'
      - 'tosctl/src/validator-auth-native/**'
      - 'tosctl/src/Cargo.toml'
      - 'tosctl/src/Cargo.lock'
      - 'test/validator-auth-implementation/**'
      - 'tools/validator-auth/**'
      - 'doc/validator-auth-p0/**'
      - 'doc/validator-auth-p0-freeze.json'
      - 'doc/validator-auth-p0-native-insertions.json'
      - 'test/validator-auth-p0/**'
      - 'CMakeLists.txt'
      - 'test/CMakeLists.txt'
      - '.github/workflows/validator-auth-p0-implementation.yml'
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: validator-p0-implementation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  implementation:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install native library dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld cmake ninja-build pkg-config libssl-dev libsodium-dev liblz4-dev zlib1g-dev gperf
      - name: Build production libraries and focused drivers
        run: |
          set -euo pipefail
          mkdir -p artifacts
          git rev-parse HEAD > artifacts/commit.txt
          python3 tools/validator-auth/generate.py
          cargo fmt --manifest-path tosctl/src/Cargo.toml -p tos-validator-auth -p tos-validator-auth-native -p tos-validator-auth-crypto -- --check
          cargo clippy --locked --manifest-path tosctl/src/Cargo.toml -p tos-validator-auth -p tos-validator-auth-native -p tos-validator-auth-crypto --all-targets --no-deps -- -D warnings
          cargo build --locked --manifest-path tosctl/src/Cargo.toml -p tos-validator-auth -p tos-validator-auth-native -p tos-validator-auth-crypto --bins
          cmake -S . -B build-p0 -G Ninja -DCMAKE_BUILD_TYPE=Release -DTOS_ARCH= \
            -DTOS_BUILD_P0_IMPLEMENTATION_TESTS=ON -DUSE_QUIC=OFF \
            -DTOS_USE_ROCKSDB=OFF -DTOS_USE_ABSEIL=OFF -DTOS_USE_LLD=ON \
            -DCMAKE_SKIP_INSTALL_RULES=ON \
            -DOPENSSL_CRYPTO_LIBRARY="$(pkg-config --variable=libdir openssl)/libcrypto.so" \
            -DOPENSSL_SSL_LIBRARY="$(pkg-config --variable=libdir openssl)/libssl.so" \
            -DOPENSSL_INCLUDE_DIR="$(pkg-config --variable=includedir openssl)"
          export FUNC_BIN="$PWD/build-p0/crypto/func" FIFT_BIN="$PWD/build-p0/crypto/fift"
          cmake --build build-p0 --target func fift -j2
          cmake --build build-p0 --target emulator test-p0-vm test-p0-vm-adapter test-p0-committee test-p0-registry-view test-p0-committee-proof test-p0-implementation test-p0-transfer test-p0-transport test-p0-cells test-p0-state test-p0-proof test-p0-authority test-p0-journal test-p0-signer test-p0-sync test-p0-channel test-p0-process test-p0-object-store test-p0-issuer test-p0-api-semantics test-p0-admin test-p0-admin-process test-p0-api-service test-p0-http test-p0-keyring test-keyring-temp-key -j2
          cmake --build build-p0 --target validator/impl/CMakeFiles/tos_validator.dir/validate-query.cpp.o -j2
          cmake -S . -B build-p0-sanitized -G Ninja -DCMAKE_BUILD_TYPE=Release -DTOS_ARCH= \
            -DTOS_BUILD_P0_IMPLEMENTATION_TESTS=ON -DUSE_QUIC=OFF \
            -DTOS_USE_ASAN=ON -DTOS_USE_UBSAN=ON \
            -DTOS_USE_ROCKSDB=OFF -DTOS_USE_ABSEIL=OFF -DTOS_USE_LLD=ON \
            -DCMAKE_SKIP_INSTALL_RULES=ON \
            -DOPENSSL_CRYPTO_LIBRARY="$(pkg-config --variable=libdir openssl)/libcrypto.so" \
            -DOPENSSL_SSL_LIBRARY="$(pkg-config --variable=libdir openssl)/libssl.so" \
            -DOPENSSL_INCLUDE_DIR="$(pkg-config --variable=includedir openssl)"
          cmake --build build-p0-sanitized --target test-p0-keyring-sanitized test-p0-vm test-p0-committee test-p0-proof test-p0-registry-view test-p0-committee-proof -j2
          cargo build --locked --manifest-path tosctl/src/Cargo.toml -p tos_vm --example p0-parity
          cargo build --locked --manifest-path tosctl/src/Cargo.toml -p tos_executor --example pq-tx-parity
      - name: Exercise native VM and contract execution
        run: |
          set -euo pipefail
          python3 test/validator-auth-implementation/vm_crypto_fixtures.py --out artifacts/vm-crypto
          build-p0/test/validator-auth-implementation/test-p0-vm artifacts/vm-fixtures artifacts/vm-crypto | tee artifacts/vm.txt
          tosctl/src/target/debug/examples/p0-parity artifacts/vm-fixtures | tee artifacts/vm-rust.txt
          ASAN_OPTIONS=detect_leaks=1:detect_stack_use_after_return=1 UBSAN_OPTIONS=halt_on_error=1 build-p0-sanitized/test/validator-auth-implementation/test-p0-vm artifacts/vm-fixtures-sanitized artifacts/vm-crypto | tee artifacts/vm-sanitized.txt
          diff -r artifacts/vm-fixtures artifacts/vm-fixtures-sanitized
          build-p0/test/validator-auth-implementation/test-p0-vm-adapter artifacts/vm-fixtures | tee artifacts/vm-getter.txt
          python3 test/validator-auth-implementation/check_vm_transactions.py --build build-p0 --vectors artifacts/vm-fixtures --driver tosctl/src/target/debug/examples/pq-tx-parity --out artifacts/vm-transactions
      - name: Derive complete committees from native election and registry state
        run: |
          set -euo pipefail
          build-p0/test/validator-auth-implementation/test-p0-committee artifacts/committee-fixtures | tee artifacts/committee.txt
          tosctl/src/target/debug/committee-conformance artifacts/committee-fixtures | tee artifacts/committee-rust.txt
          ASAN_OPTIONS=detect_leaks=1:detect_stack_use_after_return=1 UBSAN_OPTIONS=halt_on_error=1 build-p0-sanitized/test/validator-auth-implementation/test-p0-committee artifacts/committee-fixtures-sanitized | tee artifacts/committee-sanitized.txt
          diff -r artifacts/committee-fixtures artifacts/committee-fixtures-sanitized
          build-p0/test/validator-auth-implementation/test-p0-registry-view artifacts/registry-view-fixtures | tee artifacts/registry-view.txt
          tosctl/src/target/debug/registry-view-conformance artifacts/registry-view-fixtures | tee artifacts/registry-view-rust.txt
          build-p0/test/validator-auth-implementation/test-p0-committee-proof artifacts/committee-fixtures artifacts/committee-proof-fixtures | tee artifacts/committee-proof.txt
          tosctl/src/target/debug/committee-proof-conformance artifacts/committee-proof-fixtures | tee artifacts/committee-proof-rust.txt
          ASAN_OPTIONS=detect_leaks=1:detect_stack_use_after_return=1 UBSAN_OPTIONS=halt_on_error=1 build-p0-sanitized/test/validator-auth-implementation/test-p0-registry-view artifacts/registry-view-fixtures-sanitized | tee artifacts/registry-view-sanitized.txt
          ASAN_OPTIONS=detect_leaks=1:detect_stack_use_after_return=1 UBSAN_OPTIONS=halt_on_error=1 build-p0-sanitized/test/validator-auth-implementation/test-p0-committee-proof artifacts/committee-fixtures-sanitized artifacts/committee-proof-fixtures-sanitized | tee artifacts/committee-proof-sanitized.txt
          diff -r artifacts/registry-view-fixtures artifacts/registry-view-fixtures-sanitized
          diff -r artifacts/committee-proof-fixtures artifacts/committee-proof-fixtures-sanitized
      - name: Exercise frozen contracts through production libraries
        run: |
          set -euo pipefail
          python3 test/validator-auth-p0/freeze_record.py
          python3 test/validator-auth-p0/check_production.py --out artifacts/historical-boundary.json
          build-p0/test/validator-auth-implementation/test-p0-keyring "$RUNNER_TEMP/p0-keyring" | tee artifacts/keyring.txt
          ASAN_OPTIONS=detect_leaks=1:detect_stack_use_after_return=1 UBSAN_OPTIONS=halt_on_error=1 build-p0-sanitized/test/validator-auth-implementation/test-p0-keyring-sanitized "$RUNNER_TEMP/p0-keyring-sanitized" | tee artifacts/keyring-sanitized.txt
          python3 test/validator-auth-implementation/check_sanitizer_link.py --build build-p0-sanitized --out artifacts/sanitizer-link.json
          (cd "$RUNNER_TEMP" && "$GITHUB_WORKSPACE/build-p0/test-keyring-temp-key") | tee artifacts/legacy-keyring.txt
          python3 test/validator-auth-implementation/check.py \
            --cpp build-p0/test/validator-auth-implementation/test-p0-implementation \
            --rust tosctl/src/target/debug/conformance --out artifacts/implementation.json
          python3 test/validator-auth-implementation/check_lifecycle.py \
            --cpp build-p0/test/validator-auth-implementation/test-p0-implementation --out artifacts/lifecycle.json
          python3 test/validator-auth-implementation/check_lifecycle.py \
            --driver tosctl/src/target/debug/conformance --out artifacts/lifecycle-rust.json
          build-p0/test/validator-auth-implementation/test-p0-cells artifacts/native-cell-fixtures | tee artifacts/cells.txt
          build-p0/test/validator-auth-implementation/test-p0-transfer | tee artifacts/transfer.txt
          build-p0/test/validator-auth-implementation/test-p0-object-store | tee artifacts/object-store.txt
          python3 test/validator-auth-implementation/check_api_semantics.py --driver build-p0/test/validator-auth-implementation/test-p0-api-semantics --out artifacts/api-semantics-cpp.json
          python3 test/validator-auth-implementation/check_api_semantics.py --driver tosctl/src/target/debug/conformance --out artifacts/api-semantics-rust.json
          python3 test/validator-auth-implementation/check_service_auth.py --driver build-p0/test/validator-auth-implementation/test-p0-api-semantics --out artifacts/service-auth-cpp.json
          python3 test/validator-auth-implementation/check_service_auth.py --driver tosctl/src/target/debug/conformance --out artifacts/service-auth-rust.json
          build-p0/test/validator-auth-implementation/test-p0-state | tee artifacts/state.txt
          build-p0/test/validator-auth-implementation/test-p0-proof artifacts/native-proof-fixtures | tee artifacts/proofs.txt
          ASAN_OPTIONS=detect_leaks=1:detect_stack_use_after_return=1 UBSAN_OPTIONS=halt_on_error=1 build-p0-sanitized/test/validator-auth-implementation/test-p0-proof artifacts/native-proof-fixtures-sanitized | tee artifacts/proofs-sanitized.txt
          diff -r artifacts/native-proof-fixtures artifacts/native-proof-fixtures-sanitized
          python3 test/validator-auth-implementation/check_native.py --rust tosctl/src/target/debug/native-conformance --cpp build-p0/test/validator-auth-implementation/test-p0-implementation --cells artifacts/native-cell-fixtures --proofs artifacts/native-proof-fixtures --out artifacts/rust-native.json
          build-p0/test/validator-auth-implementation/test-p0-authority | tee artifacts/authorities.txt
          P0_EVIDENCE_TMP="$(mktemp -d)"
          build-p0/test/validator-auth-implementation/test-p0-api-service "$P0_EVIDENCE_TMP/api" tosctl/src/target/debug/conformance tosctl/src/target/debug/native-conformance | tee artifacts/api-service.txt
          python3 test/validator-auth-implementation/check_http.py --cpp build-p0/test/validator-auth-implementation/test-p0-http --rust tosctl/src/target/debug/conformance --out artifacts/http.json
          python3 test/validator-auth-implementation/check_client.py --driver tosctl/src/target/debug/conformance --native tosctl/src/target/debug/native-conformance --proofs artifacts/native-proof-fixtures --out artifacts/client.json
          build-p0/test/validator-auth-implementation/test-p0-admin "$P0_EVIDENCE_TMP/admin" | tee artifacts/admin.txt
          build-p0/test/validator-auth-implementation/test-p0-admin-process "$P0_EVIDENCE_TMP/admin-process" | tee artifacts/admin-process.txt
          build-p0/test/validator-auth-implementation/test-p0-issuer "$P0_EVIDENCE_TMP/issuer" | tee artifacts/issuer.txt
          build-p0/test/validator-auth-implementation/test-p0-journal "$P0_EVIDENCE_TMP/journal" | tee artifacts/journal.txt
          build-p0/test/validator-auth-implementation/test-p0-signer "$P0_EVIDENCE_TMP/signer" | tee artifacts/signer.txt
          build-p0/test/validator-auth-implementation/test-p0-sync "$P0_EVIDENCE_TMP/sync" | tee artifacts/sync.txt
          build-p0/test/validator-auth-implementation/test-p0-channel "$P0_EVIDENCE_TMP/channel" | tee artifacts/channel.txt
          build-p0/test/validator-auth-implementation/test-p0-process "$P0_EVIDENCE_TMP/process" | tee artifacts/process-rehearsal.txt
          python3 test/validator-auth-implementation/check_transport.py \
            --driver build-p0/test/validator-auth-implementation/test-p0-transport | tee artifacts/transport-cpp.json
          python3 test/validator-auth-implementation/check_transport.py \
            --driver tosctl/src/target/debug/conformance | tee artifacts/transport-rust.json
      - name: Compile guard removals and require assertion failures
        if: matrix.runner == 'ubuntu-24.04'
        run: |
          set -euo pipefail
          python3 test/validator-auth-implementation/mutations.py \
            --rust tosctl/src/target/debug/conformance --out artifacts/cpp-mutations.json
          python3 test/validator-auth-implementation/rust_mutations.py \
            --cpp build-p0/test/validator-auth-implementation/test-p0-implementation --out artifacts/rust-mutations.json
          python3 test/validator-auth-implementation/cell_mutations.py --build build-p0 --out artifacts/cell-mutations.json
          python3 test/validator-auth-implementation/native_module_mutations.py --build build-p0 --out artifacts/native-modules.json
          python3 test/validator-auth-implementation/journal_mutations.py --build build-p0 --out artifacts/journal-mutations.json
          python3 test/validator-auth-implementation/admin_mutations.py --build build-p0 --out artifacts/admin-mutations.json
          python3 test/validator-auth-implementation/signer_mutations.py --build build-p0 --out artifacts/signer-mutations.json
          python3 test/validator-auth-implementation/channel_mutations.py --build build-p0 --out artifacts/channel-mutations.json
          python3 test/validator-auth-implementation/object_store_mutations.py --build build-p0 --out artifacts/object-store-mutations.json
          python3 test/validator-auth-implementation/issuer_mutations.py --build build-p0 --out artifacts/issuer-mutations.json
          python3 test/validator-auth-implementation/api_semantic_mutations.py --build build-p0 --out artifacts/api-semantic-mutations.json
          python3 test/validator-auth-implementation/api_service_mutations.py --build build-p0 --out artifacts/api-service-mutations.json
          python3 test/validator-auth-implementation/http_mutations.py --language cpp --build build-p0 --out artifacts/http-cpp-mutations.json
          python3 test/validator-auth-implementation/keyring_mutations.py --build build-p0 --out artifacts/keyring-mutations.json
          python3 test/validator-auth-implementation/http_mutations.py --language rust --out artifacts/http-rust-mutations.json
          python3 test/validator-auth-implementation/rust_native_mutations.py --cells artifacts/native-cell-fixtures --proofs artifacts/native-proof-fixtures --out artifacts/rust-native-mutations.json
          export FUNC_BIN="$PWD/build-p0/crypto/func" FIFT_BIN="$PWD/build-p0/crypto/fift"
          python3 test/validator-auth-implementation/vm_mutations.py --build build-p0 --out artifacts/vm-mutations.json
          python3 test/validator-auth-implementation/vm_adapter_mutations.py --build build-p0 --fixtures artifacts/vm-fixtures --driver tosctl/src/target/debug/examples/pq-tx-parity --out artifacts/vm-adapter-mutations.json
          python3 test/validator-auth-implementation/rust_vm_mutations.py --fixtures artifacts/vm-fixtures --out artifacts/rust-vm-mutations.json
          python3 test/validator-auth-implementation/committee_mutations.py --build build-p0 --out artifacts/committee-mutations.json
          python3 test/validator-auth-implementation/rust_committee_mutations.py --fixtures artifacts/committee-fixtures --out artifacts/rust-committee-mutations.json
          python3 test/validator-auth-implementation/registry_view_mutations.py --language cpp --build build-p0 --out artifacts/registry-view-cpp-mutations.json
          python3 test/validator-auth-implementation/registry_view_mutations.py --language rust --fixtures artifacts/registry-view-fixtures --out artifacts/registry-view-rust-mutations.json
          python3 test/validator-auth-implementation/committee_proof_mutations.py --language cpp --build build-p0 --fixtures artifacts/committee-fixtures --out artifacts/committee-proof-cpp-mutations.json
          python3 test/validator-auth-implementation/committee_proof_mutations.py --language rust --fixtures artifacts/committee-proof-fixtures --out artifacts/committee-proof-rust-mutations.json
          python3 test/validator-auth-implementation/fixture_lifetime_mutations.py --build build-p0-sanitized --out artifacts/fixture-lifetime-mutations.json
          git diff --exit-code
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: validator-p0-implementation-${{ matrix.runner }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
