name: Validator P0 implementation

on:
  pull_request:
    paths:
      - 'validator/auth/**'
      - 'keyring/**'
      - 'crypto/**'
      - 'emulator/**'
      - 'tos/tos-types.h'
      - 'validator/impl/**'
      - 'tosctl/src/vm/**'
      - 'tosctl/src/block/**'
      - 'tosctl/src/block-json/**'
      - 'tosctl/src/node-control/control-client/**'
      - 'tosctl/src/node-control/service/src/voting/**'
      - 'tosctl/src/assembler/**'
      - 'tosctl/src/validator-auth-crypto/**'
      - 'tosctl/src/validator-auth/**'
      - 'tosctl/src/validator-auth-native/**'
      - 'tosctl/src/Cargo.toml'
      - 'tosctl/src/Cargo.lock'
      - 'test/validator-auth-implementation/**'
      - 'test/validator-auth-session-birth/**'
      - 'tools/validator-auth/**'
      - 'doc/validator-auth-p0/**'
      - 'doc/validator-auth-p0-freeze.json'
      - 'doc/validator-auth-p0-native-insertions.json'
      - 'test/validator-auth-p0/**'
      - 'CMakeLists.txt'
      - 'test/CMakeLists.txt'
      - '.github/workflows/validator-auth-p0-implementation.yml'
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: validator-p0-implementation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  implementation:
    name: ${{ matrix.check_name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            guards: core
            check_name: implementation (ubuntu-24.04)
          - runner: ubuntu-24.04-arm
            guards: none
            check_name: implementation (ubuntu-24.04-arm)
          - runner: ubuntu-24.04
            guards: services
            check_name: P0 service guards
          - runner: ubuntu-24.04
            guards: state
            check_name: P0 state and proof guards
          - runner: ubuntu-24.04
            guards: native
            check_name: P0 native execution guards
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install native library dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld cmake ninja-build pkg-config libssl-dev libsodium-dev liblz4-dev zlib1g-dev gperf
      - name: Build production libraries and focused drivers
        run: |
          set -euo pipefail
          mkdir -p artifacts
          git rev-parse HEAD > artifacts/commit.txt
          python3 tools/validator-auth/generate.py
          cargo fmt --manifest-path tosctl/src/Cargo.toml -p tos-validator-auth -p tos-validator-auth-native -p tos-validator-auth-crypto -- --check
          cargo clippy --locked --manifest-path tosctl/src/Cargo.toml -p tos-validator-auth -p tos-validator-auth-native -p tos-validator-auth-crypto --all-targets --no-deps -- -D warnings
          cargo build --locked --manifest-path tosctl/src/Cargo.toml -p tos-validator-auth -p tos-validator-auth-native -p tos-validator-auth-crypto --bins
          cmake -S . -B build-p0 -G Ninja -DCMAKE_BUILD_TYPE=Release -DTOS_ARCH= \
            -DTOS_BUILD_P0_IMPLEMENTATION_TESTS=ON -DUSE_QUIC=OFF \
            -DTOS_USE_ROCKSDB=OFF -DTOS_USE_ABSEIL=OFF -DTOS_USE_LLD=ON \
            -DCMAKE_SKIP_INSTALL_RULES=ON \
            -DOPENSSL_CRYPTO_LIBRARY="$(pkg-config --variable=libdir openssl)/libcrypto.so" \
            -DOPENSSL_SSL_LIBRARY="$(pkg-config --variable=libdir openssl)/libssl.so" \
            -DOPENSSL_INCLUDE_DIR="$(pkg-config --variable=includedir openssl)"
          export FUNC_BIN="$PWD/build-p0/crypto/func" FIFT_BIN="$PWD/build-p0/crypto/fift"
          cmake --build build-p0 --target func fift -j2
          cmake --build build-p0 --target emulator test-p0-vm test-p0-vm-adapter test-p0-committee test-p0-registry-view test-p0-committee-proof test-p0-certificate-proof test-p0-certificate-rpc test-p0-implementation test-p0-transfer test-p0-transport test-p0-cells test-p0-state test-p0-state-replay benchmark-p0-c0 test-p0-proof test-p0-authority test-p0-context test-p0-governance test-p0-owner-proof test-p0-native-apply test-p0-native-history test-p0-native-header test-p0-native-evidence test-p0-native-config-context test-p0-native-host-vm test-p0-native-registry test-p0-persistent-apply test-p0-native-transactions test-p0-config-gates test-config-transition test-p0-native-governance test-p0-native-session-id test-p0-native-session-history create-state p0-genesis-tool p0-genesis-probe p0-vset-probe test-p0-journal test-p0-signer test-p0-sync test-p0-channel test-p0-process test-p0-object-store test-p0-issuer test-p0-api-semantics test-p0-admin test-p0-admin-process test-p0-api-service test-p0-http test-p0-keyring test-keyring-temp-key -j2
          cmake --build build-p0 --target validator/impl/CMakeFiles/tos_validator.dir/validate-query.cpp.o -j2
          cmake -S . -B build-p0-sanitized -G Ninja -DCMAKE_BUILD_TYPE=Release -DTOS_ARCH= \
            -DTOS_BUILD_P0_IMPLEMENTATION_TESTS=ON -DUSE_QUIC=OFF \
            -DTOS_USE_ASAN=ON -DTOS_USE_UBSAN=ON \
            -DTOS_USE_ROCKSDB=OFF -DTOS_USE_ABSEIL=OFF -DTOS_USE_LLD=ON \
            -DCMAKE_SKIP_INSTALL_RULES=ON \
            -DOPENSSL_CRYPTO_LIBRARY="$(pkg-config --variable=libdir openssl)/libcrypto.so" \
            -DOPENSSL_SSL_LIBRARY="$(pkg-config --variable=libdir openssl)/libssl.so" \
            -DOPENSSL_INCLUDE_DIR="$(pkg-config --variable=includedir openssl)"
          cmake --build build-p0-sanitized --target test-p0-keyring-sanitized test-p0-vm test-p0-committee test-p0-proof test-p0-registry-view test-p0-committee-proof test-p0-state-replay test-p0-certificate-proof test-p0-certificate-rpc test-p0-context test-p0-governance test-p0-owner-proof test-p0-native-apply test-p0-native-history test-p0-native-header test-p0-native-evidence test-p0-native-config-context test-p0-native-host-vm test-p0-native-registry test-p0-persistent-apply test-p0-native-transactions test-p0-config-gates test-config-transition test-p0-native-governance test-p0-native-session-id test-p0-native-session-history -j2
          cargo build --locked --manifest-path tosctl/src/Cargo.toml -p tos_vm --example p0-parity --example native-host-parity
          cargo build --locked --manifest-path tosctl/src/Cargo.toml -p tos_executor --example pq-tx-parity
      - name: Enforce native configuration admission and transition gates
        run: |
          set -euo pipefail
          build-p0/test/validator-auth-implementation/test-p0-config-gates tosctl/src/block/src/tests/data/config.boc artifacts/config-gates | tee artifacts/config-gates.txt
          tosctl/src/target/debug/config-gates-conformance artifacts/config-gates | tee artifacts/config-gates-rust.txt
          build-p0/test-config-transition | tee artifacts/legacy-config-transition.txt
          ASAN_OPTIONS=detect_leaks=1:detect_stack_use_after_return=1 UBSAN_OPTIONS=halt_on_error=1 build-p0-sanitized/test/validator-auth-implementation/test-p0-config-gates tosctl/src/block/src/tests/data/config.boc artifacts/config-gates-sanitized | tee artifacts/config-gates-sanitized.txt
          ASAN_OPTIONS=detect_leaks=1:detect_stack_use_after_return=1 UBSAN_OPTIONS=halt_on_error=1 build-p0-sanitized/test-config-transition | tee artifacts/legacy-config-transition-sanitized.txt
          diff -r artifacts/config-gates artifacts/config-gates-sanitized
      - name: Exercise native VM and contract execution
        run: |
          set -euo pipefail
          python3 test/validator-auth-implementation/vm_crypto_fixtures.py --out artifacts/vm-crypto
          build-p0/test/validator-auth-implementation/test-p0-vm artifacts/vm-fixtures artifacts/vm-crypto | tee artifacts/vm.txt
          tosctl/src/target/debug/examples/p0-parity artifacts/vm-fixtures | tee artifacts/vm-rust.txt
          ASAN_OPTIONS=detect_leaks=1:detect_stack_use_after_return=1 UBSAN_OPTIONS=halt_on_error=1 build-p0-sanitized/test/validator-auth-implementation/test-p0-vm artifacts/vm-fixtures-sanitized artifacts/vm-crypto | tee artifacts/vm-sanitized.txt
          diff -r artifacts/vm-fixtures artifacts/vm-fixtures-sanitized
          build-p0/test/validator-auth-implementation/test-p0-vm-adapter artifacts/vm-fixtures | tee artifacts/vm-getter.txt
          python3 test/validator-auth-implementation/check_vm_transactions.py --build build-p0 --vectors artifacts/vm-fixtures --driver tosctl/src/target/debug/examples/pq-tx-parity --out artifacts/vm-transactions
      - name: Exercise privileged native VM host isolation
        run: |
          set -euo pipefail
          build-p0/test/validator-auth-implementation/test-p0-native-host-vm artifacts/native-host | tee artifacts/native-host.txt
          tosctl/src/target/debug/examples/native-host-parity artifacts/native-host | tee artifacts/native-host-rust.txt
          ASAN_OPTIONS=detect_leaks=1:detect_stack_use_after_return=1 UBSAN_OPTIONS=halt_on_error=1 build-p0-sanitized/test/validator-auth-implementation/test-p0-native-host-vm artifacts/native-host-sanitized | tee artifacts/native-host-sanitized.txt
          diff -r artifacts/native-host artifacts/native-host-sanitized
      - name: Verify native owner execution and rollback proofs
        run: |
          set -euo pipefail
          for chain in mc shard; do
            workchain=-1
            if [ "$chain" = shard ]; then workchain=0; fi
            python3 test/validator-auth-implementation/owner_fixtures.py --build build-p0 --driver build-p0/test/validator-auth-implementation/test-p0-owner-proof --out "artifacts/owner-transactions-$chain" --workchain "$workchain"
            build-p0/test/validator-auth-implementation/test-p0-owner-proof verify "artifacts/owner-transactions-$chain" "artifacts/owner-proof-$chain" | tee "artifacts/owner-$chain.txt"
            tosctl/src/target/debug/owner-conformance "artifacts/owner-proof-$chain" | tee "artifacts/owner-rust-$chain.txt"
            ASAN_OPTIONS=detect_leaks=1:detect_stack_use_after_return=1 UBSAN_OPTIONS=halt_on_error=1 build-p0-sanitized/test/validator-auth-implementation/test-p0-owner-proof verify "artifacts/owner-transactions-$chain" "artifacts/owner-proof-$chain-sanitized" | tee "artifacts/owner-sanitized-$chain.txt"
            diff -r "artifacts/owner-proof-$chain" "artifacts/owner-proof-$chain-sanitized"
          done
      - name: Authenticate bounded native header witnesses without archive IO
        run: |
          set -euo pipefail
          build-p0/test/validator-auth-implementation/test-p0-native-header artifacts/owner-transactions-mc artifacts/native-header | tee artifacts/native-header.txt
          tosctl/src/target/debug/native-header-conformance artifacts/native-header | tee artifacts/native-header-rust.txt
          ASAN_OPTIONS=detect_leaks=1:detect_stack_use_after_return=1 UBSAN_OPTIONS=halt_on_error=1 build-p0-sanitized/test/validator-auth-implementation/test-p0-native-header artifacts/owner-transactions-mc artifacts/native-header-sanitized | tee artifacts/native-header-sanitized.txt
          diff -r artifacts/native-header artifacts/native-header-sanitized
      - name: Admit transaction-contained typed native evidence
        run: |
          set -euo pipefail
          build-p0/test/validator-auth-implementation/test-p0-native-evidence artifacts/native-header artifacts/native-evidence | tee artifacts/native-evidence.txt
          tosctl/src/target/debug/native-evidence-conformance artifacts/native-evidence | tee artifacts/native-evidence-rust.txt
          ASAN_OPTIONS=detect_leaks=1:detect_stack_use_after_return=1 UBSAN_OPTIONS=halt_on_error=1 build-p0-sanitized/test/validator-auth-implementation/test-p0-native-evidence artifacts/native-header artifacts/native-evidence-sanitized | tee artifacts/native-evidence-sanitized.txt
          diff -r artifacts/native-evidence artifacts/native-evidence-sanitized
      - name: Resolve finalized native history from original block bytes
        run: |
          set -euo pipefail
          build-p0/test/validator-auth-implementation/test-p0-native-history artifacts/owner-transactions-mc artifacts/native-history | tee artifacts/native-history.txt
          tosctl/src/target/debug/native-history-conformance artifacts/native-history | tee artifacts/native-history-rust.txt
          ASAN_OPTIONS=detect_leaks=1:detect_stack_use_after_return=1 UBSAN_OPTIONS=halt_on_error=1 build-p0-sanitized/test/validator-auth-implementation/test-p0-native-history artifacts/owner-transactions-mc artifacts/native-history-sanitized | tee artifacts/native-history-sanitized.txt
          diff -r artifacts/native-history artifacts/native-history-sanitized
      - name: Apply native owner, possession and current identity authority in block order
        run: |
          set -euo pipefail
          for chain in mc shard; do
            workchain=-1
            if [ "$chain" = shard ]; then workchain=0; fi
            python3 test/validator-auth-implementation/owner_fixtures.py --build build-p0 --driver build-p0/test/validator-auth-implementation/test-p0-native-apply --out "artifacts/apply-owner-$chain" --workchain "$workchain"
            build-p0/test/validator-auth-implementation/test-p0-native-apply verify "artifacts/apply-owner-$chain" "artifacts/native-apply-$chain" | tee "artifacts/native-apply-$chain.txt"
            tosctl/src/target/debug/native-apply-conformance "artifacts/native-apply-$chain" | tee "artifacts/native-apply-rust-$chain.txt"
            ASAN_OPTIONS=detect_leaks=1:detect_stack_use_after_return=1 UBSAN_OPTIONS=halt_on_error=1 build-p0-sanitized/test/validator-auth-implementation/test-p0-native-apply verify "artifacts/apply-owner-$chain" "artifacts/native-apply-$chain-sanitized" | tee "artifacts/native-apply-sanitized-$chain.txt"
            diff -r "artifacts/native-apply-$chain" "artifacts/native-apply-$chain-sanitized"
            build-p0/test/validator-auth-implementation/test-p0-persistent-apply verify "artifacts/apply-owner-$chain" "artifacts/persistent-apply-$chain" | tee "artifacts/persistent-apply-$chain.txt"
            tosctl/src/target/debug/native-apply-conformance --persistent "artifacts/persistent-apply-$chain" | tee "artifacts/persistent-apply-rust-$chain.txt"
            ASAN_OPTIONS=detect_leaks=1:detect_stack_use_after_return=1 UBSAN_OPTIONS=halt_on_error=1 build-p0-sanitized/test/validator-auth-implementation/test-p0-persistent-apply verify "artifacts/apply-owner-$chain" "artifacts/persistent-apply-$chain-sanitized" | tee "artifacts/persistent-apply-sanitized-$chain.txt"
            diff -r "artifacts/native-apply-$chain" "artifacts/persistent-apply-$chain"
            build-p0/test/validator-auth-implementation/test-p0-native-transactions verify "artifacts/apply-owner-$chain" "artifacts/native-transactions-$chain" | tee "artifacts/native-transactions-$chain.txt"
            tosctl/src/target/debug/native-apply-conformance --transactions "artifacts/native-transactions-$chain" | tee "artifacts/native-transactions-rust-$chain.txt"
            ASAN_OPTIONS=detect_leaks=1:detect_stack_use_after_return=1 UBSAN_OPTIONS=halt_on_error=1 build-p0-sanitized/test/validator-auth-implementation/test-p0-native-transactions verify "artifacts/apply-owner-$chain" "artifacts/native-transactions-$chain-sanitized" | tee "artifacts/native-transactions-sanitized-$chain.txt"
            diff -r "artifacts/native-apply-$chain" "artifacts/native-transactions-$chain"
            diff -r "artifacts/native-transactions-$chain" "artifacts/native-transactions-$chain-sanitized"
            diff -r "artifacts/persistent-apply-$chain" "artifacts/persistent-apply-$chain-sanitized"
          done
      - name: Derive complete committees from native election and registry state
        run: |
          set -euo pipefail
          build-p0/validator/auth/test-p0-native-session-id | tee artifacts/native-session-id.txt
          ASAN_OPTIONS=detect_leaks=1:detect_stack_use_after_return=1 UBSAN_OPTIONS=halt_on_error=1 build-p0-sanitized/validator/auth/test-p0-native-session-id | tee artifacts/native-session-id-sanitized.txt
          build-p0/test/validator-auth-implementation/test-p0-committee artifacts/committee-fixtures | tee artifacts/committee.txt
          test -x build-p0/validator/auth/test-p0-native-session-history
          build-p0/validator/auth/test-p0-native-session-history artifacts/owner-transactions-mc artifacts/committee-fixtures | tee artifacts/native-session-history.txt
          tosctl/src/target/debug/committee-conformance artifacts/committee-fixtures | tee artifacts/committee-rust.txt
          ASAN_OPTIONS=detect_leaks=1:detect_stack_use_after_return=1 UBSAN_OPTIONS=halt_on_error=1 build-p0-sanitized/test/validator-auth-implementation/test-p0-committee artifacts/committee-fixtures-sanitized | tee artifacts/committee-sanitized.txt
          test -x build-p0-sanitized/validator/auth/test-p0-native-session-history
          ASAN_OPTIONS=detect_leaks=1:detect_stack_use_after_return=1 UBSAN_OPTIONS=halt_on_error=1 build-p0-sanitized/validator/auth/test-p0-native-session-history artifacts/owner-transactions-mc artifacts/committee-fixtures-sanitized | tee artifacts/native-session-history-sanitized.txt
          diff -r artifacts/committee-fixtures artifacts/committee-fixtures-sanitized
          build-p0/test/validator-auth-implementation/test-p0-registry-view artifacts/registry-view-fixtures | tee artifacts/registry-view.txt
          tosctl/src/target/debug/registry-view-conformance artifacts/registry-view-fixtures | tee artifacts/registry-view-rust.txt
          build-p0/test/validator-auth-implementation/test-p0-committee-proof artifacts/committee-fixtures artifacts/committee-proof-fixtures | tee artifacts/committee-proof.txt
          tosctl/src/target/debug/committee-proof-conformance artifacts/committee-proof-fixtures | tee artifacts/committee-proof-rust.txt
          ASAN_OPTIONS=detect_leaks=1:detect_stack_use_after_return=1 UBSAN_OPTIONS=halt_on_error=1 build-p0-sanitized/test/validator-auth-implementation/test-p0-registry-view artifacts/registry-view-fixtures-sanitized | tee artifacts/registry-view-sanitized.txt
          ASAN_OPTIONS=detect_leaks=1:detect_stack_use_after_return=1 UBSAN_OPTIONS=halt_on_error=1 build-p0-sanitized/test/validator-auth-implementation/test-p0-committee-proof artifacts/committee-fixtures-sanitized artifacts/committee-proof-fixtures-sanitized | tee artifacts/committee-proof-sanitized.txt
          diff -r artifacts/registry-view-fixtures artifacts/registry-view-fixtures-sanitized
          diff -r artifacts/committee-proof-fixtures artifacts/committee-proof-fixtures-sanitized
          build-p0/test/validator-auth-implementation/test-p0-certificate-proof artifacts/committee-fixtures artifacts/certificate-proof-fixtures | tee artifacts/certificate-proof.txt
          tosctl/src/target/debug/certificate-proof-conformance artifacts/certificate-proof-fixtures | tee artifacts/certificate-proof-rust.txt
          tosctl/src/target/debug/certificate-client-conformance artifacts/certificate-proof-fixtures | tee artifacts/certificate-client-rust.txt
          build-p0/test/validator-auth-implementation/test-p0-certificate-rpc artifacts/committee-fixtures artifacts/certificate-proof-fixtures tosctl/src/target/debug/certificate-client-conformance | tee artifacts/certificate-rpc.txt
          ASAN_OPTIONS=detect_leaks=1:detect_stack_use_after_return=1 UBSAN_OPTIONS=halt_on_error=1 build-p0-sanitized/test/validator-auth-implementation/test-p0-certificate-proof artifacts/committee-fixtures-sanitized artifacts/certificate-proof-fixtures-sanitized | tee artifacts/certificate-proof-sanitized.txt
          ASAN_OPTIONS=detect_leaks=1:detect_stack_use_after_return=1 UBSAN_OPTIONS=halt_on_error=1 build-p0-sanitized/test/validator-auth-implementation/test-p0-certificate-rpc artifacts/committee-fixtures-sanitized artifacts/certificate-proof-fixtures-sanitized | tee artifacts/certificate-rpc-sanitized.txt
          diff -r artifacts/certificate-proof-fixtures artifacts/certificate-proof-fixtures-sanitized
      - name: Bind native configuration accounts and complete checkpoints
        run: |
          set -euo pipefail
          build-p0/test/validator-auth-implementation/test-p0-native-config-context artifacts/committee-fixtures artifacts/native-config-context | tee artifacts/native-config-context.txt
          tosctl/src/target/debug/native-config-context-conformance artifacts/native-config-context | tee artifacts/native-config-context-rust.txt
          ASAN_OPTIONS=detect_leaks=1:detect_stack_use_after_return=1 UBSAN_OPTIONS=halt_on_error=1 build-p0-sanitized/test/validator-auth-implementation/test-p0-native-config-context artifacts/committee-fixtures artifacts/native-config-context-sanitized | tee artifacts/native-config-context-sanitized.txt
          diff -r artifacts/native-config-context artifacts/native-config-context-sanitized
      - name: Exercise frozen contracts through production libraries
        run: |
          set -euo pipefail
          python3 test/validator-auth-p0/freeze_record.py
          build-p0/test/validator-auth-implementation/test-p0-governance artifacts/governance-fixtures | tee artifacts/governance-cpp.txt
          tosctl/src/target/debug/governance-conformance artifacts/governance-fixtures | tee artifacts/governance-rust.txt
          ASAN_OPTIONS=detect_leaks=1:detect_stack_use_after_return=1 UBSAN_OPTIONS=halt_on_error=1 build-p0-sanitized/test/validator-auth-implementation/test-p0-governance artifacts/governance-fixtures-sanitized | tee artifacts/governance-sanitized.txt
          diff -r artifacts/governance-fixtures artifacts/governance-fixtures-sanitized
          build-p0/test/validator-auth-implementation/test-p0-native-governance artifacts/native-governance-fixtures | tee artifacts/native-governance-cpp.txt
          tosctl/src/target/debug/governance-conformance --native artifacts/native-governance-fixtures | tee artifacts/native-governance-rust.txt
          ASAN_OPTIONS=detect_leaks=1:detect_stack_use_after_return=1 UBSAN_OPTIONS=halt_on_error=1 build-p0-sanitized/test/validator-auth-implementation/test-p0-native-governance artifacts/native-governance-fixtures-sanitized | tee artifacts/native-governance-sanitized.txt
          diff -r artifacts/native-governance-fixtures artifacts/native-governance-fixtures-sanitized
          python3 test/validator-auth-implementation/context_fixtures.py --out artifacts/context-fixtures
          build-p0/test/validator-auth-implementation/test-p0-context artifacts/context-fixtures | tee artifacts/context-cpp.txt
          tosctl/src/target/debug/context-conformance artifacts/context-fixtures | tee artifacts/context-rust.txt
          ASAN_OPTIONS=detect_leaks=1:detect_stack_use_after_return=1 UBSAN_OPTIONS=halt_on_error=1 build-p0-sanitized/test/validator-auth-implementation/test-p0-context artifacts/context-fixtures | tee artifacts/context-sanitized.txt
          python3 test/validator-auth-p0/check_production.py --out artifacts/historical-boundary.json
          build-p0/test/validator-auth-implementation/test-p0-keyring "$RUNNER_TEMP/p0-keyring" | tee artifacts/keyring.txt
          ASAN_OPTIONS=detect_leaks=1:detect_stack_use_after_return=1 UBSAN_OPTIONS=halt_on_error=1 build-p0-sanitized/test/validator-auth-implementation/test-p0-keyring-sanitized "$RUNNER_TEMP/p0-keyring-sanitized" | tee artifacts/keyring-sanitized.txt
          python3 test/validator-auth-implementation/check_sanitizer_link.py --build build-p0-sanitized --out artifacts/sanitizer-link.json
          (cd "$RUNNER_TEMP" && "$GITHUB_WORKSPACE/build-p0/test-keyring-temp-key") | tee artifacts/legacy-keyring.txt
          python3 test/validator-auth-implementation/check.py \
            --cpp build-p0/test/validator-auth-implementation/test-p0-implementation \
            --rust tosctl/src/target/debug/conformance --out artifacts/implementation.json
          python3 test/validator-auth-implementation/check_lifecycle.py \
            --cpp build-p0/test/validator-auth-implementation/test-p0-implementation --out artifacts/lifecycle.json
          python3 test/validator-auth-implementation/check_lifecycle.py \
            --driver tosctl/src/target/debug/conformance --out artifacts/lifecycle-rust.json
          build-p0/test/validator-auth-implementation/test-p0-cells artifacts/native-cell-fixtures | tee artifacts/cells.txt
          build-p0/test/validator-auth-implementation/test-p0-transfer | tee artifacts/transfer.txt
          build-p0/test/validator-auth-implementation/test-p0-object-store | tee artifacts/object-store.txt
          python3 test/validator-auth-implementation/check_api_semantics.py --driver build-p0/test/validator-auth-implementation/test-p0-api-semantics --out artifacts/api-semantics-cpp.json
