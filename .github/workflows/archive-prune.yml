name: Archive pruning regression

on:
  push:
    branches: [fix/issue-190-archive-prune-lifecycle]
  pull_request:
    paths:
      - 'validator/db/archive-*'
      - 'tddb/td/db/RocksDb.*'
      - 'test/test-archive-prune.cpp'
      - 'CMakeLists.txt'
      - '.github/workflows/archive-prune.yml'

permissions:
  contents: read
  packages: read

concurrency:
  group: archive-prune-${{ github.ref }}
  cancel-in-progress: true

jobs:
  archive-prune:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    container:
      image: ghcr.io/${{ github.repository }}-builder:ubuntu-24.04
      credentials:
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      CCACHE_DIR: /root/.ccache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: /root/.ccache
          key: ${{ runner.os }}-${{ runner.arch }}-archive-prune-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-archive-prune-
      - name: Configure native regression
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git rev-parse HEAD
          git diff --check
          cmake -S . -B build -G Ninja \
            -DCMAKE_C_COMPILER=clang-21 -DCMAKE_CXX_COMPILER=clang++-21 \
            -DCMAKE_BUILD_TYPE=Release -DTOS_ARCH=x86-64 \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DTOS_USE_JEMALLOC=ON -DTOS_PRODUCTION_BUILD=ON
      - name: Compile and run native regressions
        shell: bash
        run: |
          set -euo pipefail
          cmake --build build --parallel 4 --target test-archive-prune test-validator-cleanup test-validator-cleanup-worker test-validator-cleanup-statedb 2>&1 | tee archive-prune-build.log
          ctest --test-dir build --output-on-failure --repeat until-fail:3 -R '^archive-prune' 2>&1 | tee archive-prune-green.log
          ctest --test-dir build --output-on-failure -R '^test-validator-cleanup(-worker|-statedb)?$' 2>&1 | tee archive-prune-related.log
      - name: Verify cancellation sensitivity
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('validator/db/archive-manager.cpp')
          original = p.read_text()
          guard = """        // A pending index deletion can be cancelled during scheduler teardown.
                  // Do not acknowledge deletion or abort the process on cancellation.
                  if (R.is_error()) {
                    promise.set_error(R.move_as_error());
                    return;
                  }
          """
          assert original.count(guard) == 1
          p.write_text(original.replace(guard, '        R.ensure();\n', 1))
          PY
          cmake --build build --parallel 4 --target test-archive-prune 2>&1 | tee archive-prune-control-build.log
          set +e
          timeout 90s build/test-archive-prune --held-reader-shutdown 2>&1 | tee archive-prune-red.log
          rc=${PIPESTATUS[0]}
          set -e
          echo "cancellation mutation exit=$rc"
          test "$rc" -eq 134
          grep -q 'BARRIER: actual slice owner released; external reader held=1' archive-prune-red.log
          grep -qi 'lost promise' archive-prune-red.log
          git checkout -- validator/db/archive-manager.cpp
          cmake --build build --parallel 4 --target test-archive-prune
          ctest --test-dir build --output-on-failure -R '^archive-prune' 2>&1 | tee archive-prune-restored.log
      - name: Preserve native evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: archive-prune-${{ github.sha }}
          retention-days: 14
          path: archive-prune-*.log
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        if: always()
        with:
          path: /root/.ccache
          key: ${{ runner.os }}-${{ runner.arch }}-archive-prune-${{ github.sha }}

  static-analysis:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    container:
      image: ghcr.io/${{ github.repository }}-builder:ubuntu-24.04
      credentials:
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Prepare clean comparison builds
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          uv tool install codechecker==6.29.1
          base=$(git merge-base HEAD origin/main)
          git worktree add --detach /tmp/tos-archive-base "$base"
          for source in "$GITHUB_WORKSPACE" /tmp/tos-archive-base; do
            cmake -S "$source" -B "$source/build" -G Ninja \
              -DCMAKE_C_COMPILER=clang-21 -DCMAKE_CXX_COMPILER=clang++-21 \
              -DCMAKE_BUILD_TYPE=Release -DTOS_ARCH=x86-64 \
              -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
              -DTOS_USE_JEMALLOC=ON -DTOS_PRODUCTION_BUILD=ON
          done
      - name: Run differential C++ analysis
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/static-analysis.py --build-dir build --base-build-dir /tmp/tos-archive-base/build --jobs 4 2>&1 | tee archive-prune-analysis.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: archive-prune-analysis-${{ github.sha }}
          retention-days: 14
          path: archive-prune-analysis.log
