name: Lint

on:
  pull_request:
    branches: [master, testnet]
    types: [opened, reopened, synchronize, ready_for_review]
  push:
    branches: [master, testnet]
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Date Stamp
      shell: bash
      id: date-stamp
      run: |
        echo "timestamp=$(date -u "+%Y%m%d%H%M_%S")" >> "$GITHUB_OUTPUT"

    - name: Install system libraries
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential git cmake ninja-build libjemalloc-dev

    - name: Install Clang 21
      run: |
        # SECURITY: Pin to specific LLVM release instead of fetching script
        wget -q https://apt.llvm.org/llvm.sh
        chmod +x llvm.sh
        sudo ./llvm.sh 21 all

    # TODO: Preserve ccache cache between runs once we get rid of warning suppression mappings.

    # Rust toolchain needed for Rust crates under tosctl/src.
    - name: Install pinned Rust toolchain
      uses: actions-rs/toolchain@v1
      with:
        toolchain: 1.91.1
        profile: minimal

    - name: Build TOS
      run: |
        cmake -S . -B build -G Ninja \
          -DCMAKE_C_COMPILER=clang-21 \
          -DCMAKE_CXX_COMPILER=clang++-21 \
          -DCMAKE_BUILD_TYPE=Release \
          -DTOS_USE_JEMALLOC=ON \
          -DTOS_USE_LLD=On \
          -DTOS_WERROR_BUILD=On
        ninja -C build

    - name: Check spaces at EOL
      run: |
        ! git grep --cached -Il '\s$' -- :/ \
          ':(exclude)crypto/smartcont/tol-stdlib/' \
          ':(exclude)tol/' \
          ':(exclude)tol-tester/' \
          ':(exclude)third-party/'

    - name: Check C++ formatting
      run: |
        # TODO: Run clang-format only on changed files.
        clang-format-21 -i $(git ls-files '*.h' '*.hpp' '*.cpp' \
          ':(exclude)crypto/smartcont/tol-stdlib/' \
          ':(exclude)tol/' \
          ':(exclude)tol-tester/' \
          ':(exclude)third-party/')
        git diff --exit-code

    - name: Prepare Python environment
      run: |
        # SECURITY: Pin uv version to avoid supply chain risk
        curl -LsSf https://astral.sh/uv/0.11.7/install.sh | sh
        uv sync
        uv run test/tostester/generate_tl.py

    - name: Lint Python
      run: |
        uv run ruff check
        uv run ruff format --check
        uv run basedpyright
