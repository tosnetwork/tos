name: Slice 1 conformance

on:
  pull_request:
    branches: [actor-layer, master, testnet, main]
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - '.github/workflows/slice-1-conformance.yml'
      - 'CMakeLists.txt'
      - 'crypto/smartcont/**'
      - 'doc/slice-1-gas-baselines.json'
      - 'doc/slice-3-reference-baselines.json'
      - 'doc/slice-3-replay-fixture-schema.json'
      - 'doc/slice-3-*.md'
      - 'examples/slice3/**'
      - 'emulator/test/slice-1-*.cpp'
      - 'emulator/test/slice-3-*.cpp'
      - 'emulator/test/slice-3-replay-fixtures/**'
      - 'scripts/check-slice-1-gas.py'
      - 'scripts/check-slice-3-replay-fixtures.py'
      - 'scripts/check-slice-3-scaffold.py'
      - 'scripts/check-slice-3-release-package.py'
      - 'tol/**'
      - 'tol-tester/**'
  push:
    branches: [actor-layer, master, testnet, main]
    paths:
      - '.github/workflows/slice-1-conformance.yml'
      - 'CMakeLists.txt'
      - 'crypto/smartcont/**'
      - 'doc/slice-1-gas-baselines.json'
      - 'doc/slice-3-reference-baselines.json'
      - 'doc/slice-3-replay-fixture-schema.json'
      - 'doc/slice-3-*.md'
      - 'examples/slice3/**'
      - 'emulator/test/slice-1-*.cpp'
      - 'emulator/test/slice-3-*.cpp'
      - 'emulator/test/slice-3-replay-fixtures/**'
      - 'scripts/check-slice-1-gas.py'
      - 'scripts/check-slice-3-replay-fixtures.py'
      - 'scripts/check-slice-3-scaffold.py'
      - 'scripts/check-slice-3-release-package.py'
      - 'tol/**'
      - 'tol-tester/**'
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tol-and-emulator:
    name: Tol contracts and emulator fixtures
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/${{ github.repository }}-builder:ubuntu-24.04
      credentials:
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install pinned Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: 1.91.1
          profile: minimal

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang-21 \
            -DCMAKE_CXX_COMPILER=clang++-21 \
            -DTOS_USE_JEMALLOC=ON \
            -DTOS_USE_LLD=ON

      - name: Build Slice 1 test targets
        run: |
          cmake --build build --target tol fift test-emulator -j"$(nproc)"

      - name: Compile migrated reference contracts
        run: |
          build/tol/tol crypto/smartcont/jetton-minter.tol
          build/tol/tol crypto/smartcont/jetton-wallet.tol
          build/tol/tol crypto/smartcont/wallet-v5.tol

      - name: Run Envelope deterministic fuzz smoke
        working-directory: tol-tester
        env:
          FIFTPATH: ${{ github.workspace }}/crypto/fift/lib
          FIFT_EXECUTABLE: ${{ github.workspace }}/build/crypto/fift
          TOL_EXECUTABLE: ${{ github.workspace }}/build/tol/tol
        run: |
          python3 tol-tester.py tests slice-1-envelope-fuzz-smoke

      - name: Run full Tol tester suite
        working-directory: tol-tester
        env:
          FIFTPATH: ${{ github.workspace }}/crypto/fift/lib
          FIFT_EXECUTABLE: ${{ github.workspace }}/build/crypto/fift
          TOL_EXECUTABLE: ${{ github.workspace }}/build/tol/tol
        run: |
          python3 tol-tester.py tests

      - name: Run Slice 1 gas regression gate
        env:
          FIFTPATH: ${{ github.workspace }}/crypto/fift/lib
          FIFT_EXECUTABLE: ${{ github.workspace }}/build/crypto/fift
          TOL_EXECUTABLE: ${{ github.workspace }}/build/tol/tol
        run: |
          python3 scripts/check-slice-1-gas.py

      - name: Run Slice 1 emulator fixtures
        run: |
          build/test-emulator 2>&1 | tee /tmp/test-emulator.log
          grep "test(s) passed" /tmp/test-emulator.log

      - name: Run Slice 3 replay fixtures
        run: |
          python3 scripts/check-slice-3-replay-fixtures.py --test-emulator build/test-emulator

      - name: Run Slice 3 scaffold and release package checks
        run: |
          python3 scripts/check-slice-3-scaffold.py \
            --tol build/tol/tol \
            --tol-tester tol-tester/tol-tester.py \
            --fift build/crypto/fift \
            --fiftpath crypto/fift/lib
          python3 scripts/check-slice-3-release-package.py \
            --tol build/tol/tol \
            --tol-tester tol-tester/tol-tester.py \
            --fift build/crypto/fift \
            --fiftpath crypto/fift/lib
