name: SLH-DSA SHA-256 backends
on:
  pull_request:
    paths:
      - 'crypto/pq/slhdsa*'
      - 'crypto/pq/CMakeLists.txt'
      - 'third-party/slhdsa-c/**'
      - 'third-party/bitcoin-sha256/**'
      - 'test/pq-slhdsa/**'
      - 'tosctl/src/common/build/slhdsa_sha256.rs'
      - 'tosctl/src/vm/build.rs'
      - 'tosctl/src/vm/slh-shim.c'
      - 'tosctl/src/vm/src/executor/mod.rs'
      - 'tosctl/src/vm/src/executor/pq.rs'
      - 'tosctl/src/vm/src/tests/test_slhdsa_vectors.rs'
      - 'tosctl/src/wallet-pq-signer/build.rs'
      - '.github/workflows/slhdsa-sha256-backend.yml'
defaults:
  run:
    shell: bash
permissions:
  contents: read
concurrency:
  group: slhdsa-sha256-backend-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  # Every configuration runs the same signature vectors. "sha-ni" must actually execute the SHA-NI
  # path (TOS_REQUIRE_SHA_NI=1 fails the job otherwise) and "armv8-sha2" the ARMv8 SHA2 path
  # (TOS_REQUIRE_ARMV8_SHA2=1); "portable" builds the imported file. `switch` is the environment
  # assignment that overrides the platform default, `cpu_flag` the /proc/cpuinfo word (on macOS,
  # the hw.optional.arm sysctl) the runner must show for its hardware path.
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64-default
            runner: ubuntu-24.04
            switch: ''
            expect: 'ON'
            expect_armv8: 'OFF'
            require: '1'
            require_armv8: '0'
            backend: sha-ni
            cpu_flag: sha_ni
          - name: linux-x86_64-off
            runner: ubuntu-24.04
            switch: 'TOS_SLHDSA_SHA_NI=0'
            expect: 'OFF'
            expect_armv8: 'OFF'
            require: '0'
            require_armv8: '0'
            backend: portable
            cpu_flag: ''
          - name: linux-arm64-default
            runner: ubuntu-24.04-arm
            switch: ''
            expect: 'OFF'
            expect_armv8: 'ON'
            require: '0'
            require_armv8: '1'
            backend: armv8-sha2
            cpu_flag: sha2
          - name: linux-arm64-off
            runner: ubuntu-24.04-arm
            switch: 'TOS_SLHDSA_ARMV8_SHA2=0'
            expect: 'OFF'
            expect_armv8: 'OFF'
            require: '0'
            require_armv8: '0'
            backend: portable
            cpu_flag: ''
          - name: macos-default
            runner: macos-15
            switch: ''
            expect: 'OFF'
            expect_armv8: 'ON'
            require: '0'
            require_armv8: '1'
            backend: armv8-sha2
            cpu_flag: FEAT_SHA256
          - name: macos-off
            runner: macos-15
            switch: 'TOS_SLHDSA_ARMV8_SHA2=0'
            expect: 'OFF'
            expect_armv8: 'OFF'
            require: '0'
            require_armv8: '0'
            backend: portable
            cpu_flag: ''
    name: native (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Configure the PQ library alone
        run: |
          if [ -n '${{ matrix.switch }}' ]; then export '${{ matrix.switch }}'; fi
          cmake -S crypto/pq -B build-pq -DCMAKE_BUILD_TYPE=Release | tee configure.txt
          grep -Fx -- '-- SLH-DSA SHA-256 backend: TOS_SLHDSA_SHA_NI=${{ matrix.expect }}' configure.txt
          grep -Fx -- '-- SLH-DSA SHA-256 backend: TOS_SLHDSA_ARMV8_SHA2=${{ matrix.expect_armv8 }}' configure.txt
      - name: Signature vectors through the node adapter
        env:
          TOS_REQUIRE_SHA_NI: ${{ matrix.require }}
          TOS_REQUIRE_ARMV8_SHA2: ${{ matrix.require_armv8 }}
        run: |
          cmake --build build-pq --target test-pq-slhdsa-vectors -j4
          build-pq/test-pq-slhdsa-vectors test/pq-slhdsa/slh-verify-vectors.txt | tee vectors.txt
          grep -Fx 'SLH-DSA SHA-256 backend: ${{ matrix.backend }}' vectors.txt
      # Counted, not timed, so it gates on every leg: the worst-case input must be rejected
      # at exactly the compressions it was built to cost. An edit that makes it cheaper, or
      # makes it verify, fails here; the timing step below could not tell.
      - name: Worst-case input costs the work it was built for
        run: |
          cmake --build build-pq --target test-pq-slhdsa-work -j4
          build-pq/test-pq-slhdsa-work test/pq-slhdsa/slh-worst-case-vectors.txt 0 3174
      - name: Hardware backend against the imported implementation
        if: matrix.backend != 'portable'
        env:
          TOS_REQUIRE_SHA_NI: ${{ matrix.require }}
          TOS_REQUIRE_ARMV8_SHA2: ${{ matrix.require_armv8 }}
        run: |
          if [ "$RUNNER_OS" = macOS ]; then
            test "$(sysctl -n hw.optional.arm.${{ matrix.cpu_flag }})" = 1
          else
            grep -m1 -o -w '${{ matrix.cpu_flag }}' /proc/cpuinfo
          fi
          cmake --build build-pq --target test-pq-slhdsa-sha256-backend -j4
          build-pq/test-pq-slhdsa-sha256-backend | tee backend.txt
          grep -Fx 'OK: ${{ matrix.backend }} path matches the imported implementation' backend.txt
          grep -Fx 'OK: forced portable path matches the imported implementation' backend.txt
      # Timing on a shared runner: the numbers never fail the job. The first file holds honestly
      # generated signatures; the second holds one signature built to maximise the verifier's
      # work (3,174 compressions against 2,214), the case the gas price has to cover.
      - name: Verification time on this runner, hardware and forced portable (not a gate)
        if: matrix.backend != 'portable'
        continue-on-error: true
        run: |
          cmake --build build-pq --target bench-pq-slhdsa-verify -j4
          lscpu | grep -E '^(Architecture|Vendor ID|Model name|CPU\(s\)):' || true
          build-pq/bench-pq-slhdsa-verify test/pq-slhdsa/slh-verify-vectors.txt | tee bench.txt
          grep -E '^verify ${{ matrix.backend }}: vectors=4 valid=4 invalid=0 ' bench.txt
          grep -E '^verify portable: vectors=4 valid=4 invalid=0 ' bench.txt
          echo 'worst case:'
          build-pq/bench-pq-slhdsa-verify test/pq-slhdsa/slh-worst-case-vectors.txt 2000 | tee worst.txt
          grep -E '^verify ${{ matrix.backend }}: vectors=1 valid=0 invalid=1 ' worst.txt
          grep -E '^verify portable: vectors=1 valid=0 invalid=1 ' worst.txt
  rust:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64-default
            runner: ubuntu-24.04
            switch: ''
            require: '1'
            require_armv8: '0'
            backend: sha-ni
          - name: linux-x86_64-off
            runner: ubuntu-24.04
            switch: 'TOS_SLHDSA_SHA_NI=0'
            require: '0'
            require_armv8: '0'
            backend: portable
          - name: linux-arm64-default
            runner: ubuntu-24.04-arm
            switch: ''
            require: '0'
            require_armv8: '1'
            backend: armv8-sha2
          - name: linux-arm64-off
            runner: ubuntu-24.04-arm
            switch: 'TOS_SLHDSA_ARMV8_SHA2=0'
            require: '0'
            require_armv8: '0'
            backend: portable
    name: rust (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        run: scripts/install-rust-toolchain.sh
      - name: Restore Rust dependency cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        continue-on-error: true
        with:
          prefix-key: tos-rust-ci-v1
          key: slhdsa-sha256-${{ matrix.name }}
          cache-bin: false
          workspaces: tosctl/src -> target
      - name: VM suite-3 backend and the wallet signer
        env:
          TOS_REQUIRE_SHA_NI: ${{ matrix.require }}
          TOS_REQUIRE_ARMV8_SHA2: ${{ matrix.require_armv8 }}
        run: |
          if [ -n '${{ matrix.switch }}' ]; then export '${{ matrix.switch }}'; fi
          cargo test --locked --manifest-path tosctl/src/vm/Cargo.toml --lib slhdsa_vector_tests -- --nocapture | tee vm.txt
          grep -Fx 'SLH-DSA SHA-256 backend: ${{ matrix.backend }}' vm.txt
          cargo test --locked --manifest-path tosctl/src/wallet-pq-signer/Cargo.toml
