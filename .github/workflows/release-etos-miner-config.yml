name: Release eTOS miner config

# Packages the eTOS miner configuration templates and adapter scripts as a
# release artifact. Does NOT build a new miner binary — eTOS reuses upstream
# GPU miners (ethminer, T-Rex, lolMiner) pointed at TOS JSON-RPC via stratum.
#
# Trigger: push of any tag matching "v*".
# Produces:
#   etos-miner-config-{tag}.tar.gz   — template tarball
#   etos-miner-config-{tag}.tar.gz.sha256

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-etos-miner-config-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: package eTOS miner config
    runs-on: ubuntu-22.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify config templates are present
        run: |
          set -euo pipefail
          DIR="evm/contracts/etos-miner-config"
          for f in \
            "${DIR}/README.md" \
            "${DIR}/ethminer-stratum.conf" \
            "${DIR}/trex-stratum.conf" \
            "${DIR}/stratum-adapter.py" \
            "${DIR}/etos-pool-example.toml"
          do
            if [ ! -f "$f" ]; then
              echo "ERROR: required file not found: $f" >&2
              exit 1
            fi
          done
          echo "All required template files present."

      - name: Package artifact
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          ARCHIVE="etos-miner-config-${TAG}.tar.gz"

          # Archive with directory structure preserved, using a versioned top-level dir
          tar -czf "$ARCHIVE" \
            --transform "s|^evm/contracts/etos-miner-config|etos-miner-config-${TAG}|" \
            evm/contracts/etos-miner-config

          sha256sum "$ARCHIVE" > "${ARCHIVE}.sha256"

          echo "ARCHIVE=${ARCHIVE}" >> "$GITHUB_ENV"

      - name: Upload release asset
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ${{ env.ARCHIVE }}
          asset_name: ${{ env.ARCHIVE }}
          tag: ${{ github.ref_name }}
          overwrite: true

      - name: Upload SHA256 checksum
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ${{ env.ARCHIVE }}.sha256
          asset_name: ${{ env.ARCHIVE }}.sha256
          tag: ${{ github.ref_name }}
          overwrite: true
