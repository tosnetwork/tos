name: PQ signing tool validation

on:
  pull_request:
    paths:
      - crypto/pq/cli-integer.h
      - crypto/pq/controller-tool.cpp
      - crypto/pq/vote-tool.cpp
      - crypto/CMakeLists.txt
      - test/pq-mldsa44/signing_tool_integer_test.py
      - test/auth-extensions/cells.py
      - .github/workflows/pq-signing-tool-validation.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signing-tools:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Install pinned analysis tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build build-essential python3-venv libjemalloc-dev
          sudo scripts/install-llvm-toolchain.sh 21 all
          python3 -m venv /tmp/signing-codechecker
          /tmp/signing-codechecker/bin/pip install CodeChecker==6.29.1
      - name: Configure independent candidate and merge-base builds
        run: |
          git worktree add --detach ../signing-base "$(git merge-base origin/main HEAD)"
          for source in . ../signing-base; do
            cmake -S "$source" -B "$source/build" -G Ninja \
              -DCMAKE_C_COMPILER=clang-21 -DCMAKE_CXX_COMPILER=clang++-21 \
              -DCMAKE_BUILD_TYPE=Release -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
              -DTOS_ARCH=x86-64 -DTOS_USE_JEMALLOC=ON -DTOS_WERROR_BUILD=ON
          done
      - name: Build and test the signing entry points
        run: |
          cmake --build build --target tos-pq-controller tos-pq-vote tos-pq-consensus-key test-pq-vote-body --parallel 4
          ctest --test-dir build --output-on-failure --no-tests=error \
            -R '^(pq-signing-tool-integers|controller-tool|pq-vote-body)$'
      - name: Prepare each side's generated analysis inputs
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          for build in (Path("build"), Path("../signing-base/build")):
              rows = subprocess.check_output(["ninja", "-C", str(build), "-t", "targets", "all"], text=True)
              targets = sorted({line.rsplit(": ", 1)[0] for line in rows.splitlines()
                                if Path(line.rsplit(": ", 1)[0]).suffix in {".h", ".hpp", ".hh", ".cpp", ".cc", ".c", ".inc"}})
              if not targets:
                  raise SystemExit(f"no generated inputs in {build}")
              subprocess.run(["ninja", "-C", str(build), "-j4", *targets], check=True)
          PY
      - name: Compare static analysis against the clean merge base
        run: |
          set -o pipefail
          python3 -u scripts/static-analysis.py --build-dir build \
            --base-build-dir ../signing-base/build --jobs 4 \
            --codechecker /tmp/signing-codechecker/bin/CodeChecker \
            2>&1 | tee signing-analysis.log
      - name: Retain analysis receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pq-signing-analysis-${{ github.sha }}
          path: signing-analysis.log
          if-no-files-found: warn
          retention-days: 14
