name: Source hygiene

on:
  pull_request:
    # feature/** keeps stacked PRs covered; see contract-sandboxes.yml.
    branches: [master, testnet, main, 'feature/**']
  push:
    branches: [master, testnet, main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust-format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install repository-pinned Rust toolchain
        run: scripts/install-rust-toolchain.sh
      - name: Check Rust formatting with the pinned stable toolchain
        run: ci/run rust-format

  native-registry-reproducibility:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Validate CI entrypoints before building native tools
        run: ci/run preflight
      - name: Restore compatible native compiler objects
        uses: ./.github/actions/native-cache
        with:
          profile: native-registry-release
      - name: Build and verify native registry, staking locks and node authority
        run: ci/run native-registry
      - name: Report native compiler cache statistics
        if: always()
        run: ccache --show-stats
