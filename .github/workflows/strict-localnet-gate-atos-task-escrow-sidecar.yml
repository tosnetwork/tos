name: strict-localnet-gate-atos-task-escrow-sidecar

on:
  push:
    branches:
      - agent/atos-task-escrow-sidecar-e2e

permissions:
  actions: read
  contents: write
  pull-requests: write
  issues: write

jobs:
  gate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/atos-task-escrow-sidecar-e2e
          fetch-depth: 0
      - name: Wait for explicit localnet or real-chain E2E on this revision
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          REVISION: ${{ github.sha }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 6000))
          while (( SECONDS < deadline )); do
            payload="$(gh api "/repos/${REPOSITORY}/actions/runs?head_sha=${REVISION}&per_page=100")"
            matches="$(jq --arg current "${CURRENT_RUN_ID}" '[.workflow_runs[]
              | select((.id|tostring) != $current)
              | select((.name + " " + .path + " " + .display_title)
                  | test("(?i)(localnet|real[-_ ]?chain)"))
              | select((.name + " " + .path + " " + .display_title)
                  | test("(?i)(atos|task.*escrow|sidecar)"))
              | select((.name + " " + .path + " " + .display_title)
                  | test("(?i)(materialize|export|finalize|strict-localnet-gate)") | not)]' <<<"${payload}")"
            count="$(jq 'length' <<<"${matches}")"
            if (( count > 0 )); then
              jq -r '.[] | "candidate workflow: \(.name) status=\(.status) conclusion=\(.conclusion // "") \(.html_url)"' <<<"${matches}"
              failed="$(jq '[.[] | select(.status == "completed" and .conclusion != "success")] | length' <<<"${matches}")"
              pending="$(jq '[.[] | select(..status != "completed")] | length' <<<"${matches}")"
              if (( failed > 0 )); then
                exit 1
              fi
              if (( pending == 0 )); then
                exit 0
              fi
            fi
            sleep 20
          done
          echo "no successful explicit localnet/real-chain ATOS TaskEscrow E2E found for ${REVISION}" >&2
          exit 1
      - name: Record verified localnet result
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/atos-task-escrow-sidecar-e2e.trigger
          rm -f .github/workflows/finalize-atos-task-escrow-sidecar-e2e.yml
          rm -f .github/workflows/strict-localnet-gate-atos-task-escrow-sidecar.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'ci: record verified real-localnet ATOS TaskEscrow E2E'
            git push origin HEAD:agent/atos-task-escrow-sidecar-e2e
          fi
          pr="$(gh pr list --head agent/atos-task-escrow-sidecar-e2e --state open --json number --jq '.[0].number')"
          test -n "${pr}"
          gh pr comment "${pr}" --body "Strict gate passed: an explicit localnet/real-chain ATOS TaskEscrow sidecar workflow succeeded for revision ${GITHUB_SHA}. Materialization/export/cleanup workflows were excluded from the gate."
          gh pr ready "${pr}"
