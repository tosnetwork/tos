name: JSON-RPC ASAN

# The JSON-RPC hardening includes two memory-safety fixes: a request
# buffer whose lifetime the batch driver has to extend, and a completion
# callback that must not reach a destroyed server. Neither is observable
# from an ordinary build -- a use-after-free reads plausible bytes and the
# assertions still pass -- so those fixes are only actually checked when
# the tests run instrumented.
#
# Kept as its own workflow because it builds a second time with different
# flags; it is not on the critical path for other changes.

on:
  pull_request:
    branches: [master, testnet, main]
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - 'validator-engine/json-rpc-server*'
      - 'test/test-json-rpc-*'
      - 'test/json-rpc/**'
      - '.github/workflows/jsonrpc-asan.yml'
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  asan:
    runs-on: ubuntu-24.04

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Install system libraries
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential git cmake ninja-build

    - name: Install Clang 21
      run: |
        wget -q https://apt.llvm.org/llvm.sh
        chmod +x llvm.sh
        sudo ./llvm.sh 21 all

    - name: Configure with AddressSanitizer
      run: |
        cmake -S . -B build-asan -G Ninja \
          -DCMAKE_C_COMPILER=clang-21 \
          -DCMAKE_CXX_COMPILER=clang++-21 \
          -DCMAKE_BUILD_TYPE=Debug \
          -DTOS_USE_ASAN=ON \
          -DUSE_QUIC=OFF

    - name: Build the instrumented JSON-RPC tests
      run: |
        ninja -C build-asan test-json-rpc-rate-gate test-json-rpc-parse test-json-rpc-handler-guard

    - name: Run under AddressSanitizer
      env:
        # Report the first fault with a full trace; leaks are a separate
        # question and would drown the signal we are after here.
        ASAN_OPTIONS: detect_leaks=0:abort_on_error=1:halt_on_error=1
      run: |
        ./build-asan/test-json-rpc-rate-gate
        ./build-asan/test-json-rpc-parse
        ./build-asan/test-json-rpc-handler-guard

    - name: Check JSON-RPC route gating
      run: python3 scripts/check-jsonrpc-route-gating.py
