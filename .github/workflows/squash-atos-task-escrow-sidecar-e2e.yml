name: squash-atos-task-escrow-sidecar-e2e

on:
  push:
    branches:
      - agent/atos-task-escrow-sidecar-e2e

permissions:
  contents: write

jobs:
  squash:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/atos-task-escrow-sidecar-e2e
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify materialized implementation
        shell: bash
        run: |
          set -euo pipefail
          test -f .github/workflows/atos-task-escrow-sidecar-e2e.yml
          test -f scripts/atos-task-escrow-publisher-e2e.py
          test -f doc/atos-task-escrow-publisher.md
          test ! -e .github/workflows/apply-atos-task-escrow-sidecar-e2e.yml
          test ! -e .github/workflows/export-atos-task-escrow-sidecar-source.yml
          if compgen -G '.github/atos-sidecar-e2e-patch.part*' >/dev/null; then
            echo 'temporary E2E patch material remains' >&2
            exit 1
          fi
          cargo fmt --manifest-path tosctl/src/node-control/Cargo.toml --all -- --check
          python -m py_compile scripts/atos-task-escrow-publisher-e2e.py
          git diff --check
      - name: Rewrite branch as one clean commit
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --soft origin/main
          rm -f .github/workflows/squash-atos-task-escrow-sidecar-e2e.yml
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test(localnet): exercise ATOS TaskEscrow publisher sidecar'
          git push --force-with-lease origin HEAD:agent/atos-task-escrow-sidecar-e2e
