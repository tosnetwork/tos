name: apply-atos-task-escrow-sidecar-e2e

on:
  push:
    branches:
      - agent/atos-task-escrow-sidecar-e2e

permissions:
  contents: read
  packages: read

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    container:
      image: ghcr.io/tosnetwork/tos-builder:ubuntu-24.04
      credentials:
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/atos-task-escrow-sidecar-e2e
          fetch-depth: 0
      - uses: actions/checkout@v7
        with:
          repository: tosnetwork/tos-protocol
          ref: agent/task-escrow-publisher-sidecar
          path: tos-protocol
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true
          cache-dependency-path: tos-protocol/go.sum
      - uses: actions-rust-lang/setup-rust-toolchain@v1.17.0
        with:
          toolchain: 1.91.1
          components: rustfmt
          cache: false
          rustflags: ''
      - name: Materialize implementation
        shell: bash
        run: |
          set -euo pipefail
          repo=/__w/tos/tos
          cd "$repo"
          cat .github/atos-sidecar-e2e-patch.part{00..03} > /tmp/atos-sidecar-e2e.patch.xz.b64
          base64 --decode /tmp/atos-sidecar-e2e.patch.xz.b64 > /tmp/atos-sidecar-e2e.patch.xz
          echo '5f563da0a2c122d170e6dbf82e4e5c86bb02ef5a525b44e86bf16afbac6971ad  /tmp/atos-sidecar-e2e.patch.xz' | sha256sum --check --strict
          xz -dc /tmp/atos-sidecar-e2e.patch.xz > /tmp/atos-sidecar-e2e.patch
          git apply --binary --whitespace=error-all /tmp/atos-sidecar-e2e.patch
          rustfmt --edition 2024 --config skip_children=true tosctl/src/node-control/commands/src/commands/nodectl/agent_cmd.rs
          git diff --check
      - name: Validate materialized sources
        shell: bash
        run: |
          set -euo pipefail
          cd /__w/tos/tos
          rustfmt --edition 2024 --config skip_children=true --check tosctl/src/node-control/commands/src/commands/nodectl/agent_cmd.rs
          python3 -m py_compile scripts/atos-task-escrow-publisher-e2e.py
      - name: Build TOS localnet and tosctl
        shell: bash
        run: |
          set -euo pipefail
          cd /__w/tos/tos
          mkdir -p ~/.ccache
          cp assembly/native/build-ubuntu-shared.sh .
          chmod +x build-ubuntu-shared.sh
          ./build-ubuntu-shared.sh -t -c
          cargo build --manifest-path tosctl/src/Cargo.toml -p tosctl
          cargo test --manifest-path tosctl/src/Cargo.toml -p commands exact_nanotos_bypasses_float_conversion
      - name: Validate publisher Go code
        working-directory: tos-protocol
        shell: bash
        run: |
          set -euo pipefail
          make all
          make test-race
      - name: Prepare localnet Python environment
        shell: bash
        run: |
          set -euo pipefail
          cd /__w/tos/tos
          uv sync --no-dev
          uv run test/tostester/generate_tl.py
      - name: Run real local-chain publisher E2E
        shell: bash
        env:
          TOS_PROTOCOL_DIR: /__w/tos/tos/tos-protocol
          TOS_BUILD_DIR: /__w/tos/tos/build
          TOSCTL: /__w/tos/tos/tosctl/src/target/debug/tosctl
        run: |
          set -euo pipefail
          cd /__w/tos/tos
          uv run python scripts/atos-task-escrow-publisher-e2e.py
