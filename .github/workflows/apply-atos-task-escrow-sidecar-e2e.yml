name: apply-atos-task-escrow-sidecar-e2e

on:
  push:
    branches:
      - agent/atos-task-escrow-sidecar-e2e

permissions:
  contents: write
  packages: read

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    container:
      image: ghcr.io/tosnetwork/tos-builder:ubuntu-24.04
      credentials:
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/atos-task-escrow-sidecar-e2e
          fetch-depth: 0
      - uses: actions-rust-lang/setup-rust-toolchain@v1.17.0
        with:
          toolchain: 1.91.1
          components: rustfmt
          cache: false
          rustflags: ''
      - name: Materialize implementation
        shell: bash
        run: |
          set -euo pipefail
          repo=/__w/tos/tos
          cd "$repo"
          test -d "$repo/.git"
          cat .github/atos-sidecar-e2e-patch.part{00..03} > /tmp/atos-sidecar-e2e.patch.xz.b64
          base64 --decode /tmp/atos-sidecar-e2e.patch.xz.b64 > /tmp/atos-sidecar-e2e.patch.xz
          echo '5f563da0a2c122d170e6dbf82e4e5c86bb02ef5a525b44e86bf16afbac6971ad  /tmp/atos-sidecar-e2e.patch.xz' | sha256sum --check --strict
          xz -dc /tmp/atos-sidecar-e2e.patch.xz > /tmp/atos-sidecar-e2e.patch
          git --git-dir="$repo/.git" --work-tree="$repo" apply --binary --whitespace=error-all /tmp/atos-sidecar-e2e.patch
          rm -f .github/workflows/export-atos-task-escrow-sidecar-source.yml
          rm -f .github/workflows/apply-atos-task-escrow-sidecar-e2e.yml
          rm -f .github/atos-sidecar-e2e-patch.part{00..03}
          rustfmt --edition 2024 --config skip_children=true tosctl/src/node-control/commands/src/commands/nodectl/agent_cmd.rs
          git --git-dir="$repo/.git" --work-tree="$repo" diff --check
      - name: Validate Rust CLI and test harness
        shell: bash
        run: |
          set -euo pipefail
          cd /__w/tos/tos
          rustfmt --edition 2024 --config skip_children=true --check tosctl/src/node-control/commands/src/commands/nodectl/agent_cmd.rs
          cargo test --manifest-path tosctl/src/Cargo.toml -p commands exact_nanotos_bypasses_float_conversion
          python3 -m py_compile scripts/atos-task-escrow-publisher-e2e.py
      - name: Commit implementation
        shell: bash
        run: |
          set -euo pipefail
          repo=/__w/tos/tos
          cd "$repo"
          git --git-dir="$repo/.git" --work-tree="$repo" config user.name 'github-actions[bot]'
          git --git-dir="$repo/.git" --work-tree="$repo" config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git --git-dir="$repo/.git" --work-tree="$repo" add -A
          git --git-dir="$repo/.git" --work-tree="$repo" commit -m 'test: add real local-chain TaskEscrow publisher E2E'
          git --git-dir="$repo/.git" --work-tree="$repo" push origin HEAD:agent/atos-task-escrow-sidecar-e2e
