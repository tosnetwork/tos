name: tosctl service

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "tosctl/src/node-control/**"
      - "tosctl/src/secrets-vault/**"
      - "tosctl/scripts/**"
      - "validator-engine/json-rpc-server*.cpp"
      - "scripts/localnet-jsonrpc.py"
      - "scripts/toscan-dev-seed.py"
      - "scripts/toscan-explorer-e2e.py"
      - ".github/workflows/tosctl-service.yml"
  pull_request:
    paths:
      - "tosctl/src/node-control/**"
      - "tosctl/src/secrets-vault/**"
      - "tosctl/scripts/**"
      - "validator-engine/json-rpc-server*.cpp"
      - "scripts/localnet-jsonrpc.py"
      - "scripts/toscan-dev-seed.py"
      - "scripts/toscan-explorer-e2e.py"
      - ".github/workflows/tosctl-service.yml"

permissions:
  contents: read

jobs:
  service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tosctl/src/node-control
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
          components: rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: tosctl/src/node-control -> target
      - name: Formatting
        run: cargo fmt --manifest-path service/Cargo.toml --check
      - name: Service tests
        run: cargo test --manifest-path service/Cargo.toml --lib --locked

  # The vault holds the node's signing keys and every operator credential, and
  # its 218 tests ran only on developer machines -- a suite nothing enforces is
  # a suite that silently stops being true. It is a separate job because it is
  # a separate workspace member with its own build, and because a vault
  # regression should name itself rather than arrive as "the service job
  # failed".
  secrets-vault:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tosctl/src
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
          components: rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: tosctl/src -> target
      - name: Formatting
        run: cargo fmt -p secrets-vault --check
      - name: Vault tests
        run: cargo test -p secrets-vault --lib --locked

  # This harness creates a new encrypted file Vault for one local child
  # process. It has no third-party Python dependency and must stay unable to
  # leak its generated capability into source, logs, or a caller's environment.
  local-test-vault-harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Verify local ephemeral Vault runner
        run: python3 -m unittest tosctl/scripts/tests/test_local_test_vault.py -v

  # On demand only. The gate itself takes under a minute; what made this a
  # forty-seven minute job was compiling the node in front of it, which a
  # developer machine has already done. Run it before a release, or whenever a
  # change touches the explorer surface:
  #
  #   python scripts/toscan-explorer-e2e.py
  #
  # A check that has to be remembered is weaker than one that runs itself, and
  # this trade is deliberate rather than a saving: the job is cheap enough
  # locally to actually get run, and was expensive enough here that it spent
  # most of its life cancelled mid-compile without reporting anything.
  real-chain-explorer:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    # Still generous, because a cold runner spends most of the budget compiling
    # before the gate starts at all.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build libjemalloc-dev ccache
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
      # ccache rather than caching the build directory. This job compiles the
      # commit under test, so a key built from the tree changes on every push
      # and a directory cache would miss exactly when it is needed. ccache is
      # keyed per translation unit, so a change to a handful of files reuses
      # the rest.
      - name: Restore compiler cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ccache
          key: tos-ccache-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            tos-ccache-${{ runner.os }}-
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: tosctl/src -> target
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true
      - name: Prepare Python environment
        run: |
          uv python install 3.14
          uv sync --no-dev
          uv run test/tostester/generate_tl.py
      - name: Build native localnet and JSON-RPC
        env:
          CCACHE_DIR: ~/.cache/ccache
          CCACHE_MAXSIZE: 2G
        run: |
          ccache --zero-stats
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build build --target \
            validator-engine dht-server create-state generate-random-id toslibjson \
            tos-pq-consensus-key -j2
          ccache --show-stats
      - name: Build tosctl explorer
        run: cargo build --manifest-path tosctl/src/Cargo.toml -p tosctl --locked
      - name: Real-chain TOSCAN release gate
        env:
          # This step starts immediately after compiling the node, on a runner
          # whose disk has just been saturated for the better part of an hour.
          # The waits inside are for a chain to produce blocks and an indexer to
          # catch up; giving them a developer-machine budget charges them for
          # work that is not theirs.
          TOSCAN_E2E_TIMEOUT_SCALE: "3"
        run: uv run python scripts/toscan-explorer-e2e.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: toscan-real-chain-logs
          path: test/integration/.toscan-explorer-e2e/*.log
          retention-days: 7
