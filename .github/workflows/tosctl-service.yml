name: tosctl service

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "tosctl/src/node-control/**"
      - "validator-engine/json-rpc-server*.cpp"
      - "scripts/localnet-jsonrpc.py"
      - "scripts/toscan-dev-seed.py"
      - "scripts/toscan-explorer-e2e.py"
      - ".github/workflows/tosctl-service.yml"
  pull_request:
    paths:
      - "tosctl/src/node-control/**"
      - "validator-engine/json-rpc-server*.cpp"
      - "scripts/localnet-jsonrpc.py"
      - "scripts/toscan-dev-seed.py"
      - "scripts/toscan-explorer-e2e.py"
      - ".github/workflows/tosctl-service.yml"

permissions:
  contents: read

jobs:
  service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tosctl/src/node-control
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tosctl/src/node-control -> target
      - name: Formatting
        run: cargo fmt --manifest-path service/Cargo.toml --check
      - name: Service tests
        run: cargo test --manifest-path service/Cargo.toml --lib --locked

  real-chain-explorer:
    runs-on: ubuntu-24.04
    # Most of this job compiles the node on a two-core runner. Thirty-five
    # minutes never covered a cold build, so every run so far was cancelled
    # mid-compile -- and a cancelled run reads as one still in progress rather
    # than as a check that has never produced a result.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build libjemalloc-dev ccache
      - uses: dtolnay/rust-toolchain@stable
      # ccache rather than caching the build directory. This job compiles the
      # commit under test, so a key built from the tree changes on every push
      # and a directory cache would miss exactly when it is needed. ccache is
      # keyed per translation unit, so a change to a handful of files reuses
      # the rest.
      - name: Restore compiler cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: tos-ccache-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            tos-ccache-${{ runner.os }}-
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tosctl/src -> target
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Prepare Python environment
        run: |
          uv python install 3.14
          uv sync --no-dev
          uv run test/tostester/generate_tl.py
      - name: Build native localnet and JSON-RPC
        env:
          CCACHE_DIR: ~/.cache/ccache
          CCACHE_MAXSIZE: 2G
        run: |
          ccache --zero-stats
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build build --target \
            validator-engine dht-server create-state generate-random-id toslibjson -j2
          ccache --show-stats
      - name: Build tosctl explorer
        run: cargo build --manifest-path tosctl/src/Cargo.toml -p tosctl --locked
      - name: Real-chain TOSCAN release gate
        env:
          # This step starts immediately after compiling the node, on a runner
          # whose disk has just been saturated for the better part of an hour.
          # The waits inside are for a chain to produce blocks and an indexer to
          # catch up; giving them a developer-machine budget charges them for
          # work that is not theirs.
          TOSCAN_E2E_TIMEOUT_SCALE: "3"
        run: uv run python scripts/toscan-explorer-e2e.py
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: toscan-real-chain-logs
          path: test/integration/.toscan-explorer-e2e/*.log
          retention-days: 7
