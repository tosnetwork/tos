name: MacOS-15 TOS build (shared, arm64)

on:
  workflow_dispatch:
  workflow_call:

# A literal group: inside a call, github.workflow is the caller's name, so every
# matrix member would share one group. A pull request cancels its own older run;
# any other run (a push, the nightly run, a tag) is never cancelled by another.
concurrency:
  group: macos-15-arm64-shared-${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    timeout-minutes: 240
    runs-on: macos-15

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Date Stamp
        shell: bash
        id: date-stamp
        run: |
          echo "timestamp=$(date -u "+%Y%m%d%H%M_%S")" >> "$GITHUB_OUTPUT"

      - name: Create ~/.ccache
        run: |
          mkdir -p ~/.ccache

      - name: Cache TOS
        id: cache-tos
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.ccache
          key: ${{ runner.os }}-${{ runner.arch }}-15-shared-ccache-${{ steps.date-stamp.outputs.timestamp }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-15-shared-ccache

      # Rust toolchain needed for Rust crates under tosctl/src.
      - name: Install repository-pinned Rust toolchain
        run: scripts/install-rust-toolchain.sh

      - name: Build TOS
        env:
          TOS_MACOS_DEBUG_INFO: '1'
        run: |
          cp assembly/native/build-macos-shared.sh .
          chmod +x build-macos-shared.sh
          ./build-macos-shared.sh -t -c -o 16.0
          ccache -sp

      # The suite reads git history and runs uv-based harnesses.
      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6

      # Some tests bind a second loopback source address. Linux routes all
      # of 127.0.0.0/8 to lo; macOS has only 127.0.0.1 until an alias is added.
      - name: Add the second loopback address the tests bind
        run: sudo ifconfig lo0 alias 127.0.0.2 up

      - name: Run Tests
        run: |
          cd build
          ctest --output-on-failure --timeout 1800

      - name: Run toslib integration test
        run: |
          ./test/toslib/integration/test_integration.sh
