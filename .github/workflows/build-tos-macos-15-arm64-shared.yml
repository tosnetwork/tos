name: MacOS-15 TOS build (shared, arm64)

on:
  pull_request:
    branches: [main, master, testnet]
    types: [opened, reopened, synchronize, ready_for_review]
  push:
    branches: [main, master, testnet]
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Date Stamp
        shell: bash
        id: date-stamp
        run: |
          echo "timestamp=$(date -u "+%Y%m%d%H%M_%S")" >> "$GITHUB_OUTPUT"

      - name: Prepare native test tools
        run: |
          brew install ccache ripgrep
          mkdir -p ~/.ccache

      - name: Cache TOS
        id: cache-tos
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.ccache
          key: ${{ runner.os }}-${{ runner.arch }}-15-shared-ccache-${{ steps.date-stamp.outputs.timestamp }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-15-shared-ccache

      # Rust toolchain needed for Rust crates under tosctl/src.
      - name: Install repository-pinned Rust toolchain
        run: scripts/install-rust-toolchain.sh

      - name: Build TOS
        run: |
          cp assembly/native/build-macos-shared.sh .
          chmod +x build-macos-shared.sh
          ./build-macos-shared.sh -t -c -o 16.0
          ccache -sp

      - name: Run Tests
        run: ci/run native-tests

      - name: Run toslib integration test
        run: ci/run installed-consumer
