name: ML-DSA Auth Module E2E
on:
  pull_request:
    paths:
      - 'crypto/smartcont/**'
      - 'crypto/vm/**'
      - 'crypto/pq/**'
      - 'crypto/CMakeLists.txt'
      - 'CMakeLists.txt'
      - 'common/global-version.h'
      - 'emulator/**'
      - 'tol/**'
      - 'third-party/mldsa-native/**'
      - 'test/auth-extensions/**'
      - 'test/mldsa-auth/**'
      - 'docs/mldsa44-auth-module.md'
      - '.github/workflows/mldsa-auth-module.yml'
permissions:
  contents: read
concurrency:
  group: mldsa-auth-${{ github.event.pull_request.number }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Check wire formats and signing-profile constants
        run: python3 test/mldsa-auth/test_protocol.py
      - name: Build real contract tools and transaction emulator
        run: |
          test "$(uname -m)" = '${{ matrix.arch }}'
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build --target func fift tol emulator -j2
          cmake -S test/mldsa-auth -B build-auth-signer -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build-auth-signer -j2
      - name: Install Ed25519 test cosigner
        run: python3 -m pip install cryptography==46.0.4
      - name: Execute actual module and account transactions
        id: e2e
        run: |
          python3 test/mldsa-auth/e2e.py --build build \
            --signer build-auth-signer/test-mldsa44-sign --out artifacts/auth-results
      - name: Kill both compiled module verifier-removal mutations
        if: ${{ !cancelled() && matrix.arch == 'x86_64' && steps.e2e.outcome == 'success' }}
        run: |
          python3 test/mldsa-auth/mutations.py --build build \
            --signer build-auth-signer/test-mldsa44-sign --out artifacts/auth-mutations
          git diff --exit-code
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: mldsa-auth-${{ matrix.arch }}
          path: artifacts/
          retention-days: 14
          if-no-files-found: warn
  determinism:
    needs: native
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require both native jobs
        env:
          RESULT: ${{ needs.native.result }}
        run: test "$RESULT" = success
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: mldsa-auth-*
          path: results
      - name: Compare code, full transaction evidence and measured gas
        run: |
          X=results/mldsa-auth-x86_64/auth-results
          A=results/mldsa-auth-aarch64/auth-results
          for name in contracts.json e2e.json gas.json module-func.boc module-tol.boc wallet-func.boc wallet-tol.boc agent.boc; do
            cmp "$X/$name" "$A/$name"
          done
          python3 - <<'PY'
          import json
          from pathlib import Path
          r = Path('results/mldsa-auth-x86_64')
          assert json.loads((r / 'auth-results/e2e.json').read_text())['success'] is True
          rows = json.loads((r / 'auth-results/gas.json').read_text())['transactions']
          assert rows and all(row['total_compute_gas'] > 0 for row in rows)
          mutations = json.loads((r / 'auth-mutations/mutations.json').read_text())
          assert {row['module'] for row in mutations if row['killed']} == {'func', 'tol'}
          PY
