name: CI cache validation
on:
  pull_request:
    paths:
      - '.github/actions/native-cache/**'
      - '.github/workflows/**'
  push:
    branches: [main]
    paths:
      - '.github/actions/native-cache/**'
      - '.github/workflows/**'
  workflow_dispatch:
  schedule:
    - cron: '57 5 * * 0'
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  cache-contract:
    timeout-minutes: 30
    runs-on: ${{ (vars.SELF_HOSTED_LINUX == 'true' && (
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       contains(fromJSON(vars.CI_TRUSTED_LOGINS), github.event.pull_request.user.login) &&
       contains(fromJSON(vars.CI_TRUSTED_LOGINS), github.triggering_actor))))
      && fromJSON('["self-hosted","linux","x64","tos-vm"]') || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Prepare the cache exactly as consuming jobs do
        uses: ./.github/actions/native-cache
        with:
          profile: validation
      - name: Check machine counter names and reject missing cache evidence
        run: python3 .github/actions/native-cache/test_smoke.py -v
      - name: Check cache identities and early CMake launcher propagation
        run: python3 .github/actions/native-cache/test_prepare.py -v
      - name: Require cold misses, restored hits and a failing header-warning control
        run: python3 .github/actions/native-cache/smoke.py
