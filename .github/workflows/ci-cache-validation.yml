name: CI cache validation
on:
  pull_request:
    paths:
      - '.github/actions/native-cache/**'
      - '.github/workflows/**'
  push:
    branches: [main, master, testnet]
    paths:
      - '.github/actions/native-cache/**'
      - '.github/workflows/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  cache-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Prepare the cache exactly as consuming jobs do
        uses: ./.github/actions/native-cache
        with:
          profile: validation
      - name: Check cache identities and early CMake launcher propagation
        run: python3 .github/actions/native-cache/test_prepare.py -v
      - name: Require cold misses, restored hits and a failing header-warning control
        run: python3 .github/actions/native-cache/smoke.py
