name: DNS contract upstream parity

on:
  # branches: keeps a push to a PR branch from firing here as well as through
  # pull_request, which ran the same SHA twice. See contract-sandboxes.yml.
  push:
    branches: [main]
    paths:
      - "crypto/smartcont/dns/**"
  pull_request:
    paths:
      - "crypto/smartcont/dns/**"
  schedule:
    # weekly: surface new upstream commits even when this tree is idle
    - cron: "17 6 * * 1"
  workflow_dispatch:

concurrency:
  group: dns-contract-parity-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  parity:
    timeout-minutes: 30
    runs-on: ${{ (vars.SELF_HOSTED_LINUX == 'true' && (
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       contains(fromJSON(vars.CI_TRUSTED_LOGINS), github.event.pull_request.user.login) &&
       contains(fromJSON(vars.CI_TRUSTED_LOGINS), github.triggering_actor))))
      && fromJSON('["self-hosted","linux","x64","tos-vm"]') || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Compare the .tos contracts against the pinned upstream commit
        run: ./crypto/smartcont/dns/check-upstream-parity.sh
