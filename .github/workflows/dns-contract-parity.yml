name: DNS contract upstream parity

on:
  # branches: keeps a push to a PR branch from firing here as well as through
  # pull_request, which ran the same SHA twice. See contract-sandboxes.yml.
  push:
    branches: [main, master, testnet]
    paths:
      - "crypto/smartcont/dns/**"
  pull_request:
    paths:
      - "crypto/smartcont/dns/**"
  schedule:
    # weekly: surface new upstream commits even when this tree is idle
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Compare the .tos contracts against the pinned upstream commit
        run: ./crypto/smartcont/dns/check-upstream-parity.sh
