name: ATOS full-stack TaskEscrow localnet gate

on:
  push:
    branches:
      - agent/atos-task-escrow-sidecar-e2e
  pull_request:
    paths:
      - 'scripts/**task*escrow*sidecar*'
      - '.github/workflows/**task*escrow*sidecar*'

permissions:
  actions: read

jobs:
  full-stack-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Require all runtime boundaries in the E2E harness
        id: harness
        shell: bash
        run: |
          set -euo pipefail
          script="$(find scripts -maxdepth 1 -type f | grep -Ei '(atos.*task.*escrow.*sidecar.*e2e|task.*escrow.*sidecar.*e2e)' | head -1 || true)"
          test -n "${script}"
          grep -Eqi 'tos-protocol|tos_protocol|TOS_PROTOCOL' "${script}"
          grep -Eqi 'tos-ai|tos_ai|TOS_AI' "${script}"
          grep -Eqi 'atos([^a-zA-Z0-9]|$)|ATOS_' "${script}"
          grep -Eqi 'receipt|ExecutionReceipt|execution_receipt' "${script}"
          grep -Eqi 'settlement|SettleJob|settle_job' "${script}"
          echo "script=${script}" >> "${GITHUB_OUTPUT}"
      - name: Resolve exact revision
        id: revision
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = pull_request ]; then
            echo "sha=${{ github.event.pull_request.head.sha }}" >> "${GITHUB_OUTPUT}"
          else
            echo "sha=${GITHUB_SHA}" >> "${GITHUB_OUTPUT}"
          fi
      - name: Require successful explicit real-localnet workflow
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          REVISION: ${{ steps.revision.outputs.sha }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 6000))
          while (( SECONDS < deadline )); do
            payload="$(gh api "/repos/${REPOSITORY}/actions/runs?head_sha=${REVISION}&per_page=100")"
            matches="$(jq --arg current "${CURRENT_RUN_ID}" '[.workflow_runs[]
              | select((.id|tostring) != $current)
              | select((.name + " " + .path + " " + .display_title)
                  | test("(?i)(localnet|real[-_ ]?chain)"))
              | select((.name + " " + .path + " " + .display_title)
                  | test("(?i)(atos|task.*escrow|sidecar)"))
              | select(((.name + " " + .path + " " + .display_title)
                  | test("(?i)(materialize|export|finalize|sanitize|complete|gate)")) | not)]' <<<"${payload}")"
            if [ "$(jq 'length' <<<"${matches}")" -gt 0 ]; then
              failed="$(jq '[.[] | select(.status == "completed" and .conclusion != "success")] | length' <<<"${matches}")"
              pending="$(jq '[.[] | select(.status != "completed")] | length' <<<"${matches}")"
              test "${failed}" -eq 0
              if [ "${pending}" -eq 0 ]; then
                jq -r '.[] | "validated full-stack localnet workflow: \(.name) \(.html_url)"' <<<"${matches}"
                exit 0
              fi
            fi
            sleep 20
          done
          echo "full-stack real-localnet workflow did not succeed for ${REVISION}" >&2
          exit 1
