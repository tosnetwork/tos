name: BR1 A1 native boundary and quote authentication

# These gates also run on stacked pull requests; no main-only base filter.
on:
  pull_request:
    paths:
      - 'tools/bonded-relayer/**'
      - 'tools/shielded-pool-wallet/**'
      - 'tools/shielded-pool-circuit/**'
      - 'test/bonded-relayer/**'
      - 'scripts/install-rust-toolchain.sh'
      - 'doc/br1-native-boundary.md'
      - 'doc/evidence/br1-delivery/**'
      - '.github/workflows/br1-adapter.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: br1-adapter-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  adapter:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
      - name: Check the exact Python sources with pinned Ruff
        run: |
          python -m pip install ruff==0.15.2
          ruff check --isolated --select E4,E7,E9,F,I --ignore E741 --line-length 100 --target-version py312 tools/bonded-relayer/native_adapter.py \
            tools/bonded-relayer/native_process.py \
            tools/bonded-relayer/relay_wire.py \
            test/bonded-relayer/test_native_boundary.py \
            test/bonded-relayer/delivery_controls.py
          ruff format --check --isolated --line-length 100 --target-version py312 tools/bonded-relayer/native_adapter.py \
            tools/bonded-relayer/native_process.py \
            tools/bonded-relayer/relay_wire.py \
            test/bonded-relayer/test_native_boundary.py \
            test/bonded-relayer/delivery_controls.py
      - name: Exercise the sealed native process boundary and adapter bindings
        run: python -m unittest discover -s test/bonded-relayer -p test_native_boundary.py -v
      - name: Remove adapter guards and require designated assertion failures
        run: python test/bonded-relayer/delivery_controls.py --lane adapter --out build/br1-adapter-receipts/adapter-controls.json
      - name: Install the repository-pinned Rust toolchain
        run: scripts/install-rust-toolchain.sh
      - name: Check quote source formatting
        run: rustfmt --check --config-path rustfmt.toml tools/shielded-pool-wallet/src/relayer_quote.rs tools/shielded-pool-wallet/tests/relayer_quote.rs
      - name: Run real wallet, private-fee and ML-DSA quote tests
        run: cargo test --locked --manifest-path tools/shielded-pool-wallet/Cargo.toml
      - name: Remove cryptographic quote guards and require compiled failures
        run: python test/bonded-relayer/delivery_controls.py --lane rust --out build/br1-adapter-receipts/quote-controls.json
      - name: Retain bounded source-bound control receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: br1-adapter-${{ github.sha }}
          path: build/br1-adapter-receipts/
          if-no-files-found: warn
          retention-days: 14
