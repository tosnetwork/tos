name: complete-atos-task-escrow-sidecar-e2e

on:
  push:
    branches:
      - agent/atos-task-escrow-sidecar-e2e

permissions:
  contents: write

jobs:
  complete:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/atos-task-escrow-sidecar-e2e
          fetch-depth: 0
      - name: Recover and validate the localnet E2E source
        shell: bash
        run: |
          set -euo pipefail
          script="$(find scripts -maxdepth 1 -type f | grep -Ei '(atos.*task.*escrow.*sidecar.*e2e|task.*escrow.*sidecar.*e2e)' | head -1 || true)"
          if [ -z "${script}" ]; then
            shopt -s nullglob
            parts=(.github/atos-sidecar-e2e-patch.part*)
            if [ "${#parts[@]}" -eq 0 ]; then
              echo 'localnet E2E source is absent and no recovery payload exists' >&2
              exit 1
            fi
            cat "${parts[@]}" | base64 --decode > /tmp/atos-sidecar-e2e.patch.xz
            xz --test /tmp/atos-sidecar-e2e.patch.xz
            xz -dc /tmp/atos-sidecar-e2e.patch.xz > /tmp/atos-sidecar-e2e.patch
            git apply --binary --whitespace=error-all /tmp/atos-sidecar-e2e.patch
          fi
          rm -f .github/atos-sidecar-e2e-patch.part*
          rm -f .github/workflows/export-atos-task-escrow-sidecar-source.yml
          rm -f .github/workflows/materialize-atos-task-escrow-sidecar-e2e.yml
          rm -f .github/workflows/complete-atos-task-escrow-sidecar-e2e.yml
          script="$(find scripts -maxdepth 1 -type f | grep -Ei '(atos.*task.*escrow.*sidecar.*e2e|task.*escrow.*sidecar.*e2e)' | head -1 || true)"
          test -n "${script}"
          workflow="$(find .github/workflows -maxdepth 1 -type f | grep -Ei '(localnet|real[-_]?chain)' | grep -Ei '(atos|task.*escrow|sidecar)' | grep -Eiv '(materialize|export|finalize|strict-localnet-gate|complete)' | head -1 || true)"
          test -n "${workflow}"
          python3 -m py_compile "${script}"
          grep -Eqi 'TaskEscrow|task.?escrow' "${script}"
          grep -Eqi 'tos-protocol|tos_protocol|TOS_PROTOCOL' "${script}"
          git diff --check
      - name: Commit recovered E2E source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'test(localnet): add ATOS TaskEscrow publisher sidecar E2E'
          git push origin HEAD:agent/atos-task-escrow-sidecar-e2e
