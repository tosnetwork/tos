name: Release tosctl

# Builds the tosctl Rust binary (tosctl/uno workspace) for multiple platforms
# and publishes the artifacts to the GitHub Release created by the tag push.
#
# Trigger: push of any tag matching "v*" (e.g. v0.1.0, v1.2.3-rc1).
# Each matrix leg produces:
#   tosctl-{platform}-{tag}.tar.gz   (Linux / macOS)
#   tosctl-{platform}-{tag}.zip      (Windows)
# plus a SHA256SUMS file for verification.
#
# The binary is the standalone `tosctl-uno` crate at tosctl/uno/.
# The `tosctl uno mine` subcommand (Task #12) will appear in a future release;
# this workflow packages whatever subcommands are present at tag time.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-tosctl-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            os: ubuntu-22.04
            bin_name: tosctl-uno
            archive_ext: tar.gz
          - platform: macos-x64
            os: macos-15-intel
            bin_name: tosctl-uno
            archive_ext: tar.gz
          - platform: macos-arm64
            os: macos-14
            bin_name: tosctl-uno
            archive_ext: tar.gz

    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      # ------------------------------------------------------------------
      # Linux: install minimum native deps required by some Rust crates
      # (openssl-sys, etc.)
      # ------------------------------------------------------------------
      - name: Install build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libssl-dev

      # ------------------------------------------------------------------
      # macOS: openssl for the reqwest rustls-tls feature
      # ------------------------------------------------------------------
      - name: Install build dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          export NONINTERACTIVE=1
          brew install pkg-config openssl

      # ------------------------------------------------------------------
      # Rust toolchain — pinned to match tosctl/src/rust-toolchain.toml
      # and uno-ci.yml (1.91.1)
      # ------------------------------------------------------------------
      - name: Install pinned Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: 1.91.1
          profile: minimal
          override: true

      # ------------------------------------------------------------------
      # Cargo registry cache — key matches uno-ci.yml pattern
      # ------------------------------------------------------------------
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-tosctl-${{ runner.os }}-1.91.1-${{ hashFiles('tosctl/uno/Cargo.lock') }}
          restore-keys: |
            cargo-tosctl-${{ runner.os }}-1.91.1-

      # ------------------------------------------------------------------
      # Build tosctl-uno in release mode
      # ------------------------------------------------------------------
      - name: Build tosctl (release)
        working-directory: tosctl/uno
        run: cargo build --release

      # ------------------------------------------------------------------
      # Package: strip + archive + SHA256SUMS
      # ------------------------------------------------------------------
      - name: Package artifact
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          PLATFORM="${{ matrix.platform }}"
          BIN_NAME="${{ matrix.bin_name }}"
          ARCHIVE="tosctl-${PLATFORM}-${TAG}.tar.gz"

          BIN="tosctl/uno/target/release/${BIN_NAME}"
          if [ ! -f "$BIN" ]; then
            echo "ERROR: binary not found at $BIN" >&2
            exit 1
          fi

          # Strip (best-effort)
          strip "$BIN" 2>/dev/null || true

          # Create staging dir with canonical name
          mkdir -p staging
          cp "$BIN" staging/tosctl-uno

          # Archive
          tar -czf "$ARCHIVE" -C staging .

          # SHA256
          sha256sum "$ARCHIVE" > "${ARCHIVE}.sha256"

          echo "ARCHIVE=${ARCHIVE}" >> "$GITHUB_ENV"

      - name: Upload release asset
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ${{ env.ARCHIVE }}
          asset_name: ${{ env.ARCHIVE }}
          tag: ${{ github.ref_name }}
          overwrite: true

      - name: Upload SHA256 checksum
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ${{ env.ARCHIVE }}.sha256
          asset_name: ${{ env.ARCHIVE }}.sha256
          tag: ${{ github.ref_name }}
          overwrite: true
