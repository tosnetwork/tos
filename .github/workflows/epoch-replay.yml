name: Epoch codec, state and VM determinism

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: epoch-replay-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  replay:
    name: Replay (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86-64
            runner: ubuntu-24.04
            cpu: x86-64-v2
          - arch: arm64
            runner: ubuntu-24.04-arm
            cpu: armv8-a
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Check the comparison failure controls
        run: |
          python3 test/rel02/test_run.py
          python3 test/rel02/test_rust_replay.py
          python3 test/executor-parity/test_root_cells.py
      - name: Install repository-pinned Rust toolchain
        run: scripts/install-rust-toolchain.sh
      - name: Restore Rust dependency cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        continue-on-error: true
        with:
          prefix-key: tos-rust-ci-v1
          key: epoch-replay-${{ matrix.arch }}
          cache-bin: false
          workspaces: tosctl/src -> target
      - name: Install the release toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build pkg-config autoconf automake libtool libjemalloc-dev libgmp-dev libssl-dev gperf
          sudo scripts/install-llvm-toolchain.sh 21
          uname -m
          clang-21 --version
          clang++-21 --version
      - uses: ./.github/actions/native-cache
        with:
          profile: epoch-replay-release
          max-size: 1G
      - name: Configure with the effective epoch release arguments
        env:
          CPU: ${{ matrix.cpu }}
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang-21 -DCMAKE_CXX_COMPILER=clang++-21 \
            -DTOS_ARCH="$CPU" -DPORTABLE="$CPU" -DTOS_USE_JEMALLOC=ON
      - name: Build the existing execution libraries and replay entry point
        run: cmake --build build --target test-epoch-replay --parallel "$(nproc)"
      - name: Preserve distinct witnesses of the same logical cell
        run: |
          mkdir -p result
          build/emulator/test-epoch-replay --check-dump-representations \
            test/rel02/corpus/account-preimages/-1-53209.boc result/witness-copy.boc
      - name: Build continuous Rust replay
        run: cargo build --manifest-path tosctl/src/Cargo.toml --locked --release -p tos_executor --example rel02-replay
      - name: Replay and check the on-chain oracle
        run: |
          mkdir -p result
          python3 test/rel02/run.py --executable build/emulator/test-epoch-replay \
            --output result/outputs.jsonl --metrics result/metrics.json --controls
      - name: Compare transaction error classes and complete accepted roots
        run: |
          scripts/install-rust-toolchain.sh
          cmake --build build --target emulator --parallel "$(nproc)"
          cargo test --manifest-path tosctl/src/Cargo.toml --locked --release -p tos_executor --lib tests_precompiled_external
          cargo test --manifest-path tosctl/src/Cargo.toml --locked --release -p tos_emulator --lib external_compute_skips_are_unaccepted_without_outputs
          cargo build --manifest-path tosctl/src/Cargo.toml --locked --release -p tos_emulator --lib
          python3 test/executor-parity/transaction_rejections.py \
            --native build/emulator/libemulator.so \
            --rust tosctl/src/target/release/libtos_emulator.so \
            --output result/transaction-rejections
      - name: Preserve native transaction storage accounting and live caches
        env:
          EMULATOR_PATH: ${{ github.workspace }}/build/emulator/libemulator.so
        run: |
          cargo test --manifest-path tosctl/src/Cargo.toml --locked --release -p chain_block --lib native_varuint
          cargo test --manifest-path tosctl/src/Cargo.toml --locked --release -p chain_block --lib storage_stat
          cargo test --manifest-path tosctl/src/Cargo.toml --locked --release -p chain_block --lib transaction_storage
          cmake --build build --target test-storage-encoding --parallel "$(nproc)"
          python3 test/executor-parity/storage_encoding.py --native build/emulator/test-storage-encoding --output result/storage-encoding.json
          cmp result/storage-encoding.fixture.tsv tosctl/src/block/src/tests/data/storage_stat/storage-encoding.tsv
          cmp result/storage-encoding.rejected.tsv tosctl/src/block/src/tests/data/storage_stat/storage-encoding-rejected.tsv
          cmake --build build --target test-varuint-codec --parallel "$(nproc)"
          cargo build --manifest-path tosctl/src/Cargo.toml --locked --release -p chain_block --example varuint-codec
          python3 test/executor-parity/test_varuint_codec.py
          python3 test/executor-parity/varuint_codec.py --native build/emulator/test-varuint-codec --rust tosctl/src/target/release/examples/varuint-codec --output result/varuint-codec
          cargo test --manifest-path tosctl/src/Cargo.toml --locked --release -p tos_vm --test test_config
          cmake --build build --target test-vm-endstate --parallel "$(nproc)"
          cargo build --manifest-path tosctl/src/Cargo.toml --locked --release -p tos_vm --example vm-endstate
          mkdir -p result/vm-varuint
          python3 test/rescue-fee-gate/vm_varuint_scenarios.py --write result/vm-varuint/inputs.tsv
          build/crypto/pq/test-vm-endstate result/vm-varuint/inputs.tsv > result/vm-varuint/native.tsv
          python3 test/rescue-fee-gate/vm_varuint_scenarios.py --check result/vm-varuint/native.tsv
          tosctl/src/target/release/examples/vm-endstate result/vm-varuint/inputs.tsv > result/vm-varuint/rust.tsv
          python3 test/rescue-fee-gate/vm_endstate_compare.py result/vm-varuint/native.tsv result/vm-varuint/rust.tsv
          cargo test --manifest-path tosctl/src/Cargo.toml --locked --release -p tos_executor --lib native_runtime_credit
          python3 test/executor-parity/gas_credit.py --native build/emulator/libemulator.so --rust tosctl/src/target/release/libtos_emulator.so --output result/gas-credit
          cargo test --manifest-path tosctl/src/Cargo.toml --locked --release -p chain_block --lib native_gas_purchase
          cargo test --manifest-path tosctl/src/Cargo.toml --locked --release -p tos_executor --lib native_gas_purchase
          cargo test --manifest-path tosctl/src/Cargo.toml --locked --release -p tos_executor --lib deployment_price_tests
          cmake --build build --target test-gas-purchase --parallel "$(nproc)"
          cargo build --manifest-path tosctl/src/Cargo.toml --locked --release -p chain_block --example gas-purchase
          python3 test/executor-parity/gas_purchase.py --native build/emulator/test-gas-purchase --rust tosctl/src/target/release/examples/gas-purchase --output result/gas-purchase
          python3 test/executor-parity/purchase_transactions.py --native build/emulator/libemulator.so --rust tosctl/src/target/release/libtos_emulator.so --output result/purchase-transactions
          python3 test/executor-parity/tick_context.py --native build/emulator/libemulator.so --rust tosctl/src/target/release/libtos_emulator.so --output result/tick-context
          python3 test/executor-parity/test_tick_context.py --artifacts result/tick-context
          python3 test/executor-parity/storage_cache_carry.py --output result/storage-cache-carry.json
          cmp result/storage-cache-carry.json tosctl/src/executor/tests/fixtures/storage-cache-carry.json
          python3 test/executor-parity/storage_rollback_carry.py --output result/storage-rollback-carry.json
          cmp result/storage-rollback-carry.json tosctl/src/executor/tests/fixtures/storage-rollback-carry.json
          python3 test/executor-parity/storage_tick_carry.py --output result/storage-tick-carry.json
          cmp result/storage-tick-carry.json tosctl/src/executor/tests/fixtures/storage-tick-carry.json
          python3 test/executor-parity/storage_option_carry.py --output result/storage-option-carry.json
          cmp result/storage-option-carry.json tosctl/src/executor/tests/fixtures/storage-option-carry.json
          cargo test --manifest-path tosctl/src/Cargo.toml --locked --release -p tos_executor --lib tests_storage_measurement
      - name: Compare complete roots in registered transaction fixtures
        env:
          EMULATOR_PATH: ${{ github.workspace }}/build/emulator/libemulator.so
          FUNC_PATH: ${{ github.workspace }}/build/crypto/func
          FIFT_PATH: ${{ github.workspace }}/build/crypto/fift
        run: |
          cmake --build build --target func fift --parallel "$(nproc)"
          cargo build --manifest-path tosctl/src/Cargo.toml --locked --release -p tos_executor --example pq-tx-parity
          python3 test/executor-parity/precompiled_external.py --driver tosctl/src/target/release/examples/pq-tx-parity --output result/fixture-roots/precompiled
          python3 test/executor-parity/test_root_preflight.py --driver tosctl/src/target/release/examples/pq-tx-parity --fixtures result/fixture-roots/precompiled --output result/fixture-roots/preflight
          python3 test/executor-parity/fail_action_fine.py --v16-only --driver tosctl/src/target/release/examples/pq-tx-parity --output result/fixture-roots/fine
      - name: Export authenticated contexts and carry Rust account state
        run: |
          python3 test/rel02/run_rust.py --native build/emulator/test-epoch-replay \
            --rust tosctl/src/target/release/examples/rel02-replay --output result/rust.json
      - name: Reject mutated replay artifacts
        run: python3 test/rel02/test_rust_artifacts.py --receipt result/rust.json --output result/artifact-controls.json
      - name: Record source and compiler provenance
        if: always()
        run: |
          mkdir -p result
          git rev-parse HEAD > result/source-commit.txt
          git status --porcelain --untracked-files=no > result/source-status.txt
          clang-21 --version > result/clang-version.txt
          rustc -Vv > result/rust-version.txt
          cp build/CMakeCache.txt result/CMakeCache.txt
          sha256sum tosctl/src/Cargo.lock rust-toolchain.toml > result/build-inputs.sha256
      - name: Publish canonical outputs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: epoch-replay-${{ matrix.arch }}
          path: result/
          if-no-files-found: error
          retention-days: 30
  compare:
    name: Compare both architectures with the chain
    needs: replay
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: epoch-replay-*
          path: artifacts
      - name: Require both results and report the first differing field
        run: |
          python3 test/rel02/run.py --compare \
            artifacts/epoch-replay-x86-64/outputs.jsonl \
            artifacts/epoch-replay-arm64/outputs.jsonl
          python3 test/rel02/compare_rust.py \
            artifacts/epoch-replay-x86-64/rust.json \
            artifacts/epoch-replay-arm64/rust.json
          cmp artifacts/epoch-replay-x86-64/source-commit.txt artifacts/epoch-replay-arm64/source-commit.txt
          test "$(cat artifacts/epoch-replay-x86-64/source-commit.txt)" = "$(git rev-parse HEAD)"
          cmp artifacts/epoch-replay-x86-64/build-inputs.sha256 artifacts/epoch-replay-arm64/build-inputs.sha256
          cmp artifacts/epoch-replay-x86-64/varuint-codec/inputs.tsv artifacts/epoch-replay-arm64/varuint-codec/inputs.tsv
          cmp artifacts/epoch-replay-x86-64/varuint-codec/native.stdout artifacts/epoch-replay-arm64/varuint-codec/native.stdout
          cmp artifacts/epoch-replay-x86-64/varuint-codec/rust.stdout artifacts/epoch-replay-arm64/varuint-codec/rust.stdout
          cmp artifacts/epoch-replay-x86-64/vm-varuint/inputs.tsv artifacts/epoch-replay-arm64/vm-varuint/inputs.tsv
          cmp artifacts/epoch-replay-x86-64/vm-varuint/native.tsv artifacts/epoch-replay-arm64/vm-varuint/native.tsv
          cmp artifacts/epoch-replay-x86-64/vm-varuint/rust.tsv artifacts/epoch-replay-arm64/vm-varuint/rust.tsv
          cmp artifacts/epoch-replay-x86-64/gas-credit/native/outcomes.json artifacts/epoch-replay-arm64/gas-credit/native/outcomes.json
          cmp artifacts/epoch-replay-x86-64/gas-credit/rust/outcomes.json artifacts/epoch-replay-arm64/gas-credit/rust/outcomes.json
          cmp artifacts/epoch-replay-x86-64/gas-purchase/inputs.tsv artifacts/epoch-replay-arm64/gas-purchase/inputs.tsv
          cmp artifacts/epoch-replay-x86-64/gas-purchase/native.stdout artifacts/epoch-replay-arm64/gas-purchase/native.stdout
          cmp artifacts/epoch-replay-x86-64/gas-purchase/rust.stdout artifacts/epoch-replay-arm64/gas-purchase/rust.stdout
          cmp artifacts/epoch-replay-x86-64/purchase-transactions/native/outcomes.json artifacts/epoch-replay-arm64/purchase-transactions/native/outcomes.json
          cmp artifacts/epoch-replay-x86-64/purchase-transactions/rust/outcomes.json artifacts/epoch-replay-arm64/purchase-transactions/rust/outcomes.json
          cmp artifacts/epoch-replay-x86-64/tick-context/native/outcomes.json artifacts/epoch-replay-arm64/tick-context/native/outcomes.json
          cmp artifacts/epoch-replay-x86-64/tick-context/rust/outcomes.json artifacts/epoch-replay-arm64/tick-context/rust/outcomes.json
          test ! -s artifacts/epoch-replay-x86-64/source-status.txt
          test ! -s artifacts/epoch-replay-arm64/source-status.txt
          cat artifacts/epoch-replay-x86-64/metrics.json
          cat artifacts/epoch-replay-arm64/metrics.json
          cmp artifacts/epoch-replay-x86-64/transaction-rejections/native/outcomes.json artifacts/epoch-replay-arm64/transaction-rejections/native/outcomes.json
          cmp artifacts/epoch-replay-x86-64/transaction-rejections/rust/outcomes.json artifacts/epoch-replay-arm64/transaction-rejections/rust/outcomes.json
          python3 test/executor-parity/transaction_roots.py --compare artifacts/epoch-replay-x86-64/fixture-roots artifacts/epoch-replay-arm64/fixture-roots
          test "${{ needs.replay.result }}" = success
