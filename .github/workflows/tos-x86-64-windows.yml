name: Windows TOS build (portable, x86-64)

on:
  push:
    tags: ['v*']
  workflow_dispatch:
  workflow_call:

defaults:
  run:
    shell: cmd

# A literal group: inside a call, github.workflow is the caller's name, so every
# matrix member would share one group. A pull request cancels its own older run;
# any other run (a push, the nightly run, a tag) is never cancelled by another.
concurrency:
  group: windows-msvc-${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:

    timeout-minutes: 240
    runs-on: windows-2022

    steps:
      - name: Get Current OS version
        run: |
          systeminfo | findstr /B /C:"OS Name" /C:"OS Version"

      - name: Check out current repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Create directories
        run: |
          mkdir third_libs

      - name: Cache 3pp
        id: cache-3pp
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: third_libs
          key: ${{ runner.os }}-${{ runner.arch }}-windows-2022-3pp-${{ hashFiles('**/assembly/native/build-windows-2022.bat') }}

      - name: Build TOS
        run: |
          copy assembly\native\build-windows-github-2022.bat .
          copy assembly\native\build-windows-2022.bat .
          build-windows-github-2022.bat Enterprise
          ccache -sp

#      - name: Run Tests
#        run: |
#          cd build
#          ctest -C Release --output-on-failure -E "test-bigint" --timeout 1800

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tos-x86-64-windows
          path: artifacts
          retention-days: 14
