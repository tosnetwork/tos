name: Validator P0 remote HTTP2

on:
  pull_request:
    paths:
      - 'validator/auth/remote-http2.h'
      - 'validator/auth/remote-http2.cpp'
      - 'validator/auth/CMakeLists.txt'
      - 'test/validator-auth-implementation/remote-http2-test.cpp'
      - 'test/validator-auth-implementation/remote_http2_mutations.py'
      - '.github/workflows/validator-auth-p0-remote-http2.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validator-p0-remote-http2-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  remote-http2:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install native library dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld cmake ninja-build pkg-config libssl-dev libsodium-dev liblz4-dev zlib1g-dev gperf python3-yaml
      - name: Parse focused workflow structure
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import yaml
          path = Path('.github/workflows/validator-auth-p0-remote-http2.yml')
          doc = yaml.load(path.read_text(), Loader=yaml.BaseLoader)
          assert set(doc['jobs']) == {'remote-http2'}
          job = doc['jobs']['remote-http2']
          assert job['runs-on'] == 'ubuntu-24.04'
          names = [step.get('name') for step in job['steps'] if 'name' in step]
          expected = [
              'Install native library dependencies',
              'Parse focused workflow structure',
              'Configure release and sanitizer builds',
              'Build and run focused framing cases',
              'Compile isolated framing mutations',
              'Upload focused evidence',
          ]
          assert names == expected, names
          assert doc['on']['pull_request']['paths']
          PY
      - name: Configure release and sanitizer builds
        run: |
          set -euo pipefail
          cmake -S . -B build-p0 -G Ninja -DCMAKE_BUILD_TYPE=Release -DTOS_ARCH= \
            -DTOS_BUILD_P0_IMPLEMENTATION_TESTS=ON -DUSE_QUIC=OFF \
            -DTOS_USE_ROCKSDB=OFF -DTOS_USE_ABSEIL=OFF -DTOS_USE_LLD=ON \
            -DCMAKE_SKIP_INSTALL_RULES=ON \
            -DOPENSSL_CRYPTO_LIBRARY="$(pkg-config --variable=libdir openssl)/libcrypto.so" \
            -DOPENSSL_SSL_LIBRARY="$(pkg-config --variable=libdir openssl)/libssl.so" \
            -DOPENSSL_INCLUDE_DIR="$(pkg-config --variable=includedir openssl)"
          cmake -S . -B build-p0-sanitized -G Ninja -DCMAKE_BUILD_TYPE=Release -DTOS_ARCH= \
            -DTOS_BUILD_P0_IMPLEMENTATION_TESTS=ON -DUSE_QUIC=OFF \
            -DTOS_USE_ASAN=ON -DTOS_USE_UBSAN=ON \
            -DTOS_USE_ROCKSDB=OFF -DTOS_USE_ABSEIL=OFF -DTOS_USE_LLD=ON \
            -DCMAKE_SKIP_INSTALL_RULES=ON \
            -DOPENSSL_CRYPTO_LIBRARY="$(pkg-config --variable=libdir openssl)/libcrypto.so" \
            -DOPENSSL_SSL_LIBRARY="$(pkg-config --variable=libdir openssl)/libssl.so" \
            -DOPENSSL_INCLUDE_DIR="$(pkg-config --variable=includedir openssl)"
      - name: Build and run focused framing cases
        run: |
          set -euo pipefail
          cmake --build build-p0 --target test-p0-remote-http2 -j2
          cmake --build build-p0-sanitized --target test-p0-remote-http2 -j2
          build-p0/validator/auth/test-p0-remote-http2 | tee remote-http2.txt
          ASAN_OPTIONS=detect_leaks=1:detect_stack_use_after_return=1 \
            UBSAN_OPTIONS=halt_on_error=1 \
            build-p0-sanitized/validator/auth/test-p0-remote-http2 \
            | tee remote-http2-sanitized.txt
      - name: Compile isolated framing mutations
        run: |
          set -euo pipefail
          python3 test/validator-auth-implementation/remote_http2_mutations.py \
            --build build-p0 --out remote-http2-mutations
          cp remote-http2-mutations/mutations.json remote-http2-mutations.json
          git diff --exit-code
      - name: Upload focused evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: remote-http2-${{ github.run_id }}
          path: |
            remote-http2.txt
            remote-http2-sanitized.txt
            remote-http2-mutations.json
            remote-http2-mutations/
          if-no-files-found: ignore
