name: Apply collator gathering edit

on:
  pull_request:
    paths:
      - '.github/workflows/collator-gathering-edit.yml'

permissions:
  contents: write

jobs:
  edit:
    if: github.head_ref == 'feat/validator-auth-p0'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
      - name: Apply exact source edit and remove this workflow
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('validator/impl/collator.cpp')
          text = path.read_text()

          include_before = '''#include "auth/native-config-context.h"\n#include "auth/native-history.h"\n'''
          include_after = '''#include "auth/native-config-context.h"\n#include "auth/native-history.h"\n#include "auth/native-registry-admission.h"\n'''
          body_before = '''  const auto parent = tos::auth::anchor_of(mc_block_id_, mc_state_root);\n\n  tos::auth::RegistryAdmissionInputs inputs;\n  inputs.message = msg_root;\n  inputs.configuration_account = configuration.value();\n  inputs.transaction.masterchain_state = mc_state_root;\n  inputs.transaction.parent = parent;\n  inputs.transaction.chain = params_.validator_auth.value().chain;\n  inputs.transaction.shard = shard_;\n  inputs.transaction.catchain = params_.validator_set->get_catchain_seqno();\n  inputs.transaction.inclusion = new_block_seqno;\n\n  auto admitted = tos::auth::admit_registry_message(inputs, *params_.validator_auth.value().anchors);\n'''
          body_after = '''  auto inputs = tos::auth::gather_registry_admission_inputs(\n      msg_root, configuration.value(), mc_state_root, mc_block_id_, params_.validator_auth.value().chain, shard_,\n      params_.validator_set->get_catchain_seqno(), new_block_seqno);\n  if (!inputs.ok()) {\n    return false;\n  }\n\n  auto admitted = tos::auth::admit_registry_message(inputs.value(), *params_.validator_auth.value().anchors);\n'''

          for label, anchor in [('include', include_before), ('body', body_before)]:
              count = text.count(anchor)
              if count != 1:
                  raise SystemExit(f'{label} anchor count is {count}, expected 1')
          text = text.replace(include_before, include_after, 1)
          text = text.replace(body_before, body_after, 1)
          path.write_text(text)
          PY
          git diff --check -- validator/impl/collator.cpp
          test "$(git diff --name-only -- validator/impl/collator.cpp)" = "validator/impl/collator.cpp"
          grep -Fq '#include "auth/native-registry-admission.h"' validator/impl/collator.cpp
          grep -Fq 'auto inputs = tos::auth::gather_registry_admission_inputs(' validator/impl/collator.cpp
          ! grep -Fq 'tos::auth::RegistryAdmissionInputs inputs;' validator/impl/collator.cpp
          git rm .github/workflows/collator-gathering-edit.yml
          git config user.name tosman
          git config user.email gtosnetwork@gmail.com
          git add validator/impl/collator.cpp
          git commit -m 'Gather validator auth inputs through the tested boundary'
          git push origin HEAD:feat/validator-auth-p0
