name: Windows TOS build (x86-64)

# The client tools built on Windows with clang-cl and lld-link from
# Visual Studio 2022 (assembly/native/build-windows-2022.bat), and packaged by
# assembly/native/package-windows.ps1 into the artifact tos-x86-64-windows. It
# runs on every pull request to main and every push to main, unfiltered by path,
# for the reason the Linux shared builds give, and on every version tag, whose
# run is the one a release collects (scripts/release-artifacts.py).

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
  workflow_call:

defaults:
  run:
    shell: cmd

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 300
    steps:
    - name: Check out repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        persist-credentials: false

    # The runner image ships Chocolatey, Strawberry Perl and the Visual Studio
    # LLVM toolset; ninja and NASM come from Chocolatey. The community feed
    # can fail for a while, and Chocolatey then installs nothing without
    # failing the job, so retry and stop here when NASM is still missing
    # rather than in the build.
    - name: Install build tools
      shell: pwsh
      run: |
        for ($attempt = 1; $attempt -le 3; $attempt++) {
          choco install -y --no-progress ninja nasm
          $nasm = Test-Path "C:\Program Files\NASM\nasm.exe"
          $ninja = $null -ne (Get-Command ninja -ErrorAction SilentlyContinue)
          if ($nasm -and $ninja) { exit 0 }
          Write-Host "after attempt ${attempt}: nasm present=$nasm, ninja present=$ninja"
          if ($attempt -lt 3) { Start-Sleep -Seconds (60 * $attempt) }
        }
        Write-Error "ninja or NASM could not be installed from Chocolatey after 3 attempts"
        exit 1

    # Packaged in the same step, because dumpbin, which checks every file's
    # DLLs, comes from the Visual Studio environment vcvars64 sets.
    - name: Build and package TOS
      run: |
        call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
        if errorlevel 1 exit /b 1
        set "PATH=%PATH%;C:\Program Files\NASM"
        call assembly\native\build-windows-2022.bat -k
        if errorlevel 1 exit /b 1
        pwsh -NoProfile -File assembly\native\package-windows.ps1 -BuildDir build-windows -OutDir tos-windows
        if errorlevel 1 exit /b 1

    - name: Upload artifacts
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: tos-x86-64-windows
        path: tos-windows
        if-no-files-found: error
        retention-days: 14
