name: Runner verification

# Archive cap control: with the host writer's cap lowered to 8 MiB for this
# round, an admitted job floods the audit stream with execve records. The
# archive must stop at exactly the cap, the writer must stay alive, the drain
# must time out and the lifetime must be invalid.
on:
  pull_request:
  push:
    branches: [ci/runner-verify]

permissions:
  contents: read

concurrency:
  group: runner-verify-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  audit-flood:
    runs-on: [self-hosted, linux, x64, tos-vm]
    timeout-minutes: 10
    steps:
      - run: |
          echo TOS_CI_PROBE_FLOOD
          for i in $(seq 40000); do /bin/true; done
          echo "flood done; log $(sudo stat -c %s /var/log/audit/audit.log) bytes"
