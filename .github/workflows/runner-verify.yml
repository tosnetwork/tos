name: Runner verification

# Contention control, and the image's positive control: with no install step of
# their own, three admitted jobs compile tos at full parallelism for
# up to 20 minutes, while the host runs the chain and an interactive build.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: runner-verify-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-load:
    runs-on: [self-hosted, linux, x64, tos-vm]
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        n: [1, 2, 3]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: tosnetwork/tos
          ref: main
          submodules: recursive
      - run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang-21 -DCMAKE_CXX_COMPILER=clang++-21 > /dev/null
          echo "TOS_CI_LOAD_START $(date -u +%s)"
          timeout 1200 ninja -C build -j16 > build.log 2>&1 || true
          echo "TOS_CI_LOAD_END $(date -u +%s) $(grep -c '^\[' build.log) steps"
