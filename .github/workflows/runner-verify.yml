name: Runner verification

# Negative control for the execution classification: admitted jobs that run
# a custom-shell command, a container entrypoint and a job-created systemd
# service, none matching the old name patterns. Judged as if denied, every
# one of these lifetimes must fail, naming the execution.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: runner-verify-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  custom-shell:
    runs-on: [self-hosted, linux, x64, tos-vm]
    timeout-minutes: 10
    defaults:
      run:
        shell: bash --noprofile --norc -e {0}
    steps:
      - run: /bin/touch /tmp/tos-ci-probe-touch
  container-entrypoint:
    runs-on: [self-hosted, linux, x64, tos-vm]
    timeout-minutes: 10
    steps:
      - run: docker run --rm busybox:1.36 touch /tos-ci-probe-container
  job-created-service:
    runs-on: [self-hosted, linux, x64, tos-vm]
    timeout-minutes: 10
    steps:
      - run: sudo systemd-run --wait /usr/bin/touch /tmp/tos-ci-probe-unit
