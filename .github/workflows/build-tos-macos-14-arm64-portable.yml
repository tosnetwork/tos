name: MacOS-14 TOS build (portable, arm64)

on:
  pull_request:
    branches: [master, testnet]
    types: [opened, reopened, synchronize, ready_for_review]
  push:
    branches: [master, testnet]
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Date Stamp
        shell: bash
        id: date-stamp
        run: |
          echo "timestamp=$(date -u "+%Y%m%d%H%M_%S")" >> "$GITHUB_OUTPUT"

      - name: Create directories
        run: |
          mkdir -p ~/.ccache
          mkdir -p 3pp

      - name: Cache 3pp
        id: cache-3pp
        uses: actions/cache@v4
        with:
          path: 3pp
          key: ${{ runner.os }}-${{ runner.arch }}-14-3pp-${{ hashFiles('**/assembly/native/build-macos-portable.sh') }}

      - name: Cache TOS
        id: cache-tos
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ${{ runner.os }}-${{ runner.arch }}-14-portable-ccache-${{ steps.date-stamp.outputs.timestamp }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-14-portable-ccache

      # Rust toolchain needed for corrosion-rs / libuno_plonky3_ffi
      # (`cmake ..` calls `find_package(Rust)` via `third-party/corrosion`).
      - name: Install pinned Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: 1.91.1
          profile: minimal

      - name: Build TOS
        run: |
          cp assembly/native/build-macos-portable.sh .
          chmod +x build-macos-portable.sh
          ./build-macos-portable.sh -t -a -c -o 14.0
          ccache -sp

      - name: Run Tests
        run: |
          cd build
          ctest --output-on-failure --timeout 1800

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tos-arm64-macos
          path: artifacts
          retention-days: 14
