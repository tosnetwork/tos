name: Authentication extension validation

on:
  pull_request:
    paths:
      - 'crypto/smartcont/**'
      - 'crypto/CMakeLists.txt'
      - 'tosctl/src/node-control/contracts/**'
      - 'sdk/js/packages/wallets/**'
      - 'sdk/js/packages/client/src/client/TosClient.ts'
      - 'test/auth-extensions/**'
      - 'scripts/update-auth-contract-code.py'
      - '.github/workflows/auth-extension-validation.yml'
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read

concurrency:
  group: auth-extension-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  authentication:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Configure and build native contract tools
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build --target func fift tol emulator -j2
      - name: Install deterministic-signature test dependency
        run: python3 -m pip install cryptography==46.0.4
      - name: Native action-phase authentication tests and mutation checks
        env:
          FUNC_PATH: ${{ github.workspace }}/build/crypto/func
          FIFT_PATH: ${{ github.workspace }}/build/crypto/fift
          TOL_PATH: ${{ github.workspace }}/build/tol/tol
          EMULATOR_PATH: ${{ github.workspace }}/build/emulator/libemulator.so
        run: |
          python3 scripts/update-auth-contract-code.py --check
          python3 test/auth-extensions/test_auth.py
          python3 test/auth-extensions/mutations.py
          python3 test/auth-extensions/test_sdk_wallet_vectors.py
          git diff --exit-code
      # The SDK half of the wallet vectors: the committed messages the native
      # test above executes must still be exactly what the SDK produces.
      - name: SDK wallet tests and network-bound vectors
        working-directory: sdk/js
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm --filter @tos/wallets --filter @tos/client typecheck
          pnpm --filter @tos/wallets test
          git diff --exit-code
