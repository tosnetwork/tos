name: Authentication extension validation

on:
  pull_request:
    paths:
      - 'crypto/smartcont/**'
      - 'tosctl/src/node-control/contracts/**'
      - 'scripts/*auth*'
      - '.github/workflows/auth-extension-validation.yml'
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read

concurrency:
  group: auth-extension-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  native-tools:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Archive the exact public source snapshot
        run: |
          mkdir -p auth-artifacts
          git archive --format=tar HEAD | gzip > auth-artifacts/source.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: auth-extension-source-${{ github.event.pull_request.head.sha }}
          path: auth-artifacts/source.tar.gz
          retention-days: 3
      - name: Configure native tools
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build native contract tools
        run: cmake --build build --target func fift tol emulator -j2
      - name: Package native tools for reproducible local validation
        run: |
          mkdir -p auth-artifacts/tools
          cp build/crypto/func build/crypto/fift auth-artifacts/tools/
          find build -type f \( -name tol -o -name 'libemulator.so*' \) -exec cp {} auth-artifacts/tools/ \;
          ldd build/crypto/fift > auth-artifacts/tools/ldd.txt
      - uses: actions/upload-artifact@v4
        with:
          name: auth-extension-tools-${{ github.event.pull_request.head.sha }}
          path: auth-artifacts/tools/
          retention-days: 3
