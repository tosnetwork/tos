name: Authentication extension validation

# One-shot publication of the locally tested patch to this feature branch.
# Replaced with the read-only validation workflow after publication.
on:
  pull_request:
    paths:
      - '.github/auth-stage.*'
      - '.github/workflows/auth-extension-validation.yml'
    types: [opened, reopened, synchronize]

permissions:
  contents: write
  actions: read

jobs:
  publish-tested-source:
    if: >-
      github.repository == 'tosnetwork/tos' &&
      github.event.pull_request.number == 93 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feat/pq-auth-extensions'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: true
      - name: Verify and apply the exact tested source patch
        run: |
          set -euo pipefail
          cat .github/auth-stage.1 .github/auth-stage.2 .github/auth-stage.3 > /tmp/auth-stage.patch.gz
          echo 'f94efbea039a4e991691af314f5e6358a71c2f1d2f5f7661f2ed333d260046e9  /tmp/auth-stage.patch.gz' | sha256sum -c -
          gzip -dc /tmp/auth-stage.patch.gz > /tmp/auth-stage.patch
          git apply --index --whitespace=error /tmp/auth-stage.patch
          python3 - <<'PY'
          import subprocess
          allowed = {
              'crypto/CMakeLists.txt',
              'crypto/smartcont/agent-account-code.fc',
              'crypto/smartcont/auth-extension.fc',
              'crypto/smartcont/auth-extension.md',
              'crypto/smartcont/auth-extension.tol',
              'crypto/smartcont/wallet-v5-code.fc',
              'crypto/smartcont/wallet-v5.tol',
              'scripts/update-auth-contract-code.py',
              'test/auth-extensions/cells.py',
              'test/auth-extensions/mutations.py',
              'test/auth-extensions/native.py',
              'test/auth-extensions/test-module.fc',
              'test/auth-extensions/test_auth.py',
          }
          changed = set(subprocess.check_output(['git', 'diff', '--cached', '--name-only'], text=True).splitlines())
          if changed != allowed:
              raise SystemExit(f'Unexpected patch paths: {changed ^ allowed}')
          PY
      - name: Retrieve native tools built from this PR's unchanged VM and compiler sources
        uses: actions/download-artifact@v4
        with:
          name: auth-extension-tools-0d638bed28a8e6ac48c06ce8e86aa839ffa691c6
          run-id: 34569449498
          github-token: ${{ github.token }}
          path: auth-tools
      - name: Regenerate artifacts and rerun native regression and mutation tests
        env:
          FUNC_PATH: ${{ github.workspace }}/auth-tools/func
          FIFT_PATH: ${{ github.workspace }}/auth-tools/fift
          TOL_PATH: ${{ github.workspace }}/auth-tools/tol
          EMULATOR_PATH: ${{ github.workspace }}/auth-tools/libemulator.so
        run: |
          set -euo pipefail
          chmod +x auth-tools/func auth-tools/fift auth-tools/tol
          python3 -m pip install cryptography==46.0.4
          python3 scripts/update-auth-contract-code.py
          python3 scripts/update-auth-contract-code.py --check
          python3 test/auth-extensions/test_auth.py
          python3 test/auth-extensions/mutations.py
          git diff --check
      - name: Commit only the tested patch and its generated bytecode to the feature branch
        run: |
          set -euo pipefail
          git add tosctl/src/node-control/contracts/src/agent_account.rs \
            tosctl/src/node-control/contracts/src/wallet/wallet_contract.rs \
            sdk/js/packages/wallets/src/codes.ts
          git rm .github/auth-stage.1 .github/auth-stage.2 .github/auth-stage.3
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(contracts): add replaceable authentication roots without version bumps' \
            -m 'Add strict module-only and same-request hybrid authentication, retain Agent Account policy checks, synchronize Wallet V5 FunC and Tol paths, regenerate SDK bytecode, and add native action-phase regression and guard-mutation coverage.'
          git push origin HEAD:refs/heads/feat/pq-auth-extensions
