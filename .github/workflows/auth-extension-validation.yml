name: Authentication extension validation

on:
  pull_request:
    paths:
      - 'crypto/smartcont/**'
      - 'crypto/CMakeLists.txt'
      - 'crypto/block/auth-policy.*'
      - 'crypto/block/block.cpp'
      - 'crypto/block/block.tlb'
      - 'test/test-config-transition.cpp'
      - 'tosctl/src/node-control/contracts/**'
      - 'sdk/js/packages/wallets/src/codes.ts'
      - 'test/auth-extensions/**'
      - 'test/wallet-v5r2/**'
      - 'scripts/update-auth-contract-code.py'
      - '.github/workflows/auth-extension-validation.yml'
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read

concurrency:
  group: auth-extension-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  authentication:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Configure and build native contract tools
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build --target func fift tol emulator test-config-transition -j2
      - name: Install deterministic-signature test dependency
        run: python3 -m pip install cryptography==46.0.4
      - name: Native action-phase authentication tests and mutation checks
        env:
          FUNC_PATH: ${{ github.workspace }}/build/crypto/func
          FIFT_PATH: ${{ github.workspace }}/build/crypto/fift
          TOL_PATH: ${{ github.workspace }}/build/tol/tol
          EMULATOR_PATH: ${{ github.workspace }}/build/emulator/libemulator.so
        run: |
          python3 scripts/update-auth-contract-code.py --check
          python3 test/auth-extensions/test_auth.py
          python3 test/auth-extensions/mutations.py
          python3 test/wallet-v5r2/test_v5r1_action_baseline.py --output "$RUNNER_TEMP/v5r1-baseline"
          python3 test/wallet-v5r2/test_auth_policy.py --output "$RUNNER_TEMP/auth-policy"
          python3 test/wallet-v5r2/test_receiver_auth.py --output "$RUNNER_TEMP/r2-receiver-auth"
          python3 test/wallet-v5r2/test_identity.py --output "$RUNNER_TEMP/r2-identity"
          python3 test/wallet-v5r2/test_state.py --output "$RUNNER_TEMP/r2-state"
          python3 test/wallet-v5r2/test_fee_identity.py --output "$RUNNER_TEMP/r2-fee-identity"
          python3 test/wallet-v5r2/test_fee_cells.py --output "$RUNNER_TEMP/r2-fee-cells"
          python3 test/wallet-v5r2/test_fee_bounds.py --output "$RUNNER_TEMP/r2-fee-bounds"
          python3 test/wallet-v5r2/test_wallet.py --output "$RUNNER_TEMP/r2-wallet"
          build/test-config-transition
          python3 test/wallet-v5r2/policy_native_mutations.py --build build --output "$RUNNER_TEMP/auth-policy-native"
          git diff --exit-code
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: v5r1-action-baseline
          path: ${{ runner.temp }}/v5r1-baseline/results.json
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: auth-policy-validation
          path: |
            ${{ runner.temp }}/auth-policy/results.json
            ${{ runner.temp }}/auth-policy-native/
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: r2-receiver-identity-validation
          path: |
            ${{ runner.temp }}/r2-receiver-auth/
            ${{ runner.temp }}/r2-identity/
            ${{ runner.temp }}/r2-state/
            ${{ runner.temp }}/r2-fee-identity/
            ${{ runner.temp }}/r2-fee-cells/
            ${{ runner.temp }}/r2-fee-bounds/
            ${{ runner.temp }}/r2-wallet/
          retention-days: 14
